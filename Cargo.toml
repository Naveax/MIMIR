[workspace]
members = [
    "crates/mimir-types",
    "crates/mimir-config",
    "crates/mimir-core",
    "crates/mimir-io",
    "crates/mimir-export",
    "crates/mimir-replay",
    "crates/mimir-anchor",
    "crates/mimir-branch",
    "crates/mimir-rollout",
    "crates/mimir-score",
    "crates/mimir-skill",
    "crates/mimir-teacher",
    "crates/mimir-cache",
    "crates/mimir-cli",
    "crates/mimir-sim-bridge",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
authors = ["MIMIR contributors"]
publish = false

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13"
thiserror = "2.0"
toml = "0.8"

mimir-anchor = { path = "crates/mimir-anchor" }
mimir-branch = { path = "crates/mimir-branch" }
mimir-cache = { path = "crates/mimir-cache" }
mimir-config = { path = "crates/mimir-config" }
mimir-core = { path = "crates/mimir-core" }
mimir-export = { path = "crates/mimir-export" }
mimir-io = { path = "crates/mimir-io" }
mimir-replay = { path = "crates/mimir-replay" }
mimir-rollout = { path = "crates/mimir-rollout" }
mimir-score = { path = "crates/mimir-score" }
mimir-sim-bridge = { path = "crates/mimir-sim-bridge" }
mimir-skill = { path = "crates/mimir-skill" }
mimir-teacher = { path = "crates/mimir-teacher" }
mimir-types = { path = "crates/mimir-types" }
