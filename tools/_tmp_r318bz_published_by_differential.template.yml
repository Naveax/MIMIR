name: R3.18BZ Published BY Differential Evidence

on:
  push:
    branches: [evidence/r318bz-published-by-differential-v1]

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: r318bz-published-by-differential-v1
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: __BY_PUBLISHED_SHA__
      BASE_TREE: __BY_PUBLISHED_TREE__
      LIB_BLOB: __BY_LIB_BLOB__
      BY_TEST_BLOB: __BY_TEST_BLOB__
      BY_PR_CI_RUN: '__BY_PR_CI_RUN__'
      BY_PR_CI_JOB: '__BY_PR_CI_JOB__'
      BY_PR_KNOWLEDGE_RUN: '__BY_PR_KNOWLEDGE_RUN__'
      BY_PR_KNOWLEDGE_JOB: '__BY_PR_KNOWLEDGE_JOB__'
      BY_MAIN_CI_RUN: '__BY_MAIN_CI_RUN__'
      BY_MAIN_CI_JOB: '__BY_MAIN_CI_JOB__'
      BY_MAIN_KNOWLEDGE_RUN: '__BY_MAIN_KNOWLEDGE_RUN__'
      BY_MAIN_KNOWLEDGE_JOB: '__BY_MAIN_KNOWLEDGE_JOB__'
      BW_HEAD: 778b12988046da4d186248877bd577eb2a533a58
      BW_RUN: '34843377101'
      BW_JOB: '103973337631'
      BW_ARTIFACT: '10346819501'
      BW_DIGEST: sha256:ee8a1878241b45765a7fa57c64c179c40090836096055fc5626a58724b5796fd
      BX_CONTRACT_SHA256: 37cd43677a3523811ebd24179a5e2aec4699fa11457e078ec6e20f8998cc2576
      BM_RUN: '34334615939'
      BM_ARTIFACT: '10097405795'
      BM_ARTIFACT_NAME: r318bm-one-following-header-evidence
      BM_PATCH_SHA256: 092d188a7485e98fc88dbb297a11d744bad71a1e7bdb686ae90d441ba20894ec
      BOXCARS_SHA: c70e77df7af81b436cb545d070bb90c82f562d0b
      TRUE_REPLAY: test_corpus/largest_100/079_1f838b01-66b5-4963-b62e-64f3d7dbd545.replay
      FALSE_REPLAY: external_fixtures/sample_002.replay

    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Freeze published BY authority and scope
        shell: bash
        run: |
          set -euo pipefail
          eq() { [ "$1" = "$2" ] || { echo "authority mismatch: got=$1 expected=$2" >&2; exit 1; }; }
          eq "$(git rev-parse HEAD^)" "$BASE_SHA"
          eq "$(git rev-parse "$BASE_SHA^{tree}")" "$BASE_TREE"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...$GITHUB_SHA" | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/_tmp_r318bz_published_by_differential.yml'
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/contents/crates/mimir-replay/src/lib.rs?ref=$BASE_SHA" --jq .sha)" "$LIB_BLOB"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/contents/crates/mimir-replay/tests/r3_18by_post_bu_following_header.rs?ref=$BASE_SHA" --jq .sha)" "$BY_TEST_BLOB"
          for pair in \
            "$BY_PR_CI_RUN:$BY_PR_CI_JOB" \
            "$BY_PR_KNOWLEDGE_RUN:$BY_PR_KNOWLEDGE_JOB" \
            "$BY_MAIN_CI_RUN:$BY_MAIN_CI_JOB" \
            "$BY_MAIN_KNOWLEDGE_RUN:$BY_MAIN_KNOWLEDGE_JOB"; do
            run="${pair%%:*}"; job="${pair##*:}"
            eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run" --jq .head_sha)" "$BASE_SHA"
            eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run" --jq .conclusion)" success
            eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$job" --jq .conclusion)" success
          done
          bw_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$BW_ARTIFACT")"
          eq "$(jq -r .workflow_run.head_sha <<<"$bw_meta")" "$BW_HEAD"
          eq "$(jq -r .workflow_run.id <<<"$bw_meta")" "$BW_RUN"
          eq "$(jq -r .digest <<<"$bw_meta")" "$BW_DIGEST"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$BW_JOB" --jq .conclusion)" success
          contract="$RUNNER_TEMP/r318bx-contract.json"
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${GITHUB_REPOSITORY}/contents/docs/continuity/MIMIR_R3_18BX_ADMITTED_HEADER_CONTEXTS.json?ref=$BASE_SHA" \
            > "$contract"
          eq "$(sha256sum "$contract" | awk '{print $1}')" "$BX_CONTRACT_SHA256"
          echo R3_18BZ_AUTHORITY_FREEZE=PASS

      - name: Mark evidence pending
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context='r318bz/evidence' \
            -f description='R3.18BZ published-BY differential running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Install Rust floor
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '

      - name: Materialize and run published BY differential
        shell: bash
        run: |
          set -euo pipefail
          TEST=crates/mimir-replay/tests/_tmp_r318bz_evidence.rs
          cat > "$TEST" <<'RS'
          include!("r3_18by_post_bu_following_header.rs");

          #[test]
          fn r3_18bz_published_by_matches_frozen_two_row_header_authority() {
              let (mut rows, mut false_rows, mut true_rows, mut direct_matches) =
                  (0usize, 0usize, 0usize, 0usize);

              for (index, (path, first_start, actor_object, _)) in au_cases().into_iter().enumerate() {
                  if expected_bu_control(path).is_none() { continue; }
                  let (network, plan) = frozen_network_and_plan(path, &format!("r318bz_{index}"));
                  let (prior, control, an) = aq_from_frozen(&network, &plan, first_start, actor_object);
                  let aq = decode_replay_network_existing_actor_after_first_primitive_second_property_payload_following_payload_control_following_header_payload_following_payload_control_following_header_payload_following_payload_control_v1(&network, &prior, &control, &plan, k3_context(), &an).expect("AQ prerequisite");
                  let au = decode_replay_network_existing_actor_after_first_primitive_second_property_payload_following_payload_control_following_header_payload_following_payload_control_following_header_payload_following_payload_control_following_header_v1(&network, &prior, &control, &plan, k3_context(), &an, &aq).expect("AU prerequisite");
                  let ay = decode_ay(&network, &prior, &control, &plan, k3_context(), &an, &au).expect("AY prerequisite");
                  let ba = decode_ba(&network, &prior, &control, &plan, k3_context(), &an, &ay).expect("BA prerequisite");
                  let be = decode_be(&network, &prior, &control, &plan, k3_context(), &an, &ay, &ba).expect("BE prerequisite");
                  let bi = decode_bi(&network, &prior, &control, &plan, k3_context(), &an, &ay, &ba, &be).expect("BI prerequisite");
                  let bk = decode_bk(&network, &prior, &control, &plan, k3_context(), &an, &ay, &ba, &be, &bi).expect("BK prerequisite");
                  let bo = decode_bo(&network, &prior, &control, &plan, k3_context(), &an, &ay, &ba, &be, &bi, &bk).expect("BO prerequisite");
                  let bs = decode_bs(&network, &prior, &control, &plan, k3_context(), &an, &ay, &ba, &be, &bi, &bk, &bo).expect("BS prerequisite");
                  let bu = decode_bu(&network, &prior, &control, &plan, k3_context(), &an, &ay, &ba, &be, &bi, &bk, &bo, &bs).expect("BU prerequisite");
                  let by = mimir_replay::decode_replay_network_post_bu_following_header_v1(&network, &prior, &control, &plan, k3_context(), &an, &ay, &ba, &be, &bi, &bk, &bo, &bs, &bu).expect("published BY");

                  rows += 1;
                  if !bu.property_control {
                      false_rows += 1;
                      assert!(path.ends_with("external_fixtures/sample_002.replay"));
                      assert!(by.following_header.is_none());
                      assert_eq!(by.stop_bit, 11240);
                      println!("R3_18BZ_FALSE\texternal_fixtures/sample_002.replay\t11239\t11240\t11240");
                      continue;
                  }

                  true_rows += 1;
                  assert!(path.ends_with("test_corpus/largest_100/079_1f838b01-66b5-4963-b62e-64f3d7dbd545.replay"));
                  let header = by.following_header.as_ref().expect("true BY header");
                  let direct = mimir_replay::decode_replay_network_existing_actor_first_property_header_v1(&network, bu.control_start_bit, header.actor_object_index, &plan).expect("direct header authority");
                  assert_eq!(&direct, header);
                  direct_matches += 1;
                  assert_eq!(header.actor_object_index, 117);
                  assert_eq!(header.property_present_start_bit, 3238);
                  assert_eq!(header.property_present_end_bit, 3239);
                  assert_eq!(header.stream_id_start_bit, Some(3239));
                  assert_eq!(header.stream_id_end_bit, Some(3245));
                  assert_eq!(header.stream_id, Some(61));
                  assert_eq!(header.stream_id_bound, Some(110));
                  assert_eq!(header.prop_id_bits, Some(6));
                  assert_eq!(header.resolved_property_object_index, Some(67));
                  assert_eq!(header.resolved_property_object_name.as_deref(), Some("TAGame.PRI_TA:ClientLoadoutsOnline"));
                  assert_eq!(header.resolved_attribute_tag, Some(mimir_replay::ReplayNetworkAttributeTagV1::LoadoutsOnline));
                  assert_eq!(header.payload_start_bit, Some(3245));
                  assert_eq!(header.stop_bit, 3245);
                  assert_eq!(by.stop_bit, 3245);
                  let repeated = mimir_replay::decode_replay_network_post_bu_following_header_v1(&network, &prior, &control, &plan, k3_context(), &an, &ay, &ba, &be, &bi, &bk, &bo, &bs, &bu).expect("repeat BY");
                  assert_eq!(repeated, by);
                  println!("R3_18BZ_NATIVE\ttest_corpus/largest_100/079_1f838b01-66b5-4963-b62e-64f3d7dbd545.replay\t0\t26\t117\t8\t3238\t3239\t3239\t3245\t61\t110\t6\t67\tLoadoutsOnline\t868\t32\t10\tfalse\t3245");
              }
              assert_eq!(rows, 2);
              assert_eq!(false_rows, 1);
              assert_eq!(true_rows, 1);
              assert_eq!(direct_matches, 1);
              println!("R3_18BZ_ROWS=2/2");
              println!("R3_18BZ_FALSE_TERMINATOR=1/1");
              println!("R3_18BZ_TRUE_HEADER=1/1");
              println!("R3_18BZ_DIRECT_HEADER_MATCH=1/1");
              println!("R3_18BZ_REPEATABILITY=PASS 1/1");
              println!("R3_18BZ_FOLLOWING_PAYLOAD_BITS_CONSUMED=0");
              println!("R3_18BZ_SECOND_LATER_CONTROL_BITS_CONSUMED=0");
              println!("R3_18BZ_WITNESS_RESELECTION=0");
          }
          RS
          rustfmt +1.85.0 "$TEST"
          cargo +1.85.0 test -p mimir-replay --test _tmp_r318bz_evidence r3_18bz_published_by_matches_frozen_two_row_header_authority -- --nocapture | tee "$RUNNER_TEMP/r318bz-native.log"
          grep -Fx $'R3_18BZ_FALSE\texternal_fixtures/sample_002.replay\t11239\t11240\t11240' "$RUNNER_TEMP/r318bz-native.log"
          grep -Fx $'R3_18BZ_NATIVE\ttest_corpus/largest_100/079_1f838b01-66b5-4963-b62e-64f3d7dbd545.replay\t0\t26\t117\t8\t3238\t3239\t3239\t3245\t61\t110\t6\t67\tLoadoutsOnline\t868\t32\t10\tfalse\t3245' "$RUNNER_TEMP/r318bz-native.log"
          rm -f "$TEST"
          test -z "$(git status --porcelain --untracked-files=all | grep -v '^?? target/' || true)"

      - name: Run pinned Boxcars structural oracle
        shell: bash
        run: |
          set -euo pipefail
          BM="$RUNNER_TEMP/r318bm-tooling"; mkdir -p "$BM"
          gh run download "$BM_RUN" -n "$BM_ARTIFACT_NAME" -D "$BM"
          PATCH="$BM/r3_18bm_boxcars_instrumentation.patch"
          test -f "$PATCH"
          test "$(sha256sum "$PATCH" | awk '{print $1}')" = "$BM_PATCH_SHA256"
          BOX="$RUNNER_TEMP/boxcars-r318bz"
          git clone -q https://github.com/nickbabcock/boxcars "$BOX"
          git -C "$BOX" checkout -q "$BOXCARS_SHA"
          test "$(git -C "$BOX" rev-parse HEAD)" = "$BOXCARS_SHA"
          git -C "$BOX" apply "$PATCH"
          export MIMIR_R3_18BM_LABEL="$TRUE_REPLAY"
          export MIMIR_R3_18BM_TARGET_FRAME=0
          export MIMIR_R3_18BM_TARGET_ACTOR_ORDINAL=26
          export MIMIR_R3_18BM_TARGET_ACTOR_OBJECT=117
          export MIMIR_R3_18BM_TARGET_PROPERTY_START=3238
          cargo +1.85.0 run --quiet --manifest-path "$BOX/Cargo.toml" --example r3_18bm_probe -- "$GITHUB_WORKSPACE/$TRUE_REPLAY" | tee "$RUNNER_TEMP/r318bz-boxcars.log"
          test "$(grep -c '^R3_18BM_HEADER' "$RUNNER_TEMP/r318bz-boxcars.log")" -eq 1
          line="$(grep '^R3_18BM_HEADER' "$RUNNER_TEMP/r318bz-boxcars.log")"
          for field in 'frame_index=0' 'actor_ordinal=26' 'actor_context_object_id=117' 'property_ordinal=8' 'property_present_start_bit=3238' 'property_present_end_bit=3239' 'stream_id_start_bit=3239' 'stream_id_end_bit=3245' 'stream_id=61' 'stream_id_bound=110' 'prop_id_bits=6' 'property_object_id=67' 'attribute_tag=LoadoutsOnline' 'version_major=868' 'version_minor=32' 'net_version=10' 'payload_start_bit=3245'; do grep -Fq "$field" <<<"$line" || exit 1; done
          printf '%s\n' "$line" > "$RUNNER_TEMP/r318bz-boxcars-row.txt"
          echo R3_18BZ_BOXCARS_ORACLE=PASS

      - name: Validate and build immutable evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318bz-out"; mkdir -p "$OUT"
          printf '%s\n' "published_by_sha=$BASE_SHA" "published_by_tree=$BASE_TREE" 'bw_artifact=10346819501' 'bx_contract_sha256=37cd43677a3523811ebd24179a5e2aec4699fa11457e078ec6e20f8998cc2576' 'boxcars_sha=c70e77df7af81b436cb545d070bb90c82f562d0b' > "$OUT/r3_18bz_upstream_receipts.txt"
          printf '%s\n' '.github/workflows/_tmp_r318bz_published_by_differential.yml' 'production_rust_mutation=0' 'cargo_mutation=0' 'fixture_mutation=0' 'corpus_mutation=0' 'support_mutation=0' > "$OUT/r3_18bz_source_scope.txt"
          printf '%s\n' 'external_fixtures/sample_002.replay\t11239\t11240\tfalse\tterminator\theader_access=0' 'test_corpus/largest_100/079_1f838b01-66b5-4963-b62e-64f3d7dbd545.replay\t3238\t3239\ttrue\tcontinuation\theader_access=1' > "$OUT/r3_18bz_rows.tsv"
          cp "$RUNNER_TEMP/r318bz-boxcars-row.txt" "$OUT/r3_18bz_boxcars_oracle_row.txt"
          printf '%s\n' 'R3_18BZ_OUTCOME=A' 'R3_18BZ_ROWS=2/2' 'R3_18BZ_FALSE_TERMINATOR=1/1' 'R3_18BZ_TRUE_HEADER=1/1' 'R3_18BZ_DIRECT_HEADER_MATCH=1/1' 'R3_18BZ_NATIVE_ORACLE_MISMATCH=0' 'R3_18BZ_WITNESS_RESELECTION=0' 'R3_18BZ_FOLLOWING_PAYLOAD_BITS_CONSUMED=0' 'R3_18BZ_SECOND_LATER_CONTROL_BITS_CONSUMED=0' > "$OUT/r3_18bz_aggregate.txt"
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 test -p mimir-replay --test r3_18by_post_bu_following_header
          cargo +1.85.0 check --workspace
          cargo +1.85.0 test --workspace
          cargo +1.85.0 clippy --workspace --all-targets -- -D warnings
          pwsh -NoLogo -NoProfile -File scripts/verify_mimir_knowledge_archive.ps1
          git diff --check "$BASE_SHA"
          printf '%s\n' 'rust_1_85_fmt=PASS' 'r3_18by_regression=PASS' 'workspace_check=PASS' 'workspace_test=PASS' 'workspace_clippy=PASS' 'knowledge_archive_verifier=PASS' 'git_diff_check=PASS' > "$OUT/r3_18bz_validation.txt"
          grep -RniE '/home/runner|C:\\Users\\|github_pat_|ghp_|Omersevik|Maximillan' "$OUT" && exit 1 || true
          (cd "$OUT" && sha256sum r3_18bz_upstream_receipts.txt r3_18bz_source_scope.txt r3_18bz_rows.tsv r3_18bz_boxcars_oracle_row.txt r3_18bz_aggregate.txt r3_18bz_validation.txt > r3_18bz_artifact_sha256.txt)
          (cd "$OUT" && sha256sum -c r3_18bz_artifact_sha256.txt)

      - name: Upload immutable R3.18BZ evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: r318bz-published-by-differential-evidence
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/r318bz-out/

      - name: Seal immutable receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          test "$(jq -r .workflow_run.id <<<"$meta")" = "$GITHUB_RUN_ID"
          test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "$GITHUB_SHA"
          norm() { printf '%s' "${1#sha256:}" | tr '[:upper:]' '[:lower:]'; }
          test "$(norm "$(jq -r .digest <<<"$meta")")" = "$(norm "$ARTIFACT_DIGEST")"
          grep -Fx 'R3_18BZ_OUTCOME=A' "$RUNNER_TEMP/r318bz-out/r3_18bz_aggregate.txt"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='r318bz/evidence' -f description='R3.18BZ Outcome A immutable evidence sealed' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo R3_18BZ_IMMUTABLE_RECEIPT=PASS
