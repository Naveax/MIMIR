name: Dependency MSRV Floor Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/_tmp_dependency_msrv_floor.yml

concurrency:
  group: dependency-msrv-floor-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rust-1-85:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: thiserror-2.0.20
            package: thiserror
            current: 2.0.18
            target: 2.0.20
            manifest_change: none
          - label: clap-4.6.6
            package: clap
            current: 4.6.0
            target: 4.6.6
            manifest_change: none
          - label: serde_json-1.0.151
            package: serde_json
            current: 1.0.149
            target: 1.0.151
            manifest_change: none
          - label: blake3-1.8.6
            package: blake3
            current: 1.8.3
            target: 1.8.6
            manifest_change: none
          - label: toml-1.1.4
            package: toml
            current: 0.8.23
            target: 1.1.4+spec-1.1.0
            manifest_change: toml-major

    name: rust-1.85 / ${{ matrix.label }}

    steps:
      - name: Checkout fresh validation base
        uses: actions/checkout@v6

      - name: Install exact Rust floor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          $version = rustc +1.85.0 --version
          if ($version -notmatch '^rustc 1\.85\.0 ') {
              throw "unexpected rustc floor: $version"
          }

      - name: Apply dependency candidate without committing it
        shell: pwsh
        env:
          PACKAGE: ${{ matrix.package }}
          CURRENT: ${{ matrix.current }}
          TARGET: ${{ matrix.target }}
          MANIFEST_CHANGE: ${{ matrix.manifest_change }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:MANIFEST_CHANGE -eq 'toml-major') {
              $path = 'Cargo.toml'
              $text = Get-Content -LiteralPath $path -Raw
              $old = 'toml = "0.8"'
              $new = 'toml = "1.1"'
              if (-not $text.Contains($old)) {
                  throw 'fresh main no longer has the expected toml 0.8 workspace requirement'
              }
              Set-Content -LiteralPath $path -Value ($text.Replace($old, $new)) -NoNewline
          }

          cargo +1.85.0 update -p "$($env:PACKAGE)@$($env:CURRENT)" --precise $env:TARGET

          $lock = Get-Content -LiteralPath Cargo.lock -Raw
          $escapedTarget = [regex]::Escape($env:TARGET)
          if ($lock -notmatch "name = `"$([regex]::Escape($env:PACKAGE))`"\r?\nversion = `"$escapedTarget`"") {
              throw "Cargo.lock did not resolve $($env:PACKAGE) to $($env:TARGET)"
          }

          Write-Host "DEPENDENCY_CANDIDATE_RESOLVED=$($env:PACKAGE)@$($env:TARGET)"

      - name: Validate exact Rust 1.85 floor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 check --workspace
          cargo +1.85.0 test --workspace
          cargo +1.85.0 clippy --workspace --all-targets -- -D warnings
          Write-Host 'DEPENDENCY_MSRV_1_85=PASS'

      - name: Prove validation-only scope
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $changed = @(git diff --name-only)
          $allowed = @('Cargo.lock')
          if ('${{ matrix.manifest_change }}' -eq 'toml-major') {
              $allowed += 'Cargo.toml'
          }
          foreach ($path in $changed) {
              if ($allowed -notcontains $path) {
                  throw "unexpected validation mutation: $path"
              }
          }
          Write-Host "DEPENDENCY_VALIDATION_SCOPE=$($changed -join ',')"
