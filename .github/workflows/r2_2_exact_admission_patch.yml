name: R2.2 exact admission patch

on:
  push:
    branches:
      - agent/replay-compat-admit-220826-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/replay-compat-admit-220826-v1
          fetch-depth: 0

      - name: Apply exact bounded admission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Path = 'crates/mimir-replay/src/lib.rs'
          $Text = Get-Content -LiteralPath $Path -Raw

          $OldConstants = @'
          const SUPPORTED_BUILD_VERSION_FIXTURE_003: &str = "251020.62592.500294";
          const MAX_ADMITTED_TEXT_BYTES: i32 = 10_000;
          '@
          $NewConstants = @'
          const SUPPORTED_BUILD_VERSION_FIXTURE_003: &str = "251020.62592.500294";
          const SUPPORTED_BUILD_VERSION_CORPUS_RANK_001: &str = "220826.56130.393105";
          const MAX_ADMITTED_TEXT_BYTES: i32 = 10_000;
          '@

          $OldEnum = @'
              Fixture002Exact,
              Fixture003Exact,
          }
          '@
          $NewEnum = @'
              Fixture002Exact,
              Fixture003Exact,
              CorpusRank001Exact,
          }
          '@

          $OldMatch = @'
                  SUPPORTED_BUILD_VERSION_FIXTURE_002 => Some(SupportedReplayHeaderTupleV1::Fixture002Exact),
                  SUPPORTED_BUILD_VERSION_FIXTURE_003 => Some(SupportedReplayHeaderTupleV1::Fixture003Exact),
                  _ => None,
          '@
          $NewMatch = @'
                  SUPPORTED_BUILD_VERSION_FIXTURE_002 => Some(SupportedReplayHeaderTupleV1::Fixture002Exact),
                  SUPPORTED_BUILD_VERSION_FIXTURE_003 => Some(SupportedReplayHeaderTupleV1::Fixture003Exact),
                  SUPPORTED_BUILD_VERSION_CORPUS_RANK_001 => {
                      Some(SupportedReplayHeaderTupleV1::CorpusRank001Exact)
                  }
                  _ => None,
          '@

          $OldTestAnchor = @'
              #[test]
              fn minimal_reader_rejects_unknown_build_version_for_otherwise_supported_tuple() {
          '@
          $NewTestAnchor = @'
              #[test]
              fn minimal_reader_admits_top_ranked_corpus_build_exact_tuple() {
                  let bytes = build_replay_bytes(build_header(HeaderSpec {
                      build_version: SUPPORTED_BUILD_VERSION_CORPUS_RANK_001.to_string(),
                      ..HeaderSpec::minimal()
                  }));

                  let header = read_synthetic(bytes)
                      .expect("top-ranked corpus BuildVersion exact tuple should be admitted");

                  assert_eq!(
                      header.metadata.get("BuildVersion"),
                      Some(&FieldValue::Text(
                          SUPPORTED_BUILD_VERSION_CORPUS_RANK_001.to_string()
                      ))
                  );
              }

              #[test]
              fn minimal_reader_rejects_unknown_build_version_for_otherwise_supported_tuple() {
          '@

          $Replacements = @(
              @($OldConstants, $NewConstants, 'constants'),
              @($OldEnum, $NewEnum, 'enum'),
              @($OldMatch, $NewMatch, 'match'),
              @($OldTestAnchor, $NewTestAnchor, 'test')
          )

          foreach ($Replacement in $Replacements) {
              $Old = [string]$Replacement[0]
              $New = [string]$Replacement[1]
              $Label = [string]$Replacement[2]
              $Count = ([regex]::Matches($Text, [regex]::Escape($Old))).Count
              if ($Count -ne 1) {
                  throw "Expected exactly one $Label replacement anchor, found $Count."
              }
              $Text = $Text.Replace($Old, $New)
          }

          Set-Content -LiteralPath $Path -Value $Text -NoNewline
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed: $LASTEXITCODE" }

          $After = Get-Content -LiteralPath $Path -Raw
          if (-not $After.Contains('SUPPORTED_BUILD_VERSION_CORPUS_RANK_001')) {
              throw 'Exact corpus build admission constant is missing after patch.'
          }
          if (-not $After.Contains('minimal_reader_admits_top_ranked_corpus_build_exact_tuple')) {
              throw 'Exact corpus admission unit test is missing after patch.'
          }

      - name: Commit exact admission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/mimir-replay/src/lib.rs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --cached --check failed: $LASTEXITCODE" }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Patch workflow produced no source change.' }
          git commit -m 'Admit top-ranked replay build 220826 exactly'
          if ($LASTEXITCODE -ne 0) { throw "git commit failed: $LASTEXITCODE" }
          git push origin HEAD:agent/replay-compat-admit-220826-v1
          if ($LASTEXITCODE -ne 0) { throw "git push failed: $LASTEXITCODE" }
