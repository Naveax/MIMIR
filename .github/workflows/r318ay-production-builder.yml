name: R3.18AY Production Builder

on:
  push:
    branches:
      - builder/r318ay-production-v1

concurrency:
  group: r318ay-production-builder-v1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout builder control
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preserve helper and checkout frozen canonical main
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/r318ay_production_builder.py "$RUNNER_TEMP/r318ay_production_builder.py"
          git checkout --force origin/main
          test "$(git rev-parse HEAD)" = "dae58bc2d27aef2daac02b626ae37dbd309706bc"
          test "$(git rev-parse HEAD^{tree})" = "06f5cb02daa94be784e7ab31aac101493bc8e959"

      - name: Authority freeze and materialize AY patch
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(python "$RUNNER_TEMP/r318ay_production_builder.py" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [[ $rc -eq 0 ]]; then
            exit 0
          fi
          if [[ "$output" != "AY pre-format scope drift" ]]; then
            echo "unexpected AY helper failure" >&2
            exit "$rc"
          fi
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          expected=(
            "crates/mimir-replay/src/lib.rs"
            "crates/mimir-replay/tests/r3_18ay_post_au_payload.rs"
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'legacy guard recovery scope drift\nactual: %s\nexpected: %s\n' "${changed[*]}" "${expected[*]}" >&2
            exit 1
          fi
          grep -q "R3.18AY PRE-ADMISSION BEGIN bounded post-AU one-following-payload" crates/mimir-replay/src/lib.rs
          test -f crates/mimir-replay/tests/r3_18ay_post_au_payload.rs
          echo "Accepted known helper untracked-file guard false-negative after exact two-file verification"

      - name: Normalize AY API to seven arguments
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          lib_path = Path("crates/mimir-replay/src/lib.rs")
          test_path = Path("crates/mimir-replay/tests/r3_18ay_post_au_payload.rs")
          lib = lib_path.read_text()
          test = test_path.read_text()

          parameter = "    aq_prior: &ReplayNetworkExistingActorAfterFirstPrimitiveSecondPropertyPayloadFollowingPayloadControlFollowingHeaderPayloadFollowingPayloadControlFollowingHeaderPayloadFollowingPayloadControlV1,\n"
          if lib.count(parameter) != 1:
              raise SystemExit(f"AY aq_prior parameter authority drift: {lib.count(parameter)}")
          lib = lib.replace(parameter, "", 1)

          recompute = "context, an_prior, aq_prior)?;"
          if lib.count(recompute) != 1:
              raise SystemExit(f"AY AU recompute authority drift: {lib.count(recompute)}")
          lib = lib.replace(recompute, "context, an_prior, &au_prior.control)?;", 1)

          decode_call_aq = ",&aq,&"
          if test.count(decode_call_aq) != 14:
              raise SystemExit(f"AY focused decode-call authority drift: {test.count(decode_call_aq)}")
          test = test.replace(decode_call_aq, ",&")

          if "aq_prior:" in lib:
              raise SystemExit("AY redundant aq_prior parameter remained")
          if lib.count("&au_prior.control") != 1:
              raise SystemExit("AY embedded AQ authority count mismatch")
          if test.count(decode_call_aq) != 0:
              raise SystemExit("AY focused calls still pass redundant AQ input")

          lib_path.write_text(lib)
          test_path.write_text(test)
          print("R3.18AY API normalized to seven arguments using AU-embedded AQ authority")
          PY

      - name: Install Rust 1.85 validation toolchain
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy

      - name: Format and validate focused AY production
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 fmt --all
          git diff --check
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          expected=(
            "crates/mimir-replay/src/lib.rs"
            "crates/mimir-replay/tests/r3_18ay_post_au_payload.rs"
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'scope drift after rustfmt\nactual: %s\nexpected: %s\n' "${changed[*]}" "${expected[*]}" >&2
            exit 1
          fi
          cargo +1.85.0 test -p mimir-replay --test r3_18ay_post_au_payload -- --test-threads=1
          cargo +1.85.0 check --workspace --all-targets
          cargo +1.85.0 clippy --workspace --all-targets -- -D warnings

      - name: Publish exact clean candidate once
        shell: bash
        env:
          CANDIDATE_REF: candidate/r318ay-production-v1
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/${CANDIDATE_REF}" >/dev/null 2>&1; then
            echo "candidate ref already exists; refusing duplicate publication" >&2
            exit 1
          fi
          git config user.name "Naveax"
          git config user.email "79841922+Naveax@users.noreply.github.com"
          git switch -c "${CANDIDATE_REF}"
          git add crates/mimir-replay/src/lib.rs crates/mimir-replay/tests/r3_18ay_post_au_payload.rs
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=(
            "crates/mimir-replay/src/lib.rs"
            "crates/mimir-replay/tests/r3_18ay_post_au_payload.rs"
          )
          if [[ "${staged[*]}" != "${expected[*]}" ]]; then
            printf 'staged scope drift\nactual: %s\nexpected: %s\n' "${staged[*]}" "${expected[*]}" >&2
            exit 1
          fi
          git commit -m "Implement R3.18AY bounded post-AU payload"
          git push origin "HEAD:refs/heads/${CANDIDATE_REF}"
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
