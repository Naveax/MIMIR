name: R3.18BM One Following Header Evidence

on:
  push:
    branches: [evidence/r318bm-following-header-v1]

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: r318bm-one-following-header-v1
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: 607361a67b7eb03a868114b0171f30a6d26873e6
      BASE_TREE: 8a83d5d80b39d79cc7d3fc8612d02bd911e3446e
      PROD_SHA: f4a56d53d11a0c3d59f4bd57e58688bdd9d192bf
      PROD_TREE: 07656c7a43c1afb97903ef33c1109b764fbf8b7d
      LIB_BLOB: 0bfff19a7d285e07508b648dbcd5af95a31838f6
      BK_TEST_BLOB: 1938707e60f7893768747931bf84e3bbac792d1b
      BM_SPEC_BLOB: e7478ee50450200e2ec9e353bc9fb0ea43561e15
      BL_DECISION_BLOB: 3eaae4404910427da3c8612dbf442f9b4c793adb
      BL_HEAD: cd30b3bb4139381ea78a2c8ec0f70c1e162e16a9
      BL_RUN: '34215686040'
      BL_JOB: '102026758270'
      BL_CI_RUN: '34215686044'
      BL_CI_JOB: '102027091932'
      BL_ARTIFACT: '10051851703'
      BL_ARTIFACT_NAME: r318bl-published-bk-differential-evidence
      BL_ARTIFACT_SIZE: '4001'
      BL_DIGEST: sha256:452cb989e2ad9d992c7e8fbb9ff3643d110bee941997fc40f2188b0ce22dcc73
      BL_MANIFEST_DIGEST: sha256:1270cc5cce9e832cc86f1854ff89c9c8c73ce6d78fe4ee61c985c116f057d53d
      MAIN_CI_RUN: '34219893871'
      MAIN_CI_JOB: '102040276136'
      MAIN_KA_RUN: '34219893944'
      MAIN_KA_JOB: '102040276104'
      BOXCARS_SHA: c70e77df7af81b436cb545d070bb90c82f562d0b
      BOXCARS_FRAME_BLOB: 6f2ff153d3a27cdacccc65e3f23851489077a7d8
      BOXCARS_ATTR_BLOB: 5e2d5bc1cd8187af30c3ea95193ad987645cb76e

    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mark evidence pending
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context='r318bm/evidence' \
            -f description='R3.18BM one-following-header evidence running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Freeze canonical authorities
        shell: bash
        run: |
          set -euo pipefail
          eq() { [ "$1" = "$2" ] || { echo "authority mismatch: got=$1 expected=$2" >&2; exit 1; }; }
          eq "$(git rev-parse HEAD^)" "$BASE_SHA"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" "$BASE_SHA"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$BASE_SHA" --jq .tree.sha)" "$BASE_TREE"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/contents/crates/mimir-replay/src/lib.rs?ref=$BASE_SHA" --jq .sha)" "$LIB_BLOB"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/contents/crates/mimir-replay/tests/r3_18bk_post_bi_following_control.rs?ref=$BASE_SHA" --jq .sha)" "$BK_TEST_BLOB"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/continuity/MIMIR_R3_18BM_EXECUTION_SPEC.md?ref=$BASE_SHA" --jq .sha)" "$BM_SPEC_BLOB"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/continuity/MIMIR_R3_18BL_DECISION.md?ref=$BASE_SHA" --jq .sha)" "$BL_DECISION_BLOB"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$BL_RUN" --jq .head_sha)" "$BL_HEAD"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$BL_RUN" --jq .conclusion)" success
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$BL_JOB" --jq .conclusion)" success
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$BL_CI_RUN" --jq .head_sha)" "$BL_HEAD"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$BL_CI_RUN" --jq .conclusion)" success
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$BL_CI_JOB" --jq .conclusion)" success
          bl_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$BL_ARTIFACT")"
          eq "$(jq -r .name <<<"$bl_meta")" "$BL_ARTIFACT_NAME"
          eq "$(jq -r .size_in_bytes <<<"$bl_meta")" "$BL_ARTIFACT_SIZE"
          eq "$(jq -r .digest <<<"$bl_meta")" "$BL_DIGEST"
          eq "$(jq -r .workflow_run.id <<<"$bl_meta")" "$BL_RUN"
          eq "$(jq -r .workflow_run.head_sha <<<"$bl_meta")" "$BL_HEAD"
          eq "$(jq -r .expired <<<"$bl_meta")" false
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$MAIN_CI_RUN" --jq .head_sha)" "$BASE_SHA"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$MAIN_CI_RUN" --jq .head_branch)" main
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$MAIN_CI_RUN" --jq .conclusion)" success
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$MAIN_CI_JOB" --jq .conclusion)" success
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$MAIN_KA_RUN" --jq .head_sha)" "$BASE_SHA"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$MAIN_KA_RUN" --jq .head_branch)" main
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$MAIN_KA_RUN" --jq .conclusion)" success
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$MAIN_KA_JOB" --jq .conclusion)" success
          echo R3_18BM_AUTHORITY_FREEZE=PASS

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '

      - name: Execute deterministic R3.18BM evidence
        shell: bash
        run: bash tools/_tmp_r318bm_run.sh

      - name: Reuse and verify unique same-head natural CI
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318bm-out"
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml" --jq .id)"
          run_id=''
          for attempt in $(seq 1 120); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100")"
            count="$(jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .event == "push")] | length' <<<"$runs")"
            [ "$count" -gt 1 ] && { echo "duplicate same-head CI runs: $count" >&2; exit 1; }
            if [ "$count" -eq 1 ]; then run_id="$(jq -r '.workflow_runs[0].id' <<<"$runs")"; break; fi
            sleep 5
          done
          test -n "$run_id"
          for attempt in $(seq 1 240); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
            [ "$state" = completed ] && break
            sleep 5
          done
          ci="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          test "$(jq -r .status <<<"$ci")" = completed
          test "$(jq -r .conclusion <<<"$ci")" = success
          test "$(jq -r .head_sha <<<"$ci")" = "$GITHUB_SHA"
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          test "$(jq '.total_count' <<<"$jobs")" -eq 1
          job_id="$(jq -r '.jobs[0].id' <<<"$jobs")"
          test "$(jq -r '.jobs[0].conclusion' <<<"$jobs")" = success
          {
            echo R3_18BM_SAME_HEAD_CI=PASS
            echo CI_RUN_ID=$run_id
            echo CI_JOB_ID=$job_id
            echo CI_RUN_COUNT=1
            echo CI_HEAD_SHA=$GITHUB_SHA
          } | tee "$OUT/r3_18bm_same_head_ci_receipt.txt"
          (cd "$OUT" && sha256sum \
            r3_18bm_source_scope.txt \
            r3_18bm_frozen_control_rows.tsv \
            r3_18bm_continuation_targets.tsv \
            r3_18bm_terminator_rows.tsv \
            r3_18bm_boxcars_instrumentation.patch \
            r3_18bm_boxcars_instrumentation_sha256.txt \
            r3_18bm_header_rows.json \
            r3_18bm_header_summary.json \
            r3_18bm_negative_controls.txt \
            r3_18bm_validation.txt \
            r3_18bm_aggregate.txt \
            r3_18bm_upstream_receipts.txt \
            r3_18bm_same_head_ci_receipt.txt \
            > r3_18bm_artifact_sha256.txt)
          test "$(wc -l < "$OUT/r3_18bm_artifact_sha256.txt")" -eq 13
          (cd "$OUT" && sha256sum -c r3_18bm_artifact_sha256.txt)

      - name: Upload immutable R3.18BM evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: r318bm-one-following-header-evidence
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/r318bm-out/

      - name: Verify immutable receipt and mark success
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318bm-out"
          test -n "$ARTIFACT_ID"; test -n "$ARTIFACT_DIGEST"
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          test "$(jq -r '.workflow_run.id' <<<"$meta")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$meta")" = "$GITHUB_SHA"
          test "$(jq -r .expired <<<"$meta")" = false
          norm() { printf '%s' "${1#sha256:}" | tr '[:upper:]' '[:lower:]'; }
          test "$(norm "$(jq -r .digest <<<"$meta")")" = "$(norm "$ARTIFACT_DIGEST")"
          for line in \
            'R3_18BM_OUTCOME=A' \
            'R3_18BM_EVIDENCE=PASS' \
            'R3_18BM_FROZEN_CONTROL_ROWS=3/3' \
            'R3_18BM_FALSE_TERMINATORS=1/1' \
            'R3_18BM_TRUE_ROWS=2/2' \
            'R3_18BM_ONE_FOLLOWING_HEADER_EXACT=2/2' \
            'R3_18BM_NATIVE_ORACLE_MISMATCH=0' \
            'R3_18BM_UNCLASSIFIED=0' \
            'R3_18BM_WITNESS_RESELECTION=0' \
            'R3_18BM_REPEATABILITY=PASS 2/2' \
            'R3_18BM_HEADER_TRUNCATION=PASS 2/2' \
            'R3_18BM_FALSE_TERMINATOR_NO_HEADER=PASS 1/1' \
            'R3_18BM_FOLLOWING_PAYLOAD_BITS_CONSUMED=0' \
            'R3_18BM_SECOND_LATER_CONTROL_BITS_CONSUMED=0' \
            'R3_18BM_PRODUCTION_CARGO_FIXTURE_CORPUS_SUPPORT_MUTATION=0/0/0/0/0' \
            'R3_18BM_PRIVACY_SCAN=PASS'; do grep -Fx "$line" "$OUT/r3_18bm_aggregate.txt"; done
          grep -Fx 'R3_18BM_SAME_HEAD_CI=PASS' "$OUT/r3_18bm_same_head_ci_receipt.txt"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context='r318bm/evidence' \
            -f description='R3.18BM Outcome A evidence verified' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo R3_18BM_IMMUTABLE_RECEIPT=PASS
