name: R3.18AO Continuity Admission Builder

on:
  push:
    branches:
      - automation/r318ao-admission-builder-v1
    paths:
      - .github/workflows/_tmp_r318ao_admission_trigger.txt

concurrency:
  group: r318ao-continuity-admission-builder-v1
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  pull-requests: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 68014a3b9aa3e5a84a4a03c2464863e9a60bfec2
      BASE_TREE: 6180021a44355e92348785d1f0f0d50002fb1a66
      PROD_SHA: 3c74b276b8eeb1d99d2ca2b12a824c2d2ef66b38
      PROD_TREE: 3efcc244bca55623b12bb21eb277753fc61144d4
      PROD_LIB_BLOB: 9d6b5ae2898cee745a17de9d1d7ef4b8fbd0e822
      PROD_TEST_BLOB: 8aa48b2b74d0956d1d2e965d056e1cf14a81f703
      AO_HEAD: 0f5ecb5b1dccf35aaabf6a45645bc70ad8a68a1c
      AO_TREE: 59126fe2757ecc500a5cc6f822d76fbc380ef85b
      AO_RUN: '32734420624'
      AO_JOB: '97453768432'
      AO_ARTIFACT: '9522750814'
      AO_ARTIFACT_SIZE: '4619'
      AO_DIGEST: 'sha256:2e34f3be6963b2b6031a395e85e9699b64df7413d62dd9809fa8fd9794547d73'
      AO_VALIDATION_PR: '194'
      AO_CI_RUN: '32734946566'
      AO_CI_JOB: '97455429462'
      CANDIDATE_BRANCH: continuity/r318ao-admit-ap-v1
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mark admission builder pending
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='r318ao/continuity-builder' \
            -f description='R3.18AO continuity builder running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
      - name: Freeze fresh main and immutable AO authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/main^{tree})" = "$BASE_TREE"
          test "$(git rev-parse "$BASE_SHA:crates/mimir-replay/src/lib.rs")" = "$PROD_LIB_BLOB"
          test "$(git rev-parse "$BASE_SHA:crates/mimir-replay/tests/r3_18an_post_ak_payload.rs")" = "$PROD_TEST_BLOB"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AO_RUN" --jq .head_sha)" = "$AO_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AO_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$AO_JOB" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$AO_HEAD" --jq .tree.sha)" = "$AO_TREE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AO_ARTIFACT" --jq .digest)" = "$AO_DIGEST"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AO_ARTIFACT" --jq .size_in_bytes)" = "$AO_ARTIFACT_SIZE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$AO_VALIDATION_PR" --jq .state)" = closed
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$AO_VALIDATION_PR" --jq '.merged_at // "null"')" = null
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AO_CI_RUN" --jq .head_sha)" = "$AO_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AO_CI_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$AO_CI_JOB" --jq .conclusion)" = success
          if git ls-remote --exit-code --heads origin "refs/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1; then
            echo "R3.18AO continuity candidate already exists; refusing duplicate" >&2
            exit 1
          fi
          echo R3_18AO_AUTHORITY_FREEZE=PASS
      - name: Generate exact 9-doc AO closure and AP opening
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$BASE_SHA"
          git clean -fdx
          git switch -C "$CANDIDATE_BRANCH" "$BASE_SHA"
          python - <<'PY'
          from pathlib import Path
          import json, re

          DATE='2026-08-24'
          BASE='68014a3b9aa3e5a84a4a03c2464863e9a60bfec2'
          BASE_TREE='6180021a44355e92348785d1f0f0d50002fb1a66'
          PROD='3c74b276b8eeb1d99d2ca2b12a824c2d2ef66b38'
          PROD_TREE='3efcc244bca55623b12bb21eb277753fc61144d4'
          LIB='9d6b5ae2898cee745a17de9d1d7ef4b8fbd0e822'
          TEST='8aa48b2b74d0956d1d2e965d056e1cf14a81f703'
          AO='0f5ecb5b1dccf35aaabf6a45645bc70ad8a68a1c'
          AO_TREE='59126fe2757ecc500a5cc6f822d76fbc380ef85b'
          AO_RUN='32734420624/97453768432'
          AO_CI='32734946566/97455429462'
          AO_ART='9522750814'
          AO_SIZE='4619'
          AO_DIG='2e34f3be6963b2b6031a395e85e9699b64df7413d62dd9809fa8fd9794547d73'
          AO_AGG='63af8982928307ad6432a5935e32cd229f9316a1800c130e9547fdb4be0b0f3b'
          AO_ROWS='40b08b16f857aecd7e15b9cb6f20d5b35a1d5ff2fd280989e217e5b4511de343'
          AO_NEG='7d88f48abc322b49c35d7b7e246b9db7a7d2708e2391816b9eb901a3875f3bf7'
          AO_SCOPE='c85e47a18a772aafd38b27524dc69ec90e2f1eb123dd7f6ff13d89916c39b815'
          AO_SUM='fbde2f6bd1f64f20bc685802e64dc267c934acc2ceeaad1a0f230c8b8e8436d4'
          AO_UP='cf255d2f1be329f8ca21a60f6fbd9d25797ea6ea8a3baaa708be7402df192419'
          AO_VAL='05e30505bfafb841df4eab519aaeeb4f4645dd8dba3e0f900651bbb3ee981d35'
          AO_MANIFEST='016c533cdde6b1cbd093a86227b0f989940ce39a1d27452144d35781bc21736a'
          AJ='cc85f9330b6d4190817d61c094d97bd00afbce770cb743170c195499d5bbc55c'
          AM='842b94ed4c4e57323433585fea48116ecf18989b'
          AM_ART='9443581172'
          AM_DIG='2f65de5207bd96787fd7d1527a55991f08d5da614a0ddfce22a7aa267968e3c8'
          BOX='c70e77df7af81b436cb545d070bb90c82f562d0b'

          def read(p):
              return Path(p).read_text(encoding='utf-8')
          def write(p,s):
              Path(p).write_text(s, encoding='utf-8', newline='\n')
          def rep1(p, old, new, label):
              s=read(p)
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f'{p}: {label}: expected 1 occurrence, got {n}')
              write(p, s.replace(old,new,1))
          def regex1(p, pattern, repl, label):
              s=read(p)
              out,n=re.subn(pattern,repl,s,count=1,flags=re.S)
              if n != 1:
                  raise SystemExit(f'{p}: {label}: expected 1 regex match, got {n}')
              write(p,out)

          p='MIMIR_CONTINUE_HERE.md'
          rep1(p,
               'LAST_COMPLETED_READ_ONLY_AUDIT:\n  R3.18AM — post-AK one-following-payload evidence / Outcome A / 47/47 / Int=47 / width32=47 / mismatch 0 / artifact 9443581172',
               f'LAST_COMPLETED_READ_ONLY_AUDIT:\n  R3.18AO — published-R3.18AN one-following-payload differential / Outcome A / 47/47 / Int=47 / width32=47 / mismatch 0 / artifact {AO_ART}',
               'last read-only audit')
          rep1(p,
               'LAST_COMPLETED_EVIDENCE_PASS:\n  R3.18AM — one post-AK Int payload exact 47/47 / width32=47 / semantic range 1..415 / mismatch 0 / another-control 0 / artifact 9443581172',
               f'LAST_COMPLETED_EVIDENCE_PASS:\n  R3.18AO — published-AN one-payload exact 47/47 / width32=47 / semantic range 1..415 / mismatch 0 / next-control 0 / artifact {AO_ART}',
               'last evidence pass')
          rep1(p,
               'CURRENT_PASS:\n  R3.18AO — published-R3.18AN one-following-payload differential\n\nCURRENT_PASS_TYPE:\n  read-only published-production differential / reuse exactly the frozen R3.18AM 47-row lane, invoke published R3.18AN, require exact payload identity through payload end, consume zero next-control bits',
               'CURRENT_PASS:\n  R3.18AP — next property-control bit evidence after published R3.18AN payload\n\nCURRENT_PASS_TYPE:\n  read-only one-control differential / reuse exactly the frozen R3.18AO 47-row lane, reconstruct published R3.18AN through payload end, observe exactly one next property_present bit, stop one bit later, consume zero stream/header/payload/second-control bits',
               'current pass')
          rep1(p,
               '  R3.18AO ACTIVE read-only differential: published-R3.18AN versus frozen-R3.18AM exact 47-row validation through one payload end; production mutation 0; next-control consumption 0\n  NO next property-control bit after R3.18AN, alternate payload tag/layout, repeated/generalized property loop/cursor, next actor/frame/lifecycle/raw-state/event/replay-slice/skill/runtime/export widening is admitted',
               f'  R3.18AO CLOSED Outcome A: published-R3.18AN/frozen-R3.18AM/direct-native-oracle exact 47/47; Int=47; width32=47; semantic range 1..415; mismatch 0; witness reselection 0; next-control consumption 0; artifact {AO_ART}\n  R3.18AP ACTIVE read-only evidence: after exact published R3.18AN payload-end reconstruction, observe exactly one next property_present bit on the frozen 47-row lane and stop one bit later\n  NO next stream/header/payload after the R3.18AP control bit, second later property-control bit, generalized/repeated property loop/cursor, next actor/frame/lifecycle/raw-state/event/replay-slice/skill/runtime/export widening is admitted',
               'hard-stop frontier')
          s=read(p)
          marker='R3_18AN_PRODUCTION_CLOSURE:\n'
          if s.count(marker) != 1:
              raise SystemExit('MIMIR_CONTINUE_HERE.md: AN closure marker drift')
          closure=f'''R3_18AO_EVIDENCE_CLOSURE:
          Outcome A / read-only / production unchanged at {PROD}
          canonical main before admission: {BASE} / tree {BASE_TREE}
          evidence head/tree: {AO} / {AO_TREE}
          authority run/job: {AO_RUN} SUCCESS
          validation-only PR #194: closed unmerged / exact-head normal CI {AO_CI} SUCCESS
          artifact: {AO_ART} / {AO_SIZE} bytes / sha256:{AO_DIG}; downloaded ZIP digest exact / inner manifest 7/7 PASS
          frozen rows 47/47 / published R3.18AN exact 47/47 / AM-direct-native-oracle exact 47/47 / mismatch 0
          Int=47 / width32=47 / semantic range 1..415 / witness reselection 0 / next-control bits consumed 0
          aggregate/rows/negative/source-scope/summary/upstream/validation hashes: {AO_AGG} / {AO_ROWS} / {AO_NEG} / {AO_SCOPE} / {AO_SUM} / {AO_UP} / {AO_VAL}
          production-Cargo-fixture-corpus-support mutation 0/0/0/0/0 / privacy PASS
          next exact pass: R3.18AP one next property-control bit evidence only

          '''
          closure='\n'.join(line[10:] if line.startswith('          ') else line for line in closure.splitlines())+'\n'
          write(p, s.replace(marker, closure+marker, 1))

          p='MIMIR_KNOWLEDGE_GRAPH.md'
          rep1(p,
               'R3.18AN bounded post-AK one-following-payload production / CLOSED\nR3.18AO published-AN one-following-payload differential / ACTIVE                                      |',
               'R3.18AN bounded post-AK one-following-payload production / CLOSED\nR3.18AO published-AN one-following-payload differential / CLOSED\nR3.18AP next property-control bit evidence after published AN payload / ACTIVE                         |',
               'graph frontier')
          old_tail='''114. `docs/continuity/MIMIR_R3_18AM_EXECUTION_SPEC.md`
          115. `docs/continuity/MIMIR_R3_18AM_DECISION.md`
          116. `docs/continuity/MIMIR_R3_18AN_EXECUTION_SPEC.md`
          117. `docs/continuity/MIMIR_R3_18AN_DECISION.md`
          118. `docs/continuity/MIMIR_R3_18AO_EXECUTION_SPEC.md`
          119. `docs/continuity/MIMIR_PASS_PROTOCOL.md`
          120. `docs/continuity/MIMIR_BOUNDARY_LOCKS.md`
          121. `docs/continuity/MIMIR_EXECUTION_ROADMAP_A_TO_Z.md`
          122. `MIMIR_ALL_SOURCES_SUPERBOOK.md`
          123. `docs/chatgpt-archive/SOURCE_REGISTRY.md`
          124. `docs/chatgpt-archive/VALIDATION_MATRIX.md`
          125. `docs/chatgpt-archive/migration/HISTORICAL_TO_CURRENT_MAPPING.md`'''
          old_tail='\n'.join(line.strip() for line in old_tail.splitlines())
          new_tail='''114. `docs/continuity/MIMIR_R3_18AM_EXECUTION_SPEC.md`
          115. `docs/continuity/MIMIR_R3_18AM_DECISION.md`
          116. `docs/continuity/MIMIR_R3_18AN_EXECUTION_SPEC.md`
          117. `docs/continuity/MIMIR_R3_18AN_DECISION.md`
          118. `docs/continuity/MIMIR_R3_18AO_EXECUTION_SPEC.md`
          119. `docs/continuity/MIMIR_R3_18AO_DECISION.md`
          120. `docs/continuity/MIMIR_R3_18AP_EXECUTION_SPEC.md`
          121. `docs/continuity/MIMIR_PASS_PROTOCOL.md`
          122. `docs/continuity/MIMIR_BOUNDARY_LOCKS.md`
          123. `docs/continuity/MIMIR_EXECUTION_ROADMAP_A_TO_Z.md`
          124. `MIMIR_ALL_SOURCES_SUPERBOOK.md`
          125. `docs/chatgpt-archive/SOURCE_REGISTRY.md`
          126. `docs/chatgpt-archive/VALIDATION_MATRIX.md`
          127. `docs/chatgpt-archive/migration/HISTORICAL_TO_CURRENT_MAPPING.md`'''
          new_tail='\n'.join(line.strip() for line in new_tail.splitlines())
          rep1(p,old_tail,new_tail,'mandatory reading tail')
          oldsec=f'''### R3.18AO published-AN one-following-payload differential: ACTIVE
          - read-only; production frozen at R3.18AN `{PROD}`
          - reuse exactly immutable R3.18AM 47 witnesses; witness reselection 0
          - require published-AN payload identity exact through payload end; next-control bits remain 0
          '''
          oldsec='\n'.join(line.strip() for line in oldsec.splitlines())+'\n'
          newsec=f'''### R3.18AO published-AN one-following-payload differential: OUTCOME A / CLOSED
          - evidence `{AO}` / tree `{AO_TREE}`; run/job `{AO_RUN}` SUCCESS
          - validation-only PR #194 closed unmerged; exact-head normal CI `{AO_CI}` SUCCESS
          - artifact `{AO_ART}` / `sha256:{AO_DIG}`; downloaded ZIP digest exact / inner manifest 7/7 PASS
          - published AN exact 47/47; AM/direct-native/oracle exact 47/47; Int=47; width32=47; semantic range 1..415; mismatch 0; witness reselection 0
          - next-control bits consumed 0; production/Cargo/fixture/corpus/support mutation 0/0/0/0/0; privacy PASS

          ### R3.18AP next property-control bit evidence after published AN payload: ACTIVE
          - read-only; production remains R3.18AN `{PROD}`
          - reuse exactly the immutable AO 47-row lane; first reconstruct published AN exactly through payload end
          - observe exactly one next `property_present` bit with pinned Boxcars plus independent LSB-first evidence read; report full false/true distribution
          - stop one bit later; next stream/header/payload and second later control consumption remain 0/0/0/0
          '''
          newsec='\n'.join(line.strip() for line in newsec.splitlines())+'\n'
          rep1(p,oldsec,newsec,'AO/AP sections')

          p='docs/continuity/MIMIR_BOUNDARY_LOCKS.md'
          new_override=f'''# 0. Current override — R3.18AO closed / R3.18AP active

          This current override supersedes older status wording later in this historical lock file.

          ## PRODUCTION — R3.18AN
          - `{PROD}` / `{PROD_TREE}` remains canonical production;
          - validates/recomputes exact R3.18AK/R3.18AJ authority, decodes exactly one R3.18AM-admitted `Int/32` payload, and stops at payload end;
          - next property-control consumption in production remains zero.

          ## CLOSED DIFFERENTIAL — R3.18AO Outcome A
          - immutable 47-row lane; published R3.18AN exact 47/47;
          - AM/direct-native/oracle exact 47/47; `Int=47`; width32=47; semantic range 1..415; mismatch 0; witness reselection 0;
          - artifact `{AO_ART}` / `sha256:{AO_DIG}`; next-control consumption 0; production mutation 0.

          ## ACTIVE EVIDENCE GATE — R3.18AP
          - reuse exactly the frozen R3.18AO witnesses and published R3.18AN API;
          - reconstruct each row exactly through the published AN payload end;
          - observe exactly one next `property_present` bit at that stop with pinned Boxcars plus independent LSB-first evidence logic;
          - report both boolean classes without filtering, stop one bit later, and consume no next stream/header/payload/second-control bits.

          ## CLOSED
          - production consumption of the R3.18AP-observed control bit until a separate bounded production pass;
          - next stream/header/payload after the one R3.18AP evidence bit;
          - second later property-control bit, alternate payload widening, repeated/generalized property loop or cursor;
          - next actor/frame/lifecycle/raw-state/event/replay-slice/skill/counterfactual/runtime/export widening.

          ---
          '''
          new_override='\n'.join(line[10:] if line.startswith('          ') else line for line in new_override.splitlines())+'\n'
          regex1(p,r'# 0\. Current override — R3\.18AN closed / R3\.18AO active\n.*?\n---\n',new_override,'current override')

          p='docs/continuity/MIMIR_CONTINUITY_STATE.json'
          data=json.loads(read(p))
          data['updated_date']=DATE
          data['last_completed_read_only_audit']='R3.18AO'
          data['current_pass']='R3.18AP'
          data['current_pass_kind']='read-only one-control differential / exactly one next property_present bit after published R3.18AN payload end'
          data['current_pass_goal']='On exactly the immutable 47-row R3.18AO lane, reproduce published R3.18AN through payload end, observe exactly one next property_present bit with pinned Boxcars and independent LSB-first evidence logic, require exact equality, and stop one bit later.'
          data['current_pass_stop_boundary']='Exactly one property_present bit after a valid published R3.18AN payload end. No next stream/header/payload, second later control, generalized loop/cursor, next actor/frame or semantic/runtime/export widening.'
          data['r3_18ao_evidence_closure']={'outcome':'A','production_sha':PROD,'base_main_sha':BASE,'evidence_head':AO,'evidence_tree':AO_TREE,'authority_run_job':AO_RUN,'same_head_ci':AO_CI,'validation_pr':194,'artifact_id':int(AO_ART),'artifact_size':int(AO_SIZE),'artifact_sha256':AO_DIG,'inner_manifest_entries':7,'frozen_rows':47,'published_an_exact':47,'am_native_oracle_exact':47,'tag_int':47,'payload_width_32':47,'semantic_int_min':1,'semantic_int_max':415,'mismatch':0,'witness_reselection':0,'next_control_bits_consumed':0,'production_cargo_fixture_corpus_support_mutation':'0/0/0/0/0','privacy':'PASS','aggregate_sha256':AO_AGG,'comparison_rows_sha256':AO_ROWS,'negative_controls_sha256':AO_NEG,'source_scope_sha256':AO_SCOPE,'summary_sha256':AO_SUM,'upstream_receipts_sha256':AO_UP,'validation_sha256':AO_VAL,'manifest_file_sha256':AO_MANIFEST}
          closed=data.get('closed_now',[])
          closed=[x for x in closed if x != 'another property control after the one R3.18AN payload end']
          for x in ['production consumption of the one R3.18AP-observed property control bit before a separate bounded production pass','next stream/header/payload after the one R3.18AP evidence control bit','second later property control bit after R3.18AP','repeated/generalized property loop or generic cursor after R3.18AP']:
              if x not in closed: closed.append(x)
          data['closed_now']=closed
          nf=data.get('next_files_to_read',[])
          for item,after in [('docs/continuity/MIMIR_R3_18AO_DECISION.md','docs/continuity/MIMIR_R3_18AO_EXECUTION_SPEC.md'),('docs/continuity/MIMIR_R3_18AP_EXECUTION_SPEC.md','docs/continuity/MIMIR_R3_18AO_DECISION.md')]:
              if item not in nf:
                  try: i=nf.index(after)+1
                  except ValueError: i=len(nf)
                  nf.insert(i,item)
          data['next_files_to_read']=nf
          write(p,json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          write('docs/continuity/MIMIR_CURRENT_STATE.md',f'''# MIMIR — Current Canonical State

          **Continuity date:** {DATE}
          **Repository:** `Naveax/MIMIR`
          **Canonical production SHA:** `{PROD}`
          **Production tree:** `{PROD_TREE}`
          **Production milestone:** `R3.18AN — bounded post-AK one-following-payload production`
          **Last read-only evidence:** `R3.18AO — Outcome A / published AN exact 47/47 / Int=47 / width32=47 / semantic 1..415 / mismatch 0 / artifact {AO_ART}`
          **Last contract:** `R3.18AJ — Outcome A / exact_tuple_only / 17 contexts / multiplicity 47 / sha256:{AJ}`
          **Current exact pass:** `R3.18AP — next property-control bit evidence after published R3.18AN payload`

          ## Truthful boundary

          R3.18AN remains the production boundary. R3.18AO independently revalidated that published production on exactly the immutable 47 R3.18AM witnesses: published-AN and AM/direct-native/oracle identity matched 47/47 through one exact `Int/32` payload end, mismatch 0, witness reselection 0 and next-control consumption 0.

          ```text
          AO evidence head/tree               {AO} / {AO_TREE}
          AO authority run/job                {AO_RUN} SUCCESS
          AO validation PR                    #194 closed unmerged
          AO exact-head normal CI             {AO_CI} SUCCESS
          AO artifact                         {AO_ART} / {AO_SIZE} bytes
          AO artifact SHA-256                 {AO_DIG}
          AO inner manifest                   7/7 PASS
          published AN exact                  47/47
          AM/direct-native/oracle exact       47/47
          mismatch                            0
          next-control bits consumed          0
          production/Cargo/fixture/corpus/support mutation 0/0/0/0/0
          ```

          ## Current gate

          R3.18AP is read-only. Reuse exactly the AO 47-row witness lane. First reproduce published R3.18AN exactly through `stop_bit == payload_end`, then observe exactly one next `property_present` bit using pinned Boxcars plus an independent evidence-only LSB-first read. Record the complete false/true distribution without witness filtering and stop exactly one bit later.

          ## Hard stop

          R3.18AP may not resolve or consume the next stream ID, header or payload, may not read a second later control bit, may not create a generalized property loop/cursor, and may not widen into the next actor/frame/lifecycle/raw-state/event/replay-slice/skill/counterfactual/runtime/export layers.
          '''.replace('\n          ','\n').lstrip())

          write('docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md',f'''# MIMIR — Next Chat Handoff

          Canonical production remains **R3.18AN** at `{PROD}` / `{PROD_TREE}`. R3.18AO is now closed Outcome A as a read-only published-production differential.

          R3.18AO authority: evidence `{AO}` / tree `{AO_TREE}`; run/job `{AO_RUN}` SUCCESS; validation-only PR #194 closed unmerged; exact-head normal CI `{AO_CI}` SUCCESS; artifact `{AO_ART}` / `{AO_SIZE}` bytes / `sha256:{AO_DIG}` with downloaded ZIP digest exact and inner manifest 7/7 PASS.

