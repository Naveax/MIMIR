name: R3.18BG Admission and R3.18BH Open v5

on:
  push:
    branches:
      - continuity/r318bg-admit-r318bh

permissions:
  contents: write

concurrency:
  group: r318bg-admission-r318bh-v5-${{ github.sha }}
  cancel-in-progress: false

env:
  PAYLOAD_WORKFLOW_BLOB: 96a46597019011ed9e5223f7954c469f04fb300a

jobs:
  continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact admission head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Execute corrected immutable continuity payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$PAYLOAD_WORKFLOW_BLOB" --jq .content | tr -d '\n' | base64 -d > "$RUNNER_TEMP/original-admission.yml"
          test "$(git hash-object "$RUNNER_TEMP/original-admission.yml")" = "$PAYLOAD_WORKFLOW_BLOB"
          python3 - "$RUNNER_TEMP/original-admission.yml" "$RUNNER_TEMP/r318bg_admission_patch.py" <<'PY'
          from pathlib import Path
          import sys

          src = Path(sys.argv[1]).read_text(encoding='utf-8')
          begin = "          python3 - <<'PY'\n"
          end = "\n          PY\n      - name: Validate exact continuity surface"
          if src.count(begin) != 1 or src.count(end) != 1:
              raise SystemExit('immutable admission payload markers drifted')

          raw = src.split(begin, 1)[1].split(end, 1)[0]
          body = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in raw.splitlines()
          ) + '\n'

          if not body.startswith('from pathlib import Path\n'):
              raise SystemExit('extracted payload has unexpected first line')

          old_start = "if 'R3.18BG CLOSED Outcome A:' not in t:\n"
          old_end = "write(p, t)\n\n# Knowledge graph"
          if body.count(old_start) != 1 or body.count(old_end) != 1:
              raise SystemExit('master hard-stop patch anchors drifted')

          start = body.index(old_start)
          end_idx = body.index(old_end, start)
          corrected = (
              "master_override = (\n"
              "    '# CURRENT OVERRIDE — R3.18BG CLOSED / R3.18BH ACTIVE\\n\\n'\n"
              "    'Fresh receipts below override older current-like wording above.\\n\\n'\n"
              "    '```text\\n'\n"
              "    'R3_18BF_EVIDENCE_CLOSURE:\\n'\n"
              "    'Outcome A / read-only / exact 40/40 / false=37 true=3 / headers=3/3 / contexts=3/3 / mismatch=0 / reselection=0 / artifact 10009534065\\n'\n"
              "    'R3_18BG_EVIDENCE_CLOSURE:\\n'\n"
              "    'Outcome A / read-only one primitive payload on exactly the three BF-true rows\\n'\n"
              "    'head: 02e1799001b670db24f1e0076f2afd6c05f5afdf\\n'\n"
              "    'run/job: 34112731371/101715102551 SUCCESS\\n'\n"
              "    'same-head CI: 34112731358/101712578621 SUCCESS\\n'\n"
              "    'artifact: 10015405999 / sha256:a43a528a49fa6d07ef1c92266c6dc9ed4ef2a3e87e7f69f65f2f40d39f3fa15a\\n'\n"
              "    'inner manifest: sha256:b06097e08cc276e80e17543f36a3ab05ac184b335ec12ded0fd460e2129d5e46 / 17/17 verified\\n'\n"
              "    'rows: 3/3 / Boolean=2 / Float=1 / widths 1:2 + 32:1 / raw IEEE754 Float identity\\n'\n"
              "    'native-oracle mismatch: 0 / witness reselection: 0 / BF-false excluded: 37/37 / upstream-AU-false excluded: 7/7 / next-control consumed: 0\\n'\n"
              "    'R3_18BH_ACTIVE:\\n'\n"
              "    'read exactly one next property_present bit from each exact BG payload_end_bit; discover distribution; require native/pinned-Boxcars bit+end equality 3/3; stop one bit later\\n'\n"
              "    '```\\n\\n'\n"
              "    'Hard stop: no production BG payload/BH-control composition, no following stream/header/payload, no second later control, no generalized cursor, and no actor/frame/lifecycle/raw-state/event/replay-slice/skill/counterfactual/runtime/export widening.\\n\\n'\n"
              ")\n"
              "t = sub_once(\n"
              "    t,\n"
              "    r'(?ms)^# CURRENT OVERRIDE — R3\\.18BF CLOSED / R3\\.18BG ACTIVE\\n.*?(?=^---\\n)',\n"
              "    master_override,\n"
              "    'master current override',\n"
              ")\n"
          )
          body = body[:start] + corrected + body[end_idx:]

          compile(body, '<r318bg-admission-patch-v5>', 'exec')
          Path(sys.argv[2]).write_text(body, encoding='utf-8', newline='\n')
          PY
          python3 "$RUNNER_TEMP/r318bg_admission_patch.py"

      - name: Validate exact continuity surface
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool docs/continuity/MIMIR_CONTINUITY_STATE.json >/dev/null
          test -f docs/continuity/MIMIR_R3_18BG_DECISION.md
          test -f docs/continuity/MIMIR_R3_18BH_EXECUTION_SPEC.md
          grep -q '^# CURRENT OVERRIDE — R3.18BG CLOSED / R3.18BH ACTIVE$' MIMIR_CONTINUE_HERE.md
          ! grep -q '^# CURRENT OVERRIDE — R3.18BF CLOSED / R3.18BG ACTIVE$' MIMIR_CONTINUE_HERE.md
          grep -A1 '^CURRENT_PASS:$' MIMIR_CONTINUE_HERE.md | grep -q 'R3.18BH'
          grep -q 'R3.18BG one following primitive payload evidence / Outcome A CLOSED' MIMIR_KNOWLEDGE_GRAPH.md
          grep -q 'R3.18BH next property-control bit evidence after exact BG payload end / ACTIVE' MIMIR_KNOWLEDGE_GRAPH.md
          grep -q '^# 0. Current override — R3.18BG payload evidence closed / R3.18BH next-control evidence active$' docs/continuity/MIMIR_BOUNDARY_LOCKS.md
          grep -q 'R3.18BH' docs/continuity/MIMIR_CURRENT_STATE.md
          grep -q 'R3.18BH' docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md
          git rm .github/workflows/r318bg-admission-r318bh-v5.yml
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/r318bg-admission-r318bh-v5.yml \
            MIMIR_CONTINUE_HERE.md \
            MIMIR_KNOWLEDGE_GRAPH.md \
            docs/continuity/MIMIR_BOUNDARY_LOCKS.md \
            docs/continuity/MIMIR_CONTINUITY_STATE.json \
            docs/continuity/MIMIR_CURRENT_STATE.md \
            docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md \
            docs/continuity/MIMIR_PROGRESS_LEDGER.md \
            docs/continuity/MIMIR_R3_18BG_DECISION.md \
            docs/continuity/MIMIR_R3_18BH_EXECUTION_SPEC.md | sort)"
          test "$actual" = "$expected" || { echo 'Unexpected diff surface'; diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual"); exit 1; }
          test -z "$(git diff --name-only -- '*.rs' 'Cargo.toml' 'Cargo.lock')"

      - name: Commit exact docs-only admission
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naveax'
          git config user.email '79841922+Naveax@users.noreply.github.com'
          git add MIMIR_CONTINUE_HERE.md MIMIR_KNOWLEDGE_GRAPH.md docs/continuity
          git commit -m 'Admit R3.18BG and open R3.18BH'
          git push origin HEAD:continuity/r318bg-admit-r318bh
