name: R3.18AF Next Property-Control Differential Evidence

on:
  push:
    branches:
      - evidence/r318af-next-property-control-v1

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: r318af-next-property-control-evidence
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mark evidence pending
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='r318af/evidence' \
            -f description='R3.18AF one-bit differential evidence running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '

      - name: Execute R3.18AF evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crates/mimir-replay/examples
          bash tools/_tmp_r318af_run.sh

      - name: Upload immutable R3.18AF evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: r318af-next-property-control-differential-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            r3_18af_source_scope.txt
            r3_18af_replay_identity.tsv
            r3_18af_frozen_ae_rows.json
            r3_18af_targets.tsv
            r3_18af_boxcars_instrumentation_sha256.txt
            r3_18af_summary.json
            r3_18af_comparison.json
            r3_18af_negative_controls.txt
            r3_18af_aggregate.txt
            r3_18af_upstream_receipts.txt
            r3_18af_artifact_sha256.txt

      - name: Verify immutable receipt and mark success
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          test "$(jq -r '.workflow_run.id' <<<"$meta")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$meta")" = "$GITHUB_SHA"
          test "$(jq -r '.expired' <<<"$meta")" = false
          rest_digest="$(jq -r '.digest' <<<"$meta")"
          norm() { printf '%s' "${1#sha256:}" | tr '[:upper:]' '[:lower:]'; }
          test "$(norm "$rest_digest")" = "$(norm "$ARTIFACT_DIGEST")"
          grep -Fx 'R3_18AF_OUTCOME=A' r3_18af_aggregate.txt
          grep -Fx 'R3_18AF_EVIDENCE=PASS' r3_18af_aggregate.txt
          grep -Fx 'R3_18AF_FROZEN_ROWS=47/47' r3_18af_aggregate.txt
          grep -Fx 'R3_18AF_PUBLISHED_R318AD_EXACT=47/47' r3_18af_aggregate.txt
          grep -Fx 'R3_18AF_NATIVE_ORACLE_MISMATCH=0' r3_18af_aggregate.txt
          grep -Fx 'R3_18AF_NEXT_STREAM_BITS_CONSUMED=0' r3_18af_aggregate.txt
          grep -Fx 'R3_18AF_NEXT_HEADER_BITS_CONSUMED=0' r3_18af_aggregate.txt
          grep -Fx 'R3_18AF_NEXT_PAYLOAD_BITS_CONSUMED=0' r3_18af_aggregate.txt
          grep -Fx 'R3_18AF_SECOND_LATER_CONTROL_BITS_CONSUMED=0' r3_18af_aggregate.txt
          grep -Fx 'R3_18AF_WITNESS_RESELECTION=0' r3_18af_aggregate.txt
          grep -Fx 'R3_18AF_PRIVACY_SCAN=PASS' r3_18af_aggregate.txt
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='r318af/evidence' \
            -f description='R3.18AF Outcome A one-bit differential PASS' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "R3_18AF_EVIDENCE_HEAD=$(git rev-parse HEAD)"
          echo "R3_18AF_EVIDENCE_TREE=$(git rev-parse HEAD^{tree})"
          echo "R3_18AF_AUTHORITY_RUN=$GITHUB_RUN_ID"
          echo "R3_18AF_ARTIFACT_ID=$ARTIFACT_ID"
          echo "R3_18AF_ARTIFACT_DIGEST=$ARTIFACT_DIGEST"
          cat r3_18af_aggregate.txt
          echo 'R3_18AF_IMMUTABLE_RECEIPT=PASS'

      - name: Mark evidence failure
        if: failure()
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='r318af/evidence' \
            -f description='R3.18AF evidence failed; inspect exact run' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
