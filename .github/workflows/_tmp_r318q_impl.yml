name: R3.18Q Bounded Following Header Implementation

on:
  push:
    branches: [ops/r318q-implementation-v1]

permissions:
  contents: write
  actions: read

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc --version | grep -F 'rustc 1.85.0 '

      - name: Build and prove clean R3.18Q candidate
        run: bash tools/_tmp_r318q_impl.sh

      - uses: actions/upload-artifact@v4
        with:
          name: r318q-production-authority
          path: r3_18q_authority/
          if-no-files-found: error
          retention-days: 30
