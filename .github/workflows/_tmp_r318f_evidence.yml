name: R3.18F Second Property Header Evidence

on:
  push:
    branches:
      - evidence/r318f-second-property-header

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run R3.18F evidence orchestration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/_tmp_r318f_run.sh

      - name: Upload immutable R3.18F evidence
        id: artifact
        uses: actions/upload-artifact@v6
        with:
          name: r318f-second-property-header-evidence
          path: |
            r3_18f_source_scope.txt
            r3_18f_replay_identity.tsv
            r3_18f_boxcars_instrumentation_sha256.txt
            r3_18f_selected_witnesses.json
            r3_18f_selection_summary.json
            r3_18f_comparison.json
            r3_18f_aggregate.txt
            r3_18f_receipt_sha256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Immutable receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          echo "R3_18F_AUTHORITY_HEAD=$(git rev-parse HEAD)"
          echo "R3_18F_AUTHORITY_RUN=$GITHUB_RUN_ID"
          echo "R3_18F_ARTIFACT_ID=$ARTIFACT_ID"
          echo "R3_18F_ARTIFACT_DIGEST=$ARTIFACT_DIGEST"
          cat r3_18f_selection_summary.json
          cat r3_18f_comparison.json
          cat r3_18f_aggregate.txt
          cat r3_18f_receipt_sha256.txt
          echo 'R3_18F_IMMUTABLE_RECEIPT=PASS'
