      - name: Emit immutable R3.17P receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"; test -n "$ARTIFACT_DIGEST"
          printf 'R3_17P_AUTHORITY_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'R3_17P_AUTHORITY_RUN=%s\n' "$GITHUB_RUN_ID"
          printf 'R3_17P_ARTIFACT_ID=%s\n' "$ARTIFACT_ID"
          printf 'R3_17P_ARTIFACT_DIGEST=%s\n' "$ARTIFACT_DIGEST"
          cat r3_17p_summary.json
          cat r3_17p_aggregate.txt
          cat r3_17p_receipt_sha256.txt
          printf 'R3_17P_RECEIPT_STREAM=PASS\n'