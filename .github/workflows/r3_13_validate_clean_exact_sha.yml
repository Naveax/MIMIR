name: R3.13 Validate Clean Exact SHA

on:
  push:
    branches:
      - agent/r3-13-network-lookup-plan-clean-validation

permissions:
  contents: read

jobs:
  validate-and-readback:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact clean R3.13 commit
        uses: actions/checkout@v6
        with:
          ref: ee23fe4d6975caf4910fd6db84a18c3a2f3f70aa
          fetch-depth: 1

      - name: Assert exact checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -ne 'ee23fe4d6975caf4910fd6db84a18c3a2f3f70aa') {
            throw "exact checkout drift: $actual"
          }
          Write-Host "R3_13_EXACT_SHA=$actual"

      - name: Toolchain
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup component add rustfmt clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full verifier with concise readback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'r3_13_verify_repo.log'
          & pwsh -NoProfile -File scripts/verify_repo.ps1 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "R3_13_VERIFY_EXIT=$code"
            Get-Content -LiteralPath $log -Tail 500
            exit $code
          }

          $markers = @(
            'test result: ok. 111 passed; 0 failed',
            'test result: ok. 273 passed; 0 failed',
            'PASS: 100 replay fixtures match manifest size + SHA-256.',
            'supported=44 unsupported=56 malformed=0 mapping_error=0 other_error=0',
            'PASS: MIMIR repository verification completed with real command arguments.'
          )
          foreach ($marker in $markers) {
            if (-not (Select-String -LiteralPath $log -SimpleMatch $marker -Quiet)) {
              throw "missing R3.13 verifier marker: $marker"
            }
            Write-Host "READBACK $marker"
          }
          Write-Host 'R3_13_FULL_VERIFICATION=PASS'
          Write-Host 'R3_13_VERIFY_EXIT=0'
