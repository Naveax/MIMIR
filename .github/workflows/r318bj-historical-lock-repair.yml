name: R3.18BJ Historical Lock Repair

on:
  push:
    branches:
      - continuity/r318bj-admit-bk

permissions:
  contents: write

concurrency:
  group: r318bj-historical-lock-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: 910b88b66cf896893ff86620944111c723c5ab5d
      SCRIPT_PATH: .github/scripts/r318bj_restore_historical_locks.py
      WORKFLOW_PATH: .github/workflows/r318bj-historical-lock-repair.yml
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Repair exactly two historical locks
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$BASE_SHA"
          python3 "$SCRIPT_PATH"
          python3 -m json.tool docs/continuity/MIMIR_CONTINUITY_STATE.json >/dev/null
          grep -F 'production composition of the following payload after R3.18AU before a later production pass' docs/continuity/MIMIR_CONTINUITY_STATE.json
          grep -F 'production composition of the R3.18BG-observed payload before a later production pass' docs/continuity/MIMIR_CONTINUITY_STATE.json
          test "$(grep -c 'production consumption/composition of the R3.18BH-observed next property-control bit before a later production pass' docs/continuity/MIMIR_CONTINUITY_STATE.json || true)" -eq 0
          test "$(grep -c 'production consumption of the R3.18BH-observed next property-control bit before R3.18BJ published-production differential closure' docs/continuity/MIMIR_CONTINUITY_STATE.json || true)" -eq 0
          pwsh -NoLogo -NoProfile -File scripts/verify_repo.ps1
      - name: Commit repaired docs-only tree
        shell: bash
        run: |
          set -euo pipefail
          git rm "$SCRIPT_PATH" "$WORKFLOW_PATH"
          git add docs/continuity/MIMIR_CONTINUITY_STATE.json
          test -z "$(git diff --cached --name-only "$BASE_SHA" -- crates Cargo.toml Cargo.lock external_fixtures test_corpus scripts .github)"
          git config user.name 'MIMIR Continuity Bot'
          git config user.email '79841922+Naveax@users.noreply.github.com'
          git commit -m 'Preserve superseded historical boundary locks'
          git push origin HEAD:continuity/r318bj-admit-bk
