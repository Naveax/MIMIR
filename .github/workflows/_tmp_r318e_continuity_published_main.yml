name: R3.18E Continuity Published Main Validator

on:
  push:
    branches:
      - validation/r318e-continuity-published-main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 85
    env:
      PARENT: dd7d9550910a0ad08cd5f1a171d782b5dd4e954a
      PUBLISHED: 3a10ee59ba42722b59ca6c5b816205f6e5d603ea
      PUBLISHED_TREE: ff8049a18431977e054652a0836217fcc39d84a7
      PROD: 4adadd185783954c7fb6ad67db14b77b377cdde5

    steps:
      - name: Checkout validation trigger
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Freeze published main and reset
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PUBLISHED"
          test "$(git rev-parse "${PUBLISHED}^{tree}")" = "$PUBLISHED_TREE"
          test "$(git rev-parse "${PUBLISHED}^")" = "$PARENT"
          git reset --hard "$PUBLISHED"
          test "$(git rev-parse HEAD)" = "$PUBLISHED"
          echo 'R3_18E_CONTINUITY_PUBLISHED_IDENTITY=PASS'

      - name: Verify published six-file diff and handbook integrity
        shell: pwsh
        run: |
          $expected = @(
            'MIMIR_CONTINUE_HERE.md','MIMIR_KNOWLEDGE_GRAPH.md',
            'docs/continuity/MIMIR_CONTINUITY_STATE.json','docs/continuity/MIMIR_CURRENT_STATE.md',
            'docs/continuity/MIMIR_R3_18E_DECISION.md','docs/continuity/MIMIR_R3_18F_EXECUTION_SPEC.md'
          ) | Sort-Object
          $actual = @(git diff --name-only $env:PARENT $env:PUBLISHED) | Where-Object { $_ } | Sort-Object
          $delta = @(Compare-Object $expected $actual)
          if ($delta.Count -ne 0) { $delta | Format-Table; exit 1 }
          $forbidden = @(git diff --name-only $env:PARENT $env:PUBLISHED -- crates Cargo.toml Cargo.lock external_fixtures test_corpus tools scripts .github)
          if ($forbidden.Count -ne 0) { $forbidden; exit 1 }
          $numstat = @(git diff --numstat $env:PARENT $env:PUBLISHED -- MIMIR_CONTINUE_HERE.md)
          if ($numstat.Count -ne 1 -or $numstat[0] -ne "53`t23`tMIMIR_CONTINUE_HERE.md") { $numstat; exit 1 }
          $handbook=Get-Content MIMIR_CONTINUE_HERE.md -Raw
          foreach ($anchor in @('# 9.7 Exact-SHA validation','# 10. PASS TEMPLATE — COPY THIS FOR EVERY FUTURE PASS','# 13. CURRENT PASS CHECKLIST — R3.14A','**Important:** the newest `main` commit can be newer than `LAST_PRODUCTION_CODE_SHA`')) {
            if (-not $handbook.Contains($anchor)) { throw "Missing handbook anchor: $anchor" }
          }
          Write-Host 'R3_18E_CONTINUITY_PUBLISHED_SCOPE=PASS files=6 handbook=+53/-23 production=0'

      - name: Verify published canonical semantics
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          prod='4adadd185783954c7fb6ad67db14b77b377cdde5'
          state=json.loads(Path('docs/continuity/MIMIR_CONTINUITY_STATE.json').read_text(encoding='utf-8'))
          main=Path('MIMIR_CONTINUE_HERE.md').read_text(encoding='utf-8')
          graph=Path('MIMIR_KNOWLEDGE_GRAPH.md').read_text(encoding='utf-8')
          current=Path('docs/continuity/MIMIR_CURRENT_STATE.md').read_text(encoding='utf-8')
          decision=Path('docs/continuity/MIMIR_R3_18E_DECISION.md').read_text(encoding='utf-8')
          spec=Path('docs/continuity/MIMIR_R3_18F_EXECUTION_SPEC.md').read_text(encoding='utf-8')
          assert state['last_production_code_sha']==prod
          assert state['last_completed_read_only_audit']=='R3.18E'
          assert state['last_completed_evidence_pass']=='R3.18E'
          assert state['current_pass']=='R3.18F'
          assert state['r3_18e']['artifact_id']==9264243765
          assert state['r3_18e']['selected_rows']==94
          assert state['r3_18e']['native_oracle_mismatch_count']==0
          assert state['r3_18e']['second_stream_bits_consumed']==0
          assert state['r3_18e']['second_header_bits_consumed']==0
          assert state['r3_18e']['second_payload_bits_consumed']==0
          for anchor in ['CURRENT_PASS:\n  R3.18F','R3_18E_AUDIT_CLOSURE:','R3_18F_OPEN_BOUNDARY:']:
              assert anchor in main, anchor
          assert 'R3.18E control-bit differential decision' in graph
          assert 'R3.18F active second-property-header evidence spec' in graph
          assert '**Outcome:** **A — ADMITTED / READ-ONLY DIFFERENTIAL COMPLETE**' in decision
          assert '**Status:** ACTIVE' in spec
          assert '**Production mutation:** forbidden' in spec
          assert '**Second-property payload decode:** forbidden' in spec
          assert '**Third property / repeated loop:** forbidden' in spec
          assert 'R3.18F' in current and prod in current
          print('R3_18E_CONTINUITY_PUBLISHED_SEMANTICS=PASS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Knowledge Archive
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/verify_mimir_knowledge_archive.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full repository verifier
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/verify_repo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
