name: R3.18AI Continuity Builder

on:
  push:
    branches:
      - automation/r318ai-continuity-aj-generator-v1
    paths:
      - .github/workflows/_tmp_r318ai_continuity_trigger.txt

concurrency:
  group: r318ai-continuity-builder
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  statuses: write

jobs:
  build-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_MAIN: b419503b5ceb8c44af207f645232570b1c9f2e6d
      BASE_TREE: 8bcdedf47233b0e6db605c6c532677d0f8166801
      GENERATOR_BLOB: f8e1ba64e960bb2b3b6e089b5c8b4219c07cb50b
      OPS_BRANCH: ops/r318ai-continuity-aj-open-v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact automation head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mark builder pending
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='r318ai/continuity-builder' \
            -f description='R3.18AI continuity builder running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Freeze base and generator authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          actual_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$actual_main" = "$BASE_MAIN"
          test "$(git rev-parse "$BASE_MAIN^{tree}")" = "$BASE_TREE"
          test "$(git hash-object tools/_tmp_r318ai_continuity_generate.py)" = "$GENERATOR_BLOB"
          python -m py_compile tools/_tmp_r318ai_continuity_generate.py
          cp tools/_tmp_r318ai_continuity_generate.py "$RUNNER_TEMP/r318ai_continuity_generate.py"

      - name: Resolve immutable builder job receipt
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          job_id=""
          for _ in $(seq 1 20); do
            job_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "build-continuity") | .id' | head -n 1)"
            if [ -n "$job_id" ]; then break; fi
            sleep 1
          done
          test -n "$job_id"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "builder=$GITHUB_RUN_ID/$job_id"

      - name: Generate clean continuity candidate
        shell: bash
        env:
          R318AI_BUILDER_JOB: ${{ steps.receipt.outputs.job_id }}
        run: |
          set -euo pipefail
          git reset --hard "$BASE_MAIN"
          git clean -fdx
          git switch -C "$OPS_BRANCH" "$BASE_MAIN"
          mkdir -p tools
          cp "$RUNNER_TEMP/r318ai_continuity_generate.py" tools/_tmp_r318ai_continuity_generate.py
          R318AI_BUILDER_RUN="$GITHUB_RUN_ID" \
          R318AI_BUILDER_JOB="$R318AI_BUILDER_JOB" \
          python tools/_tmp_r318ai_continuity_generate.py
          rm -f tools/_tmp_r318ai_continuity_generate.py
          rmdir tools 2>/dev/null || true

          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          cat > "$expected" <<'EOF'
          MIMIR_CONTINUE_HERE.md
          MIMIR_KNOWLEDGE_GRAPH.md
          docs/continuity/MIMIR_BOUNDARY_LOCKS.md
          docs/continuity/MIMIR_CONTINUITY_STATE.json
          docs/continuity/MIMIR_CURRENT_STATE.md
          docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md
          docs/continuity/MIMIR_PROGRESS_LEDGER.md
          docs/continuity/MIMIR_R3_18AI_DECISION.md
          docs/continuity/MIMIR_R3_18AJ_EXECUTION_SPEC.md
          EOF
          sed -i 's/^          //' "$expected"
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sed '/^$/d' | sort -u > "$actual"
          sort -u -o "$expected" "$expected"
          diff -u "$expected" "$actual"

          python -m json.tool docs/continuity/MIMIR_CONTINUITY_STATE.json >/dev/null
          pwsh -NoProfile -File scripts/verify_mimir_knowledge_archive.ps1

          git add -- \
            MIMIR_CONTINUE_HERE.md \
            MIMIR_KNOWLEDGE_GRAPH.md \
            docs/continuity/MIMIR_BOUNDARY_LOCKS.md \
            docs/continuity/MIMIR_CONTINUITY_STATE.json \
            docs/continuity/MIMIR_CURRENT_STATE.md \
            docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md \
            docs/continuity/MIMIR_PROGRESS_LEDGER.md \
            docs/continuity/MIMIR_R3_18AI_DECISION.md \
            docs/continuity/MIMIR_R3_18AJ_EXECUTION_SPEC.md
          git diff --cached --check
          test -z "$(git status --porcelain | awk '$1 != "M" && $1 != "A" {print}')"

          git config user.name "MIMIR Admission Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Admit R3.18AI and open R3.18AJ"
          test "$(git rev-parse HEAD^)" = "$BASE_MAIN"
          test "$(git diff --name-only "$BASE_MAIN" HEAD | sort | tr '\n' ' ')" = "$(sort "$expected" | tr '\n' ' ')"

      - name: Publish candidate branch and receipt
        shell: bash
        env:
          R318AI_BUILDER_JOB: ${{ steps.receipt.outputs.job_id }}
        run: |
          set -euo pipefail
          clean_sha="$(git rev-parse HEAD)"
          clean_tree="$(git rev-parse HEAD^{tree})"
          receipt="$RUNNER_TEMP/r318ai_continuity_candidate_receipt.txt"
          {
            echo "R3_18AI_CONTINUITY_BUILDER_RUN=$GITHUB_RUN_ID"
            echo "R3_18AI_CONTINUITY_BUILDER_JOB=$R318AI_BUILDER_JOB"
            echo "R3_18AI_BASE_MAIN=$BASE_MAIN"
            echo "R3_18AI_BASE_TREE=$BASE_TREE"
            echo "R3_18AI_CLEAN_SHA=$clean_sha"
            echo "R3_18AI_CLEAN_TREE=$clean_tree"
            echo "R3_18AI_OPS_BRANCH=$OPS_BRANCH"
            echo "R3_18AI_CLEAN_FILE_COUNT=9"
            echo "R3_18AI_PRODUCTION_MUTATION=0"
            echo "R3_18AI_CARGO_MUTATION=0"
            echo "R3_18AI_FIXTURE_MUTATION=0"
            echo "R3_18AI_CORPUS_MUTATION=0"
            echo "R3_18AI_WORKFLOW_MUTATION=0"
            echo "R3_18AI_SUPPORT_MUTATION=0"
            echo "R3_18AI_CONTINUITY_CANDIDATE=PASS"
            echo "--- sha256 ---"
            sha256sum \
              MIMIR_CONTINUE_HERE.md \
              MIMIR_KNOWLEDGE_GRAPH.md \
              docs/continuity/MIMIR_BOUNDARY_LOCKS.md \
              docs/continuity/MIMIR_CONTINUITY_STATE.json \
              docs/continuity/MIMIR_CURRENT_STATE.md \
              docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md \
              docs/continuity/MIMIR_PROGRESS_LEDGER.md \
              docs/continuity/MIMIR_R3_18AI_DECISION.md \
              docs/continuity/MIMIR_R3_18AJ_EXECUTION_SPEC.md
          } | tee "$receipt"
          git push origin "HEAD:refs/heads/$OPS_BRANCH"
          cp "$receipt" r318ai_continuity_candidate_receipt.txt

      - name: Upload candidate receipt
        uses: actions/upload-artifact@v4
        with:
          name: r318ai-continuity-candidate-receipt
          path: r318ai_continuity_candidate_receipt.txt
          if-no-files-found: error

      - name: Report builder status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description='R3.18AI continuity builder failed'
          if [ "$JOB_STATUS" = 'success' ]; then
            state=success
            description='R3.18AI continuity builder succeeded'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='r318ai/continuity-builder' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
