name: R3.18BJ Canonical Admission Helper

on:
  push:
    branches:
      - continuity/r318bj-admit-bk

permissions:
  contents: write
  actions: read

concurrency:
  group: r318bj-admit-bk-continuity
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: 910b88b66cf896893ff86620944111c723c5ab5d
      HELPER_PATH: .github/workflows/r318bj-admit-bk-continuity.yml
      SCRIPT_PATH: .github/scripts/r318bj_admit_bk.py
    steps:
      - name: Checkout continuity branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Freeze main and helper-only pre-state
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$BASE_SHA"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          mapfile -t actual < <(git diff --name-only "$BASE_SHA" HEAD | sort)
          mapfile -t expected < <(printf '%s\n' "$HELPER_PATH" "$SCRIPT_PATH" | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")

      - name: Execute continuity mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$SCRIPT_PATH"
          python3 "$SCRIPT_PATH"

      - name: Validate mutated continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool docs/continuity/MIMIR_CONTINUITY_STATE.json >/dev/null
          grep -F 'R3.18BJ — Outcome A' MIMIR_CONTINUE_HERE.md
          grep -F 'R3.18BK — bounded post-BI next property-control production' MIMIR_CONTINUE_HERE.md
          grep -F 'R3.18BJ published-R3.18BI one-following-payload differential / Outcome A CLOSED' MIMIR_KNOWLEDGE_GRAPH.md
          grep -F 'R3.18BK bounded post-BI next property-control production / ACTIVE' MIMIR_KNOWLEDGE_GRAPH.md
          grep -F '**Outcome:** **A — ADMITTED / READ-ONLY DIFFERENTIAL CLOSED**' docs/continuity/MIMIR_R3_18BJ_DECISION.md
          grep -F '**Status:** ACTIVE' docs/continuity/MIMIR_R3_18BK_EXECUTION_SPEC.md
          pwsh -NoLogo -NoProfile -File scripts/verify_repo.ps1

      - name: Commit final docs-only tree
        shell: bash
        run: |
          set -euo pipefail
          git rm "$HELPER_PATH" "$SCRIPT_PATH"
          git add MIMIR_CONTINUE_HERE.md MIMIR_KNOWLEDGE_GRAPH.md docs/continuity/MIMIR_BOUNDARY_LOCKS.md docs/continuity/MIMIR_CONTINUITY_STATE.json docs/continuity/MIMIR_CURRENT_STATE.md docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md docs/continuity/MIMIR_PROGRESS_LEDGER.md docs/continuity/MIMIR_R3_18BJ_DECISION.md docs/continuity/MIMIR_R3_18BK_EXECUTION_SPEC.md
          test -z "$(git diff --cached --name-only "$BASE_SHA" -- crates Cargo.toml Cargo.lock external_fixtures test_corpus scripts)"
          mapfile -t actual < <(git diff --cached --name-only "$BASE_SHA" | sort)
          mapfile -t expected < <(printf '%s\n' MIMIR_CONTINUE_HERE.md MIMIR_KNOWLEDGE_GRAPH.md docs/continuity/MIMIR_BOUNDARY_LOCKS.md docs/continuity/MIMIR_CONTINUITY_STATE.json docs/continuity/MIMIR_CURRENT_STATE.md docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md docs/continuity/MIMIR_PROGRESS_LEDGER.md docs/continuity/MIMIR_R3_18BJ_DECISION.md docs/continuity/MIMIR_R3_18BK_EXECUTION_SPEC.md | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          git config user.name 'MIMIR Continuity Bot'
          git config user.email '79841922+Naveax@users.noreply.github.com'
          git commit -m 'Admit R3.18BJ and open R3.18BK'
          git push origin HEAD:continuity/r318bj-admit-bk
