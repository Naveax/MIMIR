        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Freeze fresh main and helper ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = "$HELPER_PATH"

