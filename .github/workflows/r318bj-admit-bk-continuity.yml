name: R3.18BJ Canonical Admission Helper

on:
  push:
    branches:
      - continuity/r318bj-admit-bk

permissions:
  contents: write
  actions: read

concurrency:
  group: r318bj-admit-bk-continuity
  cancel-in-progress: false

jobs:
