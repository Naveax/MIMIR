name: R3.18AZ Continuity Admission BA Builder

on:
  push:
    branches:
      - builder/r318az-admission-ba-v1
    paths:
      - .github/workflows/r318az-admission-ba-builder.yml
      - .github/workflows/r318az_admission_builder.py

concurrency:
  group: r318az-admission-ba-builder-v1
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  statuses: read

jobs:
  build-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAIN_SHA: d12b7662a61571ecb43109ebbc753b790d37b6ad
      MAIN_TREE: b90fb38e7e16bfd3948219856eef29f9ac1bb8f2
      PROD_SHA: 2558cc0559422a3e6695e1501f20d96d83b23e6d
      PROD_TREE: 93198ad2a4f929ac62b87beddbc9d5b5665f08d1
      EVIDENCE_HEAD: f46479faa2b230f7fde474f7f7696a1024420879
      EVIDENCE_TREE: 0d022d27fda2275de9512d96231979e1d016491e
      EVIDENCE_RUN: '33086674062'
      EVIDENCE_JOB: '98568084290'
      EVIDENCE_CI_RUN: '33086674797'
      EVIDENCE_CI_JOB: '98568087263'
      ARTIFACT_ID: '9652520412'
      ARTIFACT_SIZE: '18151'
      ARTIFACT_DIGEST: sha256:558c709e242d74150755565d07c7968853abad0a1de6c5f49cd8f5920e7f9fc4
      CANDIDATE_BRANCH: candidate/r318az-admission-ba-v1
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout builder control
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Freeze AZ evidence and current authority
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/r318az_admission_builder.py "$RUNNER_TEMP/r318az_admission_builder.py"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$MAIN_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$MAIN_SHA" --jq .tree.sha)" = "$MAIN_TREE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$PROD_SHA" --jq .tree.sha)" = "$PROD_TREE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$EVIDENCE_HEAD" --jq .tree.sha)" = "$EVIDENCE_TREE"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$EVIDENCE_RUN" --jq .head_sha)" = "$EVIDENCE_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$EVIDENCE_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$EVIDENCE_JOB" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$EVIDENCE_CI_RUN" --jq .head_sha)" = "$EVIDENCE_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$EVIDENCE_CI_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$EVIDENCE_CI_JOB" --jq .conclusion)" = success

          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ARTIFACT_ID")"
          test "$(jq -r .name <<<"$artifact")" = r318az-published-ay-differential-evidence
          test "$(jq -r .size_in_bytes <<<"$artifact")" = "$ARTIFACT_SIZE"
          test "$(jq -r .digest <<<"$artifact")" = "$ARTIFACT_DIGEST"
          test "$(jq -r .expired <<<"$artifact")" = false
          test "$(jq -r .workflow_run.head_sha <<<"$artifact")" = "$EVIDENCE_HEAD"

          status="$(gh api "repos/${GITHUB_REPOSITORY}/commits/$EVIDENCE_HEAD/status")"
          test "$(jq -r .state <<<"$status")" = success
          test "$(jq '[.statuses[] | select(.context=="r318az/evidence" and .state=="success")] | length' <<<"$status")" -eq 1

          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=$EVIDENCE_HEAD&per_page=100")"
          test "$(jq '[.workflow_runs[] | select(.name=="R3.18AZ Published AY Differential Evidence")] | length' <<<"$runs")" -eq 1
          test "$(jq '[.workflow_runs[] | select(.name=="CI")] | length' <<<"$runs")" -eq 1
          test "$(jq '[.workflow_runs[] | select(.run_attempt != 1)] | length' <<<"$runs")" -eq 0

          if gh api "repos/${GITHUB_REPOSITORY}/branches/${CANDIDATE_BRANCH}" >/dev/null 2>&1; then
            echo "candidate branch already exists; refusing duplicate" >&2
            exit 1
          fi

          git checkout --detach "$MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$MAIN_TREE"

      - name: Materialize AZ closure and BA execution spec
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/r318az_admission_builder.py"
          git diff --check

          mapfile -t actual < <({ git diff --name-only "$MAIN_SHA"; git ls-files --others --exclude-standard; } | sort -u)
          mapfile -t expected < <(printf '%s\n' \
            MIMIR_CONTINUE_HERE.md \
            MIMIR_KNOWLEDGE_GRAPH.md \
            docs/continuity/MIMIR_BOUNDARY_LOCKS.md \
            docs/continuity/MIMIR_CONTINUITY_STATE.json \
            docs/continuity/MIMIR_CURRENT_STATE.md \
            docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md \
            docs/continuity/MIMIR_PROGRESS_LEDGER.md \
            docs/continuity/MIMIR_R3_18AZ_DECISION.md \
            docs/continuity/MIMIR_R3_18BA_EXECUTION_SPEC.md | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")

          git diff --exit-code "$MAIN_SHA" -- crates Cargo.toml Cargo.lock external_fixtures test_corpus scripts MIMIR_ALL_SOURCES_SUPERBOOK.md docs/chatgpt-archive .github
          python -m json.tool docs/continuity/MIMIR_CONTINUITY_STATE.json >/dev/null
          pwsh -NoProfile -File scripts/verify_mimir_knowledge_archive.ps1

          grep -Fx '  R3.18BA — bounded post-R3.18AY mixed following-control production' MIMIR_CONTINUE_HERE.md
          grep -F 'R3.18AZ published-R3.18AY one-following-payload differential / Outcome A CLOSED' MIMIR_KNOWLEDGE_GRAPH.md
          grep -F 'R3.18BA bounded post-R3.18AY mixed following-control production / ACTIVE' MIMIR_KNOWLEDGE_GRAPH.md
          grep -Fx '**Outcome:** **A — ADMITTED / READ-ONLY DIFFERENTIAL COMPLETE**' docs/continuity/MIMIR_R3_18AZ_DECISION.md
          grep -Fx '**Status:** ACTIVE' docs/continuity/MIMIR_R3_18BA_EXECUTION_SPEC.md

      - name: Publish one clean continuity candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$MAIN_SHA"
          if gh api "repos/${GITHUB_REPOSITORY}/branches/${CANDIDATE_BRANCH}" >/dev/null 2>&1; then
            echo "candidate branch appeared during build; refusing duplicate publication" >&2
            exit 1
          fi

          git config user.name Naveax
          git config user.email 79841922+Naveax@users.noreply.github.com
          git switch -c "$CANDIDATE_BRANCH"
          git add \
            MIMIR_CONTINUE_HERE.md \
            MIMIR_KNOWLEDGE_GRAPH.md \
            docs/continuity/MIMIR_BOUNDARY_LOCKS.md \
            docs/continuity/MIMIR_CONTINUITY_STATE.json \
            docs/continuity/MIMIR_CURRENT_STATE.md \
            docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md \
            docs/continuity/MIMIR_PROGRESS_LEDGER.md \
            docs/continuity/MIMIR_R3_18AZ_DECISION.md \
            docs/continuity/MIMIR_R3_18BA_EXECUTION_SPEC.md

          mapfile -t staged < <(git diff --cached --name-only | sort)
          mapfile -t expected < <(printf '%s\n' \
            MIMIR_CONTINUE_HERE.md \
            MIMIR_KNOWLEDGE_GRAPH.md \
            docs/continuity/MIMIR_BOUNDARY_LOCKS.md \
            docs/continuity/MIMIR_CONTINUITY_STATE.json \
            docs/continuity/MIMIR_CURRENT_STATE.md \
            docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md \
            docs/continuity/MIMIR_PROGRESS_LEDGER.md \
            docs/continuity/MIMIR_R3_18AZ_DECISION.md \
            docs/continuity/MIMIR_R3_18BA_EXECUTION_SPEC.md | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${staged[@]}")

          git commit -m "Admit R3.18AZ and open R3.18BA"
          test "$(git rev-parse HEAD^1)" = "$MAIN_SHA"
          test "$(git diff --name-only "$MAIN_SHA" HEAD | wc -l)" -eq 9
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo "admission_candidate_sha=$(git rev-parse HEAD)"
          echo "admission_candidate_tree=$(git rev-parse HEAD^{tree})"
