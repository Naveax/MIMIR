name: Temporary R3.14C Primitive Implementation V2

on:
  push:
    branches:
      - agent/r3-14c-network-bit-primitives-v2
    paths:
      - '.github/workflows/_tmp_r3_14c_v2.yml'

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact implementation branch
        uses: actions/checkout@v6
        with:
          ref: agent/r3-14c-network-bit-primitives-v2
          fetch-depth: 0

      - name: Assert exact published-main base
        shell: bash
        run: |
          set -euo pipefail
          base=c42836647673cecc47cc9c89908da1de11d8a222
          git cat-file -e "${base}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse "${base}:Cargo.lock")" = "$(git rev-parse 'HEAD:Cargo.lock')"
          test "$(git rev-parse "${base}:crates/mimir-replay/Cargo.toml")" = "$(git rev-parse 'HEAD:crates/mimir-replay/Cargo.toml')"
          test "$(git rev-parse "${base}:crates/mimir-replay/src/lib.rs")" = "$(git rev-parse 'HEAD:crates/mimir-replay/src/lib.rs')"

      - name: Apply deterministic R3.14C source patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/_tmp_r3_14c_v2_apply.py
          git diff -- crates/mimir-replay/src/lib.rs

      - name: Format and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          test "$(git diff --name-only)" = 'crates/mimir-replay/src/lib.rs'

      - name: Focused R3.14C primitive tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p mimir-replay r3_14c_ -- --nocapture

      - name: Full mimir-replay regression
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p mimir-replay -- --nocapture

      - name: Workspace check
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --workspace --all-targets --all-features

      - name: Workspace tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --workspace --all-targets --all-features

      - name: Workspace clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Export inventory gate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p mimir-export -- --list

      - name: Verify checked-in replay corpus
        shell: pwsh
        run: |
          ./scripts/verify_test_corpus.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify MIMIR knowledge archive
        shell: pwsh
        run: |
          ./scripts/verify_mimir_knowledge_archive.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit R3.14C hard stop and exact source scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf 'R3.14C working-tree changes:\n%s\n' "$changed"
          test "$changed" = 'crates/mimir-replay/src/lib.rs'
          git diff --quiet -- Cargo.toml Cargo.lock crates/mimir-replay/Cargo.toml

          grep -q "struct NetworkBitCursor<'a>" crates/mimir-replay/src/lib.rs
          ! grep -q 'pub struct NetworkBitCursor' crates/mimir-replay/src/lib.rs
          ! grep -q 'ReplayNetworkFirstActorEnvelope' crates/mimir-replay/src/lib.rs
          ! grep -Eiq 'boxcars' crates/mimir-replay/Cargo.toml Cargo.toml Cargo.lock

          test "$(grep -c '^    fn r3_14c_' crates/mimir-replay/src/lib.rs)" -eq 19
          grep -q 'fn r3_14c_bounded_u32_matches_all_47_r3_14a_actor_id_vectors' crates/mimir-replay/src/lib.rs
          grep -q 'for row_index in 0..47' crates/mimir-replay/src/lib.rs

          git diff -- crates/mimir-replay/src/lib.rs > r3_14c_source.diff
          source_sha256="$(sha256sum crates/mimir-replay/src/lib.rs | awk '{print $1}')"
          cat > r3_14c_validation_receipt.txt <<EOF
          pass=R3.14C
          base_main_sha=c42836647673cecc47cc9c89908da1de11d8a222
          source_sha256=${source_sha256}
          focused_tests=PASS
          focused_test_count=19
          oracle_vector_rows=47
          oracle_vector_value_match=47/47
          oracle_vector_end_bit_match=47/47
          mimir_replay_regression=PASS
          workspace_check=PASS
          workspace_tests=PASS
          workspace_clippy=PASS
          export_inventory=PASS
          corpus_verifier=PASS
          knowledge_archive_verifier=PASS
          cargo_locked=PASS
          hard_stop_scope=PASS
          production_files_changed=crates/mimir-replay/src/lib.rs
          EOF

      - name: Commit validated production source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/mimir-replay/src/lib.rs
          test "$(git diff --cached --name-only)" = 'crates/mimir-replay/src/lib.rs'
          git diff --cached --check
          git commit -m 'Add replay network bit primitives'
          git push origin HEAD:agent/r3-14c-network-bit-primitives-v2

      - name: Upload R3.14C validation evidence
        uses: actions/upload-artifact@v6
        with:
          name: r3-14c-v2-validation-${{ github.sha }}
          path: |
            r3_14c_source.diff
            r3_14c_validation_receipt.txt
          if-no-files-found: error
