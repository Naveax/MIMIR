name: R3.18Z Published Run Discovery

on:
  push:
    branches:
      - ops/r318z-run-discovery-v1
    paths-ignore:
      - r318z_run_discovery.json
  pull_request:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  discover:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ops/r318z-run-discovery-v1
      - name: Read published-main runs
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ac24d29edeacd04152afe318e25ae296385159c3
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&head_sha=$PUBLISHED_SHA&event=push&per_page=20" \
            --jq '{published_sha: env.PUBLISHED_SHA, workflow_runs: [.workflow_runs[] | {id,name,status,conclusion,head_sha,event,path,created_at,updated_at}]}' \
            > r318z_run_discovery.json
          cat r318z_run_discovery.json
          git config user.name 'MIMIR Discovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add r318z_run_discovery.json
          git commit -m 'ops(r318z): record published-main run discovery'
          git push origin HEAD:refs/heads/ops/r318z-run-discovery-v1
