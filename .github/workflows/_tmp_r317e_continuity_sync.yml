Outcome A requires a complete contract table for every admitted observed shape, deterministic success/end-bit semantics, explicit malformed/truncation rules, privacy-safe test vectors, and zero contradiction with the R3.17E evidence artifact. Outcome B means targeted evidence is still required for a specific shape. Outcome C stops the wave.

