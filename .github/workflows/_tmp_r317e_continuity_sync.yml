name: R3.17E Continuity Admission

on:
  push:
    branches:
      - agent/r317e-continuity-sync

permissions:
  contents: write

jobs:
  admission:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout disposable continuity branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply R3.17E continuity sync
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/_tmp_r317e_continuity_sync.py
          if ($LASTEXITCODE -ne 0) { throw 'R3.17E continuity synchronizer failed' }
          Write-Host 'R3_17E_CONTINUITY_APPLY=PASS'

      - name: Verify exact six-file continuity scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'cfe4882f99dbce5e8148e476c177a0586b1e7986'
          $prodBlob = '54e1bfb918ec1bd42a61cfa0131ca27412082ac5'
          $expected = @(
            'MIMIR_CONTINUE_HERE.md',
            'MIMIR_KNOWLEDGE_GRAPH.md',
            'docs/continuity/MIMIR_CONTINUITY_STATE.json',
            'docs/continuity/MIMIR_CURRENT_STATE.md',
            'docs/continuity/MIMIR_R3_17E_DECISION.md',
            'docs/continuity/MIMIR_R3_17F_EXECUTION_SPEC.md'
          ) | Sort-Object

          if ((git rev-parse 'HEAD:crates/mimir-replay/src/lib.rs') -ne $prodBlob) { throw 'frozen production source blob mismatch' }
          git diff --exit-code "$base..HEAD" -- crates/mimir-replay/src/lib.rs crates/mimir-replay/Cargo.toml Cargo.toml Cargo.lock external_fixtures test_corpus
          if ($LASTEXITCODE -ne 0) { throw 'protected production/Cargo/corpus branch drift exists' }
          git add -N -- docs/continuity/MIMIR_R3_17E_DECISION.md docs/continuity/MIMIR_R3_17F_EXECUTION_SPEC.md
          if ($LASTEXITCODE -ne 0) { throw 'intent-to-add new continuity files failed' }
          $actual = @(git diff --name-only) | Sort-Object
          if (($actual -join "`n") -ne ($expected -join "`n")) {
            Write-Host 'EXPECTED:'; $expected | ForEach-Object { Write-Host $_ }
            Write-Host 'ACTUAL:'; $actual | ForEach-Object { Write-Host $_ }
            throw 'continuity working-tree scope mismatch'
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'continuity diff check failed' }
          Write-Host 'R3_17E_CONTINUITY_SCOPE=PASS files=6'

      - name: Knowledge archive verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/verify_mimir_knowledge_archive.ps1
          if ($LASTEXITCODE -ne 0) { throw 'knowledge archive verification failed' }
          Write-Host 'R3_17E_CONTINUITY_KNOWLEDGE=PASS'

      - name: Publish clean R3.17E admission candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'cfe4882f99dbce5e8148e476c177a0586b1e7986'
          $candidate = 'candidate/r3-17e-admission-clean'
          $files = @(
            'MIMIR_CONTINUE_HERE.md',
            'MIMIR_KNOWLEDGE_GRAPH.md',
            'docs/continuity/MIMIR_CONTINUITY_STATE.json',
            'docs/continuity/MIMIR_CURRENT_STATE.md',
            'docs/continuity/MIMIR_R3_17E_DECISION.md',
            'docs/continuity/MIMIR_R3_17F_EXECUTION_SPEC.md'
          )
          $stage = Join-Path $env:RUNNER_TEMP 'r317e-admission-clean-stage'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          foreach ($file in $files) {
            $dst = Join-Path $stage $file
            $parent = Split-Path -Parent $dst
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -LiteralPath $file -Destination $dst
          }
          git fetch origin main --quiet
          if ($LASTEXITCODE -ne 0) { throw 'fetch main failed' }
          $remoteMain = git rev-parse origin/main
          if ($remoteMain -ne $base) { throw "main drifted: $remoteMain != $base" }
          git checkout --detach $base
          if ($LASTEXITCODE -ne 0) { throw 'checkout base failed' }
          git clean -fdx
          git checkout -B $candidate
          if ($LASTEXITCODE -ne 0) { throw 'candidate create failed' }
          foreach ($file in $files) {
            $src = Join-Path $stage $file
            $parent = Split-Path -Parent $file
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -LiteralPath $src -Destination $file
          }
          git add -- $files
          $expected = $files | Sort-Object
          $actual = @(git diff --cached --name-only) | Sort-Object
          if (($actual -join "`n") -ne ($expected -join "`n")) { throw 'clean staged scope mismatch' }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'clean diff check failed' }
          git diff --cached --exit-code -- crates/mimir-replay/src/lib.rs crates/mimir-replay/Cargo.toml Cargo.toml Cargo.lock external_fixtures test_corpus
          if ($LASTEXITCODE -ne 0) { throw 'clean candidate contains protected diff' }
          $global:LASTEXITCODE = 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Admit R3.17E and open R3.17F'
          if ($LASTEXITCODE -ne 0) { throw 'admission commit failed' }
          $cleanSha = git rev-parse HEAD
          git push origin "HEAD:refs/heads/$candidate" --force
          if ($LASTEXITCODE -ne 0) { throw 'push candidate failed' }
          Write-Host "R3_17E_ADMISSION_CLEAN_SHA=$cleanSha"
          Write-Host 'R3_17E_ADMISSION_CLEAN=PASS'
