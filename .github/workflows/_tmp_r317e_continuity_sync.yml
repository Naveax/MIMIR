## Goal

Freeze deterministic, atomic decoding contracts for only the K2 semantic variants actually observed by R3.17E, so a later production implementation pass can be TDD-driven without guessing wire behavior.

## In scope

1. `ActiveActor`: 33-bit payload contract consisting of active flag plus actor reference semantics.
2. `String`: signed i32 length branch contract for observed Empty, Windows1252 and UTF16 forms, including exact payload-end and truncation behavior.
3. `QWordString`: observed legacy 64-bit QWord branch and observed RL223 Windows1252 text branch.
4. `UniqueId`: observed Steam, PlayStation, PsyNet and Epic variants only, with evidence-supported net-version width rules and Epic text/local structure.
5. `PartyLeader`: only observed `Some(Epic, Windows1252, declared=33)` structure.
6. Atomic failure semantics: insufficient input or malformed declared shape must not partially advance the externally visible cursor/result.
7. Exact boundary tests must be derived from immutable R3.17E witness identities/hashes; no cleartext identities enter public fixtures.

## Explicitly not admitted

- PartyLeader `None` or non-Epic PartyLeader variants.
- Unobserved UniqueId systems or width/version combinations.
- Unobserved QWordString UTF16/empty combinations.
- Any K2 shape inferred solely from Boxcars source or type names rather than supported-corpus evidence.
- Production decoder implementation.
- Second property or property-loop continuation.
- Next actor/frame iteration, actor lifecycle mutation.
- K3/K4 families, raw-state/event/skill/runtime/export widening.
- Cargo, fixture, corpus or support-lane widening unless separately admitted.

