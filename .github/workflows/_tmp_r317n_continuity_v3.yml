name: R3.17N Continuity Closure V3

on:
  push:
    branches:
      - agent/r317n-continuity-sync-v3

permissions:
  contents: write

jobs:
  continuity:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch wording-only semantic assertion and rerun closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/_tmp_r317n_continuity_driver.sh')
          s=p.read_text(encoding='utf-8')
          old="assert 'R3.18 remains closed' in texts[3] and 'R3.18 remains closed' in texts[4]"
          new="assert 'R3.18' in texts[3] and 'R3.18 remains closed' in texts[4]"
          if s.count(old)!=1: raise SystemExit('semantic assertion anchor mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          print('R3_17N_WORDING_ASSERTION_PATCH=PASS')
          PY
          bash tools/_tmp_r317n_continuity_driver.sh
