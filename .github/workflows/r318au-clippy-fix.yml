name: R3.18AU Clippy Fix Staging

on:
  push:
    branches:
      - automation/r318au-builder-v1

concurrency:
  group: r318au-clippy-fix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v6
        with:
          ref: automation/r318au-builder-v1
          fetch-depth: 0

      - name: Install Rust 1.85 rustfmt
        shell: bash
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt

      - name: Apply exact Clippy repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/mimir-replay/tests/r3_18au_post_aq_following_header.rs')
          source = path.read_text(encoding='utf-8')
          old = 'usize::try_from((aq.stop_bit + 7) / 8).unwrap()'
          new = 'usize::try_from(aq.stop_bit.div_ceil(8)).unwrap()'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one manual div ceil expression, found {source.count(old)}')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8', newline='\n')
          PY

      - name: Rust 1.85 format and focused validation
        shell: bash
        run: |
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 test -p mimir-replay --test r3_18au_post_aq_following_header -- --nocapture

      - name: Current toolchain Clippy warnings denied
        shell: bash
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Scope guard
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          test "$changed" = 'crates/mimir-replay/tests/r3_18au_post_aq_following_header.rs'

      - name: Remove helper and commit staging output
        shell: bash
        run: |
          git rm .github/workflows/r318au-clippy-fix.yml
          git add crates/mimir-replay/tests/r3_18au_post_aq_following_header.rs
          git diff --cached --check
          git config user.name 'MIMIR AU Builder'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Stage R3.18AU Clippy-clean focused test'
          git push origin HEAD:automation/r318au-builder-v1
