name: R3.18AO Published AN Differential Evidence

on:
  push:
    branches:
      - evidence/r318ao-published-an-differential-v1
    paths:
      - .github/workflows/_tmp_r318ao_trigger.txt

concurrency:
  group: r318ao-evidence-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark evidence pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='r318ao/evidence' \
            -f description='R3.18AO published AN differential running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version
          cargo +1.85.0 --version
          rustup run 1.85.0 rustfmt --version
          gh --version
          jq --version
          pwsh --version

      - name: Execute deterministic R3.18AO evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x tools/_tmp_r318ao_run.sh
          tools/_tmp_r318ao_run.sh

      - name: Upload immutable R3.18AO evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r318ao-published-an-differential-evidence
          path: r3_18ao_*
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Verify artifact receipt and mark success
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact=''
          for attempt in $(seq 1 30); do
            artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name=="r318ao-published-an-differential-evidence") | [.id,.size_in_bytes,.digest] | @tsv' | head -n1)"
            if [[ -n "$artifact" ]]; then break; fi
            sleep 2
          done
          test -n "$artifact"
          IFS=$'\t' read -r artifact_id artifact_size artifact_digest <<< "$artifact"
          test -n "$artifact_id"
          test -n "$artifact_size"
          test -n "$artifact_digest"
          echo "R3_18AO_ARTIFACT=${artifact_id}/${artifact_size}/${artifact_digest}"
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='r318ao/evidence' \
            -f description='R3.18AO 47/47 published AN differential passed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Mark evidence failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='r318ao/evidence' \
            -f description='R3.18AO evidence failed; inspect exact run' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
