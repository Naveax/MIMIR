name: R2.4 Exact Admission Patch

on:
  push:
    branches:
      - agent/r2-4-admit-rank3-230823
    paths:
      - .github/workflows/r2-4-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/r2-4-admit-rank3-230823
          fetch-depth: 0

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Apply exact rank-3 admission
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Path = 'crates/mimir-replay/src/lib.rs'
          $Text = Get-Content -LiteralPath $Path -Raw

          function Replace-ExactOnce([string]$Label, [string]$Old, [string]$New) {
            $script:Text = $script:Text.Replace($Old, $New)
            $oldCount = ([regex]::Matches((Get-Content -LiteralPath $Path -Raw), [regex]::Escape($Old))).Count
            if ($oldCount -ne 1) {
              throw "$Label anchor count expected 1, got $oldCount"
            }
          }

          $Old = @'
          const SUPPORTED_BUILD_VERSION_CORPUS_RANK_001: &str = "220826.56130.393105";
          const SUPPORTED_BUILD_VERSION_CORPUS_RANK_002: &str = "230224.54624.415510";
          const MAX_ADMITTED_TEXT_BYTES: i32 = 10_000;
          '@
          $New = @'
          const SUPPORTED_BUILD_VERSION_CORPUS_RANK_001: &str = "220826.56130.393105";
          const SUPPORTED_BUILD_VERSION_CORPUS_RANK_002: &str = "230224.54624.415510";
          const SUPPORTED_BUILD_VERSION_CORPUS_RANK_003: &str = "230823.66121.430366";
          const MAX_ADMITTED_TEXT_BYTES: i32 = 10_000;
          '@
          $Count = ([regex]::Matches($Text, [regex]::Escape($Old))).Count
          if ($Count -ne 1) { throw "constant anchor count expected 1, got $Count" }
          $Text = $Text.Replace($Old, $New)

          $Old = @'
              CorpusRank001Exact,
              CorpusRank002Exact,
          }
          '@
          $New = @'
              CorpusRank001Exact,
              CorpusRank002Exact,
              CorpusRank003Exact,
          }
          '@
          $Count = ([regex]::Matches($Text, [regex]::Escape($Old))).Count
          if ($Count -ne 1) { throw "enum anchor count expected 1, got $Count" }
          $Text = $Text.Replace($Old, $New)

          $Old = @'
              SUPPORTED_BUILD_VERSION_CORPUS_RANK_002 => {
                  Some(SupportedReplayHeaderTupleV1::CorpusRank002Exact)
              }
              _ => None,
          '@
          $New = @'
              SUPPORTED_BUILD_VERSION_CORPUS_RANK_002 => {
                  Some(SupportedReplayHeaderTupleV1::CorpusRank002Exact)
              }
              SUPPORTED_BUILD_VERSION_CORPUS_RANK_003 => {
                  Some(SupportedReplayHeaderTupleV1::CorpusRank003Exact)
              }
              _ => None,
          '@
          $Count = ([regex]::Matches($Text, [regex]::Escape($Old))).Count
          if ($Count -ne 1) { throw "match anchor count expected 1, got $Count" }
          $Text = $Text.Replace($Old, $New)

          $Old = @'
              #[test]
              fn minimal_reader_rejects_unknown_build_version_for_otherwise_supported_tuple() {
          '@
          $New = @'
              #[test]
              fn minimal_reader_admits_third_ranked_corpus_build_exact_tuple() {
                  let bytes = build_replay_bytes(build_header(HeaderSpec {
                      build_version: SUPPORTED_BUILD_VERSION_CORPUS_RANK_003.to_string(),
                      ..HeaderSpec::minimal()
                  }));

                  let header = read_synthetic(bytes)
                      .expect("third-ranked corpus BuildVersion exact tuple should be admitted");

                  assert_eq!(
                      header.metadata.get("BuildVersion"),
                      Some(&FieldValue::Text(
                          SUPPORTED_BUILD_VERSION_CORPUS_RANK_003.to_string()
                      ))
                  );
              }

              #[test]
              fn minimal_reader_rejects_unknown_build_version_for_otherwise_supported_tuple() {
          '@
          $Count = ([regex]::Matches($Text, [regex]::Escape($Old))).Count
          if ($Count -ne 1) { throw "test anchor count expected 1, got $Count" }
          $Text = $Text.Replace($Old, $New)

          [IO.File]::WriteAllText((Resolve-Path $Path), $Text, [Text.UTF8Encoding]::new($false))

          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt failed' }

          $Diff = git diff -- $Path
          if (-not $Diff) { throw 'patch produced no source diff' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }

          $Changed = @(git diff --name-only)
          if ($Changed.Count -ne 1 -or $Changed[0] -ne $Path) {
            throw "unexpected changed files: $($Changed -join ', ')"
          }

      - name: Verify exact admission locally on GitHub runner
        shell: pwsh
        run: |
          cargo test -p mimir-replay minimal_reader_admits_third_ranked_corpus_build_exact_tuple -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p mimir-replay minimal_reader_rejects_unknown_build_version_for_otherwise_supported_tuple -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit source patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/mimir-replay/src/lib.rs
          git commit -m "Admit third-ranked replay build 230823 exactly"
          git push origin HEAD:agent/r2-4-admit-rank3-230823
