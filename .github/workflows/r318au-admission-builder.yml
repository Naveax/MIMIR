          The focused `r3_18au_post_aq_following_header` target passed 12/12 on the exact candidate and again through the full repository verifier. The frozen mixed-lane test exercises all 47 witnesses, false-path post-AQ poison isolation, true-path payload poison isolation, true-header truncation, exact membership rejection and source-scope guards. Workspace check/test and Clippy with warnings denied passed on the exact candidate and on published `main`.

          ## Clean publication

          The production commit contains only:
          - `crates/mimir-replay/src/lib.rs`;
          - `crates/mimir-replay/tests/r3_18au_post_aq_following_header.rs`.

          No Cargo/dependency, documentation, workflow, fixture, corpus, support, raw-state, event, skill, runtime or export mutation entered the production commit. Fresh-main ancestry was rechecked immediately before publication; `main` was advanced with `force=false`; exact SHA/tree readback matched; published-main CI succeeded.

          ## Hard stop

          No following payload after the one admitted true-path header, no second later property-control bit, no header on the seven false terminators, no context outside exact R3.18AT membership, no generalized/repeated property loop/cursor, and no next actor/frame/lifecycle/raw-state/event/replay-slice/skill/counterfactual/runtime/export widening.

          ## Next gate

          R3.18AV is a separate read-only published-production differential. It must compare published R3.18AU against exactly the immutable 47-row AS/AT authority, preserve false=7 and true=40, require exact true-header identity/boundaries and AT context/multiplicity equality, keep mismatch and witness reselection at zero, and consume no following payload or second later control. Only AV Outcome A may open a separate R3.18AW one-following-payload evidence pass on the exact forty true rows.
          """
          decision_path = Path("docs/continuity/MIMIR_R3_18AU_DECISION.md")
          if decision_path.exists():
              raise SystemExit("AU decision already exists")
          write(str(decision_path), textwrap.dedent(decision))

          av_spec = f"""# MIMIR R3.18AV — Published R3.18AU Mixed Following-Header Differential

          **Status:** ACTIVE
          **Pass type:** read-only published-production differential
          **Production authority:** R3.18AU `{PROD}` / `{TREE}`
          **Production mutation:** forbidden
          **Following payload:** forbidden
          **Second later property-control bit:** forbidden
          **Witness reselection:** forbidden

          ## Goal

          Validate the published R3.18AU mixed following-header API against exactly the immutable 47-row R3.18AS/R3.18AT authority lane.

          - The exact 7 AQ-false rows must remain successful no-header terminators and stop at the already-published AQ/AU terminator boundary with zero post-AQ reads.
          - The exact 40 AQ-true rows must return exactly one following header matching the frozen R3.18AS header identity/boundaries and exact R3.18AT eight-field membership, then stop exactly at `payload_start`.
          - No following payload or second later control may be consumed.

          ## Frozen authority

          ```text
          production SHA/tree                    {PROD} / {TREE}
          parent                                 {PARENT}
          lib / focused-test blobs               {LIB_BLOB} / {TEST_BLOB}
          AU execution spec blob                 {AU_SPEC_BLOB}
          AU clean-candidate CI                  {CANDIDATE_RUN}/{CANDIDATE_JOB} SUCCESS
          AU published-main CI                   {PUBLISHED_RUN}/{PUBLISHED_JOB} SUCCESS
          AS evidence head                       {AS_HEAD}
          AS artifact                            {AS_ARTIFACT} / sha256:{AS_ARTIFACT_SHA}
          AT contract                            sha256:{AT_SHA}
          AT membership                          exact_tuple_only / 16 eight-field tuples / multiplicity 40
          immutable mixed lane                   47 rows / false=7 / true=40
          observed true-header tags              Int=40
          pinned Boxcars                         c70e77df7af81b436cb545d070bb90c82f562d0b
          ```

          R3.18AS and R3.18AT are immutable authorities. R3.18AV may not reselect witnesses, infer a larger tuple set, or inherit R3.18AJ/Z/P membership.

          ## Exact differential lane

          For every exact frozen witness:

          1. reconstruct the exact valid published prerequisites through R3.18AQ;
          2. call published R3.18AU once;
          3. require the returned embedded control to equal the exact recomputed AQ result;
          4. on false, require `following_header == None` and AU stop equal AQ stop;
          5. on true, require one header whose stream/property/tag/context coordinates and boundary equal frozen R3.18AS authority;
          6. require every true header to be an exact R3.18AT member and exact context multiplicities to sum to 40;
          7. require true AU stop equal the frozen header `payload_start`;
          8. repeat and require bit-exact identical result;
          9. stop without payload or later-control access.

          Expected totals:

          ```text
          rows                         47/47
          false no-header              7
          true exact header            40
          exact AT contexts            16/16
          AT multiplicity sum          40
          tag distribution             Int=40
          mismatch                     0
          witness reselection          0
          following payload            0 bits
          second later control         0 bits
          ```

          ## Required negative controls

          At minimum:
          - false-row poison beginning at AQ/AU stop leaves the false terminator result unchanged;
          - truncate a true row after AQ but inside its following header -> reject atomically;
          - poison at true-row `payload_start` -> published AU header result unchanged;
          - wrong actor object -> reject;
          - unresolved lookup -> reject;
          - wrong exact version/context -> reject;
          - corrupt or mismatched published prerequisite -> reject;
          - flip/drop `is_rl_223` -> reject unless the complete resulting tuple is independently an exact AT member;
          - tag-only/component-only/Cartesian/versionless membership -> reject;
          - AJ-valid but AT-absent tuple -> reject;
          - fabricated seventeenth tuple -> reject;
          - source-scope guard -> at most one following-header primitive, zero payload decoders, no generalized/repeated loop.

          ## Validation

          Require:
          - frozen witness identity 47/47;
          - published AU exact 47/47;
          - false=7 / true=40;
          - true frozen header identity/boundary exact 40/40;
          - exact AT context identity 16/16 and multiplicity sum 40;
          - mismatch 0 and witness reselection 0;
          - repeatability PASS;
          - all negative controls PASS;
          - following payload / second later control 0/0;
          - focused AU regressions PASS;
          - full mimir-replay/workspace fmt/check/test/clippy and repository verifier PASS;
          - same-head normal CI SUCCESS;
          - production/Cargo/fixture/corpus/support mutation 0/0/0/0/0;
          - privacy scan PASS.

          Before any dispatch/rerun, inspect queued/waiting/in-progress equivalent runs. Reuse an existing exact run if present. Rerun is never polling.

          ## Hard stop

          No following payload, no second later control, no context outside exact R3.18AT, no header on false terminators, no generalized/repeated property loop/cursor, no next actor/frame/lifecycle mutation, no raw-state/event/replay-slice/skill/counterfactual/runtime/export widening.

          ## Outcome gate

          ### Outcome A
          Published R3.18AU matches all 47 immutable AS/AT witnesses exactly: false=7 no-header, true=40 exact header, exact contexts/multiplicity preserved, mismatch 0, witness reselection 0, all negative/full validations PASS, and following-payload/second-control consumption 0/0. A separate R3.18AW evidence pass may then inspect exactly one following payload on the exact forty true rows only.

          ### Outcome B
          A bounded differential mismatch or narrower safe subset is isolated. Record only the exact supported subset and keep following-payload evidence closed.

          ### Outcome C
          Authority/witness drift, false-terminator header access, true-header mismatch, AT membership widening, adjacent payload/later-control access, production mutation, generic chaining or privacy failure. Stop without widening.
          """
          av_path = Path("docs/continuity/MIMIR_R3_18AV_EXECUTION_SPEC.md")
          if av_path.exists():
              raise SystemExit("AV spec already exists")
          write(str(av_path), textwrap.dedent(av_spec))

          ledger_path = Path("docs/continuity/MIMIR_PROGRESS_LEDGER.md")
          ledger = ledger_path.read_text(encoding="utf-8")
          if "## 2026-08-26 — R3.18AU — Bounded Post-AQ Mixed-Continuation Following-Header Production" in ledger:
              raise SystemExit("AU ledger entry already exists")
          ledger_entry = f"""

          ## 2026-08-26 — R3.18AU — Bounded Post-AQ Mixed-Continuation Following-Header Production

          Production base SHA: `{PARENT}`
          Production commit SHA: `{PROD}`
          Production tree: `{TREE}`
          Pass type: bounded production implementation
          Outcome: **A — ADMITTED / PUBLISHED**

          What changed:
          - added one boundary-specific mixed following-header composition after published R3.18AQ;
          - preserved all 7 false rows as successful no-header terminators with zero post-AQ reads;
          - composed exactly one following header on all 40 true rows under exact R3.18AT membership;
          - stopped true rows exactly at `payload_start` and consumed zero following-payload/second-control bits;
          - kept generalized/repeated property looping closed.

          Authority:
          - canonical main before production `{PARENT}` / tree `{PARENT_TREE}`;
          - R3.18AT contract `sha256:{AT_SHA}`;
          - R3.18AS evidence `{AS_HEAD}` / artifact `{AS_ARTIFACT}` / `sha256:{AS_ARTIFACT_SHA}`;
          - clean-candidate CI `{CANDIDATE_RUN}/{CANDIDATE_JOB}` SUCCESS;
          - published-main CI `{PUBLISHED_RUN}/{PUBLISHED_JOB}` SUCCESS;
          - lib/test blobs `{LIB_BLOB}` / `{TEST_BLOB}`.

          Validation:
          - frozen mixed lane 47/47;
          - false terminators 7/7, following header none, post-AQ reads 0;
          - true headers exact 40/40; Int=40; exact AT contexts 16;
          - truncation/wrong actor/unresolved lookup/wrong version-context/RL223/Cartesian/fabricated/post-stop poison/source-scope negatives PASS;
          - focused AU target 12/12 PASS;
          - full repository verifier and Clippy warnings-denied PASS on candidate and published main;
          - clean production scope exactly `lib.rs` + `r3_18au_post_aq_following_header.rs`.

          Boundaries opened:
          - published production can return one exact following header on AQ-true under R3.18AT while preserving AQ-false as a no-header terminator.

          Boundaries still closed:
          - following payload; second later property control; context outside exact AT membership; header on false terminators; generalized/repeated property loop/cursor; wider semantic/runtime layers.

          Next exact pass:
          - `R3.18AV — published-R3.18AU mixed following-header differential`.
          """
          write(str(ledger_path), ledger.rstrip() + textwrap.dedent(ledger_entry) + "\n")

          # Final semantic guards before staging.
          root = Path("MIMIR_CONTINUE_HERE.md").read_text(encoding="utf-8")
          graph = Path("MIMIR_KNOWLEDGE_GRAPH.md").read_text(encoding="utf-8")
          machine = json.loads(Path("docs/continuity/MIMIR_CONTINUITY_STATE.json").read_text(encoding="utf-8"))
          if f"LAST_PRODUCTION_CODE_SHA:\n  {PROD}" not in root or "CURRENT_PASS:\n  R3.18AV" not in root:
              raise SystemExit("root continuity postcondition failed")
          if "R3.18AV published-R3.18AU mixed following-header differential / ACTIVE" not in graph:
              raise SystemExit("knowledge graph frontier postcondition failed")
          if machine["last_production_code_sha"] != PROD or machine["current_pass"] != "R3.18AV":
              raise SystemExit("machine state postcondition failed")

      - name: Verify knowledge archive and JSON
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Content -LiteralPath docs/continuity/MIMIR_CONTINUITY_STATE.json -Raw | ConvertFrom-Json | Out-Null
          ./scripts/verify_mimir_knowledge_archive.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Scope guard, remove helper, commit staging output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm .github/workflows/r318au-admission-builder.yml
          git add MIMIR_CONTINUE_HERE.md MIMIR_KNOWLEDGE_GRAPH.md docs/continuity/MIMIR_BOUNDARY_LOCKS.md docs/continuity/MIMIR_CONTINUITY_STATE.json docs/continuity/MIMIR_CURRENT_STATE.md docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md docs/continuity/MIMIR_PROGRESS_LEDGER.md docs/continuity/MIMIR_R3_18AU_DECISION.md docs/continuity/MIMIR_R3_18AV_EXECUTION_SPEC.md
          $Expected = @(
            '.github/workflows/r318au-admission-builder.yml',
            'MIMIR_CONTINUE_HERE.md',
            'MIMIR_KNOWLEDGE_GRAPH.md',
            'docs/continuity/MIMIR_BOUNDARY_LOCKS.md',
            'docs/continuity/MIMIR_CONTINUITY_STATE.json',
            'docs/continuity/MIMIR_CURRENT_STATE.md',
            'docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md',
            'docs/continuity/MIMIR_PROGRESS_LEDGER.md',
            'docs/continuity/MIMIR_R3_18AU_DECISION.md',
            'docs/continuity/MIMIR_R3_18AV_EXECUTION_SPEC.md'
          ) | Sort-Object
          $Actual = @(git diff --cached --name-only) | Sort-Object
          $Delta = Compare-Object -ReferenceObject $Expected -DifferenceObject $Actual
          if ($Delta) { $Delta | Out-String | Write-Host; throw 'Admission staging scope drift' }
          git config user.name 'MIMIR Admission Builder'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Stage R3.18AU admission and R3.18AV frontier'
          git push origin HEAD:staging/r318au-admission-av-v1
