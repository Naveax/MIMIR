name: R3.18AU Continuity Admission Builder

on:
  push:
    branches:
      - staging/r318au-admission-av-v1
    paths:
      - '.github/workflows/r318au-admission-builder.yml'

permissions:
  contents: write

concurrency:
  group: r318au-continuity-admission-builder
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v6
        with:
          ref: staging/r318au-admission-av-v1
          fetch-depth: 0

      - name: Verify frozen production base
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ExpectedMain = '6a9f456c78ffccab177823234a8d9fe4ba59a850'
          git fetch origin main --quiet
          $Main = (git rev-parse origin/main).Trim()
          if ($Main -ne $ExpectedMain) { throw "main drift: $Main" }

      - name: Materialize AU admission and AV spec
        shell: python
        run: |
          from pathlib import Path
          import json
          import re
          import textwrap

          PROD = "6a9f456c78ffccab177823234a8d9fe4ba59a850"
          TREE = "cbda5db96e88cc208f872c2237cf4741b8fcfaef"
          PARENT = "7068884bd1982a99ea68647156addc5b381f9613"
          PARENT_TREE = "c87e7ac1cca37cb1b569fbaf78181149e75881c6"
          LIB_BLOB = "d7b18acd7ea832acc73e94921b994fa1b341e006"
          TEST_BLOB = "5455121b2f0eafad09e031a66aa70178691c28fe"
          AU_SPEC_BLOB = "48e78daa50cb2724691fce09514d535a739f124f"
          CANDIDATE_RUN = 32976370318
          CANDIDATE_JOB = 98201978533
          PUBLISHED_RUN = 32977973145
          PUBLISHED_JOB = 98207283247
          AT_SHA = "3c412a5fdf5ed647fbe2b2e4db1f3adf4e4f578ae07c58a302c261f6abafd0a5"
          AS_HEAD = "475650fea59332f74b9f69da50e3e4471622ab7e"
          AS_ARTIFACT = 9603335255
          AS_ARTIFACT_SHA = "0642a4c6c6e57edad8e23dc93bdff96f54ed9563633ebe63c332a8ecbac40a45"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one marker, found {count}")
              return text.replace(old, new, 1)

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8", newline="\n")

          # Root continuity handbook.
          p = Path("MIMIR_CONTINUE_HERE.md")
          s = p.read_text(encoding="utf-8")
          s = replace_once(
              s,
              "LAST_PRODUCTION_CODE_SHA:\n  e1ccbef95c8424b689dee7d77fd8fde2af3e0204\n\nLAST_PRODUCTION_MILESTONE:\n  R3.18AQ — bounded post-AN mixed following-control production",
              f"LAST_PRODUCTION_CODE_SHA:\n  {PROD}\n\nLAST_PRODUCTION_MILESTONE:\n  R3.18AU — bounded post-AQ mixed-continuation following-header production",
              "continue production state",
          )
          s = replace_once(
              s,
              "CURRENT_PASS:\n  R3.18AU — bounded post-AQ mixed-continuation following-header production\n\nCURRENT_PASS_TYPE:\n  bounded production implementation / validate-recompute one published R3.18AQ mixed control; false remains a no-header terminator; true may compose exactly one stateless following header only under exact R3.18AT eight-field membership; stop at payload_start with payload/second-control consumption zero",
              "CURRENT_PASS:\n  R3.18AV — published-R3.18AU mixed following-header differential\n\nCURRENT_PASS_TYPE:\n  read-only published-production differential / replay the immutable 47-row AS/AT authority against published R3.18AU; preserve false=7 no-header terminators and true=40 exact one-header results; verify exact AT membership/boundaries and zero following-payload/second-control consumption; production mutation forbidden",
              "continue current pass",
          )
          s = replace_once(
              s,
              "  R3.18AU ACTIVE bounded production: false AQ prior remains a no-header terminator; true prior may compose exactly one stateless following header only under exact R3.18AT membership and stop at payload_start\n  NO following payload or second later property-control bit after the R3.18AU header boundary, header on false terminators, generalized/repeated property loop/cursor, next actor/frame/lifecycle/raw-state/event/replay-slice/skill/runtime/export widening is admitted",
              f"  R3.18AU PRODUCTION at {PROD}: validates/recomputes one exact published R3.18AQ mixed control; false returns a successful no-header terminator with zero post-AQ reads; true composes exactly one stateless following header under exact R3.18AT membership and stops at payload_start\n  R3.18AV ACTIVE read-only differential: compare published R3.18AU against the immutable 47-row AS/AT authority; require false=7, true=40, exact true headers 40/40, exact AT contexts/multiplicities, mismatch 0, and payload/second-control consumption 0/0\n  NO following payload or second later property-control bit after published R3.18AU, header on false terminators, contexts outside exact R3.18AT membership, generalized/repeated property loop/cursor, next actor/frame/lifecycle/raw-state/event/replay-slice/skill/runtime/export widening is admitted",
              "continue hard stop",
          )
          closure = f"""R3_18AU_PRODUCTION_CLOSURE:
          Outcome A / production {PROD} / tree {TREE}
          parent: {PARENT} / parent tree {PARENT_TREE}
          lib/test blobs: {LIB_BLOB} / {TEST_BLOB}
          execution spec blob: {AU_SPEC_BLOB}
          exact clean-candidate CI: {CANDIDATE_RUN}/{CANDIDATE_JOB} SUCCESS
          published-main CI: {PUBLISHED_RUN}/{PUBLISHED_JOB} SUCCESS
          R3.18AT contract: sha256:{AT_SHA} / exact_tuple_only / 16 eight-field contexts / multiplicity sum 40 / 7 false terminators outside membership
          R3.18AS source authority: {AS_HEAD} / artifact {AS_ARTIFACT} / sha256:{AS_ARTIFACT_SHA}
          frozen lane 47/47 / false terminators 7/7 no-header / true one-header rows 40/40 / Int=40 / exact contexts 16 / source-authority mismatch 0
          false post-AQ reads 0 / following payload bits 0 / second later control bits 0 / generalized loop-cursor 0
          clean production scope: crates/mimir-replay/src/lib.rs + crates/mimir-replay/tests/r3_18au_post_aq_following_header.rs only / Cargo-doc-workflow-fixture-corpus-support mutation 0/0/0/0/0/0
          fresh-main ancestry + force=false publication + exact SHA/tree readback PASS
          next exact pass: R3.18AV published-production differential; production mutation forbidden; no following payload or later control

          """
          if "R3_18AU_PRODUCTION_CLOSURE:" in s:
              raise SystemExit("continue AU closure already present")
          s = replace_once(s, "R3_18AT_CONTRACT_CLOSURE:\n", closure + "R3_18AT_CONTRACT_CLOSURE:\n", "continue closure insertion")
          write(str(p), s)

          # Knowledge graph current frontier, reading order, and AU/AV sections.
          p = Path("MIMIR_KNOWLEDGE_GRAPH.md")
          s = p.read_text(encoding="utf-8")
          s = replace_once(
              s,
              "R3.18AU bounded post-AQ mixed-continuation following-header production / ACTIVE                              |",
              "R3.18AU bounded post-AQ mixed-continuation following-header production / PRODUCTION CLOSED                   |\nR3.18AV published-R3.18AU mixed following-header differential / ACTIVE                                      |",
              "graph frontier",
          )
          old_order = """128. `docs/continuity/MIMIR_R3_18AT_EXECUTION_SPEC.md`
          129. `docs/continuity/MIMIR_R3_18AT_ADMITTED_HEADER_CONTEXTS.json`
          130. `docs/continuity/MIMIR_R3_18AT_DECISION.md`
          131. `docs/continuity/MIMIR_R3_18AU_EXECUTION_SPEC.md`
          132. `docs/continuity/MIMIR_PASS_PROTOCOL.md`
          133. `docs/continuity/MIMIR_BOUNDARY_LOCKS.md`
          134. `docs/continuity/MIMIR_EXECUTION_ROADMAP_A_TO_Z.md`
          135. `MIMIR_ALL_SOURCES_SUPERBOOK.md`
          136. `docs/chatgpt-archive/SOURCE_REGISTRY.md`
          137. `docs/chatgpt-archive/VALIDATION_MATRIX.md`
          138. `docs/chatgpt-archive/migration/HISTORICAL_TO_CURRENT_MAPPING.md`"""
          new_order = """128. `docs/continuity/MIMIR_R3_18AT_EXECUTION_SPEC.md`
          129. `docs/continuity/MIMIR_R3_18AT_ADMITTED_HEADER_CONTEXTS.json`
          130. `docs/continuity/MIMIR_R3_18AT_DECISION.md`
          131. `docs/continuity/MIMIR_R3_18AU_EXECUTION_SPEC.md`
          132. `docs/continuity/MIMIR_R3_18AU_DECISION.md`
          133. `docs/continuity/MIMIR_R3_18AV_EXECUTION_SPEC.md`
          134. `docs/continuity/MIMIR_PASS_PROTOCOL.md`
          135. `docs/continuity/MIMIR_BOUNDARY_LOCKS.md`
          136. `docs/continuity/MIMIR_EXECUTION_ROADMAP_A_TO_Z.md`
          137. `MIMIR_ALL_SOURCES_SUPERBOOK.md`
          138. `docs/chatgpt-archive/SOURCE_REGISTRY.md`
          139. `docs/chatgpt-archive/VALIDATION_MATRIX.md`
          140. `docs/chatgpt-archive/migration/HISTORICAL_TO_CURRENT_MAPPING.md`"""
          s = replace_once(s, textwrap.dedent(old_order), textwrap.dedent(new_order), "graph reading order")
          old_au = """### R3.18AU bounded post-AQ mixed-continuation following-header production: ACTIVE
          - validate/recompute exactly one published R3.18AQ mixed control prior
          - false prior remains a successful no-header terminator with zero post-AQ reads
          - true prior may invoke the existing stateless following-header primitive exactly once
          - require exact R3.18AT eight-field membership; stop exactly at `payload_start`
          - following payload, second later control, generalized/repeated loop/cursor and wider semantic/runtime layers remain closed"""
          new_au = f"""### R3.18AU bounded post-AQ mixed-continuation following-header production: PRODUCTION / CLOSED
          - production `{PROD}` / tree `{TREE}` / parent `{PARENT}`
          - lib/test blobs `{LIB_BLOB}` / `{TEST_BLOB}`; execution spec blob `{AU_SPEC_BLOB}`
          - exact clean-candidate CI `{CANDIDATE_RUN}/{CANDIDATE_JOB}` SUCCESS; published-main CI `{PUBLISHED_RUN}/{PUBLISHED_JOB}` SUCCESS
          - immutable 47-row lane preserved: false terminators 7/7 with zero post-AQ reads; true one-header rows 40/40 under exact R3.18AT membership; Int=40; 16 exact contexts
          - true path stops exactly at `payload_start`; following payload/second-control 0/0; generalized/repeated cursor 0
          - clean scope is only `crates/mimir-replay/src/lib.rs` + `crates/mimir-replay/tests/r3_18au_post_aq_following_header.rs`

          ### R3.18AV published-R3.18AU mixed following-header differential: ACTIVE
          - read-only on the immutable 47-row AS/AT authority; production remains `{PROD}`
          - require published AU exact 47/47, false=7 no-header, true=40 exact headers, AT context/multiplicity equality, mismatch 0 and witness reselection 0
          - following payload and second later control remain unread; production/Cargo/fixture/corpus/support mutation forbidden
          - only Outcome A may open a separate R3.18AW one-following-payload evidence pass on the exact 40 true rows"""
          s = replace_once(s, textwrap.dedent(old_au), textwrap.dedent(new_au), "graph AU section")
          write(str(p), s)

          # Boundary locks current override only; historical sections remain intact.
          p = Path("docs/continuity/MIMIR_BOUNDARY_LOCKS.md")
          s = p.read_text(encoding="utf-8")
          new_override = f"""# 0. Current override — R3.18AU production / R3.18AV active

          This current override supersedes older status wording later in this historical lock file.

          ## PRODUCTION — R3.18AU
          - `{PROD}` / `{TREE}` is canonical production; parent `{PARENT}`;
          - exact clean-candidate CI `{CANDIDATE_RUN}/{CANDIDATE_JOB}` and published-main CI `{PUBLISHED_RUN}/{PUBLISHED_JOB}` are SUCCESS;
          - validates/recomputes one exact published R3.18AQ mixed control;
          - false stays a successful no-header terminator with zero post-AQ reads;
          - true composes exactly one stateless following header only under exact R3.18AT membership and stops at `payload_start`;
          - immutable behavior remains false=7 / true=40; true headers exact 40/40; Int=40; 16 exact contexts.

          ## CLOSED EVIDENCE — R3.18AS Outcome A
          - evidence `{AS_HEAD}` / artifact `{AS_ARTIFACT}` / `sha256:{AS_ARTIFACT_SHA}`;
          - frozen rows 47/47; false terminators 7/7; true headers exact 40/40; native/oracle mismatch 0;
          - unique exact contexts 16; tags Int=40; witness reselection 0; payload/second-control consumption 0/0.

          ## CLOSED CONTRACT — R3.18AT Outcome A
          - contract `docs/continuity/MIMIR_R3_18AT_ADMITTED_HEADER_CONTEXTS.json` / `sha256:{AT_SHA}`;
          - membership `exact_tuple_only`; 16 complete eight-field tuples; exact observed multiplicities sum 40;
          - `is_rl_223` is required; all 7 false AQ rows remain outside header membership;
          - AJ/Z/P inheritance, tag/component/Cartesian/versionless/RL223-drop-or-flip/fabricated membership are rejected.

          ## ACTIVE DIFFERENTIAL GATE — R3.18AV
          - compare published R3.18AU against exactly the immutable 47-row AS/AT authority;
          - require false=7 no-header terminators and true=40 exact one-header results;
          - require exact header identity, boundaries, AT context/multiplicity equality, mismatch 0 and witness reselection 0;
          - production mutation is forbidden; following payload and second later property-control bit remain unread.

          ## CLOSED
          - any following-header success on the 7 false terminator rows;
          - any following-header context outside exact R3.18AT membership;
          - following payload after the R3.18AU true header `payload_start`;
          - second later property-control bit after R3.18AU;
          - repeated/generalized property loop or generic cursor;
          - next actor/frame/lifecycle/raw-state/event/replay-slice/skill/counterfactual/runtime/export widening.

          ---

          # 1. Status vocabulary"""
          pattern = r"# 0\. Current override .*?\n---\n\n# 1\. Status vocabulary"
          s2, n = re.subn(pattern, textwrap.dedent(new_override), s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f"boundary override marker count={n}")
          write(str(p), s2)

          # Machine-readable continuity state.
          p = Path("docs/continuity/MIMIR_CONTINUITY_STATE.json")
          state = json.loads(p.read_text(encoding="utf-8"))
          if state.get("current_pass") != "R3.18AU" or state.get("last_production_code_sha") != "e1ccbef95c8424b689dee7d77fd8fde2af3e0204":
              raise SystemExit("continuity JSON base drift")
          state["updated_date"] = "2026-08-26"
          state["last_production_code_sha"] = PROD
          state["last_production_milestone"] = "R3.18AU"
          state["last_production_milestone_name"] = "bounded post-AQ mixed-continuation following-header production"
          state["current_pass"] = "R3.18AV"
          state["current_pass_kind"] = "read-only published-production differential / published R3.18AU mixed following-header"
          state["current_pass_goal"] = "Compare published R3.18AU against exactly the immutable 47-row R3.18AS/R3.18AT authority. Preserve 7 false no-header terminators and 40 true exact one-header results, exact AT context/multiplicity equality, mismatch zero, witness reselection zero, and zero following-payload/second-control consumption."
          state["current_pass_stop_boundary"] = "Read-only. False rows stop at the published AQ/AU terminator boundary; true rows stop at the published AU following-header payload_start. No following payload, second later control, generalized cursor, production mutation, actor/frame/lifecycle/raw-state/event/skill/runtime widening."
          paths = state["next_files_to_read"]
          anchor = "docs/continuity/MIMIR_R3_18AU_EXECUTION_SPEC.md"
          if anchor not in paths:
              raise SystemExit("continuity JSON AU spec anchor missing")
          for extra in ["docs/continuity/MIMIR_R3_18AU_DECISION.md", "docs/continuity/MIMIR_R3_18AV_EXECUTION_SPEC.md"]:
              if extra in paths:
                  raise SystemExit(f"continuity JSON path already present: {extra}")
          i = paths.index(anchor) + 1
          paths[i:i] = ["docs/continuity/MIMIR_R3_18AU_DECISION.md", "docs/continuity/MIMIR_R3_18AV_EXECUTION_SPEC.md"]
          state["r3_18au"] = {
              "outcome": "A — admitted / published bounded mixed following-header production",
              "production_source_changed": True,
              "canonical_main_before_production": PARENT,
              "canonical_tree_before_production": PARENT_TREE,
              "production_sha": PROD,
              "production_tree": TREE,
              "production_parent": PARENT,
              "production_lib_blob": LIB_BLOB,
              "production_focused_test_blob": TEST_BLOB,
              "execution_spec_blob": AU_SPEC_BLOB,
              "candidate_ci_run": CANDIDATE_RUN,
              "candidate_ci_job": CANDIDATE_JOB,
              "published_main_ci_run": PUBLISHED_RUN,
              "published_main_ci_job": PUBLISHED_JOB,
              "contract_pass": "R3.18AT",
              "contract_sha256": AT_SHA,
              "source_evidence_pass": "R3.18AS",
              "source_evidence_head": AS_HEAD,
              "source_artifact_id": AS_ARTIFACT,
              "source_artifact_sha256": AS_ARTIFACT_SHA,
              "frozen_lane_rows": 47,
              "false_terminators": 7,
              "true_header_rows": 40,
              "true_headers_exact": 40,
              "unique_exact_contexts": 16,
              "observed_tag_counts": {"Int": 40},
              "false_post_aq_reads": 0,
              "following_payload_bits_consumed": 0,
              "second_later_control_bits_consumed": 0,
              "generalized_property_loop_or_cursor": False,
              "clean_production_files": ["crates/mimir-replay/src/lib.rs", "crates/mimir-replay/tests/r3_18au_post_aq_following_header.rs"],
              "production_cargo_docs_workflow_fixture_corpus_support_mutation": "0/0/0/0/0/0",
              "next_pass": "R3.18AV"
          }
          write(str(p), json.dumps(state, indent=2, ensure_ascii=False) + "\n")

          current_state = f"""# MIMIR — Current Canonical State

          **Continuity date:** 2026-08-26
          **Repository:** `Naveax/MIMIR`
          **Canonical production SHA:** `{PROD}`
          **Production tree:** `{TREE}`
          **Production milestone:** `R3.18AU — bounded post-AQ mixed-continuation following-header production`
          **Last read-only evidence:** `R3.18AS — Outcome A / false terminators 7/7 / true headers exact 40/40 / 16 exact eight-field contexts / Int=40 / artifact {AS_ARTIFACT}`
          **Last completed contract:** `R3.18AT — exact_tuple_only / 16 eight-field contexts / multiplicity 40 / 7 false terminators outside membership / sha256:{AT_SHA}`
          **Current exact pass:** `R3.18AV — published-R3.18AU mixed following-header differential`

          ## Truthful boundary

          R3.18AU is canonical production. It validates/recomputes one published AQ mixed-control prior. The exact seven false rows remain successful no-header terminators with zero post-AQ reads. The exact forty true rows compose one stateless following header only under R3.18AT exact membership and stop at `payload_start`.

          ```text
          production SHA/tree                    {PROD} / {TREE}
          production parent                      {PARENT}
          lib / focused-test blobs               {LIB_BLOB} / {TEST_BLOB}
          clean-candidate CI                     {CANDIDATE_RUN}/{CANDIDATE_JOB} SUCCESS
          published-main CI                      {PUBLISHED_RUN}/{PUBLISHED_JOB} SUCCESS
          AT contract                            sha256:{AT_SHA}
          frozen rows                            47/47
          false no-header terminators            7/7
          true exact one-header rows             40/40
          true tag distribution                  Int=40
          exact AT contexts                      16
          false post-AQ reads                    0
          following payload / second control     0/0
          generalized property loop/cursor       0
          production scope                       lib.rs + r3_18au_post_aq_following_header.rs only
          ```

          ## Current gate

          R3.18AV is read-only. Recompute the immutable 47-row authority and compare the published R3.18AU result exactly: false=7 with no header, true=40 with exact header identity/boundaries and exact R3.18AT context/multiplicity membership. Production mutation, witness reselection, following payload access and second later control access are forbidden.

          ## Hard stop

          Do not decode the following payload, read a second later control, admit a context outside R3.18AT, synthesize a header for a false terminator, create a generalized/repeated property cursor, or widen actor/frame/lifecycle/raw-state/event/replay-slice/skill/runtime/export behavior.
          """
          write("docs/continuity/MIMIR_CURRENT_STATE.md", textwrap.dedent(current_state))

          handoff = f"""# MIMIR — Next Chat Handoff

          Canonical production is **R3.18AU** at `{PROD}` / `{TREE}` with parent `{PARENT}`. Exact clean-candidate CI `{CANDIDATE_RUN}/{CANDIDATE_JOB}` and published-main CI `{PUBLISHED_RUN}/{PUBLISHED_JOB}` are SUCCESS. The clean production scope is only `crates/mimir-replay/src/lib.rs` plus `crates/mimir-replay/tests/r3_18au_post_aq_following_header.rs`.

          R3.18AU Outcome A preserves the immutable 47-row lane: the exact 7 AQ-false rows remain successful no-header terminators with zero post-AQ reads; the exact 40 AQ-true rows compose exactly one stateless following header under the R3.18AT exact eight-field contract and stop at `payload_start`. R3.18AT remains `sha256:{AT_SHA}` with 16 contexts and multiplicity sum 40. R3.18AS remains the source evidence authority at `{AS_HEAD}` / artifact `{AS_ARTIFACT}` / `sha256:{AS_ARTIFACT_SHA}`.

          The active pass is **R3.18AV read-only published-production differential**. On exactly the immutable 47 witnesses, reconstruct the required published prerequisites, call published R3.18AU, require false=7/no-header and true=40/exact-header, exact AT context and multiplicity equality, mismatch 0, witness reselection 0, and following-payload/second-control consumption 0/0.

          Do not mutate production, decode the following payload, read another control bit, admit contexts outside exact R3.18AT, synthesize a header on false terminators, or create a generic/repeated property loop. Before any workflow dispatch/rerun inspect queued/waiting/in-progress equivalent runs and reuse an existing exact run. Rerun is never polling.
          """
          write("docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md", textwrap.dedent(handoff))

          decision = f"""# MIMIR R3.18AU — Bounded Post-AQ Mixed-Continuation Following-Header Production Decision

          **Date:** 2026-08-26
          **Outcome:** **A — ADMITTED / PUBLISHED**
          **Canonical production:** `{PROD}` / `{TREE}`
          **Parent:** `{PARENT}`

          ## Decision

          R3.18AU closes Outcome A. On the immutable 47-row R3.18AS/R3.18AT authority lane, the published production boundary preserves all seven AQ-false rows as successful no-header terminators with zero post-AQ reads. On all forty AQ-true rows it composes exactly one stateless following header, requires exact R3.18AT eight-field membership, exposes the exact header boundary, and stops at `payload_start` without consuming the following payload or a second later property-control bit.

          This admission is boundary-specific. It does not admit a following payload, second later control, header synthesis on false terminators, context outside R3.18AT, generalized/repeated property cursor, or wider actor/frame/lifecycle/raw-state/event/replay-slice/skill/runtime/export behavior.

          ## Exact authority

          ```text
          canonical main before production       {PARENT} / {PARENT_TREE}
          production SHA/tree                    {PROD} / {TREE}
          lib / focused-test blobs               {LIB_BLOB} / {TEST_BLOB}
          AU execution spec blob                 {AU_SPEC_BLOB}
          clean-candidate CI                     {CANDIDATE_RUN}/{CANDIDATE_JOB} SUCCESS
          published-main CI                      {PUBLISHED_RUN}/{PUBLISHED_JOB} SUCCESS
          R3.18AT contract                       sha256:{AT_SHA}
          R3.18AS evidence head                  {AS_HEAD}
          R3.18AS artifact                       {AS_ARTIFACT} / sha256:{AS_ARTIFACT_SHA}
          pinned Boxcars                         c70e77df7af81b436cb545d070bb90c82f562d0b
          ```

          ## Admitted production behavior

          ```text
          frozen rows                            47/47
          AQ false terminators                   7/7
          false-path following header            none 7/7
          false post-AQ reads                    0
          AQ true continuations                  40/40
          true following headers                 exact 40/40
          exact R3.18AT contexts                 16
          observed true-header tag               Int=40
          following payload bits consumed        0
          second later control bits consumed     0
          generalized/repeated cursor            0
