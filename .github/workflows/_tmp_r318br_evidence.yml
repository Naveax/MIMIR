name: R3.18BR Next Property-Control Bit Evidence

on:
  push:
    branches:
      - evidence/r318br-next-control-v1

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: r318br-next-control-v1
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN_SHA: 265b780dc554715a7bc6bfb5c8e0fbe7ee279265
      MAIN_TREE: d19218dea425819c8ec8eee8464ab5e198945bb6
      PROD_SHA: cbb823ce7d3fc871c35a83afc5ee21ae71945821
      PROD_TREE: 146cb78edfb434fd43e532593efce8e35ee97111
      BQ_DECISION_BLOB: a429bd2f5ad0f035d5944c427bf00a9ef4621169
      BR_SPEC_BLOB: f7b805fa6725fb8d05e721140b4cbb72657af540
      BQ_HEAD: 16c43f38e740c57ae9cb90c92084002ec83815e7
      BQ_TREE: 58248877a59fb0ddad707e32f92b2cec91f6b434
      BQ_RUN: '34457725716'
      BQ_JOB: '102807933610'
      BQ_CI_RUN: '34457725700'
      BQ_CI_JOB: '102808516101'
      BQ_ARTIFACT: '10144392560'
      BQ_ARTIFACT_NAME: r318bq-one-following-payload-evidence
      BQ_ARTIFACT_SIZE: '9464'
      BQ_DIGEST: sha256:52799466bcba42667c51995c1f99cc12325a7a329b5bb355561e64319f64225c
      BQ_MANIFEST_SHA256: 332447c57f92f6f9af84e12bf74124adfe478d225e82cdb5d4cf8e925f7a97c9
      MAIN_CI_RUN: '34469746500'
      MAIN_CI_JOB: '102846609582'
      MAIN_KA_RUN: '34469746351'
      MAIN_KA_JOB: '102846608902'
      BM_RUN: '34334615939'
      BM_ARTIFACT: '10097405795'
      BM_ARTIFACT_NAME: r318bm-one-following-header-evidence
      BM_MANIFEST_SHA256: 167021cca2259c4d2ef16e9da50503007f381349219adb0f5684849f69f2cbd2
      BM_PATCH_SHA256: 092d188a7485e98fc88dbb297a11d744bad71a1e7bdb686ae90d441ba20894ec
      BOXCARS_SHA: c70e77df7af81b436cb545d070bb90c82f562d0b
      BOXCARS_FRAME_BLOB: 6f2ff153d3a27cdacccc65e3f23851489077a7d8
      BOXCARS_ATTR_BLOB: 5e2d5bc1cd8187af30c3ea95193ad987645cb76e

    steps:
      - name: Checkout exact BR evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mark BR evidence pending
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context='r318br/evidence' \
            -f description='R3.18BR exact one-bit evidence running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy

      - name: Execute deterministic R3.18BR evidence
        shell: bash
        env:
          BR_PAYLOAD_BLOB: a115e35e8e93f269f7f22637bee8d9b6fe9757f6
          BR_PAYLOAD_SHA256: 824a30883f6173a7799e49b2d05f78c2061818ae41f882329dd9cb3f2681bde1
          BR_RUN_SHA256: 91b0ef827783357d4bc6c43819df62c19b9d4d41a5f6698e86c4a1549499b95c
          BR_CONTROL_SHA256: 1a5168f48828f1dc126a36d4730f1516070574996423f3eafe3ca05ff9e7de3c
          BR_BOXCARS_SHA256: 5baeed2d1fa300e4d4a0eaa85b733cd48e50ec0a82d799bb65d99727aa170b5e
          BR_COMPARE_SHA256: 941abe5b9bd10bbd95c48898643cea62d5aca8000fd134d922b29c340a25308e
        run: |
          set -euo pipefail
          helpers="$RUNNER_TEMP/r318br-helpers"
          bm="$RUNNER_TEMP/r318br-bm"
          shim="$RUNNER_TEMP/r318br-bin"
          mkdir -p "$helpers" "$bm" "$shim"

          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$BR_PAYLOAD_BLOB" --jq .content | tr -d '\n' | base64 -d > "$RUNNER_TEMP/r318br-payload.tar.gz"
          test "$(sha256sum "$RUNNER_TEMP/r318br-payload.tar.gz" | awk '{print $1}')" = "$BR_PAYLOAD_SHA256"
          tar -xzf "$RUNNER_TEMP/r318br-payload.tar.gz" -C "$helpers"
          test "$(sha256sum "$helpers/r318br_run.sh" | awk '{print $1}')" = "$BR_RUN_SHA256"
          test "$(sha256sum "$helpers/r318br_control.rs" | awk '{print $1}')" = "$BR_CONTROL_SHA256"
          test "$(sha256sum "$helpers/r318br_boxcars.py" | awk '{print $1}')" = "$BR_BOXCARS_SHA256"
          test "$(sha256sum "$helpers/r318br_compare.py" | awk '{print $1}')" = "$BR_COMPARE_SHA256"
          python3 -m py_compile "$helpers/r318br_boxcars.py" "$helpers/r318br_compare.py"
          bash -n "$helpers/r318br_run.sh"

          gh run download "$BM_RUN" --repo "$GITHUB_REPOSITORY" --name "$BM_ARTIFACT_NAME" --dir "$bm"
          test "$(sha256sum "$bm/r3_18bm_artifact_sha256.txt" | awk '{print $1}')" = "$BM_MANIFEST_SHA256"
          (cd "$bm" && sha256sum -c r3_18bm_artifact_sha256.txt)
          test "$(sha256sum "$bm/r3_18bm_boxcars_instrumentation.patch" | awk '{print $1}')" = "$BM_PATCH_SHA256"

          export BR_REAL_CARGO="$(command -v cargo)"
          export BR_BM_PATCH="$bm/r3_18bm_boxcars_instrumentation.patch"
          cat > "$shim/cargo" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ " $* " == *" --example r3_18bm_probe "* ]]; then
            args=("$@")
            manifest=''
            for ((i=0; i<${#args[@]}; i++)); do
              if [[ "${args[$i]}" == '--manifest-path' ]]; then
                manifest="${args[$((i+1))]}"
                break
              fi
            done
            test -n "$manifest"
            root="$(dirname "$manifest")"
            test "$(git -C "$root" rev-parse HEAD)" = "$BOXCARS_SHA"

            if [[ ! -f "$root/examples/r3_18bm_probe.rs" ]]; then
              git -C "$root" apply --include=examples/r3_18bm_probe.rs "$BR_BM_PATCH"
            fi
            test -f "$root/examples/r3_18bm_probe.rs"

            python3 - "$manifest" <<'PYDEV'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          required = ['criterion = "0.8"\n', 'gungraun = "0.19.0"\n']
          counts = [s.count(x) for x in required]
          if counts == [1, 1]:
              for x in required:
                  s = s.replace(x, "", 1)
              p.write_text(s, encoding="utf-8", newline="\n")
              print("R3_18BR_BM_BENCH_DEVDEPS=STRIPPED")
          elif counts == [0, 0]:
              print("R3_18BR_BM_BENCH_DEVDEPS=ALREADY_STRIPPED")
          else:
              raise SystemExit(f"R3.18BR benchmark dev-dependency authority mismatch counts={counts}")
          PYDEV
          fi
          exec "$BR_REAL_CARGO" "$@"
          SH
          chmod +x "$shim/cargo"
          export PATH="$shim:$PATH"

          log="$RUNNER_TEMP/r318br-execute.log"
          set +e
          BR_HELPERS="$helpers" bash "$helpers/r318br_run.sh" >"$log" 2>&1
          rc=$?
          set -e
          cat "$log"
          if [ "$rc" -ne 0 ]; then
            diag="$RUNNER_TEMP/r318br-diag.txt"
            python3 - "$log" "$diag" "$rc" <<'PYDIAG'
          import os
          import re
          import sys

          src, dst, rc = sys.argv[1:]
          lines = open(src, errors="replace").read().splitlines()
          native = sum(1 for x in lines if "R3_18BR_NATIVE_SUMMARY" in x)
          oracle_idx = [i for i, x in enumerate(lines) if "R3_18BR_ORACLE" in x]
          oracle = len(oracle_idx)
          compare0 = sum(1 for x in lines if "R3_18BR_NATIVE_ORACLE_MISMATCH=0" in x)
          fullpass = sum(1 for x in lines if "R3_18BR_FULL_VALIDATION=PASS" in x)
          outcome_a = sum(1 for x in lines if "R3_18BR" in x and "OUTCOME=A" in x)
          start = oracle_idx[-1] + 1 if oracle_idx else 0
          tail = lines[start:]

          exclusions = re.compile(r"(?:MISMATCH=0|\bPASS\b|\bSUCCESS\b)", re.I)
          tests = [
              ("mismatch_nonzero", re.compile(r"R3_18BR[^\n]*MISMATCH=[1-9][0-9]*", re.I)),
              ("traceback", re.compile(r"Traceback \(most recent call last\)", re.I)),
              ("assertion", re.compile(r"AssertionError|assertion .*failed|panicked at", re.I)),
              ("system_exit", re.compile(r"SystemExit|raise SystemExit", re.I)),
              ("compile", re.compile(r"error\[E[0-9]+\]|could not compile|unresolved import|cannot find", re.I)),
              ("resolver", re.compile(r"failed to select a version|failed to resolve|requires rustc|rustc .*not supported", re.I)),
              ("missing_example", re.compile(r"no example target named|no example named", re.I)),
              ("patch_apply", re.compile(r"patch failed|patch does not apply", re.I)),
              ("missing_file", re.compile(r"No such file or directory|not found", re.I)),
              ("python_error", re.compile(r"(?:^|\s)(?:[A-Za-z]+Error|Exception):", re.I)),
              ("comparison", re.compile(r"\bexpected\b|\bactual\b|\bmismatch\b|\bdiffer\b", re.I)),
              ("generic_failure", re.compile(r"\bFAIL(?:ED|URE)?\b|\berror:\s", re.I)),
          ]

          kind = "unknown"
          err_i = None
          for name, rx in tests:
              for i, line in enumerate(tail, start=start):
                  if exclusions.search(line):
                      continue
                  if rx.search(line):
                      kind = name
                      err_i = i
                      break
              if err_i is not None:
                  break

          if err_i is None:
              for i in range(len(lines) - 1, start - 1, -1):
                  if lines[i].strip() and not exclusions.search(lines[i]):
                      err_i = i
                      break
          err = lines[err_i].strip() if err_i is not None else "<no-terminal-line>"
          prev = "<none>"
          if err_i is not None:
              for i in range(err_i - 1, start - 1, -1):
                  if lines[i].strip() and not exclusions.search(lines[i]):
                      prev = lines[i].strip()
                      break

          def clean(value):
              for raw, tag in ((os.environ.get("RUNNER_TEMP"), "<tmp>"), (os.environ.get("GITHUB_WORKSPACE"), "<workspace>")):
                  if raw:
                      value = value.replace(raw, tag)
              value = re.sub(r"https?://\S+", "<url>", value)
              value = re.sub(r"[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}", "<email>", value)
              value = re.sub(r"\b(?:gh[pousr]_|github_pat_)[A-Za-z0-9_]+\b", "<credential>", value, flags=re.I)
              value = re.sub(r"\b[A-Fa-f0-9]{32,}\b", "<id>", value)
              return " ".join(value.split())[:112]

          progress = f"native={native};oracle={oracle};compare0={compare0};full={fullpass};outA={outcome_a};rc={rc}"
          with open(dst, "w", encoding="utf-8", newline="\n") as f:
              f.write(f"progress={progress}\n")
              f.write(f"kind={kind}\n")
              f.write(f"tail={clean(err)}\n")
              f.write(f"prev={clean(prev)}\n")
          PYDIAG
            progress="$(sed -n '1s/^progress=//p' "$diag")"
            kind="$(sed -n '2s/^kind=//p' "$diag")"
            tail="$(sed -n '3s/^tail=//p' "$diag")"
            prev="$(sed -n '4s/^prev=//p' "$diag")"
            target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure -f context='r318br/diag-progress' \
              -f description="$progress" -f target_url="$target" >/dev/null || true
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure -f context='r318br/diag-kind' \
              -f description="$kind" -f target_url="$target" >/dev/null || true
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure -f context='r318br/diag-tail' \
              -f description="$tail" -f target_url="$target" >/dev/null || true
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure -f context='r318br/diag-prev' \
              -f description="$prev" -f target_url="$target" >/dev/null || true
            exit "$rc"
          fi

      - name: Upload immutable R3.18BR evidence
        uses: actions/upload-artifact@v4
        with:
          name: r318br-next-property-control-evidence
          path: ${{ runner.temp }}/r318br-authority/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Verify receipt and mark Outcome A
        shell: bash
        run: |
          set -euo pipefail
          artifact=''
          for attempt in $(seq 1 30); do
            artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name=="r318br-next-property-control-evidence") | [.id,.size_in_bytes,.digest] | @tsv' | head -n1)"
            [ -n "$artifact" ] && break
            sleep 2
          done
          test -n "$artifact"
          IFS=$'\t' read -r artifact_id artifact_size artifact_digest <<<"$artifact"
          echo "R3_18BR_ARTIFACT=${artifact_id}/${artifact_size}/${artifact_digest}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context='r318br/evidence' \
            -f description='R3.18BR Outcome A exact one-bit evidence passed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Mark BR evidence failure
        if: failure()
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context='r318br/evidence' \
            -f description='R3.18BR evidence failed; inspect exact run' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null || true
