name: R3.18AH Published AG Differential Evidence

on:
  push:
    branches:
      - evidence/r318ah-published-ag-v1
    paths:
      - .github/workflows/_tmp_r318ah_trigger.txt

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: r318ah-published-ag-evidence
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE_SHA: 0e48eebffbd7f54238835e23c177e732cbeb7978
      BASE_TREE: 627d02ca39ff732e9dd7137d061432c6a67fafd8
      PROBE_BLOB: 0f652f043a1d8d3ae68d86be6f72dd9f88300847
      RUNNER_BLOB: d7dc338415e1a981149fa34cd065671217f26937
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mark evidence pending
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='r318ah/evidence' \
            -f description='R3.18AH published AG differential running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Freeze exact authority and helpers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          git fetch --no-tags origin "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          test "$(git rev-parse HEAD:crates/mimir-replay/examples/r318ah_probe.rs)" = "$PROBE_BLOB"
          test "$(git rev-parse HEAD:tools/_tmp_r318ah_run.sh)" = "$RUNNER_BLOB"
          echo 'R3_18AH_AUTHORITY_FREEZE=PASS'

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '

      - name: Execute deterministic R3.18AH evidence
        shell: bash
        run: |
          set -euo pipefail
          bash tools/_tmp_r318ah_run.sh

      - name: Upload immutable R3.18AH evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: r318ah-published-ag-differential-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            r3_18ah_probe.tsv
            r3_18ah_comparison.json
            r3_18ah_summary.json
            r3_18ah_replay_identity.tsv
            r3_18ah_frozen_af_targets.tsv
            r3_18ah_source_scope.txt
            r3_18ah_upstream_receipts.txt
            r3_18ah_negative_controls.txt
            r3_18ah_aggregate.txt
            r3_18ah_artifact_sha256.txt

      - name: Verify immutable receipt and mark success
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          test "$(jq -r '.workflow_run.id' <<<"$meta")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$meta")" = "$GITHUB_SHA"
          test "$(jq -r '.expired' <<<"$meta")" = false
          rest_digest="$(jq -r '.digest' <<<"$meta")"
          norm() { printf '%s' "${1#sha256:}" | tr '[:upper:]' '[:lower:]'; }
          test "$(norm "$rest_digest")" = "$(norm "$ARTIFACT_DIGEST")"
          grep -Fx 'R3_18AH_OUTCOME=A' r3_18ah_aggregate.txt
          grep -Fx 'R3_18AH_EVIDENCE=PASS' r3_18ah_aggregate.txt
          grep -Fx 'R3_18AH_FROZEN_ROWS=47/47' r3_18ah_aggregate.txt
          grep -Fx 'R3_18AH_PUBLISHED_AG_EXACT=47/47' r3_18ah_aggregate.txt
          grep -Fx 'R3_18AH_PUBLISHED_FROZEN_NATIVE_MISMATCH=0' r3_18ah_aggregate.txt
          grep -Fx 'R3_18AH_CONTROL_FALSE=0' r3_18ah_aggregate.txt
          grep -Fx 'R3_18AH_CONTROL_TRUE=47' r3_18ah_aggregate.txt
          grep -Fx 'R3_18AH_WITNESS_RESELECTION=0' r3_18ah_aggregate.txt
          grep -Fx 'R3_18AH_NEXT_STREAM_BITS_CONSUMED=0' r3_18ah_aggregate.txt
          grep -Fx 'R3_18AH_NEXT_HEADER_BITS_CONSUMED=0' r3_18ah_aggregate.txt
          grep -Fx 'R3_18AH_NEXT_PAYLOAD_BITS_CONSUMED=0' r3_18ah_aggregate.txt
          grep -Fx 'R3_18AH_SECOND_LATER_CONTROL_BITS_CONSUMED=0' r3_18ah_aggregate.txt
          grep -Fx 'R3_18AH_PRIVACY_SCAN=PASS' r3_18ah_aggregate.txt
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='r318ah/evidence' \
            -f description='R3.18AH Outcome A published AG differential PASS' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "R3_18AH_EVIDENCE_HEAD=$(git rev-parse HEAD)"
          echo "R3_18AH_EVIDENCE_TREE=$(git rev-parse HEAD^{tree})"
          echo "R3_18AH_AUTHORITY_RUN=$GITHUB_RUN_ID"
          echo "R3_18AH_ARTIFACT_ID=$ARTIFACT_ID"
          echo "R3_18AH_ARTIFACT_DIGEST=$ARTIFACT_DIGEST"
          cat r3_18ah_aggregate.txt

      - name: Mark evidence failure
        if: failure()
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='r318ah/evidence' \
            -f description='R3.18AH evidence failed; inspect exact run' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
