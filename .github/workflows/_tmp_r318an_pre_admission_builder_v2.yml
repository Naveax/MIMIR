name: R3.18AN Pre-Admission Candidate Builder V2

on:
  push:
    branches:
      - automation/r318an-pre-admission-builder-v2
    paths:
      - .github/workflows/_tmp_r318an_pre_admission_trigger_v2.txt

concurrency:
  group: r318an-pre-admission-candidate-builder-v2
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build-candidate-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      BASE_SHA: fec9dca3cb8366108245788fc9a2b24a0c99fe94
      BASE_TREE: 3bf5f68ec7df5565f78f89fd4bc2254f2a64e010
      V1_HELPER_SHA: 52282c60f38a4970ae01930519b49173427358f1
      V1_GENERATOR_BLOB: 7bef3508f824d40b357eec6f411fc3dddef93fce
      V2_PATCH_BLOB: 91561bb9d94f0d4fff3817cff5830249749b78d3
      CANDIDATE_BRANCH: candidate/r318an-post-ak-payload-pre-admission-v2
      AM_HEAD: 842b94ed4c4e57323433585fea48116ecf18989b
      AM_RUN: '32473716883'
      AM_JOB: '96745647750'
      AM_CI_RUN: '32474038136'
      AM_CI_JOB: '96746590106'
      AM_ARTIFACT: '9443581172'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact V2 builder head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Freeze base, AM authority, V1 generator, and V2 patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          test "$(git rev-parse HEAD:tools/_tmp_r318an_pre_admission_patch_v2.py)" = "$V2_PATCH_BLOB"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AM_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AM_RUN" --jq .head_sha)" = "$AM_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$AM_JOB" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AM_CI_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AM_CI_RUN" --jq .head_sha)" = "$AM_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$AM_CI_JOB" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$AM_ARTIFACT" --jq .workflow_run.id)" = "$AM_RUN"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$AM_ARTIFACT" --jq .expired)" = false

          git fetch origin "$V1_HELPER_SHA" --force
          git show "$V1_HELPER_SHA:tools/_tmp_r318an_pre_admission_generate.py" > "$RUNNER_TEMP/r318an_v1_generate.py"
          test "$(git hash-object "$RUNNER_TEMP/r318an_v1_generate.py")" = "$V1_GENERATOR_BLOB"
          cp tools/_tmp_r318an_pre_admission_patch_v2.py "$RUNNER_TEMP/r318an_patch_v2.py"
          python -m py_compile "$RUNNER_TEMP/r318an_v1_generate.py" "$RUNNER_TEMP/r318an_patch_v2.py"
          echo R3_18AN_V2_AUTHORITY_FREEZE=PASS

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '
          cargo +1.85.0 --version
          rustup run 1.85.0 rustfmt --version
          cargo +1.85.0 clippy --version

      - name: Generate corrected exact two-file candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$BASE_SHA"
          git clean -fdx
          git switch -C "$CANDIDATE_BRANCH" "$BASE_SHA"
          mkdir -p tools
          cp "$RUNNER_TEMP/r318an_v1_generate.py" tools/_tmp_r318an_pre_admission_generate.py
          cp "$RUNNER_TEMP/r318an_patch_v2.py" tools/_tmp_r318an_pre_admission_patch_v2.py
          python tools/_tmp_r318an_pre_admission_generate.py
          python tools/_tmp_r318an_pre_admission_patch_v2.py
          rm -f tools/_tmp_r318an_pre_admission_generate.py tools/_tmp_r318an_pre_admission_patch_v2.py
          rmdir tools 2>/dev/null || true

          # The v1 helper proved that generated source is semantically scoped correctly but
          # rustfmt-normalization is required before the immutable candidate is validated.
          cargo +1.85.0 fmt --all

          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            crates/mimir-replay/src/lib.rs \
            crates/mimir-replay/tests/r3_18an_post_ak_payload.rs \
            | sort > "$expected"
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sed '/^$/d' | sort -u > "$actual"
          diff -u "$expected" "$actual"
          git diff --check
          grep -Fq 'r3_18an_all_47_frozen_am_rows_are_exact_and_stop_before_next_control' crates/mimir-replay/tests/r3_18an_post_ak_payload.rs
          grep -Fq 'matches!(' crates/mimir-replay/src/lib.rs
          grep -Fq '&following_payload.value' crates/mimir-replay/src/lib.rs
          echo R3_18AN_V2_SCOPE=PASS files=2 frozen_rows=47 formatted=1

      - name: Focused and full validation
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 test -p mimir-replay --test r3_18an_post_ak_payload
          cargo +1.85.0 test -p mimir-replay --test r3_18ak_post_ag_following_header
          cargo +1.85.0 check --workspace --all-targets --all-features
          cargo +1.85.0 clippy --workspace --all-targets --all-features -- -D warnings
          cargo +1.85.0 test --workspace
          pwsh -NoProfile -File ./scripts/verify_repo.ps1

      - name: Commit and publish corrected pre-admission candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -- crates/mimir-replay/src/lib.rs crates/mimir-replay/tests/r3_18an_post_ak_payload.rs
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "crates/mimir-replay/src/lib.rs crates/mimir-replay/tests/r3_18an_post_ak_payload.rs "
          git config user.name "MIMIR Candidate Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Prepare corrected bounded R3.18AN post-AK Int payload"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"

          {
            echo "R3_18AN_PRE_ADMISSION_V2=PASS"
            echo "R3_18AN_SUPERSEDES_PRE_ADMISSION_V1=1"
            echo "R3_18AN_BASE_SHA=$BASE_SHA"
            echo "R3_18AN_BASE_TREE=$BASE_TREE"
            echo "R3_18AN_AM_HEAD=$AM_HEAD"
            echo "R3_18AN_AM_RUN_JOB=$AM_RUN/$AM_JOB"
            echo "R3_18AN_AM_CI=$AM_CI_RUN/$AM_CI_JOB"
            echo "R3_18AN_CANDIDATE_SHA=$(git rev-parse HEAD)"
            echo "R3_18AN_CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
            echo "R3_18AN_SCOPE=lib.rs+r3_18an_post_ak_payload.rs"
            echo "R3_18AN_FROZEN_ROWS=47/47"
            echo "R3_18AN_TAG=Int"
            echo "R3_18AN_WIDTH=32"
            echo "R3_18AN_NEXT_CONTROL_BITS=0"
            echo "R3_18AN_CANONICAL_ADMISSION=0"
          } | tee r318an_pre_admission_v2_receipt.txt

      - name: Upload corrected candidate receipt
        uses: actions/upload-artifact@v4
        with:
          name: r318an-pre-admission-candidate-v2-receipt
          path: r318an_pre_admission_v2_receipt.txt
          if-no-files-found: error
          retention-days: 30
