name: R3.18AN Pre-Admission Candidate Builder

on:
  push:
    branches:
      - automation/r318an-pre-admission-builder-v1
    paths:
      - .github/workflows/_tmp_r318an_pre_admission_trigger.txt

concurrency:
  group: r318an-pre-admission-candidate-builder
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BASE_SHA: fec9dca3cb8366108245788fc9a2b24a0c99fe94
      BASE_TREE: 3bf5f68ec7df5565f78f89fd4bc2254f2a64e010
      GENERATOR_BLOB: 7bef3508f824d40b357eec6f411fc3dddef93fce
      CANDIDATE_BRANCH: candidate/r318an-post-ak-payload-pre-admission-v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact automation head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Freeze generator and pre-admission base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          test "$(git rev-parse HEAD:tools/_tmp_r318an_pre_admission_generate.py)" = "$GENERATOR_BLOB"
          python -m py_compile tools/_tmp_r318an_pre_admission_generate.py
          cp tools/_tmp_r318an_pre_admission_generate.py "$RUNNER_TEMP/r318an_generate.py"

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '

      - name: Generate exact two-file candidate
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$BASE_SHA"
          git clean -fdx
          git switch -C "$CANDIDATE_BRANCH" "$BASE_SHA"
          mkdir -p tools
          cp "$RUNNER_TEMP/r318an_generate.py" tools/_tmp_r318an_pre_admission_generate.py
          python tools/_tmp_r318an_pre_admission_generate.py
          rm -f tools/_tmp_r318an_pre_admission_generate.py
          rmdir tools 2>/dev/null || true

          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' \
            crates/mimir-replay/src/lib.rs \
            crates/mimir-replay/tests/r3_18an_post_ak_payload.rs \
            | sort > "$expected"
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sed '/^$/d' | sort -u > "$actual"
          diff -u "$expected" "$actual"
          git diff --check

      - name: Focused and repository validation
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 test -p mimir-replay --test r3_18an_post_ak_payload
          cargo +1.85.0 check --workspace
          cargo +1.85.0 clippy --workspace --all-targets -- -D warnings
          cargo +1.85.0 test --workspace

      - name: Commit and publish pre-admission candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -- crates/mimir-replay/src/lib.rs crates/mimir-replay/tests/r3_18an_post_ak_payload.rs
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "crates/mimir-replay/src/lib.rs crates/mimir-replay/tests/r3_18an_post_ak_payload.rs "
          git config user.name "MIMIR Candidate Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Prepare bounded R3.18AN post-AK Int payload"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"

          {
            echo "R3_18AN_PRE_ADMISSION=PASS"
            echo "R3_18AN_BASE_SHA=$BASE_SHA"
            echo "R3_18AN_BASE_TREE=$BASE_TREE"
            echo "R3_18AN_CANDIDATE_SHA=$(git rev-parse HEAD)"
            echo "R3_18AN_CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
            echo "R3_18AN_SCOPE=lib.rs+r3_18an_post_ak_payload.rs"
            echo "R3_18AN_TAG=Int"
            echo "R3_18AN_WIDTH=32"
            echo "R3_18AN_NEXT_CONTROL_BITS=0"
            echo "R3_18AN_CANONICAL_ADMISSION=0"
          } | tee r318an_pre_admission_receipt.txt

      - name: Upload candidate receipt
        uses: actions/upload-artifact@v4
        with:
          name: r318an-pre-admission-candidate-receipt
          path: r318an_pre_admission_receipt.txt
          if-no-files-found: error
          retention-days: 30
