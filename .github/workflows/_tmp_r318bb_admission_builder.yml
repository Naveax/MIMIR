name: R3.18BB Continuity Admission Builder

on:
  push:
    branches:
      - continuity/r318bb-admit-open-r318bc-v1
    paths:
      - .github/workflows/_tmp_r318bb_admission_builder.yml
      - tools/_tmp_r318bb_admission_builder.py

permissions:
  contents: write
  actions: read

jobs:
  builder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: 2bb5c48b3f627d6fe4f8ae6cb2eb2ea87408342e
      BASE_TREE: 7958e09ee5756d826307ac8b122fd748f43b8a23
      EVIDENCE_SHA: 91595db2970ad395ec048ebd9326cfa97b01b38a
      EVIDENCE_RUN: "33104207616"
      EVIDENCE_JOB: "98629573433"
      SAME_HEAD_CI: "33104207621"
      SAME_HEAD_CI_JOB: "98629573926"
      ARTIFACT_ID: "9659874105"
      ARTIFACT_NAME: r318bb-published-ba-differential-evidence
      ARTIFACT_SIZE: "9295"
      ARTIFACT_DIGEST: sha256:0e5bc329e1fc89068243ad0846356ed4dbfc2ade245623385b8e84d21b4f138e

    steps:
      - name: Checkout exact builder head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze BB authority and fresh main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$BASE_SHA"

          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN" --jq .head_sha)" = "$EVIDENCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN" --jq .status)" = completed
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN" --jq .conclusion)" = success
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN/jobs?per_page=100")"
          test "$(jq -r '.jobs[] | select(.id == (env.EVIDENCE_JOB|tonumber)) | .conclusion' <<<"$jobs")" = success

          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SAME_HEAD_CI" --jq .head_sha)" = "$EVIDENCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SAME_HEAD_CI" --jq .status)" = completed
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SAME_HEAD_CI" --jq .conclusion)" = success
          ci_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SAME_HEAD_CI/jobs?per_page=100")"
          test "$(jq -r '.jobs[] | select(.id == (env.SAME_HEAD_CI_JOB|tonumber)) | .conclusion' <<<"$ci_jobs")" = success

          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          test "$(jq -r .name <<<"$meta")" = "$ARTIFACT_NAME"
          test "$(jq -r .size_in_bytes <<<"$meta")" = "$ARTIFACT_SIZE"
          test "$(jq -r .digest <<<"$meta")" = "$ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.id <<<"$meta")" = "$EVIDENCE_RUN"
          test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "$EVIDENCE_SHA"
          test "$(jq -r .expired <<<"$meta")" = false
          echo R3_18BB_ADMISSION_AUTHORITY=PASS

      - name: Build canonical BB admission and BC spec
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/_tmp_r318bb_admission_builder.py

      - name: Validate exact canonical scope and archive
        shell: bash
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/expected.txt"
          changed="$RUNNER_TEMP/changed.txt"
          cat > "$expected" <<'EOF'
          MIMIR_CONTINUE_HERE.md
          MIMIR_KNOWLEDGE_GRAPH.md
          docs/continuity/MIMIR_BOUNDARY_LOCKS.md
          docs/continuity/MIMIR_CONTINUITY_STATE.json
          docs/continuity/MIMIR_CURRENT_STATE.md
          docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md
          docs/continuity/MIMIR_PROGRESS_LEDGER.md
          docs/continuity/MIMIR_R3_18BB_DECISION.md
          docs/continuity/MIMIR_R3_18BC_EXECUTION_SPEC.md
          EOF
          {
            git diff --name-only HEAD --
            git ls-files --others --exclude-standard
          } | sort -u > "$changed"
          sort -u -o "$expected" "$expected"
          echo '--- expected'; cat "$expected"
          echo '--- changed'; cat "$changed"
          test -z "$(comm -3 "$expected" "$changed")"
          test "$(wc -l < "$changed")" -eq 9

          python3 -m json.tool docs/continuity/MIMIR_CONTINUITY_STATE.json >/dev/null
          grep -F '146. `docs/continuity/MIMIR_R3_18BB_DECISION.md`' MIMIR_KNOWLEDGE_GRAPH.md
          grep -F '147. `docs/continuity/MIMIR_R3_18BC_EXECUTION_SPEC.md`' MIMIR_KNOWLEDGE_GRAPH.md
          grep -F 'R3.18BC — one following-property-header evidence after published R3.18BA mixed control' MIMIR_CONTINUE_HERE.md
          grep -F '**Outcome:** **A — ADMITTED / READ-ONLY DIFFERENTIAL CLOSED**' docs/continuity/MIMIR_R3_18BB_DECISION.md
          grep -F '**Status:** ACTIVE' docs/continuity/MIMIR_R3_18BC_EXECUTION_SPEC.md
          pwsh -NoLogo -NoProfile -File scripts/verify_mimir_knowledge_archive.ps1
          echo R3_18BB_CONTINUITY_VALIDATION=PASS

      - name: Commit generated canonical docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Naveax
          git config user.email 79841922+Naveax@users.noreply.github.com
          git add \
            MIMIR_CONTINUE_HERE.md \
            MIMIR_KNOWLEDGE_GRAPH.md \
            docs/continuity/MIMIR_BOUNDARY_LOCKS.md \
            docs/continuity/MIMIR_CONTINUITY_STATE.json \
            docs/continuity/MIMIR_CURRENT_STATE.md \
            docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md \
            docs/continuity/MIMIR_PROGRESS_LEDGER.md \
            docs/continuity/MIMIR_R3_18BB_DECISION.md \
            docs/continuity/MIMIR_R3_18BC_EXECUTION_SPEC.md
          git diff --cached --check
          git commit -m 'Admit R3.18BB and open R3.18BC'
          result_sha="$(git rev-parse HEAD)"
          result_tree="$(git rev-parse 'HEAD^{tree}')"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "R3_18BB_BUILDER_RESULT_SHA=$result_sha"
          echo "R3_18BB_BUILDER_RESULT_TREE=$result_tree"
