name: R3.18Y Published Receipt Probe

on:
  push:
    branches: [ops/r318y-published-receipt-v1]

permissions:
  contents: write
  actions: read

jobs:
  receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ff69da3ce17d3632cfa544190a515a227f6e65f2
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Resolve published main CI and KA
        shell: bash
        run: |
          set -euo pipefail
          if test -f tools/_tmp_r318y_published_receipt.txt || test -f tools/_tmp_r318y_published_probe_state.txt; then
            test -f tools/_tmp_r318y_published_receipt.txt && cat tools/_tmp_r318y_published_receipt.txt || true
            test -f tools/_tmp_r318y_published_probe_state.txt && cat tools/_tmp_r318y_published_probe_state.txt || true
            exit 0
          fi
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs" -f head_sha="$TARGET_SHA" -f event=push -f per_page=100 > /tmp/runs.json
          CI_RUN="$(jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.name=="CI" and .head_branch=="main" and .head_sha==$sha)][0].id // empty' /tmp/runs.json)"
          KA_RUN="$(jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.name=="Knowledge Archive" and .head_branch=="main" and .head_sha==$sha)][0].id // empty' /tmp/runs.json)"
          CI_STATUS=missing; CI_CONC=missing; KA_STATUS=missing; KA_CONC=missing
          if test -n "$CI_RUN"; then CI_STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN" --jq .status)"; CI_CONC="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN" --jq '.conclusion // "pending"')"; fi
          if test -n "$KA_RUN"; then KA_STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$KA_RUN" --jq .status)"; KA_CONC="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$KA_RUN" --jq '.conclusion // "pending"')"; fi
          mkdir -p tools
          cat > tools/_tmp_r318y_published_probe_state.txt <<EOF
TARGET_SHA=$TARGET_SHA
PUBLISHED_CI_RUN=${CI_RUN:-missing}
PUBLISHED_CI_STATUS=$CI_STATUS
PUBLISHED_CI_CONCLUSION=$CI_CONC
PUBLISHED_KA_RUN=${KA_RUN:-missing}
PUBLISHED_KA_STATUS=$KA_STATUS
PUBLISHED_KA_CONCLUSION=$KA_CONC
EOF
          if test "$CI_STATUS" = completed && test "$CI_CONC" = success && test "$KA_STATUS" = completed && test "$KA_CONC" = success; then
            CI_JOB="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs" --jq '.jobs[] | select(.name=="rust") | .id' | head -n1)"
            KA_JOB="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$KA_RUN/jobs" --jq '.jobs[] | select(.name=="verify") | .id' | head -n1)"
            test -n "$CI_JOB" && test -n "$KA_JOB"
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$CI_JOB" --jq .conclusion)" = success
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$KA_JOB" --jq .conclusion)" = success
            cat > tools/_tmp_r318y_published_receipt.txt <<EOF
TARGET_SHA=$TARGET_SHA
PUBLISHED_CI_RUN=$CI_RUN
PUBLISHED_CI_JOB=$CI_JOB
PUBLISHED_CI_CONCLUSION=success
PUBLISHED_KA_RUN=$KA_RUN
PUBLISHED_KA_JOB=$KA_JOB
PUBLISHED_KA_CONCLUSION=success
EOF
          fi
          git config user.name 'MIMIR Receipt Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/_tmp_r318y_published_probe_state.txt
          test -f tools/_tmp_r318y_published_receipt.txt && git add tools/_tmp_r318y_published_receipt.txt || true
          git commit -m 'ops(r318y): record published-main probe state'
          git push origin HEAD:ops/r318y-published-receipt-v1
          cat tools/_tmp_r318y_published_probe_state.txt
          test -f tools/_tmp_r318y_published_receipt.txt && cat tools/_tmp_r318y_published_receipt.txt || true
