name: R3.18Y One Following Header Evidence

on:
  push:
    branches:
      - evidence/r318y-following-header-v1

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '
      - name: Run R3.18Y evidence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bash tools/_tmp_r318y_run.sh; then
              echo "R3_18Y_RUN_ATTEMPT=$attempt"
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "R3_18Y_TRANSIENT_RETRY=$attempt"
            sleep $((attempt*10))
          done
      - name: Upload immutable R3.18Y evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: r318y-following-property-header-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            r3_18y_source_scope.txt
            r3_18y_replay_identity.tsv
            r3_18y_frozen_witnesses.json
            r3_18y_boxcars_instrumentation_sha256.txt
            r3_18y_header_rows.json
            r3_18y_header_summary.json
            r3_18y_negative_controls.txt
            r3_18y_aggregate.txt
            r3_18y_upstream_receipts.txt
            r3_18y_artifact_sha256.txt
      - name: Emit immutable receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" > /tmp/a.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /tmp/r.json
          python3 - <<'PY'
          import json,os
          def norm(v):
              if v is None:return None
              v=v.strip().lower(); return v[7:] if v.startswith('sha256:') else v
          aid=int(os.environ['ARTIFACT_ID']); data=json.load(open('/tmp/a.json')); r=json.load(open('/tmp/r.json'))
          m=[x for x in data.get('artifacts',[]) if x.get('id')==aid]; assert len(m)==1,m; a=m[0]
          upload=os.environ['ARTIFACT_DIGEST']
          checks={
            'name':a.get('name')=='r318y-following-property-header-evidence',
            'expired':a.get('expired') is False,
            'digest':a.get('digest') is None or norm(a.get('digest'))==norm(upload),
            'run':str(r.get('id'))==os.environ['GITHUB_RUN_ID'],
            'head':r.get('head_sha')==os.environ['GITHUB_SHA'],
            'branch':r.get('head_branch')=='evidence/r318y-following-header-v1',
            'repo':r.get('repository',{}).get('full_name')==os.environ['GITHUB_REPOSITORY'],
          }
          print(json.dumps({'artifact_id':aid,'size':a.get('size_in_bytes'),'rest_digest':a.get('digest'),'upload_digest':upload,'checks':checks},sort_keys=True),flush=True)
          assert all(checks.values()),checks
          print('R3_18Y_RECEIPT=PASS',flush=True)
          PY
          echo "R3_18Y_EVIDENCE_HEAD=$(git rev-parse HEAD)"
          echo "R3_18Y_EVIDENCE_TREE=$(git rev-parse HEAD^{tree})"
          echo "R3_18Y_AUTHORITY_RUN=$GITHUB_RUN_ID"
          echo "R3_18Y_ARTIFACT_ID=$ARTIFACT_ID"
          echo "R3_18Y_ARTIFACT_DIGEST=$ARTIFACT_DIGEST"
          cat r3_18y_aggregate.txt
          cat r3_18y_artifact_sha256.txt
          echo 'R3_18Y_IMMUTABLE_RECEIPT=PASS'
