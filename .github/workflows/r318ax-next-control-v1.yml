name: R3.18AX Next Property-Control Bit Evidence

on:
  push:
    branches:
      - evidence/r318ax-next-control-v1

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: r318ax-next-control-v1
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RUSTUP_TOOLCHAIN: 1.85.0
      MAIN_SHA: 7741e132df86877cc26cf451f296fd7b7e9cdf30
      RUN_BLOB: 13141ff44d92ba8efe8b8f859471004d6f6a6922

    steps:
      - name: Checkout exact AX evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Freeze wrapper and mark pending
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$MAIN_SHA"
          test "$(git hash-object tools/_tmp_r318ax_run.sh)" = "$RUN_BLOB"
          mapfile -t actual < <(git diff --name-only "$MAIN_SHA" "$GITHUB_SHA" | sort)
          mapfile -t expected < <(printf '%s\n' .github/workflows/r318ax-next-control-v1.yml tools/_tmp_r318ax_run.sh | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='r318ax/evidence' \
            -f description='R3.18AX exact one-bit evidence running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '

      - name: Execute deterministic R3.18AX evidence
        shell: bash
        run: |
          set -euo pipefail
          bash tools/_tmp_r318ax_run.sh

      - name: Upload immutable AX evidence
        uses: actions/upload-artifact@v4
        with:
          name: r318ax-next-property-control-evidence
          path: ${{ runner.temp }}/r318ax-out/r3_18ax_*
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Verify AX artifact receipt and mark success
        shell: bash
        run: |
          set -euo pipefail
          artifact=''
          for attempt in $(seq 1 30); do
            artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name=="r318ax-next-property-control-evidence") | [.id,.size_in_bytes,.digest] | @tsv' | head -n1)"
            [ -n "$artifact" ] && break
            sleep 2
          done
          test -n "$artifact"
          IFS=$'\t' read -r artifact_id artifact_size artifact_digest <<<"$artifact"
          echo "R3_18AX_ARTIFACT=${artifact_id}/${artifact_size}/${artifact_digest}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='r318ax/evidence' \
            -f description='R3.18AX exact one-bit evidence passed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Mark AX evidence failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='r318ax/evidence' \
            -f description='R3.18AX evidence failed; inspect exact run' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null || true
