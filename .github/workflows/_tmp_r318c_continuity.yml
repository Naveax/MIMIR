name: R3.18C Continuity Closure

on:
  push:
    branches:
      - agent/r318c-continuity-sync-v2

permissions:
  contents: write
  actions: read

jobs:
  continuity:
    runs-on: windows-latest
    timeout-minutes: 80
    env:
      BASE_MAIN: f8f6467f2ee652892329f08a3e532b1e1f834fb3
      BASE_TREE: 9943ee5620091142379763422dc22178b2278fbc
      PROD_SHA: de7a2ba40663bb619ca7bd8654846ce87670d023
      PROD_TREE: d1889038ca2eaeb8bb0f05e44b811d906f84cf6e
      LIB_BLOB: 478ae5b70514fcff79117b834733849517c48500
      R318B_TEST_BLOB: 927e9a2c834115d1c918fa96fb6d0690bd03965e
      AUTH_HEAD: a4b71ad43e5cf55c44c9518b24622ce29214acd2
      EVIDENCE_RUN: '31944102614'
      EVIDENCE_JOB: '95157425239'
      CI_RUN: '31944102575'
      CI_JOB: '95157425128'
      ARTIFACT_ID: '9262820284'
      ARTIFACT_DIGEST: sha256:95e89cb350cc4c274d2b7a53198d78941bef54ff1b3f6a165b2ba9710659ec07

    steps:
      - name: Checkout disposable continuity branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Freeze published production and R3.18C authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main evidence/r318c-loop-control
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse origin/main^{tree})" = "$BASE_TREE"
          test "$(git rev-parse "${PROD_SHA}^{tree}")" = "$PROD_TREE"
          test "$(git rev-parse "${BASE_MAIN}:crates/mimir-replay/src/lib.rs")" = "$LIB_BLOB"
          test "$(git rev-parse "${BASE_MAIN}:crates/mimir-replay/tests/r3_18b_single_k1_property.rs")" = "$R318B_TEST_BLOB"
          test "$(git rev-parse origin/evidence/r318c-loop-control)" = "$AUTH_HEAD"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN" > "$RUNNER_TEMP/evidence.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN" > "$RUNNER_TEMP/ci.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/artifact.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          evidence=json.loads((temp/'evidence.json').read_text(encoding='utf-8'))
          ci=json.loads((temp/'ci.json').read_text(encoding='utf-8'))
          artifact=json.loads((temp/'artifact.json').read_text(encoding='utf-8'))
          head=os.environ['AUTH_HEAD']
          assert str(evidence['id'])==os.environ['EVIDENCE_RUN']
          assert evidence['head_sha']==head and evidence['conclusion']=='success'
          assert str(ci['id'])==os.environ['CI_RUN']
          assert ci['head_sha']==head and ci['conclusion']=='success'
          assert str(artifact['id'])==os.environ['ARTIFACT_ID']
          assert artifact['digest']==os.environ['ARTIFACT_DIGEST'] and not artifact['expired']
          assert str(artifact['workflow_run']['id'])==os.environ['EVIDENCE_RUN']
          assert artifact['workflow_run']['head_sha']==head
          print('R3_18C_CONTINUITY_AUTHORITY=PASS')
          PY

      - name: Generate canonical closure from exact main
        shell: pwsh
        run: |
          $generator = Join-Path $env:RUNNER_TEMP 'r318c_continuity.py'
          Copy-Item tools/_tmp_r318c_continuity.py $generator -Force
          git reset --hard $env:BASE_MAIN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python $generator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(
            'MIMIR_CONTINUE_HERE.md',
            'MIMIR_KNOWLEDGE_GRAPH.md',
            'docs/continuity/MIMIR_CONTINUITY_STATE.json',
            'docs/continuity/MIMIR_CURRENT_STATE.md',
            'docs/continuity/MIMIR_R3_18C_DECISION.md',
            'docs/continuity/MIMIR_R3_18D_EXECUTION_SPEC.md'
          )
          foreach ($f in $files) {
            $content = Get-Content $f -Raw
            $content = [regex]::Replace($content, '[ \t]+(?=\r?$)', '', 'Multiline')
            $path = if (Test-Path $f) { (Resolve-Path $f).Path } else { Join-Path $PWD $f }
            [IO.File]::WriteAllText($path, $content.Replace("`r`n","`n"), [Text.UTF8Encoding]::new($false))
          }
          Write-Host 'R3_18C_CONTINUITY_GENERATION=PASS'

      - name: Enforce exact six-file continuity scope
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = @(
            'MIMIR_CONTINUE_HERE.md',
            'MIMIR_KNOWLEDGE_GRAPH.md',
            'docs/continuity/MIMIR_CONTINUITY_STATE.json',
            'docs/continuity/MIMIR_CURRENT_STATE.md',
            'docs/continuity/MIMIR_R3_18C_DECISION.md',
            'docs/continuity/MIMIR_R3_18D_EXECUTION_SPEC.md'
          ) | Sort-Object
          $actual = @(
            git diff --name-only
            git ls-files --others --exclude-standard
          ) | Where-Object { $_ } | Sort-Object -Unique
          $delta = @(Compare-Object $expected $actual)
          if ($delta.Count -ne 0) {
            Write-Host 'Expected:'; $expected
            Write-Host 'Actual:'; $actual
            $delta | Format-Table
            exit 1
          }
          $forbidden = @(git diff --name-only -- crates Cargo.toml Cargo.lock external_fixtures test_corpus tools scripts .github)
          if ($forbidden.Count -ne 0) { $forbidden; exit 1 }
          Write-Host 'R3_18C_CONTINUITY_SCOPE=PASS files=6 production=0 Cargo=0 fixture=0 corpus=0 support=0 workflow=0'

      - name: Verify semantic anchors
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          state=json.loads(Path('docs/continuity/MIMIR_CONTINUITY_STATE.json').read_text(encoding='utf-8'))
          main=Path('MIMIR_CONTINUE_HERE.md').read_text(encoding='utf-8')
          graph=Path('MIMIR_KNOWLEDGE_GRAPH.md').read_text(encoding='utf-8')
          current=Path('docs/continuity/MIMIR_CURRENT_STATE.md').read_text(encoding='utf-8')
          decision=Path('docs/continuity/MIMIR_R3_18C_DECISION.md').read_text(encoding='utf-8')
          spec=Path('docs/continuity/MIMIR_R3_18D_EXECUTION_SPEC.md').read_text(encoding='utf-8')
          prod='de7a2ba40663bb619ca7bd8654846ce87670d023'
          auth='a4b71ad43e5cf55c44c9518b24622ce29214acd2'
          assert state['last_production_code_sha']==prod
          assert state['last_production_milestone']=='R3.18B'
          assert state['last_completed_evidence_pass']=='R3.18C'
          assert state['last_completed_read_only_audit']=='R3.18C'
          assert state['current_pass']=='R3.18D'
          assert state['r3_18c']['authority_head']==auth
          assert state['r3_18c']['workflow_run']==31944102614
          assert state['r3_18c']['exact_head_ci_run']==31944102575
          assert state['r3_18c']['artifact_id']==9262820284
          assert state['r3_18c']['terminator_candidates']==47
          assert state['r3_18c']['continuation_candidates']==47
          assert state['r3_18c']['second_stream_bits_consumed']==0
          assert state['r3_18c']['second_payload_bits_consumed']==0
          assert state['r3_18c']['mismatch_count']==0
          assert 'CURRENT_PASS:\n  R3.18D' in main
          assert 'R3_18C_EVIDENCE_CLOSURE:' in main
          assert 'R3_18D_OPEN_BOUNDARY:' in main
          assert 'R3.18C property-loop boundary evidence decision' in graph
          assert 'R3.18D active next-property control-bit production spec' in graph
          assert 'MIMIR_R3_18C_DECISION.md' in graph and 'MIMIR_R3_18D_EXECUTION_SPEC.md' in graph
          assert '**Outcome:** **A — ADMITTED / EVIDENCE COMPLETE**' in decision
          assert '**Second property decode:** none' in decision
          assert '**Status:** ACTIVE' in spec
          assert '**Second property decode:** forbidden' in spec
          assert '**Repeated property loop:** forbidden' in spec
          assert 'R3.18D' in current and prod in current
          print('R3_18C_CONTINUITY_SEMANTICS=PASS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Knowledge Archive
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/verify_mimir_knowledge_archive.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full repository verifier
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/verify_repo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'R3_18C_CONTINUITY_FULL_VERIFIER=PASS'

      - name: Publish clean R3.18C continuity candidate via Git plumbing
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            MIMIR_CONTINUE_HERE.md \
            MIMIR_KNOWLEDGE_GRAPH.md \
            docs/continuity/MIMIR_CONTINUITY_STATE.json \
            docs/continuity/MIMIR_CURRENT_STATE.md \
            docs/continuity/MIMIR_R3_18C_DECISION.md \
            docs/continuity/MIMIR_R3_18D_EXECUTION_SPEC.md
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'Close R3.18C evidence and open R3.18D control-bit production' | git commit-tree "$tree" -p "$BASE_MAIN")"
          echo "R3_18C_CONTINUITY_CANDIDATE=$commit"
          echo "R3_18C_CONTINUITY_TREE=$tree"
          echo "R3_18C_CONTINUITY_PARENT=$BASE_MAIN"
          git diff-tree --no-commit-id --name-status -r "$commit"
          git push origin "$commit:refs/heads/candidate/r3-18c-continuity-clean"
          echo 'R3_18C_CONTINUITY_PUBLICATION=PASS'
