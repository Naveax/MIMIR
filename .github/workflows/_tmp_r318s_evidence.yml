name: R3.18S Following Payload Evidence

on:
  push:
    branches:
      - evidence/r318s-following-payload-v1

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '

      - name: Run R3.18S evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/_tmp_r318s_run.sh')
          s=p.read_text(encoding='utf-8')
          old="""import json,sys
          h=json.load(open(sys.argv[1],encoding='utf-8'))
          r=json.load(open(sys.argv[2],encoding='utf-8'))
          assert len(h['rows'])==47 and h['aggregate']['distinct_exact_header_context_tuples']==18
          assert all(x['native_oracle_exact'] for x in h['rows'])
          assert all(x['following_payload_bits_consumed']==0 and x['another_control_bits_consumed']==0 for x in h['rows'])
          assert r['aggregate']['rows']==47 and r['aggregate']['distinct_exact_header_context_tuples']==18
          assert r['aggregate']['published_q_native_mismatch']==0
          print('R3_18S_UPSTREAM_LANE=PASS rows=47 contexts=18 reselection=0')
          """
          new="""import json,sys
          h=json.load(open(sys.argv[1],encoding='utf-8'))
          r=json.load(open(sys.argv[2],encoding='utf-8'))
          assert len(h['rows'])==47 and h['aggregate']['rows']==47
          context_keys=('stream_id_bound','prop_id_bits','resolved_property_object_index','resolved_attribute_tag','version_major','version_minor','net_version')
          contexts={tuple(x[k] for k in context_keys) for x in h['rows']}
          assert len(contexts)==18
          assert all(x['native_oracle_exact'] for x in h['rows'])
          assert all(x['following_payload_bits_consumed']==0 and x['another_control_bits_consumed']==0 for x in h['rows'])
          assert h['aggregate']['native_oracle_mismatch']==0 and h['aggregate']['witness_reselection']==0
          assert r['outcome']=='A' and r['published_q_rows']==47
          assert r['r3_18p_exact_contract_equality']=='18/18 contexts; 47/47 multiplicities'
          assert r['native_oracle_mismatch']==0 and r['witness_reselection']==0
          assert r['following_payload_bits_consumed']==0 and r['another_control_bits_consumed']==0
          assert r['boolean_rows']==39 and r['active_actor_rows']==8
          print('R3_18S_UPSTREAM_LANE=PASS rows=47 contexts=18 reselection=0')
          """
          if s.count(old)!=1:
              raise SystemExit(f'upstream schema patch expected one match, got {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          print('R3_18S_UPSTREAM_SCHEMA_NORMALIZATION=PASS')
          PY
          bash tools/_tmp_r318s_run.sh

      - name: Upload immutable R3.18S evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: r318s-following-property-payload-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            r3_18s_source_scope.txt
            r3_18s_replay_identity.tsv
            r3_18s_frozen_witnesses.json
            r3_18s_upstream_receipts.txt
            r3_18s_boxcars_instrumentation_sha256.txt
            r3_18s_oracle_summary.json
            r3_18s_comparison.json
            r3_18s_negative_controls.txt
            r3_18s_aggregate.txt
            r3_18s_artifact_sha256.txt

      - name: Emit immutable receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" > /tmp/r318s_artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /tmp/r318s_run.json
          python3 - <<'PY'
          import json, os
          def norm(v):
              if v is None: return None
              v=v.strip().lower()
              return v[7:] if v.startswith('sha256:') else v
          aid=int(os.environ['ARTIFACT_ID'])
          data=json.load(open('/tmp/r318s_artifacts.json',encoding='utf-8'))
          matches=[x for x in data.get('artifacts',[]) if x.get('id')==aid]
          print('MATCH_COUNT',len(matches),flush=True)
          assert len(matches)==1, matches
          a=matches[0]
          run=json.load(open('/tmp/r318s_run.json',encoding='utf-8'))
          upload=os.environ['ARTIFACT_DIGEST']
          checks={
            'name':a.get('name')=='r318s-following-property-payload-evidence',
            'expired':a.get('expired') is False,
            'digest_if_present':a.get('digest') is None or norm(a.get('digest'))==norm(upload),
            'run_id':str(run.get('id'))==os.environ['GITHUB_RUN_ID'],
            'head_sha':run.get('head_sha')==os.environ['GITHUB_SHA'],
            'head_branch':run.get('head_branch')=='evidence/r318s-following-payload-v1',
            'repository':run.get('repository',{}).get('full_name')==os.environ['GITHUB_REPOSITORY'],
          }
          receipt={'artifact_id':a.get('id'),'artifact_name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'rest_digest':a.get('digest'),'upload_digest':upload,'run_id':run.get('id'),'head_sha':run.get('head_sha'),'head_branch':run.get('head_branch'),'checks':checks}
          print(json.dumps(receipt,sort_keys=True),flush=True)
          failed=[k for k,v in checks.items() if not v]
          assert not failed, {'failed_checks':failed,'receipt':receipt}
          print('R3_18S_RECEIPT_METADATA=PASS',flush=True)
          PY
          echo "R3_18S_EVIDENCE_HEAD=$(git rev-parse HEAD)"
          echo "R3_18S_EVIDENCE_TREE=$(git rev-parse HEAD^{tree})"
          echo "R3_18S_AUTHORITY_RUN=$GITHUB_RUN_ID"
          echo "R3_18S_ARTIFACT_ID=$ARTIFACT_ID"
          echo "R3_18S_ARTIFACT_DIGEST=$ARTIFACT_DIGEST"
          cat r3_18s_aggregate.txt
          cat r3_18s_artifact_sha256.txt
          echo 'R3_18S_IMMUTABLE_RECEIPT=PASS'
