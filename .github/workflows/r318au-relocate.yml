name: R3.18AU Relocate Before W Guard

on:
  push:
    branches:
      - automation/r318au-builder-v1

concurrency:
  group: r318au-relocate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  relocate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v6
        with:
          ref: automation/r318au-builder-v1
          fetch-depth: 0

      - name: Relocate complete AU suffix before W function
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/mimir-replay/src/lib.rs')
          source = path.read_text(encoding='utf-8')
          au = '// R3.18AU PRE-ADMISSION BEGIN bounded post-AQ mixed-continuation following header'
          w = 'pub fn decode_replay_network_existing_actor_after_first_primitive_second_property_payload_following_payload_control_v1('
          au_pos = source.find(au)
          w_pos = source.find(w)
          if au_pos < 0 or w_pos < 0:
              raise SystemExit(f'marker missing: au={au_pos} w={w_pos}')
          if au_pos < w_pos:
              raise SystemExit('AU is already before W; refusing duplicate relocation')
          suffix = source[au_pos:].rstrip() + '\n\n'
          prefix = source[:au_pos].rstrip() + '\n'
          w_pos = prefix.find(w)
          if w_pos < 0:
              raise SystemExit('W function missing after AU suffix removal')
          relocated = prefix[:w_pos] + suffix + prefix[w_pos:]
          if relocated.count(au) != 1:
              raise SystemExit('AU marker count drift')
          if relocated.find(au) >= relocated.find(w):
              raise SystemExit('AU relocation did not precede W')
          path.write_text(relocated, encoding='utf-8', newline='\n')
          PY

      - name: Rust formatting
        shell: bash
        run: cargo +1.85.0 fmt --all

      - name: Focused AU and legacy W regressions
        shell: bash
        run: |
          cargo +1.85.0 test -p mimir-replay --test r3_18au_post_aq_following_header -- --nocapture
          cargo +1.85.0 test -p mimir-replay --test r3_18w_following_payload_control -- --nocapture

      - name: Direct AQ AN AK regressions
        shell: bash
        run: |
          cargo +1.85.0 test -p mimir-replay --test r3_18aq_post_an_payload_control -- --nocapture
          cargo +1.85.0 test -p mimir-replay --test r3_18an_post_ak_payload -- --nocapture
          cargo +1.85.0 test -p mimir-replay --test r3_18ak_post_ag_following_header -- --nocapture

      - name: Scope and source-order guard
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          test "$changed" = 'crates/mimir-replay/src/lib.rs'
          python3 - <<'PY'
          from pathlib import Path
          s = Path('crates/mimir-replay/src/lib.rs').read_text(encoding='utf-8')
          au = '// R3.18AU PRE-ADMISSION BEGIN bounded post-AQ mixed-continuation following header'
          w = 'pub fn decode_replay_network_existing_actor_after_first_primitive_second_property_payload_following_payload_control_v1('
          assert s.find(au) >= 0 and s.find(w) >= 0 and s.find(au) < s.find(w)
          function = s[s.find(w):]
          assert 'decode_replay_network_existing_actor_first_property_header_v1(' not in function
          assert 'lookup_plan' not in function
          PY

      - name: Remove helper and commit staging output
        shell: bash
        run: |
          git rm .github/workflows/r318au-relocate.yml
          git add crates/mimir-replay/src/lib.rs
          git diff --cached --check
          git config user.name 'MIMIR AU Builder'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Stage R3.18AU before legacy W source-scope sentinel'
          git push origin HEAD:automation/r318au-builder-v1
