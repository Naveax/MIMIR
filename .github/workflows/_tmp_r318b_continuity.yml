name: R3.18B Continuity Closure

on:
  push:
    branches:
      - agent/r318b-continuity-sync

permissions:
  contents: write
  actions: read

jobs:
  continuity:
    runs-on: windows-latest
    timeout-minutes: 80
    env:
      BASE_MAIN: de7a2ba40663bb619ca7bd8654846ce87670d023
      BASE_TREE: d1889038ca2eaeb8bb0f05e44b811d906f84cf6e
      PARENT_SHA: f12365b43029f19f3ab1dd889e651f9781b0655e
      LIB_BLOB: 478ae5b70514fcff79117b834733849517c48500
      TEST_BLOB: 927e9a2c834115d1c918fa96fb6d0690bd03965e
      IMPL_RUN: '31942254523'
      EXACT_RUN: '31942696817'
      MAIN_CI_RUN: '31942870294'
      PUBLISHED_RUN: '31942896666'

    steps:
      - name: Checkout disposable continuity branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Freeze published R3.18B authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main candidate/r3-18b-single-k1-property-clean
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse origin/main^{tree})" = "$BASE_TREE"
          test "$(git rev-parse "${BASE_MAIN}^1")" = "$PARENT_SHA"
          test "$(git rev-parse origin/candidate/r3-18b-single-k1-property-clean)" = "$BASE_MAIN"
          test "$(git rev-parse "${BASE_MAIN}:crates/mimir-replay/src/lib.rs")" = "$LIB_BLOB"
          test "$(git rev-parse "${BASE_MAIN}:crates/mimir-replay/tests/r3_18b_single_k1_property.rs")" = "$TEST_BLOB"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IMPL_RUN" > "$RUNNER_TEMP/impl.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXACT_RUN" > "$RUNNER_TEMP/exact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$MAIN_CI_RUN" > "$RUNNER_TEMP/mainci.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLISHED_RUN" > "$RUNNER_TEMP/published.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          expected={
              'impl.json': int(os.environ['IMPL_RUN']),
              'exact.json': int(os.environ['EXACT_RUN']),
              'mainci.json': int(os.environ['MAIN_CI_RUN']),
              'published.json': int(os.environ['PUBLISHED_RUN']),
          }
          for name, run_id in expected.items():
              data=json.loads((temp/name).read_text(encoding='utf-8'))
              assert data['id']==run_id, (name, data['id'], run_id)
              assert data['conclusion']=='success', (name, data['conclusion'])
          assert json.loads((temp/'mainci.json').read_text(encoding='utf-8'))['head_sha']==os.environ['BASE_MAIN']
          print('R3_18B_CONTINUITY_AUTHORITY=PASS')
          PY

      - name: Generate canonical closure from exact published main
        shell: pwsh
        run: |
          $generator = Join-Path $env:RUNNER_TEMP 'r318b_continuity.py'
          Copy-Item tools/_tmp_r318b_continuity.py $generator -Force
          git reset --hard $env:BASE_MAIN
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python $generator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(
            'MIMIR_CONTINUE_HERE.md',
            'MIMIR_KNOWLEDGE_GRAPH.md',
            'docs/continuity/MIMIR_CONTINUITY_STATE.json',
            'docs/continuity/MIMIR_CURRENT_STATE.md',
            'docs/continuity/MIMIR_R3_18B_DECISION.md',
            'docs/continuity/MIMIR_R3_18C_EXECUTION_SPEC.md'
          )
          foreach ($f in $files) {
            $content = Get-Content $f -Raw
            $content = [regex]::Replace($content, '[ \t]+(?=\r?$)', '', 'Multiline')
            $path = if (Test-Path $f) { (Resolve-Path $f).Path } else { Join-Path $PWD $f }
            [IO.File]::WriteAllText($path, $content.Replace("`r`n","`n"), [Text.UTF8Encoding]::new($false))
          }
          Write-Host 'R3_18B_CONTINUITY_GENERATION=PASS'

      - name: Enforce exact six-file continuity scope
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = @(
            'MIMIR_CONTINUE_HERE.md',
            'MIMIR_KNOWLEDGE_GRAPH.md',
            'docs/continuity/MIMIR_CONTINUITY_STATE.json',
            'docs/continuity/MIMIR_CURRENT_STATE.md',
            'docs/continuity/MIMIR_R3_18B_DECISION.md',
            'docs/continuity/MIMIR_R3_18C_EXECUTION_SPEC.md'
          ) | Sort-Object
          $actual = @(
            git diff --name-only
            git ls-files --others --exclude-standard
          ) | Where-Object { $_ } | Sort-Object -Unique
          $delta = @(Compare-Object $expected $actual)
          if ($delta.Count -ne 0) {
            Write-Host 'Expected:'; $expected
            Write-Host 'Actual:'; $actual
            $delta | Format-Table
            exit 1
          }
          $forbidden = @(git diff --name-only -- crates Cargo.toml Cargo.lock external_fixtures test_corpus tools scripts .github)
          if ($forbidden.Count -ne 0) { $forbidden; exit 1 }
          Write-Host 'R3_18B_CONTINUITY_SCOPE=PASS files=6 production=0 Cargo=0 fixture=0 corpus=0 support=0 workflow=0'

      - name: Verify semantic anchors
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          main=Path('MIMIR_CONTINUE_HERE.md').read_text(encoding='utf-8')
          graph=Path('MIMIR_KNOWLEDGE_GRAPH.md').read_text(encoding='utf-8')
          current=Path('docs/continuity/MIMIR_CURRENT_STATE.md').read_text(encoding='utf-8')
          decision=Path('docs/continuity/MIMIR_R3_18B_DECISION.md').read_text(encoding='utf-8')
          spec=Path('docs/continuity/MIMIR_R3_18C_EXECUTION_SPEC.md').read_text(encoding='utf-8')
          state=json.loads(Path('docs/continuity/MIMIR_CONTINUITY_STATE.json').read_text(encoding='utf-8'))
          prod='de7a2ba40663bb619ca7bd8654846ce87670d023'
          assert state['last_production_code_sha']==prod
          assert state['last_production_milestone']=='R3.18B'
          assert state['last_completed_evidence_pass']=='R3.18A'
          assert state['current_pass']=='R3.18C'
          assert state['r3_18b']['production_sha']==prod
          assert state['r3_18b']['exact_candidate_validation_run']==31942696817
          assert state['r3_18b']['published_main_ci_run']==31942870294
          assert state['r3_18b']['published_main_validation_run']==31942896666
          assert state['r3_18b']['next_property_present_consumed_bits']==0
          assert 'CURRENT_PASS:\n  R3.18C' in main
          assert 'R3_18B_PRODUCTION_CLOSURE:' in main
          assert 'R3_18C_OPEN_BOUNDARY:' in main
          assert 'R3.18B single-property K1 production decision' in graph
          assert 'R3.18C active property-loop boundary evidence spec' in graph
          assert 'MIMIR_R3_18B_DECISION.md' in graph and 'MIMIR_R3_18C_EXECUTION_SPEC.md' in graph
          assert '**Outcome:** **A — ADMITTED / PUBLISHED PRODUCTION**' in decision
          assert '**Property loop:** not admitted' in decision
          assert '**Status:** ACTIVE' in spec
          assert '**Production mutation:** forbidden' in spec
          assert '**Second property payload:** forbidden' in spec
          assert 'next `property_present` bit' in spec
          assert prod in current and 'R3.18C' in current
          print('R3_18B_CONTINUITY_SEMANTICS=PASS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Knowledge Archive
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/verify_mimir_knowledge_archive.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full repository verifier
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/verify_repo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'R3_18B_CONTINUITY_FULL_VERIFIER=PASS'

      - name: Publish clean R3.18B continuity candidate via Git plumbing
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            MIMIR_CONTINUE_HERE.md \
            MIMIR_KNOWLEDGE_GRAPH.md \
            docs/continuity/MIMIR_CONTINUITY_STATE.json \
            docs/continuity/MIMIR_CURRENT_STATE.md \
            docs/continuity/MIMIR_R3_18B_DECISION.md \
            docs/continuity/MIMIR_R3_18C_EXECUTION_SPEC.md
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'Close R3.18B production and open R3.18C loop-control evidence' | git commit-tree "$tree" -p "$BASE_MAIN")"
          echo "R3_18B_CONTINUITY_CANDIDATE=$commit"
          echo "R3_18B_CONTINUITY_TREE=$tree"
          echo "R3_18B_CONTINUITY_PARENT=$BASE_MAIN"
          git diff-tree --no-commit-id --name-status -r "$commit"
          git push origin "$commit:refs/heads/candidate/r3-18b-continuity-clean"
          echo 'R3_18B_CONTINUITY_PUBLICATION=PASS'
