          docs/continuity/MIMIR_R3_18AK_DECISION.md
          docs/continuity/MIMIR_R3_18AL_EXECUTION_SPEC.md
          EOF
          )"
          test "$changed" = "$expected"
          test -z "$(git diff --name-only -- crates/mimir-replay Cargo.toml Cargo.lock external_fixtures corpus .github)"
          grep -q 'CURRENT_PASS:' MIMIR_CONTINUE_HERE.md
          grep -q 'R3.18AL' MIMIR_CONTINUE_HERE.md
          grep -q 'R3.18AK bounded post-AG following-header production composition / CLOSED' MIMIR_KNOWLEDGE_GRAPH.md
