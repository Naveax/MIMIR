name: R3.6 Build Clean Footer Scaffold Commit

on:
  push:
    branches:
      - agent/r3-6-footer-scaffold-reader
    paths:
      - .github/workflows/r3_6_build_clean_footer_scaffold.yml

permissions:
  contents: write

jobs:
  build-clean:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build clean source-only commit from verified source blob
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $SourceSha = '9b8f3fcd7173aa1da918f50835c2f7f3181a7be1'
          $MainSha = 'c438199e883c2e846f3872fed4fb9e2ac72ae3bd'
          $CleanBranch = 'agent/r3-6-footer-scaffold-clean'

          git fetch origin
          $remoteMain = (git rev-parse origin/main).Trim()
          if ($remoteMain -ne $MainSha) {
            throw "main drifted before clean reconstruction: expected=$MainSha actual=$remoteMain"
          }

          git checkout -B $CleanBranch $MainSha
          git checkout $SourceSha -- crates/mimir-replay/src/lib.rs
          git diff --check
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'crates/mimir-replay/src/lib.rs') {
            throw "clean reconstruction scope drift: $($changed -join ', ')"
          }

          git config user.name "Naveax"
          git config user.email "79841922+Naveax@users.noreply.github.com"
          git add -- crates/mimir-replay/src/lib.rs
          git commit -m "Add replay footer scaffold reader"
          git push origin HEAD:$CleanBranch
