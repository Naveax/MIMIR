name: R3.18AV Published AU Differential Evidence

on:
  push:
    branches:
      - evidence/r318av-published-au-differential-v1

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: r318av-published-au-differential-v1
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      GH_TOKEN: ${{ github.token }}
      MAIN_SHA: c49ce8f7b1e1145e5fb41a98dcaae9c5de61c37e
      MAIN_TREE: 124164713c7b6b19084b3fbd6d8dd7fc93bc0582
      PROD_SHA: 6a9f456c78ffccab177823234a8d9fe4ba59a850
      PROD_TREE: cbda5db96e88cc208f872c2237cf4741b8fcfaef
      PROD_PARENT: 7068884bd1982a99ea68647156addc5b381f9613
      LIB_BLOB: d7b18acd7ea832acc73e94921b994fa1b341e006
      AU_TEST_BLOB: 5455121b2f0eafad09e031a66aa70178691c28fe
      AV_SPEC_BLOB: d5b1deffd98b4b2832b9219ec4ad4a63cd92bc16
      AT_CONTRACT_BLOB: 9689dccd71252f8ace38a3e3903eb0fc4d98b550
      AU_CANDIDATE_CI: '32976370318'
      AU_CANDIDATE_CI_JOB: '98201978533'
      AU_PUBLISHED_CI: '32977973145'
      AU_PUBLISHED_CI_JOB: '98207283247'
      ADMISSION_CANDIDATE_CI: '32980346903'
      ADMISSION_CANDIDATE_CI_JOB: '98215176765'
      ADMISSION_CANDIDATE_KA: '32980346911'
      ADMISSION_CANDIDATE_KA_JOB: '98215176345'
      ADMISSION_PUBLISHED_CI: '32982361387'
      ADMISSION_PUBLISHED_CI_JOB: '98221855144'
      ADMISSION_PUBLISHED_KA: '32982361423'
      ADMISSION_PUBLISHED_KA_JOB: '98221855243'
      AS_HEAD: 475650fea59332f74b9f69da50e3e4471622ab7e
      AS_TREE: 1303071ad3031f4095e29d775afd243286a67b64
      AS_RUN: '32959321642'
      AS_JOB: '98147938829'
      AS_ARTIFACT: '9603335255'
      AS_ARTIFACT_NAME: r318as-following-property-header-evidence
      AS_ARTIFACT_SIZE: '13250'
      AS_DIGEST: sha256:0642a4c6c6e57edad8e23dc93bdff96f54ed9563633ebe63c332a8ecbac40a45
      AT_CONTRACT_SHA256: 3c412a5fdf5ed647fbe2b2e4db1f3adf4e4f578ae07c58a302c261f6abafd0a5
      BOXCARS_SHA: c70e77df7af81b436cb545d070bb90c82f562d0b

    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Mark evidence pending
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='r318av/evidence' \
            -f description='R3.18AV published AU differential running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Freeze canonical authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$MAIN_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$MAIN_SHA" --jq .tree.sha)" = "$MAIN_TREE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$MAIN_SHA" --jq .parents[0].sha)" = "$PROD_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$PROD_SHA" --jq .tree.sha)" = "$PROD_TREE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$PROD_SHA" --jq .parents[0].sha)" = "$PROD_PARENT"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/crates/mimir-replay/src/lib.rs?ref=$MAIN_SHA" --jq .sha)" = "$LIB_BLOB"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/crates/mimir-replay/tests/r3_18au_post_aq_following_header.rs?ref=$MAIN_SHA" --jq .sha)" = "$AU_TEST_BLOB"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/continuity/MIMIR_R3_18AV_EXECUTION_SPEC.md?ref=$MAIN_SHA" --jq .sha)" = "$AV_SPEC_BLOB"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/continuity/MIMIR_R3_18AT_ADMITTED_HEADER_CONTEXTS.json?ref=$MAIN_SHA" --jq .sha)" = "$AT_CONTRACT_BLOB"

          for pair in \
            "$AU_CANDIDATE_CI:$AU_CANDIDATE_CI_JOB" \
            "$AU_PUBLISHED_CI:$AU_PUBLISHED_CI_JOB" \
            "$ADMISSION_CANDIDATE_CI:$ADMISSION_CANDIDATE_CI_JOB" \
            "$ADMISSION_CANDIDATE_KA:$ADMISSION_CANDIDATE_KA_JOB" \
            "$ADMISSION_PUBLISHED_CI:$ADMISSION_PUBLISHED_CI_JOB" \
            "$ADMISSION_PUBLISHED_KA:$ADMISSION_PUBLISHED_KA_JOB"
          do
            run_id="${pair%%:*}"
            job_id="${pair##*:}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq .conclusion)" = success
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$job_id" --jq .conclusion)" = success
          done

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AS_RUN" --jq .head_sha)" = "$AS_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AS_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$AS_JOB" --jq .conclusion)" = success
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$AS_ARTIFACT")"
          test "$(jq -r .name <<<"$meta")" = "$AS_ARTIFACT_NAME"
          test "$(jq -r .size_in_bytes <<<"$meta")" = "$AS_ARTIFACT_SIZE"
          test "$(jq -r .digest <<<"$meta")" = "$AS_DIGEST"
          test "$(jq -r .expired <<<"$meta")" = false
          test "$(jq -r .workflow_run.id <<<"$meta")" = "$AS_RUN"
          test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "$AS_HEAD"

          test "$(git rev-parse HEAD^)" = "$MAIN_SHA"
          test "$(git diff --name-only "$MAIN_SHA"...HEAD | sort)" = "$(printf '%s\n' \
            '.github/workflows/r318av-published-au-differential.yml' \
            'crates/mimir-replay/tests/_tmp_r3_18av_published_au_differential.rs' | sort)"
          git diff --quiet "$MAIN_SHA" -- \
            crates/mimir-replay/src/lib.rs \
            Cargo.toml Cargo.lock \
            external_fixtures test_corpus \
            crates/mimir-replay/src/k3_admitted_groups.rs \
            crates/mimir-replay/src/k4_admitted_groups.rs \
            crates/mimir-replay/src/k4_native.rs

          echo R3_18AV_AUTHORITY_FREEZE=PASS

      - name: Download and verify immutable R3.18AS authority
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318av-out"
          AS="$RUNNER_TEMP/r318av-as"
          mkdir -p "$OUT" "$AS"

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${AS_ARTIFACT}/zip" \
            -o "$RUNNER_TEMP/r318as.zip"

          expected_digest="${AS_DIGEST#sha256:}"
          test "$(sha256sum "$RUNNER_TEMP/r318as.zip" | awk '{print $1}')" = "$expected_digest"
          test "$(stat -c '%s' "$RUNNER_TEMP/r318as.zip")" = "$AS_ARTIFACT_SIZE"
          unzip -q "$RUNNER_TEMP/r318as.zip" -d "$AS"

          test "$(wc -l < "$AS/r3_18as_artifact_sha256.txt")" -eq 13
          (cd "$AS" && sha256sum -c r3_18as_artifact_sha256.txt)

          python3 - "$AS" "$OUT" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          src = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          contract_path = pathlib.Path("docs/continuity/MIMIR_R3_18AT_ADMITTED_HEADER_CONTEXTS.json")
          contract = json.loads(contract_path.read_text())
          assert hashlib.sha256(contract_path.read_bytes()).hexdigest() == "3c412a5fdf5ed647fbe2b2e4db1f3adf4e4f578ae07c58a302c261f6abafd0a5"
          assert contract["membership_policy"] == "exact_tuple_only"
          assert contract["frozen_lane_row_count"] == 47
          assert contract["false_terminator_count"] == 7
          assert contract["observed_header_row_count"] == 40
          assert contract["unique_exact_context_count"] == 16

          authority = contract["authority"]
          expected_hashes = {
              "r3_18as_header_rows.json": authority["r3_18as_header_rows_sha256"],
              "r3_18as_header_summary.json": authority["r3_18as_header_summary_sha256"],
              "r3_18as_continuation_targets.tsv": authority["r3_18as_continuation_targets_sha256"],
              "r3_18as_terminator_rows.tsv": authority["r3_18as_terminator_rows_sha256"],
              "r3_18as_negative_controls.txt": authority["r3_18as_negative_controls_sha256"],
              "r3_18as_validation.txt": authority["r3_18as_validation_sha256"],
              "r3_18as_aggregate.txt": authority["r3_18as_aggregate_sha256"],
          }
          for name, digest in expected_hashes.items():
              assert sha256(src / name) == digest, name

          summary = json.loads((src / "r3_18as_header_summary.json").read_text())
          header_rows = json.loads((src / "r3_18as_header_rows.json").read_text())["rows"]
          assert summary["frozen_rows"] == 47
          assert summary["terminators"] == 7
          assert summary["continuations"] == 40
          assert summary["true_headers_exact"] == 40
          assert summary["native_oracle_mismatch"] == 0
          assert summary["unclassified"] == 0
          assert summary["unique_exact_contexts"] == 16
          assert summary["witness_reselection"] == 0
          assert summary["following_payload_bits_consumed"] == 0
          assert summary["second_later_control_bits_consumed"] == 0
          assert summary["tag_counts"] == {"Int": 40}
          assert len(header_rows) == 40

          fields = contract["tuple_fields"]
          def tuple_key(row):
              return tuple(row[k] for k in fields)
          artifact_contexts = sorted(
              [{**{k: r[k] for k in fields}, "observed_count": r["observed_count"]} for r in summary["contexts"]],
              key=lambda r: tuple_key(r),
          )
          contract_contexts = sorted(contract["admitted_contexts"], key=lambda r: tuple_key(r))
          assert artifact_contexts == contract_contexts
          assert sum(r["observed_count"] for r in contract_contexts) == 40

          exact = {tuple_key(r) for r in contract_contexts}
          assert (60, 5, 106, "Boolean", 868, 32, 10, False) not in exact
          assert (67, 6, 107, "Int", 868, 32, 10, False) not in exact
          assert (60, 5, 38, "Int", 868, 32, 10, False) not in exact
          assert (60, 5, 39, "Int", 868, 32, 10, False) not in exact
          assert (60, 5, 106, "Int", 868, 31, 10, False) not in exact
          assert (60, 5, 106, "Int", 868, 32, 9, False) not in exact
          assert (60, 5, 106, "Int", 868, 32, 10, True) not in exact
          assert (60, 5, 145, "Int", 868, 32, 10, False) not in exact

          targets = {}
          for filename in ("r3_18as_continuation_targets.tsv", "r3_18as_terminator_rows.tsv"):
              for line in (src / filename).read_text().splitlines():
                  if not line:
                      continue
                  parts = line.split("\t")
                  assert len(parts) == 8
                  label, frame, actor_ord, actor_obj, first_start, control_start, control_end, control_value = parts
                  targets[label] = {
                      "label": label,
                      "frame_index": int(frame),
                      "actor_ordinal": int(actor_ord),
                      "actor_context_object_id": int(actor_obj),
                      "first_start": int(first_start),
                      "control_start": int(control_start),
                      "control_end": int(control_end),
                      "control_value": int(control_value),
                  }
          assert len(targets) == 47
          headers = {r["label"]: r for r in header_rows}
          assert len(headers) == 40

          ordered_labels = []
          for line in (src / "r3_18as_frozen_control_rows.tsv").read_text().splitlines():
              m = re.search(r"\tlabel=([^\t]+)", line)
              assert m, line
              ordered_labels.append(m.group(1))
          assert len(ordered_labels) == 47
          assert len(set(ordered_labels)) == 47
          assert set(ordered_labels) == set(targets)

          columns = [
              "label","frame_index","actor_ordinal","actor_context_object_id","first_start",
              "control_start","control_end","control_value","stream_start","stream_end","stream_id",
              "stream_id_bound","prop_id_bits","property_object_index","attribute_tag",
              "payload_start_bit","header_stop_bit","version_major","version_minor","net_version","is_rl_223"
          ]
          lines = ["\t".join(columns)]
          for label in ordered_labels:
              row = dict(targets[label])
              hdr = headers.get(label)
              if hdr is not None:
                  for key in columns[8:]:
                      row[key] = hdr[key]
              else:
                  for key in columns[8:]:
                      row[key] = ""
              values = []
              for key in columns:
                  value = row[key]
                  if isinstance(value, bool):
                      values.append(str(value).lower())
                  else:
                      values.append(str(value))
              lines.append("\t".join(values))
          expected = "\n".join(lines) + "\n"
          (out / "r3_18av_expected_rows.tsv").write_text(expected)

          (out / "r3_18av_authority_validation.txt").write_text(
              "R3_18AV_AS_OUTER_DIGEST=PASS\n"
              "R3_18AV_AS_INNER_MANIFEST=13/13 PASS\n"
              "R3_18AV_AT_CONTRACT_SHA256=PASS\n"
              "R3_18AV_AT_CONTEXTS=16/16\n"
              "R3_18AV_AT_MULTIPLICITY=40\n"
              "R3_18AV_ANTI_WIDENING=PASS\n"
              "R3_18AV_EXPECTED_ROWS=47/47\n"
          )
          PY

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '

      - name: Execute deterministic R3.18AV differential
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318av-out"
          export R318AV_EXPECTED_TSV="$OUT/r3_18av_expected_rows.tsv"

          cargo +1.85.0 test -p mimir-replay --test _tmp_r3_18av_published_au_differential -- --nocapture \
            2>&1 | tee "$OUT/r3_18av_test_output.txt"

          grep -F 'R3_18AV_SUMMARY' "$OUT/r3_18av_test_output.txt" | tail -1 > "$OUT/r3_18av_comparison_summary.txt"
          grep -F 'rows=47' "$OUT/r3_18av_comparison_summary.txt"
          grep -F 'false=7' "$OUT/r3_18av_comparison_summary.txt"
          grep -F 'true=40' "$OUT/r3_18av_comparison_summary.txt"
          grep -F 'contexts=16' "$OUT/r3_18av_comparison_summary.txt"
          grep -F 'multiplicity=40' "$OUT/r3_18av_comparison_summary.txt"
          grep -F 'mismatch=0' "$OUT/r3_18av_comparison_summary.txt"
          grep -F 'witness_reselection=0' "$OUT/r3_18av_comparison_summary.txt"
          grep -F 'following_payload_bits=0' "$OUT/r3_18av_comparison_summary.txt"
          grep -F 'second_later_control_bits=0' "$OUT/r3_18av_comparison_summary.txt"
          grep -F 'R3_18AV_MISMATCHED_PREREQUISITE=PASS' "$OUT/r3_18av_test_output.txt"

          {
            echo R3_18AV_NEGATIVE_CONTROLS=PASS
            echo R3_18AV_FALSE_POST_AQ_POISON=PASS
            echo R3_18AV_TRUE_PAYLOAD_POISON=PASS
            echo R3_18AV_TRUE_HEADER_TRUNCATION=PASS
            echo R3_18AV_WRONG_ACTOR=PASS
            echo R3_18AV_UNRESOLVED_LOOKUP=PASS
            echo R3_18AV_WRONG_VERSION=PASS
            echo R3_18AV_RL223_FLIP=PASS
            echo R3_18AV_EXACT_MEMBERSHIP_ANTI_WIDENING=PASS
            echo R3_18AV_MISMATCHED_PREREQUISITE=PASS
          } > "$OUT/r3_18av_negative_controls.txt"

      - name: Reuse and verify unique same-head natural CI
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318av-out"
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml" --jq .id)"
          run_id=''
          for attempt in $(seq 1 90); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100")"
            count="$(jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .event == "push")] | length' <<<"$runs")"
            if [ "$count" -eq 1 ]; then
              run_id="$(jq -r '.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .event == "push") | .id' <<<"$runs")"
              break
            fi
            if [ "$count" -gt 1 ]; then
              echo "duplicate same-head CI runs detected: $count" >&2
              exit 1
            fi
            sleep 5
          done
          test -n "$run_id"

          for attempt in $(seq 1 180); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
            [ "$state" = completed ] && break
            sleep 5
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)" = completed
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_branch)" = 'evidence/r318av-published-au-differential-v1'
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          test "$(jq '.total_count' <<<"$jobs")" -eq 1
          job_id="$(jq -r '.jobs[0].id' <<<"$jobs")"
          test "$(jq -r '.jobs[0].conclusion' <<<"$jobs")" = success

          {
            echo R3_18AV_SAME_HEAD_CI=PASS
            echo CI_RUN_ID=$run_id
            echo CI_JOB_ID=$job_id
            echo CI_RUN_COUNT=1
            echo CI_HEAD_SHA=$GITHUB_SHA
          } > "$OUT/r3_18av_same_head_ci_receipt.txt"

      - name: Finalize validation and artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318av-out"

          {
            echo R3_18AV_SOURCE_SCOPE=PASS
            echo R3_18AV_PRODUCTION_MUTATION=0
            echo R3_18AV_CARGO_MUTATION=0
            echo R3_18AV_FIXTURE_MUTATION=0
            echo R3_18AV_CORPUS_MUTATION=0
            echo R3_18AV_SUPPORT_MUTATION=0
            echo R3_18AV_TEMP_FILES_ONLY=2
          } > "$OUT/r3_18av_source_scope.txt"

          {
            echo MAIN_SHA=$MAIN_SHA
            echo MAIN_TREE=$MAIN_TREE
            echo PROD_SHA=$PROD_SHA
            echo PROD_TREE=$PROD_TREE
            echo PROD_PARENT=$PROD_PARENT
            echo AU_CANDIDATE_CI=$AU_CANDIDATE_CI/$AU_CANDIDATE_CI_JOB
            echo AU_PUBLISHED_CI=$AU_PUBLISHED_CI/$AU_PUBLISHED_CI_JOB
            echo ADMISSION_CANDIDATE_CI=$ADMISSION_CANDIDATE_CI/$ADMISSION_CANDIDATE_CI_JOB
            echo ADMISSION_CANDIDATE_KA=$ADMISSION_CANDIDATE_KA/$ADMISSION_CANDIDATE_KA_JOB
            echo ADMISSION_PUBLISHED_CI=$ADMISSION_PUBLISHED_CI/$ADMISSION_PUBLISHED_CI_JOB
            echo ADMISSION_PUBLISHED_KA=$ADMISSION_PUBLISHED_KA/$ADMISSION_PUBLISHED_KA_JOB
            echo AS_HEAD=$AS_HEAD
            echo AS_TREE=$AS_TREE
            echo AS_RUN_JOB=$AS_RUN/$AS_JOB
            echo AS_ARTIFACT=$AS_ARTIFACT
            echo AS_DIGEST=$AS_DIGEST
            echo AT_CONTRACT_SHA256=$AT_CONTRACT_SHA256
            echo BOXCARS_SHA=$BOXCARS_SHA
          } > "$OUT/r3_18av_upstream_receipts.txt"

          if grep -R -n -E 'C:\\Users\\|/Users/|/home/[A-Za-z0-9._-]+' \
            "$OUT" \
            --exclude='r3_18av_test_output.txt' \
            --exclude='r3_18av_expected_rows.tsv'; then
            echo 'privacy scan found a local user path' >&2
            exit 1
          fi

          {
            echo R3_18AV_VALIDATION=PASS
            echo R3_18AV_PUBLISHED_AU_EXACT=47/47
            echo R3_18AV_FALSE_TERMINATORS_EXACT=7/7
            echo R3_18AV_TRUE_HEADERS_EXACT=40/40
            echo R3_18AV_AT_CONTEXTS=16/16
            echo R3_18AV_AT_MULTIPLICITY=40
            echo R3_18AV_MISMATCH=0
            echo R3_18AV_WITNESS_RESELECTION=0
            echo R3_18AV_REPEATABILITY=PASS
            echo R3_18AV_FOLLOWING_PAYLOAD_BITS_CONSUMED=0
            echo R3_18AV_SECOND_LATER_CONTROL_BITS_CONSUMED=0
            echo R3_18AV_PRIVACY_SCAN=PASS
          } > "$OUT/r3_18av_validation.txt"

          {
            echo R3_18AV_OUTCOME=A
            echo R3_18AV_EVIDENCE=PASS
            echo R3_18AV_FROZEN_ROWS=47/47
            echo R3_18AV_CONTROL_FALSE=7
            echo R3_18AV_CONTROL_TRUE=40
            echo R3_18AV_FALSE_TERMINATORS_EXACT=7/7
            echo R3_18AV_TRUE_HEADERS_EXACT=40/40
            echo R3_18AV_AT_CONTEXTS=16/16
            echo R3_18AV_AT_MULTIPLICITY=40
            echo R3_18AV_MISMATCH=0
            echo R3_18AV_WITNESS_RESELECTION=0
            echo R3_18AV_FOLLOWING_PAYLOAD_BITS_CONSUMED=0
            echo R3_18AV_SECOND_LATER_CONTROL_BITS_CONSUMED=0
            echo R3_18AV_PRODUCTION_CARGO_FIXTURE_CORPUS_SUPPORT_MUTATION=0/0/0/0/0
            echo R3_18AV_NEGATIVE_CONTROLS=PASS
            echo R3_18AV_SAME_HEAD_CI=PASS
            echo R3_18AV_PRIVACY_SCAN=PASS
          } > "$OUT/r3_18av_aggregate.txt"

          (
            cd "$OUT"
            sha256sum \
              r3_18av_authority_validation.txt \
              r3_18av_expected_rows.tsv \
              r3_18av_test_output.txt \
              r3_18av_comparison_summary.txt \
              r3_18av_negative_controls.txt \
              r3_18av_same_head_ci_receipt.txt \
              r3_18av_source_scope.txt \
              r3_18av_upstream_receipts.txt \
              r3_18av_validation.txt \
              r3_18av_aggregate.txt \
              > r3_18av_artifact_sha256.txt
            test "$(wc -l < r3_18av_artifact_sha256.txt)" -eq 10
            sha256sum -c r3_18av_artifact_sha256.txt
          )

      - name: Upload immutable R3.18AV evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: r318av-published-au-differential-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/r318av-out/r3_18av_authority_validation.txt
            ${{ runner.temp }}/r318av-out/r3_18av_expected_rows.tsv
            ${{ runner.temp }}/r318av-out/r3_18av_test_output.txt
            ${{ runner.temp }}/r318av-out/r3_18av_comparison_summary.txt
            ${{ runner.temp }}/r318av-out/r3_18av_negative_controls.txt
            ${{ runner.temp }}/r318av-out/r3_18av_same_head_ci_receipt.txt
            ${{ runner.temp }}/r318av-out/r3_18av_source_scope.txt
            ${{ runner.temp }}/r318av-out/r3_18av_upstream_receipts.txt
            ${{ runner.temp }}/r318av-out/r3_18av_validation.txt
            ${{ runner.temp }}/r318av-out/r3_18av_aggregate.txt
            ${{ runner.temp }}/r318av-out/r3_18av_artifact_sha256.txt

      - name: Verify immutable receipt and mark success
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318av-out"
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          test "$(jq -r '.workflow_run.id' <<<"$meta")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$meta")" = "$GITHUB_SHA"
          test "$(jq -r '.expired' <<<"$meta")" = false
          norm() { printf '%s' "${1#sha256:}" | tr '[:upper:]' '[:lower:]'; }
          test "$(norm "$(jq -r '.digest' <<<"$meta")")" = "$(norm "$ARTIFACT_DIGEST")"

          grep -Fx 'R3_18AV_OUTCOME=A' "$OUT/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_EVIDENCE=PASS' "$OUT/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_FROZEN_ROWS=47/47' "$OUT/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_CONTROL_FALSE=7' "$OUT/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_CONTROL_TRUE=40' "$OUT/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_FALSE_TERMINATORS_EXACT=7/7' "$OUT/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_TRUE_HEADERS_EXACT=40/40' "$OUT/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_AT_CONTEXTS=16/16' "$OUT/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_AT_MULTIPLICITY=40' "$OUT/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_MISMATCH=0' "$OUT/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_WITNESS_RESELECTION=0' "$OUT/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_FOLLOWING_PAYLOAD_BITS_CONSUMED=0' "$OUT/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_SECOND_LATER_CONTROL_BITS_CONSUMED=0' "$OUT/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_NEGATIVE_CONTROLS=PASS' "$OUT/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_SAME_HEAD_CI=PASS' "$OUT/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_PRIVACY_SCAN=PASS' "$OUT/r3_18av_aggregate.txt"

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='r318av/evidence' \
            -f description='R3.18AV Outcome A published AU differential PASS' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

          echo R3_18AV_EVIDENCE_HEAD="$(git rev-parse HEAD)"
          echo R3_18AV_EVIDENCE_TREE="$(git rev-parse HEAD^{tree})"
          echo R3_18AV_AUTHORITY_RUN="$GITHUB_RUN_ID"
          echo R3_18AV_ARTIFACT_ID="$ARTIFACT_ID"
          echo R3_18AV_ARTIFACT_DIGEST="$ARTIFACT_DIGEST"
          cat "$OUT/r3_18av_aggregate.txt"

      - name: Mark evidence failure
        if: failure()
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='r318av/evidence' \
            -f description='R3.18AV evidence failed; inspect exact run' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null || true
