name: R3.17M Continuity Closure

on:
  push:
    branches:
      - agent/r317m-continuity-sync

permissions:
  contents: write

jobs:
  continuity:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BASE_MAIN: b1a4ad1a04623e3c8b002a7ea60817120b5fb551
      PROD_SHA: 7390e3b145372252caaa8fa1fe3e0cd13b83336c
      PROD_TREE: eebe4e21de77a43b5d9d43a34a0bfb08e06bab02
      LIB_BLOB: 28d213f831c8968e6756a6ccea2cd7aa6cdbdfba
      GROUP_BLOB: da545a7144fefabab7f5be4f07fde71311065293
      TEST_BLOB: 4d1434cc0e59a6e5c72a8404c102a87d71b8b223
      M_HEAD: a50f09857f36ac52cec30b4bf3efbde9e15bb564
      M_RUN: '31881779861'
      M_JOB: '95005282281'
      M_CI_RUN: '31881779862'
      M_CI_JOB: '95005282149'
      M_ARTIFACT: '9246249473'
      M_DIGEST: sha256:50839ba19f65feb92a2e79be30d36bf78fc4cc2e3280049cd591faf6846e2987
      M_GROUPS_SHA: 80c50783d70951bf125ccdadb818750a7ce35012891997f9b396241d84a9ae2b
      M_WITNESSES_SHA: acd66e4b1fc6f8c13228c7c67c24855760d55569957177915521d685949f80c3
      M_SUMMARY_SHA: 0ae05ee497f27bf159ba3ca8b4d1ec59a8b3a131713883e72592024bf2ca59f8
      M_AGG_SHA: f6ff0d70d81afbd1db4f84cb3eaf47c8a6325aeca5bb0294071b678da352f82a

    steps:
      - name: Checkout disposable continuity branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify frozen canonical authority
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin main evidence/r317m-k4-wire-evidence
          if($LASTEXITCODE -ne 0){ throw 'fetch failed' }
          if((git rev-parse origin/main).Trim() -ne $env:BASE_MAIN){ throw 'fresh main moved' }
          if((git rev-parse "$($env:PROD_SHA)^{tree}").Trim() -ne $env:PROD_TREE){ throw 'production tree drift' }
          if((git rev-parse "$($env:PROD_SHA):crates/mimir-replay/src/lib.rs").Trim() -ne $env:LIB_BLOB){ throw 'lib blob drift' }
          if((git rev-parse "$($env:PROD_SHA):crates/mimir-replay/src/k3_admitted_groups.rs").Trim() -ne $env:GROUP_BLOB){ throw 'groups blob drift' }
          if((git rev-parse "$($env:PROD_SHA):crates/mimir-replay/tests/r3_17k_k3_attribute_decoder.rs").Trim() -ne $env:TEST_BLOB){ throw 'test blob drift' }
          if((git rev-parse origin/evidence/r317m-k4-wire-evidence).Trim() -ne $env:M_HEAD){ throw 'R3.17M authority head drift' }
          Write-Host 'frozen canonical authority PASS'

      - name: Generate R3.17M closure and R3.17N spec
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tools/_tmp_r317m_continuity.py
          if($LASTEXITCODE -ne 0){ throw 'continuity generator failed' }
          python tools/_tmp_r317m_trim.py
          if($LASTEXITCODE -ne 0){ throw 'whitespace normalizer failed' }

      - name: Enforce exact six-file docs-only scope
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'MIMIR_CONTINUE_HERE.md',
            'MIMIR_KNOWLEDGE_GRAPH.md',
            'docs/continuity/MIMIR_CONTINUITY_STATE.json',
            'docs/continuity/MIMIR_CURRENT_STATE.md',
            'docs/continuity/MIMIR_R3_17M_DECISION.md',
            'docs/continuity/MIMIR_R3_17N_EXECUTION_SPEC.md'
          )
          foreach($f in $files){ git add -- $f; if($LASTEXITCODE -ne 0){ throw "add failed: $f" } }
          $actual=@(git diff --cached --name-only | Sort-Object)
          $expected=@($files | Sort-Object)
          if(($actual -join "`n") -ne ($expected -join "`n")){ Write-Host 'Actual:'; $actual; throw 'six-file scope mismatch' }
          git diff --cached --check
          if($LASTEXITCODE -ne 0){ throw 'diff check failed' }
          if($actual | Select-String -Pattern '(^|/)(Cargo\.toml|Cargo\.lock)$|^crates/|^external_fixtures/|^test_corpus/'){ throw 'forbidden mutation' }
          Write-Host 'exact six-file docs-only scope PASS'

      - name: Verify continuity semantic anchors
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import json
          from pathlib import Path
          prod='7390e3b145372252caaa8fa1fe3e0cd13b83336c'
          auth='a50f09857f36ac52cec30b4bf3efbde9e15bb564'
          digest='sha256:50839ba19f65feb92a2e79be30d36bf78fc4cc2e3280049cd591faf6846e2987'
          groups='80c50783d70951bf125ccdadb818750a7ce35012891997f9b396241d84a9ae2b'
          state=json.loads(Path('docs/continuity/MIMIR_CONTINUITY_STATE.json').read_text(encoding='utf-8'))
          assert state['last_production_code_sha']==prod
          assert state['last_production_milestone']=='R3.17K'
          assert state['last_completed_read_only_audit']=='R3.17L'
          assert state['last_completed_evidence_pass']=='R3.17M'
          assert state['current_pass']=='R3.17N'
          assert state['r3_17m']['authority_head']==auth
          assert state['r3_17m']['workflow_run']==31881779861
          assert state['r3_17m']['workflow_job']==95005282281
          assert state['r3_17m']['exact_head_ci_run']==31881779862
          assert state['r3_17m']['exact_head_ci_job']==95005282149
          assert state['r3_17m']['artifact_id']==9246249473
          assert state['r3_17m']['artifact_digest']==digest
          assert state['r3_17m']['k4_occurrences']==39463
          assert state['r3_17m']['exact_structural_context_groups']==161
          assert state['r3_17m']['privacy_safe_witness_rows']==617
          assert state['r3_17m']['zero_target_tags']==0
          assert state['r3_17m']['groups_sha256']==groups
          assert state['r3_17m']['production_cargo_fixture_corpus_support_mutation']=='0/0/0/0/0'
          assert 'docs/continuity/MIMIR_R3_17M_DECISION.md' in state['next_files_to_read']
          assert 'docs/continuity/MIMIR_R3_17N_EXECUTION_SPEC.md' in state['next_files_to_read']
          decision=Path('docs/continuity/MIMIR_R3_17M_DECISION.md').read_text(encoding='utf-8')
          spec=Path('docs/continuity/MIMIR_R3_17N_EXECUTION_SPEC.md').read_text(encoding='utf-8')
          cont=Path('MIMIR_CONTINUE_HERE.md').read_text(encoding='utf-8')
          graph=Path('MIMIR_KNOWLEDGE_GRAPH.md').read_text(encoding='utf-8')
          current=Path('docs/continuity/MIMIR_CURRENT_STATE.md').read_text(encoding='utf-8')
          for text in (decision,cont,graph,current):
              assert auth in text
              assert '39463' in text
              assert '161' in text
          assert 'R3.17N' in cont and 'R3.17N' in graph and 'R3.17N' in current and 'R3.17N' in spec
          assert groups in decision and groups in spec
          for tag in ['CamSettings','TeamPaint','TeamLoadout','ClubColors','Reservation','StatEvent','PlayerHistoryKey','DemolishFx','DemolishExtended','ExtendedExplosion','LoadoutsOnline']:
              assert tag in decision and tag in spec, tag
          assert 'cross-product widening' in spec
          assert 'Do not implement native K4' in spec
          assert 'R3.18 remains closed' in spec
          print('continuity semantic anchors PASS')
          '@ | python -
          if($LASTEXITCODE -ne 0){ throw 'semantic anchors failed' }

      - name: Verify Knowledge Archive
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          pwsh -NoProfile -File scripts/verify_mimir_knowledge_archive.ps1
          if($LASTEXITCODE -ne 0){ throw 'knowledge archive failed' }

      - name: Full repository verifier
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          rustup component add rustfmt clippy
          if($LASTEXITCODE -ne 0){ throw 'rust component setup failed' }
          pwsh -NoProfile -File scripts/verify_repo.ps1
          if($LASTEXITCODE -ne 0){ throw 'repository verification failed' }

      - name: Publish clean continuity candidate via Git plumbing
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin main
          if($LASTEXITCODE -ne 0){ throw 'final fetch failed' }
          if((git rev-parse origin/main).Trim() -ne $env:BASE_MAIN){ throw 'main moved before candidate publication' }
          $files=@(
            'MIMIR_CONTINUE_HERE.md',
            'MIMIR_KNOWLEDGE_GRAPH.md',
            'docs/continuity/MIMIR_CONTINUITY_STATE.json',
            'docs/continuity/MIMIR_CURRENT_STATE.md',
            'docs/continuity/MIMIR_R3_17M_DECISION.md',
            'docs/continuity/MIMIR_R3_17N_EXECUTION_SPEC.md'
          )
          $env:GIT_INDEX_FILE=Join-Path $env:RUNNER_TEMP 'r317m-continuity.index'
          if(Test-Path $env:GIT_INDEX_FILE){ Remove-Item $env:GIT_INDEX_FILE -Force }
          git read-tree $env:BASE_MAIN
          if($LASTEXITCODE -ne 0){ throw 'read-tree failed' }
          foreach($f in $files){
            $blob=(git hash-object -w -- $f).Trim()
            if($LASTEXITCODE -ne 0 -or -not $blob){ throw "hash-object failed: $f" }
            git update-index --add --cacheinfo "100644,$blob,$f"
            if($LASTEXITCODE -ne 0){ throw "update-index failed: $f" }
          }
          $tree=(git write-tree).Trim()
          if($LASTEXITCODE -ne 0 -or -not $tree){ throw 'write-tree failed' }
          $baseTree=(git rev-parse "$($env:BASE_MAIN)^{tree}").Trim()
          $actual=@(git diff-tree --no-commit-id --name-only -r $baseTree $tree | Sort-Object)
          $expected=@($files | Sort-Object)
          if(($actual -join "`n") -ne ($expected -join "`n")){ Write-Host $actual; throw 'candidate tree scope mismatch' }
          git diff-tree --check $baseTree $tree
          if($LASTEXITCODE -ne 0){ throw 'candidate tree diff check failed' }
          $env:GIT_AUTHOR_NAME='github-actions[bot]'
          $env:GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          $env:GIT_COMMITTER_NAME=$env:GIT_AUTHOR_NAME
          $env:GIT_COMMITTER_EMAIL=$env:GIT_AUTHOR_EMAIL
          $sha=('Close R3.17M and open R3.17N K4 contract' | git commit-tree $tree -p $env:BASE_MAIN).Trim()
          if($LASTEXITCODE -ne 0 -or -not $sha){ throw 'commit-tree failed' }
          if((git rev-parse "$sha^").Trim() -ne $env:BASE_MAIN){ throw 'candidate parent mismatch' }
          $commitFiles=@(git diff-tree --no-commit-id --name-only -r $env:BASE_MAIN $sha | Sort-Object)
          if(($commitFiles -join "`n") -ne ($expected -join "`n")){ throw 'candidate commit scope mismatch' }
          git push origin "$($sha):refs/heads/candidate/r3-17m-continuity-clean"
          if($LASTEXITCODE -ne 0){ throw 'candidate push failed' }
          Write-Host "CANDIDATE_SHA=$sha"
          Write-Host "CANDIDATE_TREE=$tree"
          Write-Host 'clean R3.17M continuity candidate PASS'
