name: Rust Dependency Advisory Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches:
      - main
    paths:
      - 'Cargo.lock'
      - '.github/workflows/dependency-audit.yml'
  pull_request:
    paths:
      - 'Cargo.lock'
      - '.github/workflows/dependency-audit.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rustsec:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Exact Rust 1.85 toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '
          cargo +1.85.0 --version

      - name: Install pinned cargo-audit
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 install cargo-audit --version 0.22.1 --locked
          cargo audit --version | grep -F 'cargo-audit 0.22.1'

      - name: Audit exact Cargo.lock and freeze advisory DB provenance
        shell: bash
        run: |
          set -uo pipefail
          cargo audit --file Cargo.lock
          status=$?
          db="$HOME/.cargo/advisory-db"
          if [ -d "$db/.git" ]; then
            echo "RUSTSEC_ADVISORY_DB_HEAD=$(git -C "$db" rev-parse HEAD)"
          else
            echo 'RustSec advisory database checkout was not found after audit' >&2
            exit 2
          fi
          echo "RUSTSEC_CARGO_LOCK_SHA256=$(sha256sum Cargo.lock | awk '{print $1}')"
          exit "$status"
