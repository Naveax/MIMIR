name: R3.18P Corrected Contract Admission

on:
  push:
    branches: [ops/r318p-contract-prepare-v2]

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}

      - name: Toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc --version | grep -F 'rustc 1.85.0 '

      - name: Build corrected exact contract and clean admission
        env:
          BASE_MAIN: a431d57e945505b6b4879475e51fc2c2e1c14df7
          ADMISSION_BRANCH: admission/r318p-header-context-contract-v2
        run: |
          set -euxo pipefail
          OPS="$PWD"
          ART="$(mktemp -d)"
          WORK="$(mktemp -d)"
          TMP="$(mktemp -d)"
          ZIP="$(mktemp)"
          trap 'rm -rf "$ART" "$WORK" "$TMP" "$ZIP"' EXIT

          git fetch origin main ops/r318p-contract-prepare --force
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"

          # Prove the immutable outer artifact receipt itself, not merely unpacked files.
          curl -L --fail-with-body \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9284144768/zip" \
            -o "$ZIP"
          test "$(stat -c%s "$ZIP")" = "25129"
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "e6dc02f08ad025e816d772227a8c21a595902e45a9d71b5a9eb07c28fab4b94d"

          gh run download 32017369100 -n r318o-following-property-header-evidence -D "$ART"
          test "$(wc -l < "$ART/r3_18o_artifact_sha256.txt")" -eq 11
          (cd "$ART" && sha256sum -c r3_18o_artifact_sha256.txt)
          test "$(sha256sum "$ART/r3_18o_source_summary.json" | awk '{print $1}')" = "f1bc285db764a71091c904e74a82c28e369cec1e62bed1b7ae503effef4824bc"
          test "$(sha256sum "$ART/r3_18o_header_rows.json" | awk '{print $1}')" = "599657a154498451d6317bf148da7bcf6e7077f35315426023da526a955ee2a4"
          test "$(sha256sum "$ART/r3_18o_aggregate.txt" | awk '{print $1}')" = "170bad20b7d3d11596f879865a1380ade3910eba069311bec7e6d51eae2a4233"
          grep -Fq 'R3_18O_OUTCOME=A' "$ART/r3_18o_aggregate.txt"
          grep -Fq 'R3_18O_FROZEN_ROWS=47/47' "$ART/r3_18o_aggregate.txt"
          grep -Fq 'R3_18O_WITNESS_RESELECTION=0' "$ART/r3_18o_aggregate.txt"
          grep -Fq 'R3_18O_FOLLOWING_HEADER_EXACT=47/47' "$ART/r3_18o_aggregate.txt"
          grep -Fq 'R3_18O_NATIVE_ORACLE_MISMATCH=0' "$ART/r3_18o_aggregate.txt"
          echo 'R3_18P_CORRECTED_O_AUTHORITY=PASS'

          # Reuse only the historical continuity generator, then overwrite all stale
          # pre-correction receipts and tuple identities before executing it.
          git show origin/ops/r318p-contract-prepare:tools/_tmp_r318p_admit.py > "$TMP/admit.py"
          python3 - "$TMP/admit.py" <<'PY'
          from pathlib import Path
          import sys

          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')
          pairs={
            'BASE="b2d9feaee5d7579c88466431dd52d879cddfb70b"':'BASE="a431d57e945505b6b4879475e51fc2c2e1c14df7"',
            'O_DIGEST="e6dc02f087395e2d6b5fb568233484430feba51223848367edd2c6cf15b4b94d"':'O_DIGEST="e6dc02f08ad025e816d772227a8c21a595902e45a9d71b5a9eb07c28fab4b94d"',
            'O_SUMMARY_SHA="a261368f51770efee56e3d8d760390f633b6190bed81446feaf57b076189ae01"':'O_SUMMARY_SHA="f1bc285db764a71091c904e74a82c28e369cec1e62bed1b7ae503effef4824bc"',
            'O_HEADER_SHA="503bae96ac51ff27532fc80b5e537b3cb7ccd58cea1584a9a1f975da8a4748a9"':'O_HEADER_SHA="599657a154498451d6317bf148da7bcf6e7077f35315426023da526a955ee2a4"',
            'O_AGG_SHA="02324f5a0caa68257a0af93999245124242569f8d582ab2aba2f8119fe6cd676"':'O_AGG_SHA="170bad20b7d3d11596f879865a1380ade3910eba069311bec7e6d51eae2a4233"',
          }
          for old,new in pairs.items():
              assert s.count(old)==1,(old,s.count(old))
              s=s.replace(old,new,1)

          a=s.index('EXPECTED=[')
          b=s.index(']\n\ndef req',a)+1
          expected='''EXPECTED=[
          (60,5,32,"Boolean",868,32,10,1),(60,5,41,"Boolean",868,32,10,2),(60,5,78,"Boolean",868,32,10,4),
          (60,5,79,"Boolean",868,32,10,19),(60,5,80,"ActiveActor",868,32,10,6),(60,5,83,"ActiveActor",868,32,10,1),
          (60,5,85,"Boolean",868,32,10,1),(60,5,87,"Boolean",868,32,10,2),(60,5,89,"Boolean",868,32,10,1),
          (60,5,94,"Boolean",868,32,10,1),(60,5,102,"Boolean",868,32,10,2),(60,5,103,"Boolean",868,32,10,1),
          (60,5,106,"Boolean",868,32,10,1),(60,5,116,"Boolean",868,32,10,1),(67,6,61,"Boolean",868,32,10,1),
          (72,6,62,"Boolean",868,32,10,1),(72,6,65,"Boolean",868,32,10,1),(110,6,36,"ActiveActor",868,32,10,1)]'''
          s=s[:a]+expected+s[b:]
          p.write_text(s,encoding='utf-8',newline='\n')
          PY

          git worktree add --detach "$WORK" "$BASE_MAIN"
          python3 "$TMP/admit.py" "$WORK" "$ART/r3_18o_source_summary.json"

          # Old disposable helper used Markdown hard-break spaces in two generated
          # ledger lines. Canonical repository policy is git-diff-clean whitespace.
          python3 - "$WORK/docs/continuity/MIMIR_PROGRESS_LEDGER.md" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          lines=p.read_text(encoding='utf-8').splitlines()
          p.write_text('\n'.join(line.rstrip() for line in lines)+'\n',encoding='utf-8',newline='\n')
          PY

          cd "$WORK"
          git diff --check

          expected=(
            MIMIR_CONTINUE_HERE.md
            MIMIR_KNOWLEDGE_GRAPH.md
            docs/continuity/MIMIR_BOUNDARY_LOCKS.md
            docs/continuity/MIMIR_CONTINUITY_STATE.json
            docs/continuity/MIMIR_CURRENT_STATE.md
            docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md
            docs/continuity/MIMIR_PROGRESS_LEDGER.md
            docs/continuity/MIMIR_R3_18P_ADMITTED_HEADER_CONTEXTS.json
            docs/continuity/MIMIR_R3_18P_DECISION.md
            docs/continuity/MIMIR_R3_18Q_EXECUTION_SPEC.md
          )
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          mapfile -t want < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' '--- CHANGED ---' "${changed[@]}"
          test "${#changed[@]}" -eq 10
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${want[@]}")"
          git diff --exit-code "$BASE_MAIN" -- crates Cargo.toml Cargo.lock external_fixtures test_corpus scripts .github/workflows

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path

          c=Path('docs/continuity/MIMIR_R3_18P_ADMITTED_HEADER_CONTEXTS.json')
          d=json.loads(c.read_text(encoding='utf-8'))
          assert d['observed_row_count']==47
          assert d['unique_exact_context_count']==18
          assert len(d['admitted_contexts'])==18
          assert sum(x['observed_count'] for x in d['admitted_contexts'])==47
          assert d['membership_policy']=='exact_tuple_only'

          keys=('stream_id_bound','prop_id_bits','property_object_index','attribute_tag','version_major','version_minor','net_version')
          exact={tuple(x[k] for k in keys) for x in d['admitted_contexts']}
          assert len(exact)==18
          assert all(x[4:]==(868,32,10) for x in exact)

          expected={
            (60,5,32,'Boolean',868,32,10),(60,5,41,'Boolean',868,32,10),(60,5,78,'Boolean',868,32,10),
            (60,5,79,'Boolean',868,32,10),(60,5,80,'ActiveActor',868,32,10),(60,5,83,'ActiveActor',868,32,10),
            (60,5,85,'Boolean',868,32,10),(60,5,87,'Boolean',868,32,10),(60,5,89,'Boolean',868,32,10),
            (60,5,94,'Boolean',868,32,10),(60,5,102,'Boolean',868,32,10),(60,5,103,'Boolean',868,32,10),
            (60,5,106,'Boolean',868,32,10),(60,5,116,'Boolean',868,32,10),(67,6,61,'Boolean',868,32,10),
            (72,6,62,'Boolean',868,32,10),(72,6,65,'Boolean',868,32,10),(110,6,36,'ActiveActor',868,32,10),
          }
          assert exact==expected

          counts={tuple(x[k] for k in keys):x['observed_count'] for x in d['admitted_contexts']}
          assert counts[(60,5,79,'Boolean',868,32,10)]==19
          assert counts[(60,5,80,'ActiveActor',868,32,10)]==6

          # Mandatory anti-widening negatives.
          sample=next(iter(exact))
          assert (sample[0],sample[1],sample[2],'__OUTSIDE__',sample[4],sample[5],sample[6]) not in exact
          assert (sample[0],sample[1],999,sample[3],sample[4],sample[5],sample[6]) not in exact
          assert (sample[0],sample[1],sample[2],sample[3],0,0,0) not in exact
          assert (999,9,999,'Boolean',868,32,10) not in exact

          components=[set(x[i] for x in exact) for i in range(7)]
          fabricated=None
          for a in exact:
              for b in exact:
                  t=(a[0],a[1],b[2],a[3],a[4],a[5],a[6])
                  if all(t[i] in components[i] for i in range(7)) and t not in exact:
                      fabricated=t
                      break
              if fabricated:
                  break
          assert fabricated is not None

          h=hashlib.sha256(c.read_bytes()).hexdigest()
          assert h in Path('docs/continuity/MIMIR_R3_18P_DECISION.md').read_text(encoding='utf-8')
          st=json.loads(Path('docs/continuity/MIMIR_CONTINUITY_STATE.json').read_text(encoding='utf-8'))
          assert st['current_pass']=='R3.18Q'
          assert st['last_completed_contract_pass']=='R3.18P'
          assert st['last_production_code_sha']=='fd74ba8c520ab83b808730572c41e45d6dc616e6'
          trio=['docs/continuity/MIMIR_R3_18P_ADMITTED_HEADER_CONTEXTS.json','docs/continuity/MIMIR_R3_18P_DECISION.md','docs/continuity/MIMIR_R3_18Q_EXECUTION_SPEC.md']
          f=st['next_files_to_read']
          i=f.index('docs/continuity/MIMIR_R3_18P_EXECUTION_SPEC.md')
          assert f[i+1:i+4]==trio
          print('R3_18P_CONTRACT_VALIDATION=PASS',h,'fabricated_negative=',fabricated)
          PY

          grep -Fq 'R3.18P following-property header context contract: OUTCOME A / CLOSED' MIMIR_KNOWLEDGE_GRAPH.md
          grep -Fq 'R3.18Q bounded following-property header composition: ACTIVE' MIMIR_KNOWLEDGE_GRAPH.md
          grep -Fq '# CURRENT PASS CHECKLIST — R3.18Q' MIMIR_CONTINUE_HERE.md
          pwsh -NoProfile -File scripts/verify_repo.ps1

          git config user.name 'MIMIR Admission Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "${expected[@]}"
          git commit -m 'Admit corrected R3.18P and open R3.18Q'
          SHA="$(git rev-parse HEAD)"
          TREE="$(git rev-parse HEAD^{tree})"
          CONTRACT_SHA="$(sha256sum docs/continuity/MIMIR_R3_18P_ADMITTED_HEADER_CONTEXTS.json | awk '{print $1}')"
          test "$(git rev-parse HEAD^)" = "$BASE_MAIN"
          test "$(git diff --name-only "$BASE_MAIN" HEAD | sort)" = "$(printf '%s\n' "${want[@]}")"
          git diff --exit-code "$BASE_MAIN" HEAD -- crates Cargo.toml Cargo.lock external_fixtures test_corpus scripts .github/workflows
          pwsh -NoProfile -File scripts/verify_repo.ps1

          if git ls-remote --exit-code --heads origin "$ADMISSION_BRANCH" >/dev/null 2>&1; then
            echo "admission branch already exists" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$ADMISSION_BRANCH"
          test "$(git ls-remote origin "refs/heads/$ADMISSION_BRANCH" | awk '{print $1}')" = "$SHA"

          mkdir -p "$OPS/r3_18p_authority"
          cp docs/continuity/MIMIR_R3_18P_ADMITTED_HEADER_CONTEXTS.json "$OPS/r3_18p_authority/"
          printf 'R3_18P_OUTCOME=A\nR3_18P_CLEAN_SHA=%s\nR3_18P_CLEAN_TREE=%s\nR3_18P_PARENT=%s\nR3_18P_CONTRACT_SHA256=%s\nR3_18P_SCOPE=10_DOCS_ONLY\nR3_18P_CONTEXTS=18\nR3_18P_ROWS=47\nR3_18P_WITNESS_RESELECTION=0\nR3_18P_PAYLOAD_BITS_CONSUMED=0\nR3_18P_ANOTHER_CONTROL_BITS_CONSUMED=0\n' \
            "$SHA" "$TREE" "$BASE_MAIN" "$CONTRACT_SHA" > "$OPS/r3_18p_authority/receipt.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: r318p-corrected-contract-authority
          path: r3_18p_authority/
          if-no-files-found: error
          retention-days: 30
