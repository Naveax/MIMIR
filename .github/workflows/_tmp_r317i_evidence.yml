name: R3.17I K3 Wire Evidence

on:
  push:
    branches:
      - evidence/r317i-k3-wire-evidence

permissions:
  contents: read

jobs:
  evidence:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify frozen production and replay identities
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='4df00aa76a99b85a122210c4f929523f72fe9ef4'
          PROD_SHA='9bfa837c69c4751f70ca63a17c65f0f89877ff32'
          PROD_BLOB='7288238cfb5338653552435be6af41f0dd7a4e85'
          PATHS_SHA='2ecbeea804f193796a539baee1e968719f03c0cd706efff0c22a61e6ef943dae'
          IDENTITY_SHA='b02488b13cd6374219bbb89f884b03f8356f3744f930e39b2279df34859015cf'

          test "$(git rev-parse HEAD:crates/mimir-replay/src/lib.rs)" = "$PROD_BLOB"
          git cat-file -e "${PROD_SHA}^{commit}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --exit-code "$BASE_SHA"..HEAD -- crates/mimir-replay/src/lib.rs crates/mimir-replay/Cargo.toml Cargo.toml Cargo.lock external_fixtures test_corpus

          ACTUAL_PATHS_SHA="$(git show HEAD:tools/_tmp_r317i_paths.txt | sha256sum | awk '{print $1}')"
          ACTUAL_IDENTITY_SHA="$(git show HEAD:tools/_tmp_r317i_identity.tsv | sha256sum | awk '{print $1}')"
          echo "R3_17I_PATHS_SHA=$ACTUAL_PATHS_SHA"
          echo "R3_17I_IDENTITY_SHA=$ACTUAL_IDENTITY_SHA"
          test "$ACTUAL_PATHS_SHA" = "$PATHS_SHA"
          test "$ACTUAL_IDENTITY_SHA" = "$IDENTITY_SHA"

          python - <<'PY'
          import hashlib
          from pathlib import Path
          paths = [x.strip().replace('\\','/') for x in Path('tools/_tmp_r317i_paths.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          if len(paths) != 47 or len(set(paths)) != 47:
              raise SystemExit(f'expected 47 unique replay paths, got {len(paths)}')
          ids = {}
          for line in Path('tools/_tmp_r317i_identity.tsv').read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              fields = line.split('\t')
              if len(fields) != 3 or fields[2] != 'PASS':
                  raise SystemExit(f'bad identity row: {line!r}')
              ids[fields[0].replace('\\','/')] = fields[1].lower()
          if set(paths) != set(ids):
              raise SystemExit('selector/identity set mismatch')
          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b''):
                      h.update(chunk)
              return h.hexdigest()
          for rel in paths:
              path = Path(rel)
              if not path.is_file():
                  raise SystemExit(f'missing replay: {rel}')
              actual = sha256(path)
              if actual != ids[rel]:
                  raise SystemExit(f'SHA mismatch for {rel}: {actual} != {ids[rel]}')
          Path('r3_17i_replay_identity.tsv').write_text(
              ''.join(f'{rel}\t{ids[rel]}\tPASS\n' for rel in paths),
              encoding='utf-8', newline='\n'
          )
          print('R3_17I_SELECTOR_IDENTITY=PASS rows=47')
          PY

          printf 'base_sha=%s\nproduction_sha=%s\nproduction_source_blob=%s\nproduction_mutation_count=0\ncargo_mutation_count=0\ncorpus_mutation_count=0\n' "$BASE_SHA" "$PROD_SHA" "$PROD_BLOB" > r3_17i_source_scope.txt
          git diff --name-only "$BASE_SHA"..HEAD | sort >> r3_17i_source_scope.txt

      - name: Build pinned Boxcars K3 oracle
        shell: bash
        run: |
          set -euo pipefail
          BOXCARS_SHA='c70e77df7af81b436cb545d070bb90c82f562d0b'
          FRAME_BLOB='6f2ff153d3a27cdacccc65e3f23851489077a7d8'
          ATTR_BLOB='5e2d5bc1cd8187af30c3ea95193ad987645cb76e'
          MODELS_BLOB='73c73991379aeb79dcee49ea31c417141ba3c1a6'
          BITS_BLOB='d3ca061580e5e78038b2af383ff53971001c91c9'
          BOXCARS="$PWD/.tmp/boxcars-r317i"
          rm -rf "$BOXCARS"
          mkdir -p .tmp
          git clone --quiet https://github.com/nickbabcock/boxcars.git "$BOXCARS"
          git -C "$BOXCARS" checkout --quiet --detach "$BOXCARS_SHA"
          test "$(git -C "$BOXCARS" rev-parse HEAD)" = "$BOXCARS_SHA"
          test "$(git -C "$BOXCARS" hash-object src/network/frame_decoder.rs)" = "$FRAME_BLOB"
          test "$(git -C "$BOXCARS" hash-object src/network/attributes.rs)" = "$ATTR_BLOB"
          test "$(git -C "$BOXCARS" hash-object src/network/models.rs)" = "$MODELS_BLOB"
          test "$(git -C "$BOXCARS" hash-object src/bits.rs)" = "$BITS_BLOB"

          python tools/_tmp_r317i_patch.py "$BOXCARS"
          git -C "$BOXCARS" add -N examples/r3_17i_probe.rs
          git -C "$BOXCARS" diff --check
          git -C "$BOXCARS" diff --binary -- src/network/frame_decoder.rs examples/r3_17i_probe.rs Cargo.toml > r3_17i_boxcars_instrumentation.patch
          sha256sum r3_17i_boxcars_instrumentation.patch > r3_17i_boxcars_instrumentation_sha256.txt
          sha256sum tools/_tmp_r317i_patch.py tools/_tmp_r317i_analyze.py tools/_tmp_r317i_paths.txt tools/_tmp_r317i_identity.tsv > r3_17i_driver_sha256.txt

          cargo check --manifest-path "$BOXCARS/Cargo.toml" --example r3_17i_probe
          cargo test --manifest-path "$BOXCARS/Cargo.toml" --lib --quiet
          cargo build --manifest-path "$BOXCARS/Cargo.toml" --example r3_17i_probe --quiet
          echo "R3_17I_BOXCARS_BUILD=PASS"

      - name: Scan exact 47 replay lane
        shell: bash
        run: |
          set -euo pipefail
          BOXCARS="$PWD/.tmp/boxcars-r317i"
          EXE=''
          case "${OSTYPE:-}" in msys*|cygwin*) EXE='.exe' ;; esac
          PROBE="$BOXCARS/target/debug/examples/r3_17i_probe$EXE"
          test -x "$PROBE"
          : > r3_17i_boxcars.log
          while IFS= read -r rel; do
            test -n "$rel"
            MIMIR_R3_17I_LABEL="$rel" "$PROBE" "$PWD/$rel" >> r3_17i_boxcars.log 2>&1
          done < tools/_tmp_r317i_paths.txt
          test "$(grep -c '^R3_17I_ORACLE_PARSE=PASS$' r3_17i_boxcars.log)" -eq 47
          test "$(grep -c '^R3_17I_REPLAY_DONE' r3_17i_boxcars.log)" -eq 47
          sha256sum r3_17i_boxcars.log > r3_17i_boxcars_log_sha256.txt
          echo "R3_17I_47_REPLAY_SCAN=PASS"

      - name: Analyze K3 wire evidence
        shell: bash
        run: |
          set -euo pipefail
          python tools/_tmp_r317i_analyze.py r3_17i_boxcars.log
          grep -Eq '^R3_17I_OUTCOME=(A|B)$' r3_17i_aggregate.txt
          grep -Fx 'R3_17I_EVIDENCE=PASS' r3_17i_aggregate.txt
          echo 'R3_17I_ANALYSIS=PASS'

      - name: Final no-mutation gate and evidence hashes
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='4df00aa76a99b85a122210c4f929523f72fe9ef4'
          PROD_BLOB='7288238cfb5338653552435be6af41f0dd7a4e85'
          test "$(git rev-parse HEAD:crates/mimir-replay/src/lib.rs)" = "$PROD_BLOB"
          git diff --exit-code "$BASE_SHA"..HEAD -- crates/mimir-replay/src/lib.rs crates/mimir-replay/Cargo.toml Cargo.toml Cargo.lock external_fixtures test_corpus
          test "$(wc -l < r3_17i_replay_identity.tsv | tr -d ' ')" -eq 47
          python - <<'PY'
          from pathlib import Path
          groups = sum(1 for _ in Path('r3_17i_k3_groups.jsonl').open(encoding='utf-8'))
          witnesses = sum(1 for _ in Path('r3_17i_k3_witnesses.jsonl').open(encoding='utf-8'))
          if groups <= 0 or groups > 5000:
              raise SystemExit(f'unexpected group safety bound: {groups}')
          if witnesses < groups or witnesses > groups * 4:
              raise SystemExit(f'unexpected witness/group relation: witnesses={witnesses} groups={groups}')
          print(f'R3_17I_GROUP_BOUND=PASS rows={groups}')
          print(f'R3_17I_WITNESS_RELATION=PASS rows={witnesses} groups={groups}')
          PY
          sha256sum \
            r3_17i_source_scope.txt \
            r3_17i_replay_identity.tsv \
            r3_17i_boxcars_instrumentation.patch \
            r3_17i_boxcars_instrumentation_sha256.txt \
            r3_17i_driver_sha256.txt \
            r3_17i_boxcars_log_sha256.txt \
            r3_17i_k3_groups.jsonl \
            r3_17i_k3_witnesses.jsonl \
            r3_17i_summary.json \
            r3_17i_aggregate.txt > r3_17i_receipt_sha256.txt
          cat r3_17i_aggregate.txt
          echo 'R3_17I_RECEIPT=PASS'

      - name: Upload R3.17I evidence
        id: evidence_upload
        uses: actions/upload-artifact@v4
        with:
          name: r317i-k3-wire-evidence
          path: |
            r3_17i_source_scope.txt
            r3_17i_replay_identity.tsv
            r3_17i_boxcars_instrumentation.patch
            r3_17i_boxcars_instrumentation_sha256.txt
            r3_17i_driver_sha256.txt
            r3_17i_boxcars_log_sha256.txt
            r3_17i_k3_groups.jsonl
            r3_17i_k3_witnesses.jsonl
            r3_17i_summary.json
            r3_17i_aggregate.txt
            r3_17i_receipt_sha256.txt
          if-no-files-found: error
          retention-days: 1

      - name: Emit immutable bounded R3.17I receipt stream
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.evidence_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence_upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          GROUP_ROWS="$(wc -l < r3_17i_k3_groups.jsonl | tr -d ' ')"
          WITNESS_ROWS="$(wc -l < r3_17i_k3_witnesses.jsonl | tr -d ' ')"
          printf 'R3_17I_AUTHORITY_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'R3_17I_AUTHORITY_RUN=%s\n' "$GITHUB_RUN_ID"
          printf 'R3_17I_ARTIFACT_ID=%s\n' "$ARTIFACT_ID"
          printf 'R3_17I_ARTIFACT_DIGEST=%s\n' "$ARTIFACT_DIGEST"
          printf 'R3_17I_REPLAY_IDENTITY_ROWS=47\n'
          printf 'R3_17I_GROUP_ROWS=%s\n' "$GROUP_ROWS"
          printf 'R3_17I_WITNESS_ROWS=%s\n' "$WITNESS_ROWS"
          emit_file() {
            printf 'R3_17I_FILE_BEGIN\t%s\n' "$1"
            cat "$1"
            printf 'R3_17I_FILE_END\t%s\n' "$1"
          }
          for file in \
            r3_17i_source_scope.txt \
            r3_17i_replay_identity.tsv \
            r3_17i_boxcars_instrumentation_sha256.txt \
            r3_17i_driver_sha256.txt \
            r3_17i_boxcars_log_sha256.txt \
            r3_17i_summary.json \
            r3_17i_aggregate.txt \
            r3_17i_receipt_sha256.txt; do
            emit_file "$file"
          done
          printf 'R3_17I_RECEIPT_STREAM=PASS\n'
