name: R3.18AX Continuity Admission Builder v2

on:
  push:
    branches:
      - builder/r318ax-admission-v1
    paths:
      - .github/workflows/_tmp_r318ax_admission_builder_v2.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: r318ax-continuity-admission-builder-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN_SHA: 7741e132df86877cc26cf451f296fd7b7e9cdf30
      MAIN_TREE: 38c66911494625a5ec02f4633424c5a8068a8182
      V1_BLOB: 10d7d0d6e9f74cf63b9d8b9af12c82fc9ad5557f
      EVIDENCE_HEAD: 465a3f2fc71e5eed6f00c16a04738031bef8d82c
      EVIDENCE_TREE: b164a8566c6ac57ddee1aed0a7edbf9f44250488
      EVIDENCE_RUN: '33068572230'
      EVIDENCE_JOB: '98504703417'
      SAME_HEAD_CI: '33068572200'
      SAME_HEAD_CI_JOB: '98504703614'
      ARTIFACT_ID: '9644869549'
      ARTIFACT_NAME: r318ax-next-property-control-evidence
      ARTIFACT_SIZE: '18070'
      ARTIFACT_DIGEST: sha256:32f8b8056791280805da023e18ba73931f7caf4e2cf9e816411d4a0094bf97d9
      CANDIDATE_BRANCH: candidate/r318ax-admission-v1

    steps:
      - name: Checkout builder source
        uses: actions/checkout@v6
        with:
          fetch-depth: 4

      - name: Freeze source and canonical authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/_tmp_r318ax_admission_builder.yml)" = "$V1_BLOB"
          cp .github/workflows/_tmp_r318ax_admission_builder.yml "$RUNNER_TEMP/r318ax-builder-v1.yml"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$MAIN_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$MAIN_SHA" --jq .tree.sha)" = "$MAIN_TREE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$EVIDENCE_HEAD" --jq .tree.sha)" = "$EVIDENCE_TREE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$EVIDENCE_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$EVIDENCE_JOB" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$SAME_HEAD_CI" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$SAME_HEAD_CI_JOB" --jq .conclusion)" = success
          art="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ARTIFACT_ID")"
          test "$(jq -r .name <<<"$art")" = "$ARTIFACT_NAME"
          test "$(jq -r .size_in_bytes <<<"$art")" = "$ARTIFACT_SIZE"
          test "$(jq -r .digest <<<"$art")" = "$ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.id <<<"$art")" = "$EVIDENCE_RUN"
          test "$(jq -r .workflow_run.head_sha <<<"$art")" = "$EVIDENCE_HEAD"
          if gh api "repos/${GITHUB_REPOSITORY}/branches/${CANDIDATE_BRANCH}" >/dev/null 2>&1; then
            echo 'candidate already exists; refusing duplicate' >&2
            exit 1
          fi
          git checkout --detach "$MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"

      - name: Reuse v1 builder with normalized EOF
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/r318ax-builder-v1.yml" "$RUNNER_TEMP/r318ax-build.py" <<'PY'
          from pathlib import Path
          import sys
          src = Path(sys.argv[1]).read_text(encoding='utf-8')
          begin = "          python3 <<'PY'\n"
          end = "\n          PY\n\n          git diff --check"
          start = src.index(begin) + len(begin)
          stop = src.index(end, start)
          out = []
          for line in src[start:stop].splitlines():
              if line == '':
                  out.append('')
              elif line.startswith('          '):
                  out.append(line[10:])
              else:
                  raise SystemExit(f'unexpected v1 builder indentation: {line!r}')
          Path(sys.argv[2]).write_text('\n'.join(out) + '\n', encoding='utf-8', newline='\n')
          print(f'R3_18AX_V1_BUILDER_EXTRACT=PASS lines={len(out)}')
          PY
          python3 "$RUNNER_TEMP/r318ax-build.py"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MIMIR_KNOWLEDGE_GRAPH.md')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8', newline='\n')
          PY
          git diff --check
          mapfile -t actual < <({ git diff --name-only "$MAIN_SHA"; git ls-files --others --exclude-standard; } | sort -u)
          mapfile -t expected < <(printf '%s\n' \
            MIMIR_CONTINUE_HERE.md \
            MIMIR_KNOWLEDGE_GRAPH.md \
            docs/continuity/MIMIR_BOUNDARY_LOCKS.md \
            docs/continuity/MIMIR_CONTINUITY_STATE.json \
            docs/continuity/MIMIR_CURRENT_STATE.md \
            docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md \
            docs/continuity/MIMIR_PROGRESS_LEDGER.md \
            docs/continuity/MIMIR_R3_18AX_DECISION.md \
            docs/continuity/MIMIR_R3_18AY_EXECUTION_SPEC.md | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          git diff --exit-code "$MAIN_SHA" -- crates Cargo.toml Cargo.lock external_fixtures test_corpus scripts MIMIR_ALL_SOURCES_SUPERBOOK.md
          python3 -m json.tool docs/continuity/MIMIR_CONTINUITY_STATE.json >/dev/null
          pwsh -NoProfile -File scripts/verify_mimir_knowledge_archive.ps1
          grep -Fx '  R3.18AY — bounded post-AU one-following-payload production' MIMIR_CONTINUE_HERE.md
          grep -F 'R3.18AY bounded post-AU one-following-payload production / ACTIVE' MIMIR_KNOWLEDGE_GRAPH.md
          grep -Fx '**Outcome:** **A — ADMITTED / READ-ONLY ONE-BIT EVIDENCE**' docs/continuity/MIMIR_R3_18AX_DECISION.md
          grep -Fx '**Status:** ACTIVE' docs/continuity/MIMIR_R3_18AY_EXECUTION_SPEC.md

      - name: Create clean candidate from canonical parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$MAIN_SHA"
          git config user.name Naveax
          git config user.email 79841922+Naveax@users.noreply.github.com
          git switch -c "$CANDIDATE_BRANCH"
          git add MIMIR_CONTINUE_HERE.md MIMIR_KNOWLEDGE_GRAPH.md \
            docs/continuity/MIMIR_BOUNDARY_LOCKS.md \
            docs/continuity/MIMIR_CONTINUITY_STATE.json \
            docs/continuity/MIMIR_CURRENT_STATE.md \
            docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md \
            docs/continuity/MIMIR_PROGRESS_LEDGER.md \
            docs/continuity/MIMIR_R3_18AX_DECISION.md \
            docs/continuity/MIMIR_R3_18AY_EXECUTION_SPEC.md
          git commit -m 'Admit R3.18AX and open R3.18AY'
          test "$(git rev-parse HEAD^1)" = "$MAIN_SHA"
          test "$(git diff --name-only "$MAIN_SHA" HEAD | wc -l)" -eq 9
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo "R3_18AX_ADMISSION_CANDIDATE=$(git rev-parse HEAD)"
          echo "R3_18AX_ADMISSION_TREE=$(git rev-parse HEAD^{tree})"
