name: R3.18AU Staging Recovery Builder

on:
  push:
    branches:
      - automation/r318au-builder-v1

concurrency:
  group: r318au-staging-recovery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v6
        with:
          ref: automation/r318au-builder-v1
          fetch-depth: 0

      - name: Install exact Rust 1.85 toolchain
        shell: bash
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt

      - name: Recover and execute AU materializer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/r318au-builder-source.txt').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in source:
              raise SystemExit('materializer start marker not found')
          payload = source.split(start_marker, 1)[1]
          if end_marker not in payload:
              raise SystemExit('materializer end marker not found')
          payload = payload.split(end_marker, 1)[0]
          recovered = []
          for line in payload.splitlines():
              recovered.append(line[10:] if line.startswith('          ') else line)
          code = '\n'.join(recovered) + '\n'
          compile(code, 'r318au_materializer.py', 'exec')
          exec(compile(code, 'r318au_materializer.py', 'exec'), {'__name__': '__main__'})

          test_path = Path('crates/mimir-replay/tests/r3_18au_post_aq_following_header.rs')
          test_source = test_path.read_text(encoding='utf-8')
          duplicate = '    ReplayNetworkAttributeTagV1,\n'
          if test_source.count(duplicate) != 1:
              raise SystemExit('expected exactly one duplicate ReplayNetworkAttributeTagV1 import')
          test_path.write_text(test_source.replace(duplicate, '', 1), encoding='utf-8', newline='\n')
          PY

      - name: Rust 1.85 formatting
        shell: bash
        run: cargo +1.85.0 fmt --all

      - name: Focused R3.18AU validation
        shell: bash
        run: cargo +1.85.0 test -p mimir-replay --test r3_18au_post_aq_following_header -- --nocapture

      - name: Direct AQ AN AK regressions
        shell: bash
        run: |
          cargo +1.85.0 test -p mimir-replay --test r3_18aq_post_an_payload_control -- --nocapture
          cargo +1.85.0 test -p mimir-replay --test r3_18an_post_ak_payload -- --nocapture
          cargo +1.85.0 test -p mimir-replay --test r3_18ak_post_ag_following_header -- --nocapture

      - name: Clean production scope guard
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'crates/mimir-replay/src/lib.rs\ncrates/mimir-replay/tests/r3_18au_post_aq_following_header.rs'
          if [ "$changed" != "$expected" ]; then
            printf 'Unexpected production paths before helper cleanup:\n%s\n' "$changed"
            exit 1
          fi
          git rm .github/workflows/r318au-builder.yml .github/r318au-builder-source.txt
          git add crates/mimir-replay/src/lib.rs crates/mimir-replay/tests/r3_18au_post_aq_following_header.rs
          git diff --cached --check

      - name: Commit clean staging result
        shell: bash
        run: |
          git config user.name 'MIMIR AU Builder'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Stage R3.18AU bounded post-AQ following header'
          git push origin HEAD:automation/r318au-builder-v1
