name: R3.18Z Published Main Run Discovery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  discover:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ops/r318z-published-run-discovery-v2
      - name: Discover published-main runs
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ac24d29edeacd04152afe318e25ae296385159c3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?branch=main&head_sha=$env:PUBLISHED_SHA&event=push&per_page=20" `
            --jq '{published_sha: env.PUBLISHED_SHA, workflow_runs: [.workflow_runs[] | {id,name,status,conclusion,head_sha,event,path,created_at,updated_at}]}' `
            | Set-Content -Encoding utf8 r318z_published_runs.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content r318z_published_runs.json
      - name: Upload published-main receipt
        uses: actions/upload-artifact@v4
        with:
          name: r318z-published-main-runs
          path: r318z_published_runs.json
          if-no-files-found: error
          retention-days: 3
