name: R3.18BV Published BU Differential Evidence

on:
  push:
    branches: [evidence/r318bv-published-bu-v1]

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: r318bv-published-bu-v1
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: 58d7e0ac79e4e098215c06e0bc1d365cd5720d61
      BASE_TREE: 2c7768c9dcac5d96781e8c6d583d75b66bda66b1
      PROD_SHA: 43c5d6248e2ea606b2eb0fd95f5c50758c372356
      PROD_TREE: d1b7b40ed4e361d9c047e0494fb821688ef7d7b4
      PROD_PARENT: 9a86252e02d383ebc2ff9665e678f4c2319f47d9
      LIB_BLOB: 1c4db09cff43e0ab56f5efb5e8078da3a1189937
      BU_TEST_BLOB: e6170f90b47e3f04bd798edbc61f2fa59e5213dd
      BU_SPEC_BLOB: ac1ce2120320bd552e5be24e2309fea23d5a2a50
      BV_SPEC_BLOB: f6d37f928e7171ac1d100447d1f4775b948abb2a
      BR_DECISION_BLOB: 818eacadf4ba47254df11ca394cbc53dc58453f8
      BR_HEAD: ff1daab35e2e75bf7446a98a07a1db67e5196dbd
      BR_ARTIFACT: '10267123608'
      BR_DIGEST: sha256:bf9a7c52296cea0f4d8fe6a4f64d26e8c232ea26bd0589be49ba6afa589c28d1
      BU_BUILDER_RUN: '34823631010'
      BU_BUILDER_JOB: '103910607381'
      BU_PR_CI_RUN: '34826521464'
      BU_PR_CI_JOB: '103919838545'
      BU_MAIN_CI_RUN: '34827065398'
      BU_MAIN_CI_JOB: '103921549254'

    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mark evidence pending
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context='r318bv/evidence' \
            -f description='R3.18BV published-BU differential running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Freeze canonical authorities and source scope
        shell: bash
        run: |
          set -euo pipefail
          eq() { [ "$1" = "$2" ] || { echo "authority mismatch: got=$1 expected=$2" >&2; exit 1; }; }
          eq "$(git rev-parse HEAD^)" "$BASE_SHA"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" "$BASE_SHA"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$BASE_SHA" --jq .tree.sha)" "$BASE_TREE"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$PROD_SHA" --jq .tree.sha)" "$PROD_TREE"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/commits/$PROD_SHA" --jq .parents[0].sha)" "$PROD_PARENT"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/contents/crates/mimir-replay/src/lib.rs?ref=$BASE_SHA" --jq .sha)" "$LIB_BLOB"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/contents/crates/mimir-replay/tests/r3_18bu_post_bs_following_control.rs?ref=$BASE_SHA" --jq .sha)" "$BU_TEST_BLOB"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/continuity/MIMIR_R3_18BU_EXECUTION_SPEC.md?ref=$BASE_SHA" --jq .sha)" "$BU_SPEC_BLOB"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/continuity/MIMIR_R3_18BV_EXECUTION_SPEC.md?ref=$BASE_SHA" --jq .sha)" "$BV_SPEC_BLOB"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/continuity/MIMIR_R3_18BR_DECISION.md?ref=$BASE_SHA" --jq .sha)" "$BR_DECISION_BLOB"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$BU_PR_CI_RUN" --jq .head_sha)" "$PROD_SHA"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$BU_PR_CI_RUN" --jq .conclusion)" success
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$BU_PR_CI_JOB" --jq .conclusion)" success
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$BU_MAIN_CI_RUN" --jq .head_sha)" "$PROD_SHA"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$BU_MAIN_CI_RUN" --jq .head_branch)" main
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$BU_MAIN_CI_RUN" --jq .conclusion)" success
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$BU_MAIN_CI_JOB" --jq .conclusion)" success
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$BU_BUILDER_RUN" --jq .conclusion)" success
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$BU_BUILDER_JOB" --jq .conclusion)" success
          br_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$BR_ARTIFACT")"
          eq "$(jq -r .workflow_run.head_sha <<<"$br_meta")" "$BR_HEAD"
          eq "$(jq -r .digest <<<"$br_meta")" "$BR_DIGEST"
          eq "$(jq -r .expired <<<"$br_meta")" false

          OUT="$RUNNER_TEMP/r318bv-out"
          mkdir -p "$OUT"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          expected=(
            '.github/workflows/_tmp_r318bv_evidence.yml'
            'crates/mimir-replay/tests/_tmp_r318bv_published_bu_differential.rs'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq 2
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"
          {
            echo R3_18BV_SOURCE_SCOPE=PASS
            echo BASE_SHA=$BASE_SHA
            echo PROD_SHA=$PROD_SHA
            echo LIB_BLOB=$LIB_BLOB
            echo BU_TEST_BLOB=$BU_TEST_BLOB
            echo BV_SPEC_BLOB=$BV_SPEC_BLOB
            printf 'TEMP_DIFF=%s\n' "${changed[*]}"
            echo PRODUCTION_MUTATION=0
          } | tee "$OUT/r3_18bv_source_scope.txt"

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '

      - name: Execute independent published-BU differential
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318bv-out"
          cargo +1.85.0 test -p mimir-replay --test _tmp_r318bv_published_bu_differential r3_18bv_published_bu_exact_differential -- --nocapture \
            2>&1 | tee "$OUT/r3_18bv_test.log"
          grep '^R3_18BV_ROW' "$OUT/r3_18bv_test.log" | sort > "$OUT/r3_18bv_rows.tsv"
          test "$(wc -l < "$OUT/r3_18bv_rows.tsv")" -eq 2
          grep -F $'external_fixtures/sample_002.replay\t11239\t11240\t11240\tfalse\t11239' "$OUT/r3_18bv_rows.tsv"
          grep -F $'test_corpus/largest_100/079_1f838b01-66b5-4963-b62e-64f3d7dbd545.replay\t3238\t3239\t3239\ttrue\t3238' "$OUT/r3_18bv_rows.tsv"
          for line in \
            'R3_18BV_EXACT=2/2' \
            'R3_18BV_FALSE_TRUE=1/1' \
            'R3_18BV_BP_FALSE_EXCLUDED=1/1' \
            'R3_18BV_REPEATABILITY=2/2' \
            'R3_18BV_POST_STOP_POISON=2/2' \
            'R3_18BV_ADJACENT_CONSUMPTION=0/0/0/0'; do
            grep -Fx "$line" "$OUT/r3_18bv_test.log"
          done
          cargo +1.85.0 test -p mimir-replay --test r3_18bu_post_bs_following_control -- --nocapture \
            2>&1 | tee "$OUT/r3_18bv_bu_regression.log"
          echo R3_18BV_DIFFERENTIAL=PASS | tee "$OUT/r3_18bv_differential.txt"

      - name: Full validation
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318bv-out"
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 check --workspace --all-targets --all-features
          cargo +1.85.0 clippy --workspace --all-targets --all-features -- -D warnings
          pwsh -NoProfile -File scripts/verify_repo.ps1
          git diff --check "$BASE_SHA"...HEAD
          {
            echo R3_18BV_FMT=PASS
            echo R3_18BV_CHECK=PASS
            echo R3_18BV_CLIPPY=PASS
            echo R3_18BV_REPO_VERIFY=PASS
            echo R3_18BV_DIFF_CHECK=PASS
          } | tee "$OUT/r3_18bv_validation.txt"

      - name: Reuse unique same-head natural CI and seal artifact inputs
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318bv-out"
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml" --jq .id)"
          run_id=''
          for attempt in $(seq 1 120); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100")"
            count="$(jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .event == "push")] | length' <<<"$runs")"
            [ "$count" -gt 1 ] && { echo "duplicate same-head CI runs: $count" >&2; exit 1; }
            if [ "$count" -eq 1 ]; then run_id="$(jq -r '.workflow_runs[0].id' <<<"$runs")"; break; fi
            sleep 5
          done
          test -n "$run_id"
          for attempt in $(seq 1 240); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
            [ "$state" = completed ] && break
            sleep 5
          done
          ci="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          test "$(jq -r .status <<<"$ci")" = completed
          test "$(jq -r .conclusion <<<"$ci")" = success
          test "$(jq -r .head_sha <<<"$ci")" = "$GITHUB_SHA"
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          test "$(jq '.total_count' <<<"$jobs")" -eq 1
          job_id="$(jq -r '.jobs[0].id' <<<"$jobs")"
          test "$(jq -r '.jobs[0].conclusion' <<<"$jobs")" = success
          {
            echo R3_18BV_SAME_HEAD_CI=PASS
            echo CI_RUN_ID=$run_id
            echo CI_JOB_ID=$job_id
            echo CI_RUN_COUNT=1
            echo CI_HEAD_SHA=$GITHUB_SHA
          } | tee "$OUT/r3_18bv_same_head_ci_receipt.txt"
          {
            echo R3_18BV_UPSTREAM_RECEIPTS=PASS
            echo BU_BUILDER=$BU_BUILDER_RUN/$BU_BUILDER_JOB
            echo BU_PR_CI=$BU_PR_CI_RUN/$BU_PR_CI_JOB
            echo BU_MAIN_CI=$BU_MAIN_CI_RUN/$BU_MAIN_CI_JOB
            echo BR_HEAD=$BR_HEAD
            echo BR_ARTIFACT=$BR_ARTIFACT
            echo BR_DIGEST=$BR_DIGEST
          } | tee "$OUT/r3_18bv_upstream_receipts.txt"
          {
            echo R3_18BV_OUTCOME=A
            echo R3_18BV_EVIDENCE=PASS
            echo R3_18BV_EXACT=2/2
            echo R3_18BV_BS_PREREQUISITE=2/2
            echo R3_18BV_FALSE_TRUE=1/1
            echo R3_18BV_MISMATCH=0
            echo R3_18BV_WITNESS_RESELECTION=0
            echo R3_18BV_BP_FALSE_EXCLUDED=1/1
            echo R3_18BV_REPEATABILITY=2/2
            echo R3_18BV_POST_STOP_POISON=2/2
            echo R3_18BV_FOLLOWING_STREAM_HEADER_PAYLOAD_SECOND_CONTROL=0/0/0/0
            echo R3_18BV_PRODUCTION_CARGO_FIXTURE_CORPUS_SUPPORT_MUTATION=0/0/0/0/0
            echo R3_18BV_PRIVACY_SCAN=PASS
          } | tee "$OUT/r3_18bv_aggregate.txt"
          rm -f "$OUT/r3_18bv_test.log" "$OUT/r3_18bv_bu_regression.log"
          (cd "$OUT" && sha256sum \
            r3_18bv_source_scope.txt \
            r3_18bv_rows.tsv \
            r3_18bv_differential.txt \
            r3_18bv_validation.txt \
            r3_18bv_same_head_ci_receipt.txt \
            r3_18bv_upstream_receipts.txt \
            r3_18bv_aggregate.txt \
            > r3_18bv_artifact_sha256.txt)
          (cd "$OUT" && sha256sum -c r3_18bv_artifact_sha256.txt)

      - name: Upload immutable R3.18BV evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: r318bv-published-bu-differential-evidence
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/r318bv-out/

      - name: Verify immutable receipt and mark success
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318bv-out"
          test -n "$ARTIFACT_ID"; test -n "$ARTIFACT_DIGEST"
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          test "$(jq -r '.workflow_run.id' <<<"$meta")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$meta")" = "$GITHUB_SHA"
          test "$(jq -r .expired <<<"$meta")" = false
          norm() { printf '%s' "${1#sha256:}" | tr '[:upper:]' '[:lower:]'; }
          test "$(norm "$(jq -r .digest <<<"$meta")")" = "$(norm "$ARTIFACT_DIGEST")"
          grep -Fx 'R3_18BV_OUTCOME=A' "$OUT/r3_18bv_aggregate.txt"
          grep -Fx 'R3_18BV_EVIDENCE=PASS' "$OUT/r3_18bv_aggregate.txt"
          grep -Fx 'R3_18BV_SAME_HEAD_CI=PASS' "$OUT/r3_18bv_same_head_ci_receipt.txt"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context='r318bv/evidence' \
            -f description='R3.18BV Outcome A evidence verified' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo R3_18BV_IMMUTABLE_RECEIPT=PASS
