      - name: Validate exact continuity surface
        shell: bash
        run: |
          python3 -m json.tool docs/continuity/MIMIR_CONTINUITY_STATE.json >/dev/null
          test -f docs/continuity/MIMIR_R3_18BG_DECISION.md
          test -f docs/continuity/MIMIR_R3_18BH_EXECUTION_SPEC.md
          grep -q 'CURRENT_PASS:' MIMIR_CONTINUE_HERE.md
          grep -q 'R3.18BH' MIMIR_CONTINUE_HERE.md
          grep -q 'R3.18BH' docs/continuity/MIMIR_CURRENT_STATE.md
          grep -q 'R3.18BH' docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md
          git rm .github/workflows/r318bg-admission-r318bh.yml
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/r318bg-admission-r318bh.yml \
            MIMIR_CONTINUE_HERE.md \
            MIMIR_KNOWLEDGE_GRAPH.md \
            docs/continuity/MIMIR_BOUNDARY_LOCKS.md \
            docs/continuity/MIMIR_CONTINUITY_STATE.json \
            docs/continuity/MIMIR_CURRENT_STATE.md \
            docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md \
            docs/continuity/MIMIR_PROGRESS_LEDGER.md \
            docs/continuity/MIMIR_R3_18BG_DECISION.md \
            docs/continuity/MIMIR_R3_18BH_EXECUTION_SPEC.md | sort)"
          test "$actual" = "$expected" || { echo 'Unexpected diff surface'; diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual"); exit 1; }
          test -z "$(git diff --name-only -- '*.rs' 'Cargo.toml' 'Cargo.lock')"
