name: R3.18BG Admission and R3.18BH Open

on:
  push:
    branches:
      - continuity/r318bg-admit-r318bh

permissions:
  contents: write

group: r318bg-admission-r318bh

jobs:
  continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: continuity/r318bg-admit-r318bh
          fetch-depth: 0
      - name: Patch canonical continuity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          ROOT = Path('.')
          BG_HEAD = '02e1799001b670db24f1e0076f2afd6c05f5afdf'
          BG_RUN = '34112731371'
          BG_JOB = '101715102551'
          BG_CI_RUN = '34112731358'
          BG_CI_JOB = '101712578621'
          BG_ARTIFACT = '10015405999'
          BG_DIGEST = 'sha256:a43a528a49fa6d07ef1c92266c6dc9ed4ef2a3e87e7f69f65f2f40d39f3fa15a'
          BG_MANIFEST = 'sha256:b06097e08cc276e80e17543f36a3ab05ac184b335ec12ded0fd460e2129d5e46'
          ORACLE = 'c70e77df7af81b436cb545d070bb90c82f562d0b'

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8', newline='\n')

          def sub_once(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {n}')
              return out

          # Master continuity handbook: only the canonical current-state fields and immediate hard-stop summary widen.
          p = 'MIMIR_CONTINUE_HERE.md'
          t = read(p)
          t = sub_once(t, r'(LAST_COMPLETED_READ_ONLY_AUDIT:\n\s*)R3\.18BF[^\n]*',
              r'\1R3.18BG — Outcome A / exact 3/3 BF-true payloads / Boolean=2 Float=1 / widths 1:2 + 32:1 / mismatch 0 / next-control 0 / artifact 10015405999', 'master last audit')
          t = sub_once(t, r'(LAST_COMPLETED_EVIDENCE_PASS:\n\s*)R3\.18BF[^\n]*',
              r'\1R3.18BG — one following primitive payload evidence / Outcome A / 3/3 / Boolean=2 Float=1 / native-oracle mismatch 0 / artifact 10015405999', 'master last evidence')
          t = sub_once(t, r'(CURRENT_PASS:\n\s*)R3\.18BG[^\n]*',
              r'\1R3.18BH — next property-control bit evidence after exact BG payload end', 'master current pass')
          t = sub_once(t, r'(CURRENT_PASS_TYPE:\n\s*)[^\n]*',
              r'\1read-only one-next-property-control evidence / exact BG payload-end boundary on only the three BG authority rows; no following stream/header/payload', 'master pass type')
          if 'R3.18BG CLOSED Outcome A:' not in t:
              t = sub_once(t, r'(\n  R3\.18BF CLOSED Outcome A:[^\n]*\n)',
                  r'\1  R3.18BG CLOSED Outcome A: exact 3/3 BF-true primitive payloads; Boolean=2, Float=1; widths 1:2 / 32:1; raw IEEE754 Float identity; mismatch/reselection 0/0; 37 BF-false + 7 upstream AU-false excluded; next-control bits 0; artifact 10015405999\n', 'master BG hard-stop insert')
          write(p, t)

          # Knowledge graph: close BG, open BH and extend mandatory reading order without renumber collisions.
          p = 'MIMIR_KNOWLEDGE_GRAPH.md'
          t = read(p)
          t = sub_once(t, r'R3\.18BG one following primitive payload evidence / ACTIVE',
              'R3.18BG one following primitive payload evidence / Outcome A CLOSED\nR3.18BH next property-control bit evidence after exact BG payload end / ACTIVE', 'graph active pass')
          marker = '155. `docs/continuity/MIMIR_R3_18BG_EXECUTION_SPEC.md`'
          if marker not in t:
              raise SystemExit('graph reading-order marker missing')
          head, tail = t.split(marker, 1)
          m = re.search(r'\n## ', tail)
          if not m:
              raise SystemExit('graph reading-order section end missing')
          section, rest = tail[:m.start()], tail[m.start():]
          lines = section.splitlines()
          bumped = []
          for line in lines:
              mm = re.match(r'^(\d+)\. (.*)$', line)
              if mm and int(mm.group(1)) >= 156:
                  line = f'{int(mm.group(1))+2}. {mm.group(2)}'
              bumped.append(line)
          section = '\n'.join(bumped)
          insert = marker + '\n156. `docs/continuity/MIMIR_R3_18BG_DECISION.md`\n157. `docs/continuity/MIMIR_R3_18BH_EXECUTION_SPEC.md`'
          t = head + insert + section + rest
          write(p, t)

          # Boundary locks: latest override only. Historical sections remain historical.
          p = 'docs/continuity/MIMIR_BOUNDARY_LOCKS.md'
          t = read(p)
          t = sub_once(t,
              r'# 0\. Current override — R3\.18BF differential closed / R3\.18BG payload evidence active',
              '# 0. Current override — R3.18BG payload evidence closed / R3.18BH next-control evidence active', 'locks heading')
          replacement = '''## CLOSED READ-ONLY PAYLOAD EVIDENCE — R3.18BG
- authority head `{head}` / evidence `{run}/{job}` SUCCESS; same-head CI `{cirun}/{cijob}` SUCCESS.
- authoritative artifact `{artifact}` / `{digest}`; inner manifest `{manifest}`; 17/17 files verified.
- exact 3/3 BF-true payloads; Boolean=2, Float=1; widths 1:2 and 32:1; Float identity is raw IEEE754 u32; native/oracle mismatch 0; witness reselection 0.
- all 37 BF-false rows and 7 upstream AU false terminators were excluded before payload access; next-control consumption 0.

## ACTIVE READ-ONLY NEXT-CONTROL EVIDENCE — R3.18BH
- direct row authority is the exact three-row BG Outcome-A artifact.
- start exactly at each BG `payload_end_bit` and observe exactly one next `property_present` bit.
- compare native bit/boundary with pinned Boxcars; do not assume the false/true distribution in advance.
- stop one bit later: no following stream/header/payload, no second later control, no generalized cursor.

## CLOSED
'''.format(head=BG_HEAD, run=BG_RUN, job=BG_JOB, cirun=BG_CI_RUN, cijob=BG_CI_JOB, artifact=BG_ARTIFACT, digest=BG_DIGEST, manifest=BG_MANIFEST)
          t = sub_once(t, r'## ACTIVE READ-ONLY PAYLOAD EVIDENCE — R3\.18BG\n.*?\n\n## CLOSED\n', replacement, 'locks active block', flags=re.S)
          t = t.replace('- next property-control bit after BG payload;\n', '- production composition/consumption of the R3.18BH-observed next property-control bit;\n- following stream/header/payload after the one R3.18BH control observation;\n- second later property-control bit after R3.18BH;\n', 1)
          write(p, t)

          # Machine continuity state.
          p = 'docs/continuity/MIMIR_CONTINUITY_STATE.json'
          state = json.loads(read(p))
          state['updated_date'] = '2026-09-07'
          state['last_completed_read_only_audit'] = 'R3.18BG'
          state['current_pass'] = 'R3.18BH'
          state['current_pass_kind'] = 'read-only one-next-property-control evidence on exactly the three R3.18BG Outcome-A payload-end rows'
          state['current_pass_goal'] = 'From each exact BG payload_end_bit, read exactly one next property_present bit and require native/pinned-Boxcars bit and one-bit boundary equality on all 3 authority rows; distribution is discovered, not assumed.'
          state['current_pass_stop_boundary'] = 'Stop exactly one bit after BG payload_end. No following stream/header/payload, no second later property-control bit, no generalized/repeated cursor, and no access on the 37 BF-false or 7 upstream AU-false rows.'
          state['last_completed_evidence_pass'] = 'R3.18BG'
          state['last_completed_evidence_outcome'] = 'A — exact 3/3 BF-true primitive payloads; Boolean=2 Float=1; widths 1:2 and 32:1; raw IEEE754 Float identity; native/oracle mismatch 0; witness reselection 0; 37 BF-false and 7 upstream AU-false excluded; next-control consumption 0; artifact 10015405999.'
          files = state.get('next_files_to_read', [])
          for item in ['docs/continuity/MIMIR_R3_18BG_DECISION.md', 'docs/continuity/MIMIR_R3_18BH_EXECUTION_SPEC.md']:
              if item not in files:
                  files.append(item)
          state['next_files_to_read'] = files
          closed = [x for x in state.get('closed_now', []) if x != 'next property-control bit after the one R3.18BG payload evidence boundary']
          for item in [
              'production consumption/composition of the R3.18BH-observed next property-control bit before a later production pass',
              'next stream/header/payload after the one R3.18BH control evidence boundary',
              'second later property-control bit after R3.18BH',
