## Hard stop

No production composition of the BG payload or BH control, no stream/header/payload after BH, no second later control, no generalized property cursor, and no actor/frame/lifecycle/raw-state/event/replay-slice/skill/counterfactual/runtime/export widening.
''')

          write('docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md', f'''# MIMIR — Next Chat Handoff

Canonical production remains **R3.18BE** at `1d717d3e82179edd85b197968f46b8f951a3e828` / `72cf2b907437a1ba62cc9deebd7608f7d0372f81`.

R3.18BG is **Outcome A / CLOSED** at `{BG_HEAD}`. Evidence `{BG_RUN}/{BG_JOB}` SUCCESS and same-head CI `{BG_CI_RUN}/{BG_CI_JOB}` SUCCESS. Authoritative artifact `{BG_ARTIFACT}` / `{BG_DIGEST}`; inner manifest `{BG_MANIFEST}` with 17/17 files verified. Exact BF-true payloads were 3/3: Boolean=2, Float=1; widths 1:2 / 32:1; Float raw IEEE754 identity; native/oracle mismatch 0; witness reselection 0; 37 BF-false plus 7 upstream AU-false excluded; next-control consumption 0.

