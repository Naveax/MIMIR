          # Append-only progress ledger.
          p = 'docs/continuity/MIMIR_PROGRESS_LEDGER.md'
          t = read(p)
          marker = '## 2026-09-07 — R3.18BG one following primitive payload evidence — Outcome A'
          if marker not in t:
              t = t.rstrip() + f'''\n\n{marker}\n\nBase production: `1d717d3e82179edd85b197968f46b8f951a3e828`; continuity authority before admission: `e507f3988091a8135a693e7f94ff597f7fe1aa80`. Production source unchanged.\n\nEvidence head: `{BG_HEAD}`. Evidence run/job `{BG_RUN}/{BG_JOB}` SUCCESS; same-head CI `{BG_CI_RUN}/{BG_CI_JOB}` SUCCESS. Artifact `{BG_ARTIFACT}` / `{BG_DIGEST}`; inner manifest `{BG_MANIFEST}`; 17/17 artifact files verified.\n\nProven: exact 3/3 BF-true payloads; Boolean=2 / Float=1; widths 1:2 / 32:1; Float raw IEEE754 identity; native/oracle mismatch 0; witness reselection 0; BF-false exclusions 37/37; upstream-AU-false exclusions 7/7; next-control bits consumed 0; full validation PASS; privacy PASS.\n\nOpened next: R3.18BH read-only exactly-one-next-property-control observation on only the three exact BG payload-end rows. Still closed: production payload/control composition, following stream/header/payload, second later control, generalized cursor, actor/frame/state/event/skill/runtime/export widening.\n'''
          write(p, t)

          write('docs/continuity/MIMIR_R3_18BG_DECISION.md', f'''# MIMIR R3.18BG — One Following Primitive Payload Evidence Decision

**Status:** CLOSED — Outcome A  
**Pass type:** read-only one-payload differential evidence  
**Production authority:** R3.18BE `1d717d3e82179edd85b197968f46b8f951a3e828` / `72cf2b907437a1ba62cc9deebd7608f7d0372f81`  
