name: R3.18BR Canonical Admission Updater

on:
  push:
    branches:
      - automation/r318br-admit-v1

permissions:
  contents: write

jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve updater and verify canonical parent
        shell: bash
        run: |
          set -euo pipefail
          cp .github/_tmp_r318br_admit.py /tmp/r318br_admit.py
          git fetch origin main
          test "$(git rev-parse origin/main)" = "265b780dc554715a7bc6bfb5c8e0fbe7ee279265"
          git checkout --detach 265b780dc554715a7bc6bfb5c8e0fbe7ee279265

      - name: Apply canonical transition
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/r318br_admit.py
          python3 -m json.tool docs/continuity/MIMIR_CONTINUITY_STATE.json >/dev/null
          git diff --check

      - name: Verify docs-only scope and publish admission branch
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short | sed -E 's/^.. //' | sort)"
          printf '%s\n' "$changed"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -E '^(crates|Cargo\.toml|Cargo\.lock|external_fixtures|test_corpus|tools)(/|$)'; then
            echo 'forbidden production/evidence scope mutation' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MIMIR_CONTINUE_HERE.md MIMIR_KNOWLEDGE_GRAPH.md \
            docs/continuity/MIMIR_BOUNDARY_LOCKS.md \
            docs/continuity/MIMIR_CONTINUITY_STATE.json \
            docs/continuity/MIMIR_CURRENT_STATE.md \
            docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md \
            docs/continuity/MIMIR_PROGRESS_LEDGER.md \
            docs/continuity/MIMIR_R3_18BR_DECISION.md \
            docs/continuity/MIMIR_R3_18BS_EXECUTION_SPEC.md
          git diff --cached --check
          git commit -m 'Admit R3.18BR and open R3.18BS'
          test "$(git rev-parse HEAD^)" = '265b780dc554715a7bc6bfb5c8e0fbe7ee279265'
          git push --force-with-lease origin HEAD:refs/heads/admission/r318br-v1
