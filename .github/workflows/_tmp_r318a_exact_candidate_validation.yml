name: R3.18A Exact Continuity Candidate Validation

on:
  push:
    branches:
      - validation/r318a-continuity-exact

permissions:
  contents: read

jobs:
  exact-candidate:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: f12365b43029f19f3ab1dd889e651f9781b0655e
      CANDIDATE_TREE: 3e85d806e6d1bc43be17da6b4d1518838c5dff45
      BASE_MAIN: c5878cf755302fe52e9e67741486306cd30db059
    steps:
      - name: Checkout validation trigger
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reset to exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main candidate/r3-18a-continuity-clean
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          test "$(git rev-parse origin/candidate/r3-18a-continuity-clean)" = "$CANDIDATE_SHA"
          test "$(git rev-parse "${CANDIDATE_SHA}^{tree}")" = "$CANDIDATE_TREE"
          test "$(git rev-parse "${CANDIDATE_SHA}^1")" = "$BASE_MAIN"
          git reset --hard "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "R3_18A_EXACT_CANDIDATE_HEAD=$(git rev-parse HEAD)"

      - name: Enforce exact continuity diff
        shell: pwsh
        run: |
          $expected = @(
            'MIMIR_CONTINUE_HERE.md',
            'MIMIR_KNOWLEDGE_GRAPH.md',
            'docs/continuity/MIMIR_CONTINUITY_STATE.json',
            'docs/continuity/MIMIR_CURRENT_STATE.md',
            'docs/continuity/MIMIR_R3_18A_DECISION.md',
            'docs/continuity/MIMIR_R3_18B_EXECUTION_SPEC.md'
          ) | Sort-Object
          $actual = @(git diff --name-only "$env:BASE_MAIN" "$env:CANDIDATE_SHA") | Sort-Object
          $delta = @(Compare-Object $expected $actual)
          if ($delta.Count -ne 0) {
            Write-Host 'Expected:'; $expected
            Write-Host 'Actual:'; $actual
            $delta | Format-Table
            exit 1
          }
          $forbidden = @(git diff --name-only "$env:BASE_MAIN" "$env:CANDIDATE_SHA" -- crates Cargo.toml Cargo.lock external_fixtures test_corpus tools scripts)
          if ($forbidden.Count -ne 0) { $forbidden; exit 1 }
          Write-Host 'R3_18A_EXACT_SCOPE=PASS files=6 production=0 Cargo=0 fixture=0 corpus=0 support=0'

      - name: Verify semantic anchors
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          state=json.loads(Path('docs/continuity/MIMIR_CONTINUITY_STATE.json').read_text(encoding='utf-8'))
          main=Path('MIMIR_CONTINUE_HERE.md').read_text(encoding='utf-8')
          graph=Path('MIMIR_KNOWLEDGE_GRAPH.md').read_text(encoding='utf-8')
          assert state['last_completed_evidence_pass']=='R3.18A'
          assert state['current_pass']=='R3.18B'
          assert state['r3_18a']['authority_head']=='12ee215fd843260d5ece14f27aa1171cb862f49e'
          assert state['r3_18a']['next_property_present_consumed_bits']==0
          assert state['r3_18a']['mismatch_count']==0
          assert 'CURRENT_PASS:\n  R3.18B' in main
          assert 'R3_18A_EVIDENCE_CLOSURE:' in main
          assert 'R3_18B_OPEN_BOUNDARY:' in main
          assert 'R3.18A single-property evidence decision' in graph
          assert 'R3.18B active single-property K1 composition spec' in graph
          print('R3_18A_EXACT_SEMANTICS=PASS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Knowledge Archive
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/verify_mimir_knowledge_archive.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full repository verifier
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/verify_repo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo 'R3_18A_EXACT_CANDIDATE_VALIDATION=PASS'
