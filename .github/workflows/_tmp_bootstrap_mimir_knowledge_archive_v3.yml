name: Temporary MIMIR Knowledge Archive Bootstrap V3

on:
  push:
    branches:
      - docs/chatgpt-storage-multistage-archive-v2
    paths:
      - '.github/workflows/_tmp_bootstrap_mimir_knowledge_archive_v3.yml'

permissions:
  contents: write

jobs:
  materialize-and-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/chatgpt-storage-multistage-archive-v2

      - name: Verify exact transport chunks
        shell: bash
        run: |
          set -euo pipefail
          cd .github/_tmp_mimir_knowledge_parts
          sha256sum -c <<'EOF'
          fdbc497347d488eb3e4b12ae18df6962b0824e1411ff171baeeeb1ced34c836d  part_00.b64
          d3ff54488c7d55d2ee11c6938fd80103eb36070a8d0265f898e4be295778ca0a  part_01.b64
          a22631917bd5ce21c517724345bad32be3c8b6a6c1e938fc76cc74995bf8f778  part_02.b64
          88c9b243e314d9da89ae639d6516d1a139c0717ee1f1474d094b04082e0ad098  part_03.b64
          d26d584a04d88e1cb7565c7252e6d5a3784059f63f4386840ed3feceadf22f8d  part_04.b64
          acbbd0a06d95d266eb2b1db0c41ee71637e338f62934bae5c090ab4108fe59c8  part_05.b64
          ef0e5777f4cb2159f27d19f6dd308592a9887ecd89641449457a65e95ab9fcba  part_06.b64
          e3bcf2cf5e3e125f5cacbcfdbd88a888ec4f65d0eafd93870e2381f4debe856c  part_07a.b64
          d61763919542dd1e2ed22b31fb0d872a0fdafaa615cdbc5af805163eb441626c  part_07c00.b64
          6382e6a356369e0c747a8b6046d22884b4e9187c8bd6189263bebc1c5f5974fe  part_07c01.b64
          34dbeb40e9431933b2ba70fe4e79f89b324078a1f657d1950ed4674e357a87a9  part_07c02.b64
          ae6817664f9c13e54dbce7676f4425d2c0fc2a38635afa19c7937b0ccd226913  part_07c03.b64
          5dfbbc010be4c028c3c12537ce09a6db658fec0d62648c9faf5550e7ad35fcab  part_07c04.b64
          1645aaa5acfbf53d5488a442f6dbe6d2668e40391b15cf72b2fadab47485da9e  part_07c05.b64
          ea34973d9c85ab1eb539aaddbfea9fa2675b463c89a0a61cb8e2231e6262e81c  part_07c06.b64
          9ffcf8928bceaed77bb6ff6c94a397f7a5c4396a5ae53c044efe7f35cfd961df  part_07c07.b64
          EOF

      - name: Reconstruct exact 25-file archive
        shell: bash
        run: |
          set -euo pipefail
          p=.github/_tmp_mimir_knowledge_parts
          cat \
            "$p/part_00.b64" "$p/part_01.b64" "$p/part_02.b64" "$p/part_03.b64" \
            "$p/part_04.b64" "$p/part_05.b64" "$p/part_06.b64" "$p/part_07a.b64" \
            "$p/part_07c00.b64" "$p/part_07c01.b64" "$p/part_07c02.b64" "$p/part_07c03.b64" \
            "$p/part_07c04.b64" "$p/part_07c05.b64" "$p/part_07c06.b64" "$p/part_07c07.b64" \
            > /tmp/mimir-knowledge.b64
          base64 --decode /tmp/mimir-knowledge.b64 > /tmp/mimir-knowledge.zip
          echo '0a79eede6030c0ca7ceee8f962bbcd0c80826ed4f6be9a80eb9b61f506e6e52a  /tmp/mimir-knowledge.zip' | sha256sum -c -
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('/tmp/mimir-knowledge.zip') as z:
              if len(z.namelist()) != 25:
                  raise SystemExit(f'expected 25 entries, got {len(z.namelist())}')
              z.extractall('.')
          PY

      - name: Add explicit bidirectional knowledge links
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '## CANONICAL MULTI-STAGE CROSS-LINKS' MIMIR_ALL_SOURCES_SUPERBOOK.md; then
            cat >> MIMIR_ALL_SOURCES_SUPERBOOK.md <<'EOF'

          ---

          ## CANONICAL MULTI-STAGE CROSS-LINKS

          This all-in-one synthesis is part of a multi-stage validation graph. Read and verify it against:

          - [Primary execution/continuity handbook](MIMIR_CONTINUE_HERE.md)
          - [Knowledge graph](MIMIR_KNOWLEDGE_GRAPH.md)
          - [ChatGPT archive source registry](docs/chatgpt-archive/SOURCE_REGISTRY.md)
          - [Cross-source validation matrix](docs/chatgpt-archive/VALIDATION_MATRIX.md)
          - [Historical-to-current migration map](docs/chatgpt-archive/migration/HISTORICAL_TO_CURRENT_MAPPING.md)
          - [Archive manifest](docs/chatgpt-archive/MANIFEST.json)
          - [Archive verifier](scripts/verify_mimir_knowledge_archive.ps1)

          Current GitHub source/tests remain higher authority than historical snapshots when they conflict.
          EOF
          fi

          if ! grep -q '## CHATGPT STORAGE KNOWLEDGE GRAPH' MIMIR_CONTINUE_HERE.md; then
            cat >> MIMIR_CONTINUE_HERE.md <<'EOF'

          ---

          ## CHATGPT STORAGE KNOWLEDGE GRAPH

          The continuity manual is cross-linked to the sanitized historical/design archive. A future session should use these when reconstructing design history, migration candidates, or claims that predate the current Rust repository:

          - [All-sources superbook](MIMIR_ALL_SOURCES_SUPERBOOK.md)
          - [Knowledge graph / reading order](MIMIR_KNOWLEDGE_GRAPH.md)
          - [Source registry and classification](docs/chatgpt-archive/SOURCE_REGISTRY.md)
          - [Cross-source validation matrix](docs/chatgpt-archive/VALIDATION_MATRIX.md)
          - [Historical-to-current migration map](docs/chatgpt-archive/migration/HISTORICAL_TO_CURRENT_MAPPING.md)

          Do not let a historical snapshot override fresh source/tests. Historical files are evidence, design history, or migration candidates according to their registry classification.
          EOF
          fi

      - name: Privacy structure and graph gate
        shell: bash
        run: |
          set -euo pipefail
          test -f MIMIR_ALL_SOURCES_SUPERBOOK.md
          test -f MIMIR_KNOWLEDGE_GRAPH.md
          test -f docs/chatgpt-archive/SOURCE_REGISTRY.md
          test -f docs/chatgpt-archive/VALIDATION_MATRIX.md
          test -f docs/chatgpt-archive/migration/HISTORICAL_TO_CURRENT_MAPPING.md
          test -f scripts/verify_mimir_knowledge_archive.ps1
          test -f .github/workflows/knowledge-archive.yml
          test ! -e docs/chatgpt-archive/historical/conversations-011.json
          test ! -e docs/chatgpt-archive/historical/Naveax_replay_extracted_settings.json
          grep -q 'HISTORICAL_TO_CURRENT_MAPPING.md' MIMIR_ALL_SOURCES_SUPERBOOK.md
          grep -q 'MIMIR_ALL_SOURCES_SUPERBOOK.md' MIMIR_CONTINUE_HERE.md
          grep -q 'MIMIR_KNOWLEDGE_GRAPH.md' MIMIR_CONTINUE_HERE.md
          grep -q 'SOURCE_REGISTRY.md' MIMIR_CONTINUE_HERE.md
          grep -q 'VALIDATION_MATRIX.md' MIMIR_CONTINUE_HERE.md

      - name: Run permanent archive verifier
        shell: pwsh
        run: |
          & ./scripts/verify_mimir_knowledge_archive.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove bootstrap-only transport and workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/_tmp_mimir_knowledge_parts
          rm -f .github/_tmp_mimir_knowledge_archive_payload.zip
          rm -f .github/workflows/_tmp_bootstrap_mimir_knowledge_archive_v2.yml
          rm -f .github/workflows/_tmp_bootstrap_mimir_knowledge_archive_v3.yml

      - name: Commit permanent linked archive only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          if printf '%s\n' "$changed" | grep -q '^crates/'; then
            echo 'ERROR: Rust source changed during docs archive publication.' >&2
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Eq '^Cargo\.(toml|lock)$'; then
            echo 'ERROR: Cargo metadata changed during docs archive publication.' >&2
            exit 1
          fi
          git commit -m 'Add linked multi-stage ChatGPT knowledge archive for MIMIR'
          git push origin HEAD:docs/chatgpt-storage-multistage-archive-v2
