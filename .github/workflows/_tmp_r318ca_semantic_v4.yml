name: R3.18CA Exact Payload Semantic Evidence v4

on:
  push:
    branches: [evidence/r318ca-semantic-v4]

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: r318ca-semantic-v4
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      GH_TOKEN: ${{ github.token }}
      BASE_MAIN: 6ab5ee3423f74a34fbaacef32b98e5f3fd560b16
      BASE_TREE: 9afa6362ecd0613a9bda06c2261a704cde2847b8
      PROD_SHA: 3b07e223fdf326e8100412fad9410bb1b66d2cb9
      PROD_TREE: 68b32f61d61c863b25e393cfa77575bac55217d7
      BY_CI_RUN: '34857720437'
      BY_CI_JOB: '104021486939'
      MAIN_CI_RUN: '34982684978'
      MAIN_KNOWLEDGE_RUN: '34982684669'
      BZ_HEAD: cfcfb671555827b8003007ff766798a1206aca15
      BZ_TREE: 46b91c8ab80db2c67e04f5386de5db4538cc2a7f
      BZ_RUN: '34950884111'
      BZ_JOB: '104321306221'
      BZ_ARTIFACT: '10389058675'
      BZ_ARTIFACT_NAME: r318bz-published-by-differential-evidence-v4
      BZ_ARTIFACT_SIZE: '3111'
      BZ_DIGEST: sha256:e11eceb83779b2fb52c658edf8ee932d4c24228d7b8046b44b235203d9f79d39
      BZ_MANIFEST_SHA256: f298edbe583571ac1a1b477d74fde61f76b92983b0e4016a01639fd2de8930af
      BOXCARS_SHA: c70e77df7af81b436cb545d070bb90c82f562d0b
      BOXCARS_TOOLCHAIN: 1.86.0
      R317M_HEAD: a50f09857f36ac52cec30b4bf3efbde9e15bb564
      R317M_TRANSFORM_BLOB: ae0c1374f567f8e12605eb68a94e125b7eab96f9
      R317I_HEAD: 8962ddc6bd77b5469fa7ebc93c95334e5725a8ab
      R317I_PATCH_BLOB: ea651d3e33bda509280e45da2d2a1b257bdbf88d
      TARGET_REPLAY: test_corpus/largest_100/079_1f838b01-66b5-4963-b62e-64f3d7dbd545.replay
      FALSE_REPLAY: external_fixtures/sample_002.replay
      PAYLOAD_START: '3245'

    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Freeze authorities and prerequisites
        shell: bash
        run: |
          set -euo pipefail
          eq() { [ "$1" = "$2" ] || { echo "authority mismatch: got=$1 expected=$2" >&2; exit 1; }; }
          eq "$(git rev-parse HEAD^)" "$BASE_MAIN"
          eq "$(git rev-parse "$BASE_MAIN^{tree}")" "$BASE_TREE"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" "$BASE_MAIN"
          eq "$(git rev-parse "$PROD_SHA^{tree}")" "$PROD_TREE"
          eq "$(git merge-base "$BASE_MAIN" "$PROD_SHA")" "$PROD_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_MAIN...$GITHUB_SHA" | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/_tmp_r318ca_semantic_v4.yml'
          git diff --exit-code "$BASE_MAIN"..HEAD -- crates Cargo.toml Cargo.lock external_fixtures test_corpus tools scripts
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$BY_CI_RUN" --jq .head_sha)" "$PROD_SHA"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$BY_CI_RUN" --jq .conclusion)" success
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$BY_CI_JOB" --jq .conclusion)" success
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$MAIN_CI_RUN" --jq .head_sha)" "$BASE_MAIN"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$MAIN_CI_RUN" --jq .conclusion)" success
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$MAIN_KNOWLEDGE_RUN" --jq .head_sha)" "$BASE_MAIN"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$MAIN_KNOWLEDGE_RUN" --jq .conclusion)" success
          mkdir -p .tmp/r318ca-v4 out
          BZ="$RUNNER_TEMP/r318ca-v4-bz"; mkdir -p "$BZ"
          gh run download "$BZ_RUN" --repo "$GITHUB_REPOSITORY" --name "$BZ_ARTIFACT_NAME" --dir "$BZ"
          eq "$(sha256sum "$BZ/r3_18bz_artifact_sha256.txt" | awk '{print $1}')" "$BZ_MANIFEST_SHA256"
          (cd "$BZ" && sha256sum -c r3_18bz_artifact_sha256.txt)
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$BZ_ARTIFACT")"
          eq "$(jq -r .name <<<"$meta")" "$BZ_ARTIFACT_NAME"
          eq "$(jq -r .size_in_bytes <<<"$meta")" "$BZ_ARTIFACT_SIZE"
          eq "$(jq -r .digest <<<"$meta")" "$BZ_DIGEST"
          eq "$(jq -r .expired <<<"$meta")" false
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$BZ_RUN" --jq .head_sha)" "$BZ_HEAD"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$BZ_RUN" --jq .conclusion)" success
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$BZ_JOB" --jq .conclusion)" success
          for line in \
            'R3_18BZ_OUTCOME=A' \
            'R3_18BZ_ROWS=2/2' \
            'R3_18BZ_FALSE_TERMINATOR=1/1' \
            'R3_18BZ_TRUE_HEADER=1/1' \
            'R3_18BZ_DIRECT_HEADER_MATCH=1/1' \
            'R3_18BZ_NATIVE_ORACLE_MISMATCH=0' \
            'R3_18BZ_WITNESS_RESELECTION=0' \
            'R3_18BZ_FOLLOWING_PAYLOAD_BITS_CONSUMED=0' \
            'R3_18BZ_SECOND_LATER_CONTROL_BITS_CONSUMED=0'; do
            grep -Fx "$line" "$BZ/r3_18bz_aggregate.txt"
          done
          grep -F "$FALSE_REPLAY" "$BZ/r3_18bz_rows.tsv"
          grep -F "$TARGET_REPLAY" "$BZ/r3_18bz_rows.tsv"
          grep -F 'payload_start_bit=3245' "$BZ/r3_18bz_boxcars_oracle_row.txt"
          grep -F 'attribute_tag=LoadoutsOnline' "$BZ/r3_18bz_boxcars_oracle_row.txt"
          cargo test --locked -p mimir-replay --test r3_18by_post_bu_following_header -- --nocapture 2>&1 | tee .tmp/r318ca-v4/by.log
          grep -F 'test result: ok.' .tmp/r318ca-v4/by.log
          sha256sum .tmp/r318ca-v4/by.log > out/r3_18ca_by_validation_sha256.txt
          {
            echo "base_main=$BASE_MAIN"
            echo "base_tree=$BASE_TREE"
            echo "production_sha=$PROD_SHA"
            echo "production_tree=$PROD_TREE"
            echo "by_ci_run=$BY_CI_RUN"
            echo "by_ci_job=$BY_CI_JOB"
            echo "main_ci_run=$MAIN_CI_RUN"
            echo "main_knowledge_run=$MAIN_KNOWLEDGE_RUN"
            echo "bz_head=$BZ_HEAD"
            echo "bz_tree=$BZ_TREE"
            echo "bz_run=$BZ_RUN"
            echo "bz_job=$BZ_JOB"
            echo "bz_artifact=$BZ_ARTIFACT"
            echo "bz_digest=$BZ_DIGEST"
            echo "bz_manifest_sha256=$BZ_MANIFEST_SHA256"
            echo "false_replay=$FALSE_REPLAY"
            echo "false_stop_bit=11240"
            echo "false_row_payload_access=0"
            echo "true_replay=$TARGET_REPLAY"
            echo "true_payload_start=3245"
            echo "true_header_context=110,6,67,LoadoutsOnline,868,32,10,false"
            echo "production_mutation_count=0"
            echo "cargo_mutation_count=0"
            echo "fixture_mutation_count=0"
            echo "corpus_mutation_count=0"
            echo "support_lane_mutation_count=0"
          } > out/r3_18ca_authority.txt
          echo R3_18CA_V4_PREREQUISITES=PASS

      - name: Rebuild pinned Boxcars exact semantic witness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin evidence/r317m-k4-wire-evidence evidence/r317i-k3-wire-evidence
          test "$(git rev-parse origin/evidence/r317m-k4-wire-evidence)" = "$R317M_HEAD"
          test "$(git rev-parse origin/evidence/r317i-k3-wire-evidence)" = "$R317I_HEAD"
          git show "$R317M_HEAD:tools/_tmp_r317m_transform.py" > .tmp/r318ca-v4/r317m_transform.py
          git show "$R317I_HEAD:tools/_tmp_r317i_patch.py" > .tmp/r318ca-v4/r317i_patch.py
          test "$(git hash-object .tmp/r318ca-v4/r317m_transform.py)" = "$R317M_TRANSFORM_BLOB"
          test "$(git hash-object .tmp/r318ca-v4/r317i_patch.py)" = "$R317I_PATCH_BLOB"
          BOXCARS="$RUNNER_TEMP/boxcars-r318ca-v4"
          git clone --quiet https://github.com/nickbabcock/boxcars.git "$BOXCARS"
          git -C "$BOXCARS" checkout --quiet --detach "$BOXCARS_SHA"
          test "$(git -C "$BOXCARS" hash-object src/network/frame_decoder.rs)" = 6f2ff153d3a27cdacccc65e3f23851489077a7d8
          test "$(git -C "$BOXCARS" hash-object src/network/attributes.rs)" = 5e2d5bc1cd8187af30c3ea95193ad987645cb76e
          test "$(git -C "$BOXCARS" hash-object src/network/models.rs)" = 73c73991379aeb79dcee49ea31c417141ba3c1a6
          test "$(git -C "$BOXCARS" hash-object src/bits.rs)" = d3ca061580e5e78038b2af383ff53971001c91c9
          python .tmp/r318ca-v4/r317m_transform.py "$BOXCARS" "$PWD/.tmp/r318ca-v4/r317i_patch.py"
          python - "$BOXCARS" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1]); frame=root/'src/network/frame_decoder.rs'; s=frame.read_text(encoding='utf-8')
          cap='if witnesses.len() < 4 {'
          assert s.count(cap)==1, s.count(cap)
          s=s.replace(cap,'if witnesses.len() < 1000000 {',1)
          marker='fn r3_17m_classify(\n'
          helper=r'''fn r3_18ca_product(v: &crate::network::attributes::Product) -> serde_json::Value {
              let value = match &v.value {
                  crate::network::attributes::ProductValue::NoColor => serde_json::json!({"kind":"NoColor"}),
                  crate::network::attributes::ProductValue::Absent => serde_json::json!({"kind":"Absent"}),
                  crate::network::attributes::ProductValue::OldColor(x) | crate::network::attributes::ProductValue::NewColor(x) => serde_json::json!({"kind":"UserColor","value":x}),
                  crate::network::attributes::ProductValue::OldPaint(x) | crate::network::attributes::ProductValue::NewPaint(x) => serde_json::json!({"kind":"Paint","value":x}),
                  crate::network::attributes::ProductValue::Title(x) => serde_json::json!({"kind":"Title","value":x}),
                  crate::network::attributes::ProductValue::SpecialEdition(x) => serde_json::json!({"kind":"SpecialEdition","value":x}),
                  crate::network::attributes::ProductValue::OldTeamEdition(x) | crate::network::attributes::ProductValue::NewTeamEdition(x) => serde_json::json!({"kind":"TeamEdition","value":x}),
              };
              serde_json::json!({"unknown":v.unknown,"object_id":v.object_ind.0,"value":value})
          }
          fn r3_18ca_semantic(attribute: &crate::network::attributes::Attribute) -> String {
              let value = match attribute {
                  crate::network::attributes::Attribute::LoadoutsOnline(v) => serde_json::json!({
                      "tag":"LoadoutsOnline",
                      "blue":v.blue.iter().map(|g|g.iter().map(r3_18ca_product).collect::<Vec<_>>()).collect::<Vec<_>>(),
                      "orange":v.orange.iter().map(|g|g.iter().map(r3_18ca_product).collect::<Vec<_>>()).collect::<Vec<_>>(),
                      "unknown1":v.unknown1,
                      "unknown2":v.unknown2
                  }),
                  _ => serde_json::json!({"tag":"Unexpected"}),
              };
              serde_json::to_string(&value).expect("R3.18CA semantic JSON")
          }
          '''
          assert s.count(marker)==1, s.count(marker)
          s=s.replace(marker,helper+marker,1)
          old_sem='    let semantic = "decoded_variant_ok".to_owned();\n'
          assert s.count(old_sem)==1, s.count(old_sem)
          s=s.replace(old_sem,'    let semantic = r3_18ca_semantic(attribute);\n',1)
          frame.write_text(s,encoding='utf-8',newline='\n')
          cargo=root/'Cargo.toml'; c=cargo.read_text(encoding='utf-8')
          dep='serde = { version = "1", features = ["derive"] }\n'
          assert c.count(dep)==1, c.count(dep)
          c=c.replace(dep,dep+'serde_json = "1"\n',1)
          cargo.write_text(c,encoding='utf-8',newline='\n')
          PY
          git -C "$BOXCARS" add -N examples/r3_17m_probe.rs
          git -C "$BOXCARS" diff --check
          git -C "$BOXCARS" diff --binary -- src/network/frame_decoder.rs Cargo.toml examples/r3_17m_probe.rs > .tmp/r318ca-v4/boxcars.patch
          sha256sum .tmp/r318ca-v4/boxcars.patch > out/r3_18ca_boxcars_patch_sha256.txt
          rustup toolchain install "$BOXCARS_TOOLCHAIN" --profile minimal
          RUSTUP_TOOLCHAIN="$BOXCARS_TOOLCHAIN" CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo generate-lockfile --manifest-path "$BOXCARS/Cargo.toml"
          sha256sum "$BOXCARS/Cargo.lock" > out/r3_18ca_boxcars_lock_sha256.txt
          RUSTUP_TOOLCHAIN="$BOXCARS_TOOLCHAIN" cargo build --locked --manifest-path "$BOXCARS/Cargo.toml" --example r3_17m_probe --quiet
          PROBE="$BOXCARS/target/debug/examples/r3_17m_probe"
          for n in 1 2; do
            MIMIR_R3_17M_LABEL="$TARGET_REPLAY" "$PROBE" "$PWD/$TARGET_REPLAY" > ".tmp/r318ca-v4/oracle_${n}.log" 2>&1
            grep -Fx 'R3_17M_ORACLE_PARSE=PASS' ".tmp/r318ca-v4/oracle_${n}.log"
          done
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          target=os.environ['TARGET_REPLAY']; start=int(os.environ['PAYLOAD_START'])
          def fields(line):
              d={}
              for token in line.rstrip('\n').split('\t')[1:]:
                  if '=' in token:
                      k,v=token.split('=',1); d[k]=v
              return d
          def one(path):
              rows=[]
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.startswith('R3_17M_WITNESS\t'):
                      r=fields(line)
                      if r.get('attribute_tag')=='LoadoutsOnline': rows.append(r)
              exact=[r for r in rows if r.get('label')==target and int(r['payload_start_bit'])==start and int(r['stream_id'])==61 and int(r['property_object_id'])==67 and int(r['version_major'])==868 and int(r['version_minor'])==32 and int(r['net_version'])==10 and r['is_rl_223']=='false']
              if len(exact)!=1: raise SystemExit(f'exact oracle rows={len(exact)} total={len(rows)}')
              r=exact[0]; sem=json.loads(r['semantic']); canon=json.dumps(sem,sort_keys=True,separators=(',',':'))
              return {'start':int(r['payload_start_bit']),'end':int(r['payload_end_bit']),'width':int(r['payload_width']),'shape':r['shape'],'semantic':sem,'semantic_sha256':hashlib.sha256(canon.encode()).hexdigest(),'loadouts_online_witnesses':len(rows),'same_property_witnesses':sum(int(x['property_object_id'])==67 for x in rows),'same_shape_witnesses':sum(x['shape']==r['shape'] for x in rows)}
          a=one('.tmp/r318ca-v4/oracle_1.log'); b=one('.tmp/r318ca-v4/oracle_2.log')
          assert a==b,'oracle repeat mismatch'
          Path('.tmp/r318ca-v4/oracle.json').write_text(json.dumps(a,sort_keys=True)+'\n',encoding='utf-8')
          Path('out/r3_18ca_oracle.txt').write_text('\n'.join(['oracle_repeat=2/2','payload_start='+str(a['start']),'payload_end='+str(a['end']),'payload_width='+str(a['width']),'structural_shape='+a['shape'],'semantic_sha256='+a['semantic_sha256'],'target_replay_loadouts_online_witnesses='+str(a['loadouts_online_witnesses']),'same_property_witnesses='+str(a['same_property_witnesses']),'same_shape_witnesses='+str(a['same_shape_witnesses']),'multiplicity_is_runtime_frequency_promise=false','witness_reselection=0'])+'\n',encoding='utf-8')
          print('R3_18CA_V4_ORACLE=PASS',a['start'],a['end'],a['width'],a['shape'])
          PY

      - name: Compare existing native K4 and run negatives
        shell: bash
        run: |
          set -euo pipefail
          PROJ="$RUNNER_TEMP/r318ca-v4-native"; mkdir -p "$PROJ/src"
          cat > "$PROJ/Cargo.toml" <<EOF
          [package]
          name = "r318ca-v4-native"
          version = "0.0.0"
          edition = "2024"
          [dependencies]
          mimir-replay = { path = "$PWD/crates/mimir-replay" }
          serde_json = "1"
          [workspace]
          EOF
          cat > "$PROJ/src/main.rs" <<'RS'
          use mimir_replay::{decode_replay_network_k4_v1,MinimalReplayContentScaffoldReader,MinimalReplayFooterLookupMaterializationReader,ReplayContentScaffoldReader,ReplayFooterLookupMaterializationReader,ReplayInput,ReplayNetworkAttributeTagV1 as Tag,ReplayNetworkK4DecodeContextV1 as Ctx,ReplayNetworkK4ValueV1 as Val,ReplayNetworkK4OnlineProductV1 as Product,ReplayNetworkK4ProductValueV1 as PVal};
          use serde_json::{json,Value}; use std::{env,fs};
          fn product(p:&Product)->Value{let value=match &p.value{PVal::UserColor(x)=>json!({"kind":"UserColor","value":x}),PVal::Paint(x)=>json!({"kind":"Paint","value":x}),PVal::Title(x)=>json!({"kind":"Title","value":x.value}),PVal::SpecialEdition(x)=>json!({"kind":"SpecialEdition","value":x}),PVal::TeamEdition(x)=>json!({"kind":"TeamEdition","value":x})};json!({"unknown":p.unknown,"object_id":p.object_id,"value":value})}
          fn semantic(v:&Val)->Value{match v{Val::LoadoutsOnline{blue,orange,unknown1,unknown2}=>json!({"tag":"LoadoutsOnline","blue":blue.iter().map(|g|g.iter().map(product).collect::<Vec<_>>()).collect::<Vec<_>>(),"orange":orange.iter().map(|g|g.iter().map(product).collect::<Vec<_>>()).collect::<Vec<_>>(),"unknown1":unknown1,"unknown2":unknown2}),_=>json!({"tag":"Unexpected"})}}
          fn main(){let a:Vec<String>=env::args().collect();assert!(a.len()>=3);let path=&a[1];let mode=&a[2];let bytes=fs::read(path).unwrap();let input=ReplayInput::Memory{label:path.to_owned(),bytes:bytes.clone()};let s=MinimalReplayContentScaffoldReader.read_content_scaffold(&input).unwrap();let lo=usize::try_from(s.network_start).unwrap();let hi=usize::try_from(s.network_end).unwrap();let mut net=bytes[lo..hi].to_vec();if let Some(x)=mode.strip_prefix("truncate:"){net.truncate(x.parse::<usize>().unwrap());}if let Some(x)=mode.strip_prefix("poison:"){let p=x.parse::<usize>().unwrap();assert!(p/8<net.len());net[p/8]^=1u8<<(p%8);}let m=MinimalReplayFooterLookupMaterializationReader.read_footer_lookup_materialization(&input).unwrap();let ctx=Ctx{version_major:868,version_minor:32,net_version:10,is_rl_223:false};match decode_replay_network_k4_v1(&net,3245,Tag::LoadoutsOnline,ctx,&m.objects){Ok(v)=>println!("{}",serde_json::to_string(&json!({"status":"ok","start":v.payload_start_bit,"end":v.payload_end_bit,"width":v.payload_width,"shape":v.structural_shape,"semantic":semantic(&v.value)})).unwrap()),Err(e)=>println!("{}",serde_json::to_string(&json!({"status":"error","error":e.to_string()})).unwrap())}}
          RS
          cargo build --manifest-path "$PROJ/Cargo.toml" --quiet
          BIN="$PROJ/target/debug/r318ca-v4-native"
          "$BIN" "$TARGET_REPLAY" clean > .tmp/r318ca-v4/native_1.json
          "$BIN" "$TARGET_REPLAY" clean > .tmp/r318ca-v4/native_2.json
          cmp .tmp/r318ca-v4/native_1.json .tmp/r318ca-v4/native_2.json
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          o=json.loads(Path('.tmp/r318ca-v4/oracle.json').read_text()); n=json.loads(Path('.tmp/r318ca-v4/native_1.json').read_text())
          structural=semantic=membership=False; native_hash='none'
          if n['status']=='ok':
              membership=True; structural=(n['start']==o['start'] and n['end']==o['end'] and n['width']==o['width'] and n['shape']==o['shape']); semantic=(n['semantic']==o['semantic'])
              outcome='A' if structural and semantic else 'C'; category='accepted' if outcome=='A' else ('semantic_mismatch' if structural else 'structural_mismatch')
              canon=json.dumps(n['semantic'],sort_keys=True,separators=(',',':')); native_hash=hashlib.sha256(canon.encode()).hexdigest()
          else:
              err=n['error']; outcome='B' if 'unadmitted-k4-shape' in err else 'C'; category='unadmitted-k4-shape' if outcome=='B' else 'native_error'
          Path('.tmp/r318ca-v4/outcome.txt').write_text(outcome+'\n',encoding='utf-8')
          Path('out/r3_18ca_native_match.txt').write_text('\n'.join(['existing_k4_membership_accepted='+str(membership).lower(),'native_repeat=2/2','native_category='+category,'native_oracle_structural_match='+str(structural).lower(),'native_oracle_semantic_match='+str(semantic).lower(),'native_semantic_sha256='+native_hash,'oracle_semantic_sha256='+o['semantic_sha256'],'outcome='+outcome])+'\n',encoding='utf-8')
          print('R3_18CA_V4_OUTCOME='+outcome)
          PY
          END="$(python -c 'import json;print(json.load(open(".tmp/r318ca-v4/oracle.json"))["end"])')"
          "$BIN" "$TARGET_REPLAY" "poison:$END" > .tmp/r318ca-v4/native_poison.json
          cmp .tmp/r318ca-v4/native_1.json .tmp/r318ca-v4/native_poison.json
          python - <<'PY' > .tmp/r318ca-v4/trunc_bytes.txt
          import json
          o=json.load(open('.tmp/r318ca-v4/oracle.json')); s=o['start']; e=o['end']
          vals=[(s+7)//8,((s+e)//2+7)//8,max((s+7)//8,(e-1)//8)]
          print('\n'.join(map(str,dict.fromkeys(vals))))
          PY
          trunc_ok=0
          while IFS= read -r n; do
            "$BIN" "$TARGET_REPLAY" "truncate:$n" > ".tmp/r318ca-v4/trunc_$n.json"
            python - "$n" <<'PY'
          import json,sys
          d=json.load(open(f'.tmp/r318ca-v4/trunc_{sys.argv[1]}.json')); assert d['status']=='error',d
          PY
            trunc_ok=$((trunc_ok+1))
          done < .tmp/r318ca-v4/trunc_bytes.txt
          test "$trunc_ok" -ge 3
          {
            echo "truncation_distinct_boundaries=$trunc_ok"
            echo "truncation_atomic_rejections=$trunc_ok/$trunc_ok"
            echo "post_payload_poison=PASS"
            echo "false_row_payload_access=0"
            echo "next_property_control_bits_consumed=0"
            echo "second_payloads_consumed=0"
            echo "witness_reselection=0"
          } > out/r3_18ca_negative_controls.txt

      - name: Seal and upload durable evidence
        id: seal
        shell: bash
        run: |
          set -euo pipefail
          OUTCOME="$(cat .tmp/r318ca-v4/outcome.txt)"
          {
            echo "R3_18CA_OUTCOME=$OUTCOME"
            echo "R3_18CA_ORACLE_REPEAT=2/2"
            echo "R3_18CA_NATIVE_REPEAT=2/2"
            echo "R3_18CA_FALSE_ROW_PAYLOAD_ACCESS=0"
            echo "R3_18CA_NEXT_CONTROL_BITS_CONSUMED=0"
            echo "R3_18CA_SECOND_PAYLOADS_CONSUMED=0"
            echo "R3_18CA_WITNESS_RESELECTION=0"
            echo "R3_18CA_PRODUCTION_CARGO_FIXTURE_CORPUS_SUPPORT_MUTATION=0/0/0/0/0"
          } > out/r3_18ca_aggregate.txt
          python - <<'PY'
          from pathlib import Path
          text='\n'.join(p.read_text(encoding='utf-8',errors='strict').lower() for p in Path('out').glob('*'))
          forbidden=['raw_bits_hex','account_id','online_id','player_name','remote_id','"semantic"']
          hits=[x for x in forbidden if x in text]; assert not hits,hits
          Path('out/r3_18ca_privacy.txt').write_text('privacy_safe_output=true\nforbidden_hits=0\n',encoding='utf-8')
          PY
          git diff --exit-code "$BASE_MAIN"..HEAD -- crates Cargo.toml Cargo.lock external_fixtures test_corpus tools scripts
          (cd out && sha256sum r3_18ca_authority.txt r3_18ca_by_validation_sha256.txt r3_18ca_boxcars_patch_sha256.txt r3_18ca_boxcars_lock_sha256.txt r3_18ca_oracle.txt r3_18ca_native_match.txt r3_18ca_negative_controls.txt r3_18ca_aggregate.txt r3_18ca_privacy.txt > r3_18ca_artifact_sha256.txt)
          echo "outcome=$OUTCOME" >> "$GITHUB_OUTPUT"
          echo R3_18CA_V4_DURABLE_EVIDENCE=PASS

      - name: Upload R3.18CA evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: r318ca-exact-payload-semantic-v4
          path: out/
          if-no-files-found: error
          retention-days: 90

      - name: Emit immutable receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          OUTCOME: ${{ steps.seal.outputs.outcome }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"; test -n "$ARTIFACT_DIGEST"; test -n "$OUTCOME"
          printf 'R3_18CA_AUTHORITY_HEAD=%s\n' "$(git rev-parse HEAD)"
          printf 'R3_18CA_AUTHORITY_RUN=%s\n' "$GITHUB_RUN_ID"
          printf 'R3_18CA_ARTIFACT_ID=%s\n' "$ARTIFACT_ID"
          printf 'R3_18CA_ARTIFACT_DIGEST=%s\n' "$ARTIFACT_DIGEST"
          printf 'R3_18CA_OUTCOME=%s\n' "$OUTCOME"
          cat out/r3_18ca_oracle.txt
          cat out/r3_18ca_native_match.txt
          cat out/r3_18ca_negative_controls.txt
          cat out/r3_18ca_aggregate.txt
          cat out/r3_18ca_artifact_sha256.txt
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='r318ca-v4/evidence' -f description="R3.18CA exact semantic evidence Outcome $OUTCOME" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo R3_18CA_V4_RECEIPT_STREAM=PASS
