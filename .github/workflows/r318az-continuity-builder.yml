name: R3.18AZ Continuity Builder

on:
  push:
    branches:
      - continuity/r318az-admit-open-r318ba

permissions:
  contents: write

concurrency:
  group: r318az-continuity-builder
  cancel-in-progress: false

jobs:
  build:
    if: github.event.head_commit.message == 'Add R3.18AZ continuity builder'
    runs-on: ubuntu-24.04
    env:
      MAIN_SHA: d12b7662a61571ecb43109ebbc753b790d37b6ad
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse HEAD^)" = "$MAIN_SHA"
      - name: Build canonical continuity update
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json, re

          main_sha = "d12b7662a61571ecb43109ebbc753b790d37b6ad"
          prod_sha = "2558cc0559422a3e6695e1501f20d96d83b23e6d"
          prod_tree = "93198ad2a4f929ac62b87beddbc9d5b5665f08d1"
          evidence_head = "f46479faa2b230f7fde474f7f7696a1024420879"
          evidence_tree = "0d022d27fda2275de9512d96231979e1d016491e"
