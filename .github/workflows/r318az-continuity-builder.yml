name: R3.18AZ Continuity Builder

on:
  push:
    branches:
      - continuity/r318az-admit-open-r318ba

permissions:
  contents: write

concurrency:
  group: r318az-continuity-builder
  cancel-in-progress: false

jobs:
  build:
    if: github.event.head_commit.message == 'Fix R3.18AZ continuity builder'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build one clean continuity commit
        shell: bash
        run: python3 .github/scripts/r318az_continuity_builder.py
