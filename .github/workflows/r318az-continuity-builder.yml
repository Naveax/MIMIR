## Superseded scaffolding attempts

Earlier evidence SHAs were not scientific authority: `8d9043e7...` failed harness compilation; `7bd7e434...` reached the full 40/40 scientific differential but failed formatting; `2c5357e0...` exposed shallow-checkout ancestry and normal-CI evidence-environment isolation defects. None was rerun. The immutable authority is `{evidence_head}` and the success receipts above.

## Hard stop

R3.18AZ does not produce the R3.18AX-observed following control bit. It does not permit payload/control access on the seven false terminators, next stream/header/payload consumption, a second later control, a generalized/repeated property cursor, actor/frame/lifecycle advance, raw-state/event/replay-slice/skill/counterfactual/runtime/export widening, or historical boundary/value inheritance.

## Next gate

R3.18BA is a separate bounded production pass. It may validate/recompute exactly one valid published R3.18AY payload composition, begin exactly at that payload end, consume exactly one R3.18AX-admitted `property_present` bit, preserve the mixed false=37 / true=3 semantics, and stop exactly one bit later. It may not resolve a following stream, header or payload, read a second later control bit, or create a generalized property loop/cursor.
'''
          Path("docs/continuity/MIMIR_R3_18AZ_DECISION.md").write_text(decision, encoding="utf-8", newline="\n")

          ba = f'''# MIMIR R3.18BA — Bounded Post-AY Mixed Following-Control Production

**Status:** ACTIVE
**Pass type:** bounded production implementation
**Production authority before pass:** R3.18AY `{prod_sha}` / `{prod_tree}`
**Published-production differential authority:** R3.18AZ Outcome A / `{evidence_head}` / run `{evidence_run}` / artifact `{artifact}` / `sha256:{artifact_digest}`
**Control evidence authority:** R3.18AX Outcome A / artifact `9644869549` / false=37 true=3 / oracle-native exact 40/40
**Frozen production lane:** exactly 40 valid R3.18AY payload rows; the 7 upstream AU false terminators remain outside the lane

## 1. Goal

Publish exactly one boundary-specific composition after a valid R3.18AY Int/32 payload. The API must validate/recompute the supplied AY authority instead of trusting an arbitrary cursor, begin exactly at the validated AY payload end, consume exactly one `property_present` bit, represent both R3.18AX-observed boolean values, and stop one bit later.

