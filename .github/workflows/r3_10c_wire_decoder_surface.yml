name: R3.10c Wire Decoder Surface

on:
  push:
    branches:
      - agent/r3-10-boxcars-frame-differential-evidence

permissions:
  contents: read

jobs:
  wire-surface:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run supported-lane wire decoder surface probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'r3_10c_boxcars_target'
          $log = Join-Path $env:RUNNER_TEMP 'r3_10c_wire_surface.log'

          & cargo run --manifest-path tools/r3_10_boxcars_probe/Cargo.toml --release --bin wire_surface *> $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "R3_10C_EXIT=$code"
            Get-Content -LiteralPath $log -Tail 500
            exit $code
          }

          Remove-Item -LiteralPath tools/r3_10_boxcars_probe/Cargo.lock -ErrorAction SilentlyContinue

          $required = @(
            'boxcars_git_rev=c70e77df7af81b436cb545d070bb90c82f562d0b',
            'expected_replays=103',
            'expected_supported_lane=47',
            'SUMMARY supported_replays=47',
            'SUMMARY supported_name_variant_conflicts=0',
            'SUMMARY supported_trajectory_rotation_only=0',
            'R3_10C_WIRE_SURFACE_COMPLETED=PASS'
          )
          foreach ($marker in $required) {
            if (-not (Select-String -LiteralPath $log -SimpleMatch $marker -Quiet)) {
              Get-Content -LiteralPath $log -Tail 500
              throw "missing R3.10c marker: $marker"
            }
          }

          Get-Content -LiteralPath $log | Where-Object {
            $_ -match '^R3\.10c ' -or
            $_ -match '^boxcars_' -or
            $_ -match '^expected_' -or
            $_ -match '^SUMMARY ' -or
            $_ -match '^SUPPORTED_WIRE_VARIANT ' -or
            $_ -match '^SUPPORTED_NAME_WIRE ' -or
            $_ -match '_admitted=' -or
            $_ -match '^R3_10C_WIRE_SURFACE_COMPLETED='
          }

          $tracked = @(git diff --name-only)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tracked.Count -ne 0) {
            throw "R3.10c evidence mutated tracked files: $($tracked -join ', ')"
          }
          Write-Host 'R3_10C_TRACKED_SOURCE_MUTATION=false'
          Write-Host 'R3_10C_EXIT=0'
