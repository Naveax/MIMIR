name: R3.18R Published Following Header Differential

on:
  push:
    branches:
      - evidence/r318r-published-following-header-v1

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '

      - name: Run R3.18R evidence
        shell: bash
        run: bash tools/_tmp_r318r_run.sh

      - name: Upload immutable R3.18R evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: r318r-published-following-header-differential-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            r3_18r_source_scope.txt
            r3_18r_replay_identity.tsv
            r3_18r_frozen_witnesses.json
            r3_18r_upstream_receipts.txt
            r3_18r_published_q_rows.tsv
            r3_18r_comparison.json
            r3_18r_negative_controls.txt
            r3_18r_aggregate.txt
            r3_18r_artifact_sha256.txt

      - name: Emit immutable receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/r318r_artifact.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /tmp/r318r_run.json

          python3 - <<'PY'
          import json
          import os

          with open('/tmp/r318r_artifact.json', encoding='utf-8') as f:
              artifact = json.load(f)
          with open('/tmp/r318r_run.json', encoding='utf-8') as f:
              run = json.load(f)

          artifact_id = int(os.environ['ARTIFACT_ID'])
          run_id = int(os.environ['GITHUB_RUN_ID'])
          expected_sha = os.environ['GITHUB_SHA']
          expected_branch = 'evidence/r318r-published-following-header-v1'
          expected_name = 'r318r-published-following-header-differential-evidence'
          expected_digest = os.environ['ARTIFACT_DIGEST']
          expected_repository_id = 1331779246

          assert artifact['id'] == artifact_id, (artifact['id'], artifact_id)
          assert artifact['name'] == expected_name, artifact['name']
          assert artifact['expired'] is False, artifact['expired']
          assert artifact['digest'] == expected_digest, (artifact['digest'], expected_digest)
          assert artifact['workflow_run']['id'] == run_id, artifact['workflow_run']
          assert artifact['workflow_run']['repository_id'] == expected_repository_id, artifact['workflow_run']
          assert artifact['workflow_run']['head_branch'] == expected_branch, artifact['workflow_run']
          assert artifact['workflow_run']['head_sha'] == expected_sha, artifact['workflow_run']
          assert run['id'] == run_id, run['id']
          assert run['head_branch'] == expected_branch, run['head_branch']
          assert run['head_sha'] == expected_sha, run['head_sha']
          assert run['repository']['id'] == expected_repository_id, run['repository']['id']
          print('R3_18R_RECEIPT_METADATA=PASS')
          PY

          echo "R3_18R_EVIDENCE_HEAD=$(git rev-parse HEAD)"
          echo "R3_18R_EVIDENCE_TREE=$(git rev-parse HEAD^{tree})"
          echo "R3_18R_AUTHORITY_RUN=$GITHUB_RUN_ID"
          echo "R3_18R_ARTIFACT_ID=$ARTIFACT_ID"
          echo "R3_18R_ARTIFACT_DIGEST=$ARTIFACT_DIGEST"
          cat r3_18r_aggregate.txt
          cat r3_18r_artifact_sha256.txt
          echo 'R3_18R_IMMUTABLE_RECEIPT=PASS'
