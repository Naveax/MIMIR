name: R3.18R Published Following Header Differential

on:
  push:
    branches:
      - evidence/r318r-published-following-header-v1

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '

      - name: Run R3.18R evidence
        shell: bash
        run: bash tools/_tmp_r318r_run.sh

      - name: Upload immutable R3.18R evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: r318r-published-following-header-differential-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            r3_18r_source_scope.txt
            r3_18r_replay_identity.tsv
            r3_18r_frozen_witnesses.json
            r3_18r_upstream_receipts.txt
            r3_18r_published_q_rows.tsv
            r3_18r_comparison.json
            r3_18r_negative_controls.txt
            r3_18r_aggregate.txt
            r3_18r_artifact_sha256.txt

      - name: Emit immutable receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" > /tmp/r318r_artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /tmp/r318r_run.json

          python3 - <<'PY'
          import json
          import os

          with open('/tmp/r318r_artifacts.json', encoding='utf-8') as f:
              artifacts = json.load(f)
          with open('/tmp/r318r_run.json', encoding='utf-8') as f:
              run = json.load(f)

          artifact_id = int(os.environ['ARTIFACT_ID'])
          run_id = int(os.environ['GITHUB_RUN_ID'])
          expected_sha = os.environ['GITHUB_SHA']
          expected_branch = 'evidence/r318r-published-following-header-v1'
          expected_name = 'r318r-published-following-header-differential-evidence'
          upload_digest = os.environ['ARTIFACT_DIGEST']
          expected_repository = os.environ['GITHUB_REPOSITORY']

          def normalize_sha256(value):
              if value is None:
                  return None
              value = value.strip().lower()
              return value[7:] if value.startswith('sha256:') else value

          matches = [a for a in artifacts.get('artifacts', []) if a.get('id') == artifact_id]
          print('MATCH_COUNT', len(matches), flush=True)
          assert len(matches) == 1, {
              'artifact_id': artifact_id,
              'seen_ids': [a.get('id') for a in artifacts.get('artifacts', [])],
          }
          artifact = matches[0]
          rest_digest = artifact.get('digest')
          rest_digest_normalized = normalize_sha256(rest_digest)
          upload_digest_normalized = normalize_sha256(upload_digest)

          print('ARTIFACT', json.dumps({
              'id': artifact.get('id'),
              'name': artifact.get('name'),
              'size_in_bytes': artifact.get('size_in_bytes'),
              'digest': rest_digest,
              'expired': artifact.get('expired'),
          }, sort_keys=True), flush=True)
          print('RUN', json.dumps({
              'id': run.get('id'),
              'head_branch': run.get('head_branch'),
              'head_sha': run.get('head_sha'),
              'repository_full_name': run.get('repository', {}).get('full_name'),
          }, sort_keys=True), flush=True)
          print('UPLOAD_DIGEST', upload_digest, flush=True)
          print('REST_DIGEST_NORMALIZED', rest_digest_normalized, flush=True)
          print('UPLOAD_DIGEST_NORMALIZED', upload_digest_normalized, flush=True)

          checks = {
              'artifact_name': artifact.get('name') == expected_name,
              'artifact_expired': artifact.get('expired') is False,
              'artifact_digest_if_present': rest_digest is None or rest_digest_normalized == upload_digest_normalized,
              'run_id': run.get('id') == run_id,
              'head_branch': run.get('head_branch') == expected_branch,
              'head_sha': run.get('head_sha') == expected_sha,
              'repository_full_name': run.get('repository', {}).get('full_name') == expected_repository,
          }
          receipt = {
              'artifact_id': artifact.get('id'),
              'artifact_name': artifact.get('name'),
              'artifact_size_in_bytes': artifact.get('size_in_bytes'),
              'artifact_rest_digest': rest_digest,
              'artifact_upload_digest': upload_digest,
              'artifact_rest_digest_normalized': rest_digest_normalized,
              'artifact_upload_digest_normalized': upload_digest_normalized,
              'artifact_expired': artifact.get('expired'),
              'run_id': run.get('id'),
              'head_branch': run.get('head_branch'),
              'head_sha': run.get('head_sha'),
              'repository_full_name': run.get('repository', {}).get('full_name'),
              'checks': checks,
          }
          print(json.dumps(receipt, sort_keys=True), flush=True)
          failed = [name for name, passed in checks.items() if not passed]
          assert not failed, {'failed_checks': failed, 'receipt': receipt}
          print('R3_18R_RECEIPT_METADATA=PASS', flush=True)
          PY

          echo "R3_18R_EVIDENCE_HEAD=$(git rev-parse HEAD)"
          echo "R3_18R_EVIDENCE_TREE=$(git rev-parse HEAD^{tree})"
          echo "R3_18R_AUTHORITY_RUN=$GITHUB_RUN_ID"
          echo "R3_18R_ARTIFACT_ID=$ARTIFACT_ID"
          echo "R3_18R_ARTIFACT_DIGEST=$ARTIFACT_DIGEST"
          cat r3_18r_aggregate.txt
          cat r3_18r_artifact_sha256.txt
          echo 'R3_18R_IMMUTABLE_RECEIPT=PASS'
