name: R3.18O Clean Admission Preparation

on:
  push:
    branches:
      - ops/r318o-admission-prepare

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - name: Checkout ops head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc --version | grep -F 'rustc 1.85.0 '

      - name: Build and validate clean admission commit
        shell: bash
        env:
          BASE_MAIN: c1d68daf989952ccf40645ca99616bccf43bb2f4
          ADMISSION_BRANCH: admission/r318o-following-property-header-v2
        run: |
          set -euxo pipefail
          OPS="$PWD"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$BASE_MAIN"
          git worktree add --detach "$WORK" "$BASE_MAIN"
          python3 "$OPS/tools/_tmp_r318o_admit.py" "$WORK"

          python3 - "$WORK" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          p = root / "docs/continuity/MIMIR_CONTINUITY_STATE.json"
          d = json.loads(p.read_text(encoding="utf-8"))

          files = d["next_files_to_read"]
          o_spec = "docs/continuity/MIMIR_R3_18O_EXECUTION_SPEC.md"
          o_decision = "docs/continuity/MIMIR_R3_18O_DECISION.md"
          p_spec = "docs/continuity/MIMIR_R3_18P_EXECUTION_SPEC.md"
          files = [x for x in files if x not in {o_decision, p_spec}]
          idx = files.index(o_spec) + 1
          files[idx:idx] = [o_decision, p_spec]
          d["next_files_to_read"] = files

          closed = d["closed_now"]
          old = "following property stream/header/payload after the R3.18M control bit"
          if old not in closed:
              raise SystemExit("closed_now R3.18O wording drift")
          closed[closed.index(old)] = "production following-property header composition after the R3.18M control bit (R3.18O is evidence-only)"
          closed.insert(closed.index("another property control bit beyond the R3.18M stop"), "following payload after the R3.18O evidence stop")

          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + "\n", encoding="utf-8", newline="\n")
          print("R3_18O_ADMISSION_ORDER_FIX=PASS")
          PY

          cd "$WORK"
          git diff --check
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected=(
            'MIMIR_CONTINUE_HERE.md'
            'MIMIR_KNOWLEDGE_GRAPH.md'
            'docs/continuity/MIMIR_BOUNDARY_LOCKS.md'
            'docs/continuity/MIMIR_CONTINUITY_STATE.json'
            'docs/continuity/MIMIR_CURRENT_STATE.md'
            'docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md'
            'docs/continuity/MIMIR_PROGRESS_LEDGER.md'
            'docs/continuity/MIMIR_R3_18O_DECISION.md'
            'docs/continuity/MIMIR_R3_18P_EXECUTION_SPEC.md'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf '%s\n' '--- CHANGED ---' "${changed[@]}" '--- EXPECTED ---' "${expected_sorted[@]}"
          test "${#changed[@]}" -eq 9
          test "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

          git diff --exit-code "$BASE_MAIN" -- crates Cargo.toml Cargo.lock external_fixtures test_corpus scripts .github/workflows
          python3 -m json.tool docs/continuity/MIMIR_CONTINUITY_STATE.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/continuity/MIMIR_CONTINUITY_STATE.json').read_text(encoding='utf-8'))
          f=d['next_files_to_read']
          trio=[
              'docs/continuity/MIMIR_R3_18O_EXECUTION_SPEC.md',
              'docs/continuity/MIMIR_R3_18O_DECISION.md',
              'docs/continuity/MIMIR_R3_18P_EXECUTION_SPEC.md',
          ]
          pos=[f.index(x) for x in trio]
          if not (pos[0] + 1 == pos[1] and pos[1] + 1 == pos[2]):
              raise SystemExit(f'continuity reading-order drift: {pos}')
          if 'production following-property header composition after the R3.18M control bit (R3.18O is evidence-only)' not in d['closed_now']:
              raise SystemExit('production/evidence boundary wording missing')
          print('R3_18O_CONTINUITY_ORDER=PASS')
          PY
          grep -Fq 'R3.18O following-property header evidence: OUTCOME A / CLOSED' MIMIR_KNOWLEDGE_GRAPH.md
          grep -Fq 'R3.18P following-property header context contract: ACTIVE' MIMIR_KNOWLEDGE_GRAPH.md
          python3 - <<'PY'
          from pathlib import Path
          s=Path('MIMIR_KNOWLEDGE_GRAPH.md').read_text(encoding='utf-8')
          trio=[
              'docs/continuity/MIMIR_R3_18O_EXECUTION_SPEC.md',
              'docs/continuity/MIMIR_R3_18O_DECISION.md',
              'docs/continuity/MIMIR_R3_18P_EXECUTION_SPEC.md',
          ]
          pos=[s.index(f'`{x}`') for x in trio]
          if not pos[0] < pos[1] < pos[2]:
              raise SystemExit(f'KG reading-order drift: {pos}')
          print('R3_18O_KG_ORDER=PASS')
          PY
          grep -Fq '# CURRENT PASS CHECKLIST — R3.18P' MIMIR_CONTINUE_HERE.md
          test "$(grep -c '^# CURRENT PASS CHECKLIST — R3.18N$' MIMIR_CONTINUE_HERE.md)" -eq 0
          grep -Fq 'artifact: `9284144768`' docs/continuity/MIMIR_R3_18O_DECISION.md
          grep -Fq 'sha256:e6dc02f087395e2d6b5fb568233484430feba51223848367edd2c6cf15b4b94d' docs/continuity/MIMIR_R3_18O_DECISION.md
          grep -Fq 'unique_exact_context_count = 18' docs/continuity/MIMIR_R3_18P_EXECUTION_SPEC.md

          pwsh -NoProfile -File scripts/verify_repo.ps1

          git config user.name 'MIMIR Admission Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "${expected[@]}"
          git commit -m 'Admit R3.18O and open R3.18P'
          CLEAN_SHA="$(git rev-parse HEAD)"
          CLEAN_TREE="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^)" = "$BASE_MAIN"
          test "$(git diff --name-only "$BASE_MAIN" HEAD | sort)" = "$(printf '%s\n' "${expected_sorted[@]}")"
          git diff --exit-code "$BASE_MAIN" HEAD -- crates Cargo.toml Cargo.lock external_fixtures test_corpus scripts .github/workflows

          pwsh -NoProfile -File scripts/verify_repo.ps1

          if git ls-remote --exit-code --heads origin "$ADMISSION_BRANCH" >/dev/null 2>&1; then
            echo "admission branch already exists; refusing overwrite"
            exit 1
          fi
          git push origin "HEAD:refs/heads/$ADMISSION_BRANCH"
          test "$(git ls-remote origin "refs/heads/$ADMISSION_BRANCH" | awk '{print $1}')" = "$CLEAN_SHA"

          printf 'R3_18O_CLEAN_ADMISSION_SHA=%s\n' "$CLEAN_SHA" | tee "$OPS/r3_18o_clean_admission_receipt.txt"
          printf 'R3_18O_CLEAN_ADMISSION_TREE=%s\n' "$CLEAN_TREE" | tee -a "$OPS/r3_18o_clean_admission_receipt.txt"
          printf 'R3_18O_CLEAN_ADMISSION_PARENT=%s\n' "$BASE_MAIN" | tee -a "$OPS/r3_18o_clean_admission_receipt.txt"
          printf 'R3_18O_CLEAN_ADMISSION_SCOPE=9_DOCS_ONLY\n' | tee -a "$OPS/r3_18o_clean_admission_receipt.txt"
          printf 'R3_18O_CLEAN_ADMISSION_VERIFY_REPO=PASS\n' | tee -a "$OPS/r3_18o_clean_admission_receipt.txt"

      - name: Upload clean admission receipt
        uses: actions/upload-artifact@v4
        with:
          name: r318o-clean-admission-receipt
          if-no-files-found: error
          retention-days: 30
          path: r3_18o_clean_admission_receipt.txt
