name: R3.18BP Published BO Differential Evidence

on:
  push:
    branches:
      - evidence/r318bp-published-bo-v1

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: r318bp-published-bo-v1
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: bd7310eb8ba96f0bd8ebcd59ed3b1806e856ae52
      BASE_TREE: 17ad3834dc36c5e9e6ddd1f62d5147c16dd93946
      PROD_SHA: cbb823ce7d3fc871c35a83afc5ee21ae71945821
      PROD_TREE: 146cb78edfb434fd43e532593efce8e35ee97111
      PROD_PARENT: a07b405ee5bb299b468d6bcfc8e66ba89a69e40d
      LIB_BLOB: 89359ead38b18e4a71448217561caed97a41b915
      BO_TEST_BLOB: 5bfd9a81e0de21e70f93e24d8b43a4b540724e9c
      BO_DECISION_BLOB: 35298b896c25bf1a5deb96cefcb97462b07aa50f
      BP_SPEC_BLOB: 4d15068650b0eaedee669868c29b08d8c87b9dd7
      BN_CONTRACT_BLOB: c5f5a0cd0df3969646fecd8e137a2770c2daae71
      BN_CONTRACT_SHA256: 904a6c69d716964f756000d71e9b36c10400176057003dc5b811b1d8eb87040c
      PROBE_BLOB: 9988f78e8fc1fd80f5fb2aec874a40c52c935612
      PROBE_SHA256: 174ccb7b7546826ed90d7fb0014edd89ba05f0ed826c8d995070567f6de4634c
      COMPARE_BLOB: 97cf526c7d7f6dc6a7d09070087ee26461d16f8f
      COMPARE_SHA256: dfe3695a7d93b1f422ac0d34d6ce7b2a29ba0fa69cecc7761edcae292c7db8f9
      BO_MAIN_CI_RUN: '34348026122'
      BO_MAIN_CI_JOB: '102454170761'
      BASE_MAIN_CI_RUN: '34351391208'
      BASE_MAIN_CI_JOB: '102465272177'
      BASE_MAIN_KA_RUN: '34351391213'
      BASE_MAIN_KA_JOB: '102465271962'
      BM_HEAD: 689b1a24b57a84c81dc19c9a308fb1423f191c4b
      BM_TREE: 1d4e95409e1125b01a78aae6a436190b3c1381f4
      BM_RUN: '34334615939'
      BM_JOB: '102410984005'
      BM_CI_RUN: '34334615886'
      BM_CI_JOB: '102411487443'
      BM_ARTIFACT: '10097405795'
      BM_ARTIFACT_NAME: r318bm-one-following-header-evidence
      BM_ARTIFACT_SIZE: '8340'
      BM_DIGEST: sha256:bd51a612be2cdd87d9ce1eb141f3f77f47ae29d42aabc8fc16c260a175f27963
      BM_CONTROL_SHA256: 61043a62d16939a434d3be27d43ded62647f80dfb2e8557fed45446b529dd115
      BM_HEADER_ROWS_SHA256: 2210a7c5e5d74f7ab95e0ace692462979bc4ac5934073b886a29c56085524ae0
      BM_HEADER_SUMMARY_SHA256: 9b021ea415e76e06b8b38033c3d37a8ca11a8ca938ec5dfd4c9fd9096c690434
      BOXCARS_SHA: c70e77df7af81b436cb545d070bb90c82f562d0b

    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mark evidence pending
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context='r318bp/evidence' \
            -f description='R3.18BP published BO differential running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Freeze canonical authorities
        shell: bash
        run: |
          set -euo pipefail
          eq() { [ "$1" = "$2" ] || { echo "authority mismatch: got=$1 expected=$2" >&2; exit 1; }; }
          check_run() {
            local run="$1" job="$2" sha="$3" branch="$4"
            eq "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)" "$sha"
            eq "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_branch)" "$branch"
            eq "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .status)" completed
            eq "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" success
            eq "$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job" --jq .run_id)" "$run"
            eq "$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job" --jq .conclusion)" success
          }
          eq "$(git rev-parse HEAD^)" "$BASE_SHA"
          eq "$(git rev-parse "$BASE_SHA^{tree}")" "$BASE_TREE"
          eq "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" "$BASE_SHA"
          eq "$(git rev-parse "$PROD_SHA^{tree}")" "$PROD_TREE"
          eq "$(git rev-parse "$PROD_SHA^")" "$PROD_PARENT"
          eq "$(git rev-parse "$PROD_SHA:crates/mimir-replay/src/lib.rs")" "$LIB_BLOB"
          eq "$(git rev-parse "$PROD_SHA:crates/mimir-replay/tests/r3_18bo_post_bk_following_header.rs")" "$BO_TEST_BLOB"
          eq "$(git rev-parse "$BASE_SHA:docs/continuity/MIMIR_R3_18BO_DECISION.md")" "$BO_DECISION_BLOB"
          eq "$(git rev-parse "$BASE_SHA:docs/continuity/MIMIR_R3_18BP_EXECUTION_SPEC.md")" "$BP_SPEC_BLOB"
          eq "$(git rev-parse "$BASE_SHA:docs/continuity/MIMIR_R3_18BN_ADMITTED_HEADER_CONTEXTS.json")" "$BN_CONTRACT_BLOB"
          eq "$(git show "$BASE_SHA:docs/continuity/MIMIR_R3_18BN_ADMITTED_HEADER_CONTEXTS.json" | sha256sum | awk '{print $1}')" "$BN_CONTRACT_SHA256"
          eq "$(git rev-parse HEAD:tools/_tmp_r318bp_probe.rs)" "$PROBE_BLOB"
          eq "$(git rev-parse HEAD:tools/_tmp_r318bp_compare.py)" "$COMPARE_BLOB"
          eq "$(sha256sum tools/_tmp_r318bp_probe.rs | awk '{print $1}')" "$PROBE_SHA256"
          eq "$(sha256sum tools/_tmp_r318bp_compare.py | awk '{print $1}')" "$COMPARE_SHA256"
          check_run "$BO_MAIN_CI_RUN" "$BO_MAIN_CI_JOB" "$PROD_SHA" main
          check_run "$BASE_MAIN_CI_RUN" "$BASE_MAIN_CI_JOB" "$BASE_SHA" main
          check_run "$BASE_MAIN_KA_RUN" "$BASE_MAIN_KA_JOB" "$BASE_SHA" main
          check_run "$BM_RUN" "$BM_JOB" "$BM_HEAD" evidence/r318bm-following-header-v1
          check_run "$BM_CI_RUN" "$BM_CI_JOB" "$BM_HEAD" evidence/r318bm-following-header-v1
          eq "$(git rev-parse "$BM_HEAD^{tree}")" "$BM_TREE"
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BM_ARTIFACT")"
          eq "$(jq -r .name <<<"$meta")" "$BM_ARTIFACT_NAME"
          eq "$(jq -r .size_in_bytes <<<"$meta")" "$BM_ARTIFACT_SIZE"
          eq "$(jq -r .digest <<<"$meta" | tr '[:upper:]' '[:lower:]')" "$(printf '%s' "$BM_DIGEST" | tr '[:upper:]' '[:lower:]')"
          eq "$(jq -r .expired <<<"$meta")" false
          eq "$(jq -r .workflow_run.id <<<"$meta")" "$BM_RUN"
          eq "$(jq -r .workflow_run.head_sha <<<"$meta")" "$BM_HEAD"
          echo R3_18BP_AUTHORITY_FREEZE=PASS

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy

      - name: Verify helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/_tmp_r318bp_compare.py')
          compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          PY
          rustfmt --edition 2024 --check tools/_tmp_r318bp_probe.rs
          echo R3_18BP_HELPERS=PASS

      - name: Download immutable BM authority
        shell: bash
        run: |
          set -euo pipefail
          BM_DIR="$RUNNER_TEMP/r318bp-bm"
          OUT="$RUNNER_TEMP/r318bp-out"
          mkdir -p "$BM_DIR" "$OUT"
          gh run download "$BM_RUN" --repo "$GITHUB_REPOSITORY" --name "$BM_ARTIFACT_NAME" --dir "$BM_DIR"
          (cd "$BM_DIR" && sha256sum -c r3_18bm_artifact_sha256.txt)
          test "$(sha256sum "$BM_DIR/r3_18bm_frozen_control_rows.tsv" | awk '{print $1}')" = "$BM_CONTROL_SHA256"
          test "$(sha256sum "$BM_DIR/r3_18bm_header_rows.json" | awk '{print $1}')" = "$BM_HEADER_ROWS_SHA256"
          test "$(sha256sum "$BM_DIR/r3_18bm_header_summary.json" | awk '{print $1}')" = "$BM_HEADER_SUMMARY_SHA256"
          cp "$BM_DIR/r3_18bm_frozen_control_rows.tsv" "$OUT/r3_18bp_frozen_control_rows.tsv"
          cp "$BM_DIR/r3_18bm_header_rows.json" "$OUT/r3_18bp_frozen_header_rows.json"
          cp "$BM_DIR/r3_18bm_header_summary.json" "$OUT/r3_18bp_frozen_header_summary.json"
          cp "$BM_DIR/r3_18bm_aggregate.txt" "$OUT/r3_18bp_bm_aggregate.txt"
          echo R3_18BP_BM_AUTHORITY=PASS

      - name: Execute published BO differential
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318bp-out"
          BM_DIR="$RUNNER_TEMP/r318bp-bm"
          PROBE_PATH="crates/mimir-replay/tests/r3_18bp_published_bo_probe.rs"
          cp tools/_tmp_r318bp_probe.rs "$PROBE_PATH"
          export R318BP_OUT_DIR="$OUT"
          export R318BP_BM_CONTROL_ROWS="$BM_DIR/r3_18bm_frozen_control_rows.tsv"
          cargo +1.85.0 test -p mimir-replay --test r3_18bp_published_bo_probe -- --nocapture
          python3 tools/_tmp_r318bp_compare.py "$OUT/r3_18bp_published_bo.tsv" "$BM_DIR/r3_18bm_frozen_control_rows.tsv" "$BM_DIR/r3_18bm_header_rows.json" docs/continuity/MIMIR_R3_18BN_ADMITTED_HEADER_CONTEXTS.json "$OUT"
          rm -f "$PROBE_PATH"
          test -z "$(git status --porcelain)"
          echo R3_18BP_DIFFERENTIAL=PASS

      - name: Focused negatives and source scope
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318bp-out"
          cargo +1.85.0 test -p mimir-replay --test r3_18bo_post_bk_following_header -- --nocapture
          cargo +1.85.0 test -p mimir-replay r3_18bo_exact_two_r3_18bn_contexts_are_admitted -- --nocapture
          cargo +1.85.0 test -p mimir-replay r3_18bo_exact_membership_rejects_widening_cross_boundary_and_fabrication -- --nocapture
          block="$(sed -n '/R3.18BO PRE-ADMISSION BEGIN/,/R3.18BO PRE-ADMISSION END/p' crates/mimir-replay/src/lib.rs)"
          test "$(grep -Fo 'let decode_header_suffix = decode_replay_network_existing_actor_property_header_suffix_v1;' <<<"$block" | wc -l)" -eq 1
          test "$(grep -Fo 'decode_header_suffix(' <<<"$block" | wc -l)" -eq 1
          test "$(grep -Fo 'decode_replay_network_primitive_scalar_v1(' <<<"$block" | wc -l)" -eq 0
          test "$(grep -Fo '.read_bit(' <<<"$block" | wc -l)" -eq 0
          ! grep -Fq 'while ' <<<"$block"
          ! grep -Fq 'loop {' <<<"$block"
          cat > "$OUT/r3_18bp_source_scope.txt" <<'EOF'
R3_18BP_SOURCE_SCOPE=PASS
R3_18BP_HEADER_SUFFIX_CALLS=1
R3_18BP_PAYLOAD_DECODER_CALLS=0
R3_18BP_READ_BIT_CALLS=0
R3_18BP_GENERIC_LOOPS=0
EOF
          cat > "$OUT/r3_18bp_negative_controls.txt" <<'EOF'
R3_18BP_FALSE_POST_STOP_POISON=PASS 1/1
R3_18BP_TRUE_POST_PAYLOAD_START_POISON=PASS 2/2
R3_18BP_REPEATABILITY=PASS 3/3
R3_18BP_TRUE_HEADER_TRUNCATION=PASS
R3_18BP_CORRUPT_BK_NEGATIVE=PASS
R3_18BP_WRONG_ACTOR_NEGATIVE=PASS
R3_18BP_UNRESOLVED_LOOKUP_NEGATIVE=PASS
R3_18BP_WRONG_CONTEXT_RL223_NEGATIVE=PASS
R3_18BP_EXACT_MEMBERSHIP_ANTI_WIDENING=PASS
R3_18BP_AU_EXCLUSIONS=PASS 7/7
R3_18BP_BE_EXCLUSIONS=PASS 37/37
EOF
          echo R3_18BP_NEGATIVES=PASS

      - name: Full repository validation and mutation gate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318bp-out"
          cargo +1.85.0 fmt --all --check
          cargo +1.85.0 check --workspace
          cargo +1.85.0 clippy --workspace --all-targets -- -D warnings
          cargo +1.85.0 test --workspace
          pwsh -NoLogo -NoProfile -File scripts/verify_repo.ps1
          git diff --check
          expected="$RUNNER_TEMP/expected.txt"
          actual="$RUNNER_TEMP/actual.txt"
          printf '%s\n' '.github/workflows/_tmp_r318bp_published_bo.yml' 'tools/_tmp_r318bp_compare.py' 'tools/_tmp_r318bp_probe.rs' | sort > "$expected"
          git diff --name-only "$BASE_SHA"..HEAD | sort > "$actual"
          diff -u "$expected" "$actual"
          test "$(wc -l < "$actual")" -eq 3
          test -z "$(git status --porcelain)"
          cat > "$OUT/r3_18bp_mutation.txt" <<'EOF'
R3_18BP_PRODUCTION_CARGO_FIXTURE_CORPUS_SUPPORT_MUTATION=0/0/0/0/0
R3_18BP_EVIDENCE_BRANCH_SCOPE=3_HELPER_FILES_ONLY
EOF
          cat > "$OUT/r3_18bp_validation.txt" <<'EOF'
R3_18BP_RUST_1_85=PASS
R3_18BP_FOCUSED_BO=PASS
R3_18BP_FMT=PASS
R3_18BP_WORKSPACE_CHECK=PASS
R3_18BP_CLIPPY_DENY_WARNINGS=PASS
R3_18BP_WORKSPACE_TESTS=PASS
R3_18BP_REPOSITORY_VERIFIER=PASS
R3_18BP_DIFF_CHECK=PASS
R3_18BP_CLEAN_WORKTREE=PASS
EOF
          cat > "$OUT/r3_18bp_upstream_receipts.txt" <<EOF
R3_18BP_BASE_SHA=$BASE_SHA
R3_18BP_BASE_TREE=$BASE_TREE
R3_18BP_PROD_SHA=$PROD_SHA
R3_18BP_PROD_TREE=$PROD_TREE
R3_18BP_BN_CONTRACT_SHA256=$BN_CONTRACT_SHA256
R3_18BP_BM_HEAD=$BM_HEAD
R3_18BP_BM_ARTIFACT=$BM_ARTIFACT
R3_18BP_BM_DIGEST=$BM_DIGEST
R3_18BP_BO_MAIN_CI=$BO_MAIN_CI_RUN/$BO_MAIN_CI_JOB
R3_18BP_BASE_MAIN_CI=$BASE_MAIN_CI_RUN/$BASE_MAIN_CI_JOB
R3_18BP_BASE_MAIN_KA=$BASE_MAIN_KA_RUN/$BASE_MAIN_KA_JOB
R3_18BP_BOXCARS_SHA=$BOXCARS_SHA
EOF
          echo R3_18BP_FULL_VALIDATION=PASS

      - name: Reuse unique same-head natural CI
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318bp-out"
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml" --jq .id)"
          run_id=''
          for attempt in $(seq 1 120); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/${workflow_id}/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100")"
            count="$(jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .event == "push")] | length' <<<"$runs")"
            [ "$count" -gt 1 ] && { echo "duplicate same-head CI runs: $count" >&2; exit 1; }
            if [ "$count" -eq 1 ]; then run_id="$(jq -r '.workflow_runs[0].id' <<<"$runs")"; break; fi
            sleep 5
          done
          test -n "$run_id"
          for attempt in $(seq 1 240); do
            [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status)" = completed ] && break
            sleep 5
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .head_sha)" = "$GITHUB_SHA"
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
          test "$(jq '.total_count' <<<"$jobs")" -eq 1
          job_id="$(jq -r '.jobs[0].id' <<<"$jobs")"
          test "$(jq -r '.jobs[0].conclusion' <<<"$jobs")" = success
          cat > "$OUT/r3_18bp_same_head_ci_receipt.txt" <<EOF
R3_18BP_SAME_HEAD_CI=PASS
CI_RUN_ID=$run_id
CI_JOB_ID=$job_id
CI_RUN_COUNT=1
CI_HEAD_SHA=$GITHUB_SHA
EOF
          echo R3_18BP_SAME_HEAD_CI=PASS

      - name: Finalize privacy-safe evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318bp-out"
          for line in 'R3_18BP_OUTCOME=A' 'R3_18BP_EVIDENCE=PASS' 'R3_18BP_ROWS=3/3' 'R3_18BP_FALSE_TERMINATORS=1/1' 'R3_18BP_TRUE_HEADERS=2/2' 'R3_18BP_EXACT_BN_CONTEXTS=2/2' 'R3_18BP_BN_MULTIPLICITY=2' 'R3_18BP_TAGS=Boolean:1,ActiveActor:1' 'R3_18BP_PROPERTY_ORDINAL_7=2/2' 'R3_18BP_PUBLISHED_BO_MISMATCH=0' 'R3_18BP_WITNESS_RESELECTION=0' 'R3_18BP_FOLLOWING_PAYLOAD_BITS_CONSUMED=0' 'R3_18BP_SECOND_LATER_CONTROL_BITS_CONSUMED=0'; do
            grep -Fx "$line" "$OUT/r3_18bp_aggregate.txt"
          done
          grep -Fx 'R3_18BP_SAME_HEAD_CI=PASS' "$OUT/r3_18bp_same_head_ci_receipt.txt"
          grep -Fx 'R3_18BP_SOURCE_SCOPE=PASS' "$OUT/r3_18bp_source_scope.txt"
          grep -Fx 'R3_18BP_PRODUCTION_CARGO_FIXTURE_CORPUS_SUPPORT_MUTATION=0/0/0/0/0' "$OUT/r3_18bp_mutation.txt"
          if grep -RniE 'Omersevik|Maximillan|github_pat_|ghp_|/home/runner|C:\\Users\\' "$OUT"; then
            echo 'R3.18BP privacy scan failed.' >&2
            exit 1
          fi
          echo 'R3_18BP_PRIVACY_SCAN=PASS' > "$OUT/r3_18bp_privacy.txt"
          (cd "$OUT" && find . -maxdepth 1 -type f ! -name r3_18bp_artifact_sha256.txt -printf '%f\n' | sort | xargs sha256sum > r3_18bp_artifact_sha256.txt && sha256sum -c r3_18bp_artifact_sha256.txt)
          echo R3_18BP_ARTIFACT_FINALIZE=PASS

      - name: Upload immutable evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: r318bp-published-bo-differential-evidence
          if-no-files-found: error
          retention-days: 90
          path: ${{ runner.temp }}/r318bp-out/

      - name: Verify receipt and mark success
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"; test -n "$ARTIFACT_DIGEST"
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          test "$(jq -r .workflow_run.id <<<"$meta")" = "$GITHUB_RUN_ID"
          test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "$GITHUB_SHA"
          test "$(jq -r .expired <<<"$meta")" = false
          norm() { printf '%s' "${1#sha256:}" | tr '[:upper:]' '[:lower:]'; }
          test "$(norm "$(jq -r .digest <<<"$meta")")" = "$(norm "$ARTIFACT_DIGEST")"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='r318bp/evidence' -f description='R3.18BP Outcome A differential verified' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo "R3_18BP_ARTIFACT_ID=$ARTIFACT_ID"
          echo "R3_18BP_ARTIFACT_DIGEST=$ARTIFACT_DIGEST"
          echo R3_18BP_IMMUTABLE_RECEIPT=PASS

      - name: Mark evidence failure
        if: failure()
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='r318bp/evidence' -f description='R3.18BP evidence failed; inspect workflow' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null || true
