name: R3.18BI Continuity Admission and R3.18BJ Open v1

on:
  push:
    branches:
      - automation/r318bi-continuity-bj-builder-v1

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: r318bi-continuity-bj-builder-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RUNNER_BLOB: 04df72b21ab7daa3c687bcc495671cb0a4b95c97
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Execute immutable R3.18BI continuity builder
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$RUNNER_BLOB" --jq .content | tr -d '\n' | base64 -d > "$RUNNER_TEMP/r318bi_continuity_bj_runner.sh"
          test "$(git hash-object "$RUNNER_TEMP/r318bi_continuity_bj_runner.sh")" = "$RUNNER_BLOB"
          bash -n "$RUNNER_TEMP/r318bi_continuity_bj_runner.sh"
          bash "$RUNNER_TEMP/r318bi_continuity_bj_runner.sh"
