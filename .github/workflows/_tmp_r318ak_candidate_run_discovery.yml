name: R3.18AK Candidate Run Discovery

on:
  push:
    branches:
      - ops/r318ak-candidate-run-discovery-v1
    paths:
      - .github/workflows/_tmp_r318ak_candidate_run_discovery_trigger.txt

concurrency:
  group: r318ak-candidate-run-discovery
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_BRANCH: ops/r318ak-production-v1
      CANDIDATE_SHA: f20f529e3ada6e9a671ea91e5676a17a00770145
    steps:
      - uses: actions/checkout@v6
      - name: Mark discovery pending
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='r318ak/candidate-run-discovery' \
            -f description='R3.18AK candidate CI discovery running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Discover and verify candidate CI
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/r318ak_candidate_ci.txt"
          for attempt in $(seq 1 36); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$CANDIDATE_BRANCH&head_sha=$CANDIDATE_SHA&event=push&per_page=20")"
            count="$(jq '[.workflow_runs[] | select(.name == "CI")] | length' <<<"$runs")"
            if [ "$count" -gt 1 ]; then
              echo "duplicate candidate CI detected: $count" >&2
              exit 1
            fi
            if [ "$count" -eq 1 ]; then
              status="$(jq -r '.workflow_runs[] | select(.name == "CI") | .status' <<<"$runs")"
              if [ "$status" = completed ]; then
                conclusion="$(jq -r '.workflow_runs[] | select(.name == "CI") | .conclusion' <<<"$runs")"
                test "$conclusion" = success
                run="$(jq -r '.workflow_runs[] | select(.name == "CI") | .id' <<<"$runs")"
                job="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '.jobs[0].id')"
                {
                  echo "R3_18AK_CANDIDATE_SHA=$CANDIDATE_SHA"
                  echo "R3_18AK_CANDIDATE_CI=$run/$job SUCCESS"
                  echo "R3_18AK_CANDIDATE_CI_COUNT=$count"
                  echo "R3_18AK_DUPLICATE_GUARD=PASS"
                } | tee "$receipt"
                cp "$receipt" r318ak_candidate_ci.txt
                exit 0
              fi
            fi
            sleep 10
          done
          echo "candidate CI did not settle uniquely within discovery window" >&2
          exit 1
      - name: Upload candidate receipt
        uses: actions/upload-artifact@v4
        with:
          name: r318ak-candidate-ci-receipt
          path: r318ak_candidate_ci.txt
          if-no-files-found: error
          retention-days: 7
      - name: Report discovery status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          description='R3.18AK candidate CI discovery failed'
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description='R3.18AK candidate CI discovery succeeded'
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='r318ak/candidate-run-discovery' \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
