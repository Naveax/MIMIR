name: R3.18BK Source Builder

on:
  push:
    branches:
      - production/r318bk-post-bi-control

permissions:
  contents: write
  actions: read

concurrency:
  group: r318bk-source-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: de8df0b2bb36454c97863d4078ce7829fd4ecb77
      HELPER_WORKFLOW: .github/workflows/r318bk-builder.yml
      HELPER_SCRIPT: tools/r318bk_builder.py
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Freeze base and helper-only pre-state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "$HELPER_WORKFLOW"
          test "${changed[1]}" = "$HELPER_SCRIPT"

      - name: Construct exact BK source candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 "$HELPER_SCRIPT"
          test -f crates/mimir-replay/tests/r3_18bk_post_bi_following_control.rs
          grep -Fq '// R3.18BK PRE-ADMISSION BEGIN bounded post-BI following control' crates/mimir-replay/src/lib.rs

      - name: Format and focused BK validation
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt clippy
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p mimir-replay --test r3_18bk_post_bi_following_control
          cargo test -p mimir-replay --test r3_18bi_post_be_following_payload
          cargo test -p mimir-replay --test r3_18be_post_ba_following_header

      - name: Full repository verification
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/verify_repo.ps1

      - name: Enforce exact source scope and commit clean tree
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirty < <(git status --short | sed -E 's/^...//' | sort)
          printf '%s\n' "${dirty[@]}"
          test "${#dirty[@]}" -eq 2
          test "${dirty[0]}" = 'crates/mimir-replay/src/lib.rs'
          test "${dirty[1]}" = 'crates/mimir-replay/tests/r3_18bk_post_bi_following_control.rs'

          rm -f "$HELPER_WORKFLOW" "$HELPER_SCRIPT"
          git add -A
          git config user.name 'MIMIR Production Bot'
          git config user.email '79841922+Naveax@users.noreply.github.com'
          git commit -m 'Implement R3.18BK bounded post-BI control'

          mapfile -t net < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf '%s\n' "${net[@]}"
          test "${#net[@]}" -eq 2
          test "${net[0]}" = 'crates/mimir-replay/src/lib.rs'
          test "${net[1]}" = 'crates/mimir-replay/tests/r3_18bk_post_bi_following_control.rs'
          test -z "$(git status --porcelain)"
          git push origin HEAD:production/r318bk-post-bi-control
