name: R3.18AR Published AQ Differential Evidence

on:
  push:
    branches:
      - evidence/r318ar-published-aq-differential-v1

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: r318ar-published-aq-differential-v1
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: 5bf20063a829526cc090ada8c4221d6b42ae5655
      BASE_TREE: 8fa16095e28b418d12c3050c69462ecae64ba880
      PROD_SHA: e1ccbef95c8424b689dee7d77fd8fde2af3e0204
      PROD_TREE: 4e7100625096594bcc5c5b4c6a8054c283643b13
      PROD_PARENT: ec2d6c29f90863d9e312856043d01fb98a0c2d2d
      LIB_BLOB: b886c58400de0efe0a6a6113d79e6f78e751a213
      AQ_TEST_BLOB: 983cbda666f40cbc739b250eac87bc4ce0c9eb99
      AR_SPEC_BLOB: 01492ab1495dd93d5f066282773020d5b2890dc5
      AQ_BUILDER_HEAD: 4fee8974780fa2f8897bf0fea14ce13333a2dac4
      AQ_BUILDER_RUN: '32860339919'
      AQ_BUILDER_JOB: '97842469079'
      AQ_RECEIPT_ARTIFACT: '9568109670'
      AQ_RECEIPT_SIZE: '1183'
      AQ_RECEIPT_DIGEST: sha256:1d865740559cb0748f840b3cca3d4ab9c627ac251bc15f6f99dbabb20c2e3afe
      AQ_VALIDATION_PR: '197'
      AQ_PR_CI_RUN: '32861522922'
      AQ_PR_CI_JOB: '97846413853'
      AQ_PUBLISHED_CI_RUN: '32861924684'
      AQ_PUBLISHED_CI_JOB: '97847764026'
      AP_HEAD: 736ac33c099a9183693bfcb2b5f5b74704a8808e
      AP_RUN: '32745234196'
      AP_JOB: '97489066582'
      AP_ARTIFACT: '9526988237'
      AP_ARTIFACT_NAME: r318ap-next-property-control-differential-evidence
      AP_ARTIFACT_SIZE: '9692'
      AP_DIGEST: sha256:b50b01bd87c0b61ca2e407abe43ac5db9fb15290f7cd3e908332d2ac2a26c4cc

    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Mark evidence pending
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='r318ar/evidence' \
            -f description='R3.18AR published AQ differential running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Freeze canonical authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$BASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$BASE_SHA" --jq .tree.sha)" = "$BASE_TREE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$BASE_SHA" --jq .parents[0].sha)" = "$PROD_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$PROD_SHA" --jq .tree.sha)" = "$PROD_TREE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$PROD_SHA" --jq .parents[0].sha)" = "$PROD_PARENT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/crates/mimir-replay/src/lib.rs?ref=$BASE_SHA" --jq .sha)" = "$LIB_BLOB"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/crates/mimir-replay/tests/r3_18aq_post_an_payload_control.rs?ref=$BASE_SHA" --jq .sha)" = "$AQ_TEST_BLOB"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/continuity/MIMIR_R3_18AR_EXECUTION_SPEC.md?ref=$BASE_SHA" --jq .sha)" = "$AR_SPEC_BLOB"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AQ_BUILDER_RUN" --jq .head_sha)" = "$AQ_BUILDER_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AQ_BUILDER_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$AQ_BUILDER_JOB" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$AQ_RECEIPT_ARTIFACT" --jq .size_in_bytes)" = "$AQ_RECEIPT_SIZE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$AQ_RECEIPT_ARTIFACT" --jq .digest)" = "$AQ_RECEIPT_DIGEST"

          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$AQ_VALIDATION_PR" --jq .state)" = closed
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$AQ_VALIDATION_PR" --jq '.merged_at // ""')" = ""
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/$AQ_VALIDATION_PR" --jq .head.sha)" = "$PROD_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AQ_PR_CI_RUN" --jq .head_sha)" = "$PROD_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AQ_PR_CI_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$AQ_PR_CI_JOB" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AQ_PUBLISHED_CI_RUN" --jq .head_sha)" = "$PROD_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AQ_PUBLISHED_CI_RUN" --jq .event)" = push
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AQ_PUBLISHED_CI_RUN" --jq .head_branch)" = main
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AQ_PUBLISHED_CI_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$AQ_PUBLISHED_CI_JOB" --jq .conclusion)" = success

          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AP_RUN" --jq .head_sha)" = "$AP_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AP_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$AP_JOB" --jq .conclusion)" = success
          ap_meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$AP_ARTIFACT")"
          test "$(jq -r .name <<<"$ap_meta")" = "$AP_ARTIFACT_NAME"
          test "$(jq -r .size_in_bytes <<<"$ap_meta")" = "$AP_ARTIFACT_SIZE"
          test "$(jq -r .digest <<<"$ap_meta")" = "$AP_DIGEST"
          test "$(jq -r .expired <<<"$ap_meta")" = false

          echo R3_18AR_AUTHORITY_FREEZE=PASS

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '

      - name: Execute deterministic R3.18AR differential
        shell: bash
        run: |
          set -euo pipefail
          bash tools/_tmp_r318ar_run.sh

      - name: Reuse and verify unique same-head natural CI
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318ar-out"
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml" --jq .id)"
          run_id=''
          for attempt in $(seq 1 90); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100")"
            count="$(jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .event == "push")] | length' <<<"$runs")"
            if [ "$count" -eq 1 ]; then
              run_id="$(jq -r '.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .event == "push") | .id' <<<"$runs")"
              break
            fi
            if [ "$count" -gt 1 ]; then
              echo "duplicate same-head CI runs detected: $count" >&2
              exit 1
            fi
            sleep 5
          done
          test -n "$run_id"
          for attempt in $(seq 1 180); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
            if [ "$state" = completed ]; then
              break
            fi
            sleep 5
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)" = completed
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)" = "$GITHUB_SHA"
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          test "$(jq '.total_count' <<<"$jobs")" -eq 1
          job_id="$(jq -r '.jobs[0].id' <<<"$jobs")"
          test "$(jq -r '.jobs[0].conclusion' <<<"$jobs")" = success
          {
            echo R3_18AR_SAME_HEAD_CI=PASS
            echo CI_RUN_ID=$run_id
            echo CI_JOB_ID=$job_id
            echo CI_RUN_COUNT=1
            echo CI_HEAD_SHA=$GITHUB_SHA
          } | tee "$OUT/r3_18ar_same_head_ci_receipt.txt"

          (
            cd "$OUT"
            sha256sum \
              r3_18ar_source_scope.txt \
              r3_18ar_replay_identity.tsv \
              r3_18ar_frozen_targets.tsv \
              r3_18ar_summary.json \
              r3_18ar_comparison.tsv \
              r3_18ar_negative_controls.txt \
              r3_18ar_validation.txt \
              r3_18ar_aggregate.txt \
              r3_18ar_upstream_receipts.txt \
              r3_18ar_same_head_ci_receipt.txt \
              > r3_18ar_artifact_sha256.txt
          )

      - name: Upload immutable R3.18AR evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: r318ar-published-aq-differential-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/r318ar-out/r3_18ar_source_scope.txt
            ${{ runner.temp }}/r318ar-out/r3_18ar_replay_identity.tsv
            ${{ runner.temp }}/r318ar-out/r3_18ar_frozen_targets.tsv
            ${{ runner.temp }}/r318ar-out/r3_18ar_summary.json
            ${{ runner.temp }}/r318ar-out/r3_18ar_comparison.tsv
            ${{ runner.temp }}/r318ar-out/r3_18ar_negative_controls.txt
            ${{ runner.temp }}/r318ar-out/r3_18ar_validation.txt
            ${{ runner.temp }}/r318ar-out/r3_18ar_aggregate.txt
            ${{ runner.temp }}/r318ar-out/r3_18ar_upstream_receipts.txt
            ${{ runner.temp }}/r318ar-out/r3_18ar_same_head_ci_receipt.txt
            ${{ runner.temp }}/r318ar-out/r3_18ar_artifact_sha256.txt

      - name: Verify immutable receipt and mark success
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318ar-out"
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          test "$(jq -r '.workflow_run.id' <<<"$meta")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$meta")" = "$GITHUB_SHA"
          test "$(jq -r '.expired' <<<"$meta")" = false
          norm() { printf '%s' "${1#sha256:}" | tr '[:upper:]' '[:lower:]'; }
          test "$(norm "$(jq -r '.digest' <<<"$meta")")" = "$(norm "$ARTIFACT_DIGEST")"
          grep -Fx 'R3_18AR_OUTCOME=A' "$OUT/r3_18ar_aggregate.txt"
          grep -Fx 'R3_18AR_EVIDENCE=PASS' "$OUT/r3_18ar_aggregate.txt"
          grep -Fx 'R3_18AR_FROZEN_ROWS=47/47' "$OUT/r3_18ar_aggregate.txt"
          grep -Fx 'R3_18AR_PUBLISHED_AQ_EXACT=47/47' "$OUT/r3_18ar_aggregate.txt"
          grep -Fx 'R3_18AR_PUBLISHED_AN_PREREQUISITE=47/47' "$OUT/r3_18ar_aggregate.txt"
          grep -Fx 'R3_18AR_CONTROL_FALSE=7' "$OUT/r3_18ar_aggregate.txt"
          grep -Fx 'R3_18AR_CONTROL_TRUE=40' "$OUT/r3_18ar_aggregate.txt"
          grep -Fx 'R3_18AR_MISMATCH=0' "$OUT/r3_18ar_aggregate.txt"
          grep -Fx 'R3_18AR_WITNESS_RESELECTION=0' "$OUT/r3_18ar_aggregate.txt"
          grep -Fx 'R3_18AR_NEXT_STREAM_BITS_CONSUMED=0' "$OUT/r3_18ar_aggregate.txt"
          grep -Fx 'R3_18AR_NEXT_HEADER_BITS_CONSUMED=0' "$OUT/r3_18ar_aggregate.txt"
          grep -Fx 'R3_18AR_NEXT_PAYLOAD_BITS_CONSUMED=0' "$OUT/r3_18ar_aggregate.txt"
          grep -Fx 'R3_18AR_SECOND_LATER_CONTROL_BITS_CONSUMED=0' "$OUT/r3_18ar_aggregate.txt"
          grep -Fx 'R3_18AR_PRODUCTION_CARGO_FIXTURE_CORPUS_SUPPORT_MUTATION=0/0/0/0/0' "$OUT/r3_18ar_aggregate.txt"
          grep -Fx 'R3_18AR_NEGATIVE_CONTROLS=PASS' "$OUT/r3_18ar_aggregate.txt"
          grep -Fx 'R3_18AR_PRIVACY_SCAN=PASS' "$OUT/r3_18ar_aggregate.txt"
          grep -Fx 'R3_18AR_SAME_HEAD_CI=PASS' "$OUT/r3_18ar_same_head_ci_receipt.txt"

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='r318ar/evidence' \
            -f description='R3.18AR Outcome A published AQ differential PASS' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

          echo "R3_18AR_EVIDENCE_HEAD=$(git rev-parse HEAD)"
          echo "R3_18AR_EVIDENCE_TREE=$(git rev-parse HEAD^{tree})"
          echo "R3_18AR_AUTHORITY_RUN=$GITHUB_RUN_ID"
          echo "R3_18AR_ARTIFACT_ID=$ARTIFACT_ID"
          echo "R3_18AR_ARTIFACT_DIGEST=$ARTIFACT_DIGEST"
          cat "$OUT/r3_18ar_aggregate.txt"
          cat "$OUT/r3_18ar_same_head_ci_receipt.txt"
          echo R3_18AR_IMMUTABLE_RECEIPT=PASS

      - name: Mark evidence failure
        if: failure()
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='r318ar/evidence' \
            -f description='R3.18AR evidence failed; inspect exact run' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null || true
