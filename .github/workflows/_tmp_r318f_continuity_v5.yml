name: R3.18F Continuity Closure V5

on:
  push:
    branches: [agent/r318f-continuity-sync-v5]

permissions:
  contents: write

jobs:
  continuity:
    runs-on: windows-latest
    timeout-minutes: 85
    env:
      BASE: 3a10ee59ba42722b59ca6c5b816205f6e5d603ea
      BASE_TREE: ff8049a18431977e054652a0836217fcc39d84a7
      PROD: 4adadd185783954c7fb6ad67db14b77b377cdde5
      PROD_TREE: 67b1969eaff49d2913b88b3921f27b1bd7fe8193
      EVIDENCE: 27a855a9cfb82a0294dd1601e4da01c9fdfad264
      EVIDENCE_TREE: 4058b67da82e9fbfcc078e975b26d186ec68e6f0
      V1_GEN_BLOB: 5617a333dfdab62fb5146a384e00f197b5353065
      V3_PATCH_BLOB: 99aba520b60b72c28b0d209f032380fbc7b25ca3

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Freeze authority and build corrected generator
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main evidence/r318f-second-property-header candidate/r3-18d-control-bit-clean agent/r318f-continuity-sync agent/r318f-continuity-sync-v3
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git rev-parse origin/main^{tree})" = "$BASE_TREE"
          test "$(git rev-parse origin/evidence/r318f-second-property-header)" = "$EVIDENCE"
          test "$(git rev-parse origin/evidence/r318f-second-property-header^{tree})" = "$EVIDENCE_TREE"
          test "$(git rev-parse origin/candidate/r3-18d-control-bit-clean)" = "$PROD"
          test "$(git rev-parse "$PROD^{tree}")" = "$PROD_TREE"
          test "$(git rev-parse origin/agent/r318f-continuity-sync:tools/_tmp_r318f_continuity.py)" = "$V1_GEN_BLOB"
          test "$(git rev-parse origin/agent/r318f-continuity-sync-v3:tools/_tmp_r318f_continuity_v3_patch.py)" = "$V3_PATCH_BLOB"
          test "$(git rev-parse "$BASE:crates/mimir-replay/src/lib.rs")" = "42bc3fd3e8ea6bd1d15df82e4c6d8809b8443662"
          test "$(git rev-parse "$BASE:crates/mimir-replay/tests/r3_18b_single_k1_property.rs")" = "927e9a2c834115d1c918fa96fb6d0690bd03965e"
          test "$(git rev-parse "$BASE:crates/mimir-replay/tests/r3_18d_next_property_control.rs")" = "2f5b188cc5b3ce8200c9961d964f1dc66b3ab49b"
          test "$(git rev-parse "$BASE:docs/continuity/MIMIR_R3_18F_EXECUTION_SPEC.md")" = "e6b92ea5628f107112a088421f318cd45a384e87"
          test -z "$(git diff --name-only "$PROD" "$BASE" -- crates Cargo.toml Cargo.lock external_fixtures test_corpus scripts)"
          git show origin/agent/r318f-continuity-sync:tools/_tmp_r318f_continuity.py > "$RUNNER_TEMP/v1.py"
          git show origin/agent/r318f-continuity-sync-v3:tools/_tmp_r318f_continuity_v3_patch.py > "$RUNNER_TEMP/patch.py"
          python "$RUNNER_TEMP/patch.py" "$RUNNER_TEMP/v1.py" "$RUNNER_TEMP/v5.py"
          python -m py_compile "$RUNNER_TEMP/v5.py"
          echo 'R3_18F_V5_AUTHORITY_AND_PATCH=PASS'

      - name: Generate exact six-file closure
        shell: pwsh
        run: |
          git reset --hard $env:BASE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python (Join-Path $env:RUNNER_TEMP 'v5.py')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files=@('MIMIR_CONTINUE_HERE.md','MIMIR_KNOWLEDGE_GRAPH.md','docs/continuity/MIMIR_CONTINUITY_STATE.json','docs/continuity/MIMIR_CURRENT_STATE.md','docs/continuity/MIMIR_R3_18F_DECISION.md','docs/continuity/MIMIR_R3_18G_EXECUTION_SPEC.md')
          foreach($f in $files){$c=Get-Content $f -Raw;$c=[regex]::Replace($c,'[ \t]+(?=\r?$)','','Multiline');[IO.File]::WriteAllText((Resolve-Path $f).Path,$c.Replace("`r`n","`n"),[Text.UTF8Encoding]::new($false))}
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected=$files|Sort-Object
          $actual=@(git diff --name-only;git ls-files --others --exclude-standard)|Where-Object{$_}|Sort-Object -Unique
          $delta=@(Compare-Object $expected $actual)
          if($delta.Count -ne 0){$delta|Format-Table;exit 1}
          if(@(git diff --name-only -- crates Cargo.toml Cargo.lock external_fixtures test_corpus tools scripts .github).Count -ne 0){throw 'forbidden production/support diff'}
          $ns=@(git diff --numstat $env:BASE -- MIMIR_CONTINUE_HERE.md)
          if($ns.Count -ne 1){throw 'handbook numstat missing'}
          $p=$ns[0]-split "`t";$a=[int]$p[0];$d=[int]$p[1]
          if($a -ne 62 -or $d -ne 23){throw "handbook exact diff mismatch +$a/-$d expected +62/-23"}
          $baseLines=@(git show "$env:BASE`:MIMIR_CONTINUE_HERE.md");$newLines=@(Get-Content MIMIR_CONTINUE_HERE.md)
          if(($newLines.Count-$baseLines.Count) -ne 39){throw "handbook line delta mismatch base=$($baseLines.Count) new=$($newLines.Count)"}
          $h=Get-Content MIMIR_CONTINUE_HERE.md -Raw
          foreach($x in @('# 9.7 Exact-SHA validation','# 10. PASS TEMPLATE — COPY THIS FOR EVERY FUTURE PASS','# 13. CURRENT PASS CHECKLIST — R3.14A','**Important:** the newest `main` commit can be newer than `LAST_PRODUCTION_CODE_SHA`')){if(-not $h.Contains($x)){throw "missing handbook anchor $x"}}
          Write-Host 'R3_18F_V5_SCOPE=PASS files=6 handbook=+62/-23 production=0'

      - name: Verify corrected R3.18F and R3.18G semantics
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          def read(p): return Path(p).read_text(encoding='utf-8')
          S=json.loads(read('docs/continuity/MIMIR_CONTINUITY_STATE.json'))
          docs={p:read(p) for p in ['MIMIR_CONTINUE_HERE.md','MIMIR_KNOWLEDGE_GRAPH.md','docs/continuity/MIMIR_CURRENT_STATE.md','docs/continuity/MIMIR_R3_18F_DECISION.md','docs/continuity/MIMIR_R3_18G_EXECUTION_SPEC.md']}
          r=S['r3_18f']; spec=docs['docs/continuity/MIMIR_R3_18G_EXECUTION_SPEC.md']; decision=docs['docs/continuity/MIMIR_R3_18F_DECISION.md']; main=docs['MIMIR_CONTINUE_HERE.md']; graph=docs['MIMIR_KNOWLEDGE_GRAPH.md']
          assert S['last_production_code_sha']=='4adadd185783954c7fb6ad67db14b77b377cdde5'
          assert S['last_production_milestone']=='R3.18D'
          assert S['last_completed_read_only_audit']=='R3.18F' and S['last_completed_evidence_pass']=='R3.18F'
          assert S['current_pass']=='R3.18G'
          assert r['evidence_head_sha']=='27a855a9cfb82a0294dd1601e4da01c9fdfad264'
          assert r['evidence_tree']=='4058b67da82e9fbfcc078e975b26d186ec68e6f0'
          assert (r['authority_run'],r['authority_job'])==(31951039411,95174417526)
          assert (r['same_head_normal_ci_run'],r['same_head_normal_ci_job'])==(31951039378,95174417478)
          assert r['artifact_id']==9264673141 and r['artifact_sha256']=='e31e09abf322b6458f9034b06efe5502bb3b7f1011dfb08c9ffd6d1b1cd1b361'
          assert r['continuation_header_native_success']=='47/47'
          assert r['terminator_one_bit_stop_exact']=='47/47'
          assert r['continuation_attribute_tag_counts']=={'Int':46,'String':1}
          assert r['header_truncation_rows']==32 and r['native_oracle_mismatch_count']==0
          assert r['second_payload_bits_consumed']==0 and r['third_property_bits_consumed']==0
          assert r['privacy']=='PASS' and r['production_cargo_fixture_corpus_support_mutation']=='0/0/0/0/0'
          assert r['source_scope_sha256']=='492f63c3cfcb27967426816f97858c8f4ad1d9ebb6ce40719f6d829ff3f0ea55'
          assert r['replay_identity_sha256']=='b02488b13cd6374219bbb89f884b03f8356f3744f930e39b2279df34859015cf'
          assert r['boxcars_instrumentation_receipt_sha256']=='ba0f63ca5cd09ff48e7f70141f6cc78dacc2307502af6c1e09a9695b2ba52e97'
          assert r['selected_witnesses_sha256']=='99461d2c2bf2f17dc41336d6efcd9321ce7ad6fabd2da663d8ddc3509231fdd7'
          assert r['selection_summary_sha256']=='bd6c4d25b02533626485e4fdb000034a39e7c2b5f559d8a09a8a4eb5e5ca80d4'
          assert r['comparison_sha256']=='53f4a9aefbfcc3d02e5a1501d2849455052c01612ddd299e795e89ad2938ddcd'
          assert r['aggregate_sha256']=='57c90cb3617461aea1a078a7b0f72ae301fd35fc9d7c4f9fe56de6d7633a4a04'
          assert 'CURRENT_PASS:\n  R3.18G' in main and 'R3_18F_EVIDENCE_CLOSURE:' in main and 'R3_18G_OPEN_BOUNDARY:' in main
          assert 'R3.18F second-property-header evidence decision' in graph and 'R3.18G active bounded second-property-header production spec' in graph
          assert '**Outcome:** **A — ADMITTED / READ-ONLY EVIDENCE COMPLETE**' in decision
          for x in ['**Status:** ACTIVE','**Pass type:** production implementation','**Second-property payload decode:** forbidden','**Third property / repeated loop:** forbidden','**Generic chainable property cursor:** forbidden','require resolved tag in {Int, String}','continuation Int','continuation String header','explicit exact Int/String second-header allowlist']:
              assert x in spec,x
          assert 'String' in spec and 'payload' in spec and 'unconsumed' in spec
          joined='\n'.join(docs.values())
          stale=[
            '9266197133','4058b67d72219cbbf0534c6002049202fab487f3','641a62c1467d7bc56d6b3fd1c9377276a6eec0ab02666c062623afa3955114f3',
            'Byte=12 / Enum=1 / Float=4 / Int=28 / Int64=2','Byte=12, Enum=1, Float=4, Int=28 and Int64=2',
            "{'Byte': 12, 'Enum': 1, 'Float': 4, 'Int': 28, 'Int64': 2}",'26 real truncation negatives','real header truncation negatives      26',
            'require resolved tag in {Byte, Enum, Float, Int, Int64}','explicit five-tag allowlist','only Byte/Enum/Float/Int/Int64'
          ]
          for x in stale: assert x not in joined,x
          print('R3_18F_V5_SEMANTICS=PASS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Knowledge Archive
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/verify_mimir_knowledge_archive.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full repository verifier
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/verify_repo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish clean V5 candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MIMIR_CONTINUE_HERE.md MIMIR_KNOWLEDGE_GRAPH.md docs/continuity/MIMIR_CONTINUITY_STATE.json docs/continuity/MIMIR_CURRENT_STATE.md docs/continuity/MIMIR_R3_18F_DECISION.md docs/continuity/MIMIR_R3_18G_EXECUTION_SPEC.md
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'Close corrected R3.18F evidence and open R3.18G second-header production' | git commit-tree "$tree" -p "$BASE")"
          echo "R3_18F_V5_CANDIDATE=$commit"
          echo "R3_18F_V5_TREE=$tree"
          echo "R3_18F_V5_PARENT=$BASE"
          git diff-tree --no-commit-id --numstat -r "$commit"
          git push origin "$commit:refs/heads/candidate/r3-18f-continuity-clean-v5"
          echo 'R3_18F_V5_CANDIDATE_PUBLICATION=PASS'
