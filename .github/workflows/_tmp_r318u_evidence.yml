name: R3.18U Published Following Payload Differential Evidence

on:
  push:
    branches:
      - evidence/r318u-published-following-payload-v1

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '

      - name: Run R3.18U evidence
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if bash tools/_tmp_r318u_run.sh; then
              echo "R3_18U_RUN_ATTEMPT=$attempt"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'R3_18U_RUN_RETRIES_EXHAUSTED=FAIL'
              exit 1
            fi
            echo "R3_18U_TRANSIENT_RETRY=$attempt"
            sleep $((attempt * 10))
          done

      - name: Upload immutable R3.18U evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: r318u-published-following-payload-differential-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            r3_18u_source_scope.txt
            r3_18u_replay_identity.tsv
            r3_18u_frozen_witnesses.json
            r3_18u_upstream_receipts.txt
            r3_18u_contract.json
            r3_18u_s_oracle_summary.json
            r3_18u_summary.json
            r3_18u_comparison.json
            r3_18u_negative_controls.txt
            r3_18u_aggregate.txt
            r3_18u_artifact_sha256.txt

      - name: Emit immutable receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" > /tmp/r318u_artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /tmp/r318u_run.json
          python3 - <<'PY'
          import json, os
          def norm(v):
              if v is None: return None
              v=v.strip().lower()
              return v[7:] if v.startswith('sha256:') else v
          aid=int(os.environ['ARTIFACT_ID'])
          data=json.load(open('/tmp/r318u_artifacts.json',encoding='utf-8'))
          matches=[x for x in data.get('artifacts',[]) if x.get('id')==aid]
          print('MATCH_COUNT',len(matches),flush=True)
          assert len(matches)==1, matches
          a=matches[0]
          run=json.load(open('/tmp/r318u_run.json',encoding='utf-8'))
          upload=os.environ['ARTIFACT_DIGEST']
          checks={
            'name':a.get('name')=='r318u-published-following-payload-differential-evidence',
            'expired':a.get('expired') is False,
            'digest_if_present':a.get('digest') is None or norm(a.get('digest'))==norm(upload),
            'run_id':str(run.get('id'))==os.environ['GITHUB_RUN_ID'],
            'head_sha':run.get('head_sha')==os.environ['GITHUB_SHA'],
            'head_branch':run.get('head_branch')=='evidence/r318u-published-following-payload-v1',
            'repository':run.get('repository',{}).get('full_name')==os.environ['GITHUB_REPOSITORY'],
          }
          receipt={'artifact_id':a.get('id'),'artifact_name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'rest_digest':a.get('digest'),'upload_digest':upload,'run_id':run.get('id'),'head_sha':run.get('head_sha'),'head_branch':run.get('head_branch'),'checks':checks}
          print(json.dumps(receipt,sort_keys=True),flush=True)
          failed=[k for k,v in checks.items() if not v]
          assert not failed, {'failed_checks':failed,'receipt':receipt}
          print('R3_18U_RECEIPT_METADATA=PASS',flush=True)
          PY
          echo "R3_18U_EVIDENCE_HEAD=$(git rev-parse HEAD)"
          echo "R3_18U_EVIDENCE_TREE=$(git rev-parse HEAD^{tree})"
          echo "R3_18U_AUTHORITY_RUN=$GITHUB_RUN_ID"
          echo "R3_18U_ARTIFACT_ID=$ARTIFACT_ID"
          echo "R3_18U_ARTIFACT_DIGEST=$ARTIFACT_DIGEST"
          cat r3_18u_aggregate.txt
          cat r3_18u_artifact_sha256.txt
          echo 'R3_18U_IMMUTABLE_RECEIPT=PASS'
