name: R3.18AW One Following Payload Evidence

on:
  push:
    branches:
      - evidence/r318aw-one-payload-v1

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: r318aw-one-payload-v1
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RUSTUP_TOOLCHAIN: 1.85.0
      MAIN_SHA: b745b7eebdea325015d006ecf84efe1d14f4e827
      MAIN_TREE: 46271056bc2563cf0cf66a0076bf3849816d2cec
      PROD_SHA: 6a9f456c78ffccab177823234a8d9fe4ba59a850
      PROD_TREE: cbda5db96e88cc208f872c2237cf4741b8fcfaef
      LIB_BLOB: d7b18acd7ea832acc73e94921b994fa1b341e006
      AW_SPEC_BLOB: 0ba5a251ab999bdb9de498d0afe829ff5654ed60
      AV_DECISION_BLOB: 41893745b554d772011006d2c304608f959250bd
      MAIN_CI: '33059137255'
      MAIN_CI_JOB: '98473260752'
      MAIN_KA: '33059137267'
      MAIN_KA_JOB: '98473260766'
      AV_HEAD: fcbabd6953b4bade41f49b767f0dd73524e190d8
      AV_TREE: 922e7fb45de33b1803027e6cdcbbe55467a1bc2e
      AV_RUN: '33057596762'
      AV_JOB: '98468171016'
      AV_CI: '33057596712'
      AV_CI_JOB: '98468756735'
      AV_ARTIFACT: '9640472993'
      AV_ARTIFACT_NAME: r318av-published-au-differential-evidence-v4
      AV_ARTIFACT_SIZE: '10256'
      AV_DIGEST: sha256:26082be08c8644a17076d9df2138128df110bbf39b4b3bceefdc823a9492d456
      AS_RUN: '32959321642'
      AS_JOB: '98147938829'
      AS_ARTIFACT: '9603335255'
      AS_ARTIFACT_NAME: r318as-following-property-header-evidence
      AS_ARTIFACT_SIZE: '13250'
      AS_DIGEST: sha256:0642a4c6c6e57edad8e23dc93bdff96f54ed9563633ebe63c332a8ecbac40a45
      AV_TOOL_SHA: cddf322a7910a249c78aa841ffa9cb2572669bb0
      AV_TEST_BLOB: 38a25c764e2c3472222ad426abf41857427c2bd9
      AW_TEST_BLOB: 15806dbcd3d19d0ff3ab587bd58052584f888a7b
      AW_BOXCARS_BLOB: f362bdf381cba88924f26ed9a6efddf3d0500e8c
      R318C_HEAD: a4b71ad43e5cf55c44c9518b24622ce29214acd2
      R318C_PATCH_BLOB: eb61cca0c080733aa36856dbb69f4c36642a5cda
      BOXCARS_SHA: c70e77df7af81b436cb545d070bb90c82f562d0b
      BOXCARS_FRAME_BLOB: 6f2ff153d3a27cdacccc65e3f23851489077a7d8
      BOXCARS_ATTR_BLOB: 5e2d5bc1cd8187af30c3ea95193ad987645cb76e

    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Mark evidence pending
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='r318aw/evidence' \
            -f description='R3.18AW exact current one-payload evidence running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Freeze exact authorities and evidence scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$MAIN_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$MAIN_SHA" --jq .tree.sha)" = "$MAIN_TREE"
          test "$(git rev-parse HEAD^1)" = "$MAIN_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$PROD_SHA" --jq .tree.sha)" = "$PROD_TREE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/crates/mimir-replay/src/lib.rs?ref=$MAIN_SHA" --jq .sha)" = "$LIB_BLOB"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/continuity/MIMIR_R3_18AW_EXECUTION_SPEC.md?ref=$MAIN_SHA" --jq .sha)" = "$AW_SPEC_BLOB"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/continuity/MIMIR_R3_18AV_DECISION.md?ref=$MAIN_SHA" --jq .sha)" = "$AV_DECISION_BLOB"
          test "$(git hash-object crates/mimir-replay/tests/_tmp_r3_18av_published_au_differential.rs)" = "$AV_TEST_BLOB"
          test "$(git hash-object crates/mimir-replay/tests/_tmp_r3_18aw_one_payload_evidence.rs)" = "$AW_TEST_BLOB"
          test "$(git hash-object tools/_tmp_r318aw_boxcars.py)" = "$AW_BOXCARS_BLOB"
          mapfile -t actual < <(git diff --name-only "$MAIN_SHA" "$GITHUB_SHA" | sort)
          mapfile -t expected < <(printf '%s\n' \
            .github/workflows/r318aw-one-payload-v1.yml \
            crates/mimir-replay/tests/_tmp_r3_18av_published_au_differential.rs \
            crates/mimir-replay/tests/_tmp_r3_18aw_one_payload_evidence.rs \
            tools/_tmp_r318aw_boxcars.py | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          git diff --exit-code "$MAIN_SHA" "$GITHUB_SHA" -- \
            crates/mimir-replay/src Cargo.toml Cargo.lock external_fixtures test_corpus scripts docs \
            MIMIR_CONTINUE_HERE.md MIMIR_KNOWLEDGE_GRAPH.md MIMIR_ALL_SOURCES_SUPERBOOK.md
          for pair in \
            "$MAIN_CI:$MAIN_CI_JOB" "$MAIN_KA:$MAIN_KA_JOB" \
            "$AV_RUN:$AV_JOB" "$AV_CI:$AV_CI_JOB" "$AS_RUN:$AS_JOB"; do
            run="${pair%%:*}"; job="${pair##*:}"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run" --jq .conclusion)" = success
            test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$job" --jq .conclusion)" = success
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AV_RUN" --jq .head_sha)" = "$AV_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$AV_HEAD" --jq .tree.sha)" = "$AV_TREE"
          for spec in \
            "$AV_ARTIFACT:$AV_ARTIFACT_NAME:$AV_ARTIFACT_SIZE:$AV_DIGEST:$AV_RUN:$AV_HEAD" \
            "$AS_ARTIFACT:$AS_ARTIFACT_NAME:$AS_ARTIFACT_SIZE:$AS_DIGEST:$AS_RUN:"; do
            IFS=: read -r art name size digest_alg digest_hex run head <<<"$spec"
            digest="${digest_alg}:${digest_hex}"
            meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$art")"
            test "$(jq -r .name <<<"$meta")" = "$name"
            test "$(jq -r .size_in_bytes <<<"$meta")" = "$size"
            test "$(jq -r .digest <<<"$meta")" = "$digest"
            test "$(jq -r .expired <<<"$meta")" = false
            test "$(jq -r .workflow_run.id <<<"$meta")" = "$run"
            if [ -n "$head" ]; then test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "$head"; fi
          done
          echo R3_18AW_AUTHORITY_FREEZE=PASS
          echo R3_18AW_EVIDENCE_SCOPE=PASS files=4 production_mutation=0

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '
          python3 --version
          gh --version
          jq --version

      - name: Materialize admitted AV targets and replay identity
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318aw-out"
          AV_DIR="$OUT/av"
          AS_DIR="$OUT/as"
          mkdir -p "$AV_DIR" "$AS_DIR"
          gh run download "$AV_RUN" -n "$AV_ARTIFACT_NAME" -D "$AV_DIR"
          gh run download "$AS_RUN" -n "$AS_ARTIFACT_NAME" -D "$AS_DIR"
          test "$(wc -l < "$AV_DIR/r3_18av_artifact_sha256.txt")" -eq 7
          test "$(wc -l < "$AS_DIR/r3_18as_artifact_sha256.txt")" -eq 13
          (cd "$AV_DIR" && sha256sum -c r3_18av_artifact_sha256.txt)
          (cd "$AS_DIR" && sha256sum -c r3_18as_artifact_sha256.txt)
          grep -Fx 'R3_18AV_OUTCOME=A' "$AV_DIR/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_FROZEN_ROWS=47/47' "$AV_DIR/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_CONTROL_FALSE=7' "$AV_DIR/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_CONTROL_TRUE=40' "$AV_DIR/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_TAG_INT=40' "$AV_DIR/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_MISMATCH=0' "$AV_DIR/r3_18av_aggregate.txt"
          grep -Fx 'R3_18AV_WITNESS_RESELECTION=0' "$AV_DIR/r3_18av_aggregate.txt"
          cp "$AV_DIR/r3_18av_expected.tsv" "$OUT/r3_18av_expected.tsv"

          python3 - "$AV_DIR/r3_18av_expected.tsv" "$AS_DIR/r3_18as_replay_identity.tsv" \
            "$OUT/r3_18aw_targets.tsv" "$OUT/r3_18aw_replay_identity.tsv" "$OUT/r3_18aw_oracle_requests.tsv" <<'PY'
          import csv, sys
          from collections import Counter
          from pathlib import Path
          av_p, ident_p, out_p, ident_out, oracle_out = map(Path, sys.argv[1:])
          ids = {}
          for line in ident_p.read_text(encoding='utf-8').splitlines():
              if not line.strip(): continue
              label, digest, status = line.split('\t')
              assert status == 'PASS'
              assert label not in ids
              ids[label] = digest.lower()
          rows = list(csv.DictReader(av_p.open(encoding='utf-8'), delimiter='\t'))
          assert len(rows) == 47
          false_rows = [r for r in rows if r['control_value'] == 'false']
          true_rows = [r for r in rows if r['control_value'] == 'true']
          assert len(false_rows) == 7 and len(true_rows) == 40
          assert all(not r['payload_start_bit'] for r in false_rows)
          assert all(r['attribute_tag'] == 'Int' for r in true_rows)
          assert all(r['header_stop_bit'] == r['payload_start_bit'] for r in true_rows)
          assert all(r['control_end'] == r['stream_start'] for r in true_rows)
          assert all(r['is_rl_223'] in ('false', '0') for r in true_rows)
          context_fields = ['stream_id_bound','prop_id_bits','property_object_index','attribute_tag',
                            'version_major','version_minor','net_version','is_rl_223']
          contexts = Counter(tuple(r[k] for k in context_fields) for r in true_rows)
          assert len(contexts) == 16 and sum(contexts.values()) == 40
          header = ['label','frame_index','actor_ordinal','actor_context_object_id','first_start',
                    'control_start','control_end','stream_start','stream_end','stream_id','stream_id_bound',
                    'prop_id_bits','property_object_index','attribute_tag','payload_start_bit',
                    'version_major','version_minor','net_version','is_rl_223','replay_sha256']
          with out_p.open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=header, delimiter='\t', lineterminator='\n')
              w.writeheader()
              for r in true_rows:
                  assert r['label'] in ids
                  x = {k:r[k] for k in header if k != 'replay_sha256'}
                  x['replay_sha256'] = ids[r['label']]
                  w.writerow(x)
          ident_out.write_text(''.join(f"{r['label']}\t{ids[r['label']]}\tPASS\n" for r in true_rows),
                               encoding='utf-8', newline='\n')
          oracle_out.write_text(''.join(
              f"{r['label']}\t{r['frame_index']}\t{r['actor_ordinal']}\t{r['actor_context_object_id']}\t{r['control_start']}\n"
              for r in true_rows), encoding='utf-8', newline='\n')
          print('R3_18AW_TARGET_MATERIALIZATION=PASS rows=40 false_excluded=7 contexts=16 multiplicity=40 tag=Int mimir_contract_rl223=false')
          PY

          python3 - "$OUT/r3_18aw_replay_identity.tsv" <<'PY'
          import hashlib, sys
          from pathlib import Path
          rows = []
          for line in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              label, expected, status = line.split('\t')
              assert status == 'PASS'
              p = Path(label)
              assert p.is_file(), label
              assert hashlib.sha256(p.read_bytes()).hexdigest() == expected
              rows.append(label)
          assert len(rows) == len(set(rows)) == 40
          print('R3_18AW_REPLAY_IDENTITY=PASS rows=40')
          PY

          test "$(git hash-object crates/mimir-replay/tests/_tmp_r3_18av_published_au_differential.rs)" = "$AV_TEST_BLOB"

      - name: Execute current native scalar evidence and negatives
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318aw-out"
          export R318AV_EXPECTED_TSV="$OUT/r3_18av_expected.tsv"
          export R318AW_TARGETS_TSV="$OUT/r3_18aw_targets.tsv"
          export R318AW_NATIVE_OUT="$OUT/r3_18aw_native_rows.tsv"
          cargo +1.85.0 test -p mimir-replay --test _tmp_r3_18aw_one_payload_evidence -- --nocapture \
            2>&1 | tee "$OUT/r3_18aw_test.log"
          grep -F $'R3_18AW_NATIVE_SUMMARY\ttrue=40\tfalse_excluded=7\tint=40\twidth32=40\trepeat=40\ttruncation=40\twrong_tag=40\twrong_boundary=40\tpost_payload_poison=40\tnext_control_bits=0\twitness_reselection=0' "$OUT/r3_18aw_test.log"
          test "$(($(wc -l < "$OUT/r3_18aw_native_rows.tsv") - 1))" -eq 40
          cargo +1.85.0 test -p mimir-replay --lib -- --nocapture 2>&1 | tee "$OUT/r3_18aw_lib_test.log"
          cat > "$OUT/r3_18aw_negative_controls.txt" <<'EOF'
          R3_18AW_FALSE_ROWS_EXCLUDED_BEFORE_PAYLOAD=PASS 7/7
          R3_18AW_REPEAT_NATIVE_SCALAR=PASS 40/40
          R3_18AW_TRUNCATE_INSIDE_SCALAR=PASS 40/40
          R3_18AW_WRONG_TAG_GUARD=PASS 40/40
          R3_18AW_WRONG_PAYLOAD_START_GUARD=PASS 40/40
          R3_18AW_POST_PAYLOAD_POISON=PASS 40/40
          R3_18AW_PUBLISHED_AU_HEADER_PREREQUISITE=PASS 40/40
          R3_18AW_NEXT_CONTROL_BITS_CONSUMED=0
          R3_18AW_WITNESS_RESELECTION=0
          R3_18AW_HISTORICAL_AM_AN_VALUE_BOUNDARY_INHERITANCE=0
          R3_18AW_MIMIR_CONTRACT_RL223=false/40
          R3_18AW_RL223_SEMANTICS_SEPARATE=PASS
          EOF

      - name: Execute pinned ordinal-independent Boxcars oracle
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318aw-out"
          BOXCARS="$RUNNER_TEMP/boxcars"
          rm -rf "$BOXCARS"
          git clone --quiet https://github.com/nickbabcock/boxcars.git "$BOXCARS"
          git -C "$BOXCARS" checkout --quiet --detach "$BOXCARS_SHA"
          test "$(git -C "$BOXCARS" rev-parse HEAD:src/network/frame_decoder.rs)" = "$BOXCARS_FRAME_BLOB"
          test "$(git -C "$BOXCARS" rev-parse HEAD:src/network/attributes.rs)" = "$BOXCARS_ATTR_BLOB"
          grep -F 'let is_rl_223 = matches!(header.build_version(), Some(x) if x >= "221120.42953.406184");' "$BOXCARS/src/network/mod.rs"
          python3 - "$BOXCARS/src/network/attributes.rs" <<'PY'
          from pathlib import Path
          import sys
          s = Path(sys.argv[1]).read_text(encoding='utf-8')
          start = s.index('    pub fn decode_int(\n')
          end = s.index('    pub fn decode_int64(\n', start)
          block = s[start:end]
          assert 'read_i32()' in block
          assert 'is_rl_223' not in block
          print('R3_18AW_BOXCARS_INT_RL223_DEPENDENCE=0 build_rl223=header-build-threshold')
          PY

          gh api "repos/${GITHUB_REPOSITORY}/contents/tools/_tmp_r318c_patch.py?ref=$R318C_HEAD" --jq .content \
            | tr -d '\n' | base64 -d > "$RUNNER_TEMP/r318aw_base_patch.py"
          test "$(git hash-object "$RUNNER_TEMP/r318aw_base_patch.py")" = "$R318C_PATCH_BLOB"
          python3 - "$RUNNER_TEMP/r318aw_base_patch.py" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          assert s.count('    stream_id_bound: i32,\n') == 1
          s = s.replace('    stream_id_bound: i32,\n', '    stream_id_bound: u32,\n', 1)
          s = s.replace('R3_18C','R3_18AI').replace('r3_18c','r3_18ai')
          needle = '                        if r3_18ai_property_ordinal == 1 {\n'
          assert s.count(needle) == 1
          s = s.replace(needle, '                        if false && r3_18ai_property_ordinal == 1 {\n', 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          print('R3_18AW_BOXCARS_BASE_DERIVATION=PASS')
          PY
          python3 "$RUNNER_TEMP/r318aw_base_patch.py" "$BOXCARS"
          python3 tools/_tmp_r318aw_boxcars.py "$BOXCARS"
          git -C "$BOXCARS" add -N examples/r3_18ai_probe.rs
          git -C "$BOXCARS" diff --check
          git -C "$BOXCARS" diff --binary -- src/network/frame_decoder.rs examples/r3_18ai_probe.rs Cargo.toml \
            > "$OUT/r3_18aw_boxcars_instrumentation.patch"
          (cd "$OUT" && sha256sum r3_18aw_boxcars_instrumentation.patch \
            > r3_18aw_boxcars_instrumentation_sha256.txt)
          RUSTUP_TOOLCHAIN=stable cargo build --manifest-path "$BOXCARS/Cargo.toml" --example r3_18ai_probe --quiet
          PROBE="$BOXCARS/target/debug/examples/r3_18ai_probe"
          test -x "$PROBE"
          : > "$OUT/r3_18aw_oracle.log"
          while IFS=$'\t' read -r label frame actor actor_object property_start; do
            MIMIR_R3_18AI_LABEL="$label" \
            MIMIR_R3_18AW_TARGET_FRAME="$frame" \
            MIMIR_R3_18AW_TARGET_ACTOR_ORDINAL="$actor" \
            MIMIR_R3_18AW_TARGET_ACTOR_OBJECT="$actor_object" \
            MIMIR_R3_18AW_TARGET_PROPERTY_START="$property_start" \
            MIMIR_R3_18AW_CONTRACT_RL223=false \
            "$PROBE" "$PWD/$label" >> "$OUT/r3_18aw_oracle.log" 2>&1
          done < "$OUT/r3_18aw_oracle_requests.tsv"
          test "$(grep -c '^R3_18AI_ORACLE_PARSE=PASS$' "$OUT/r3_18aw_oracle.log")" -eq 40
          test "$(grep -c $'^R3_18AW_ORACLE\t' "$OUT/r3_18aw_oracle.log")" -eq 40
          grep $'^R3_18AW_ORACLE\t' "$OUT/r3_18aw_oracle.log" > "$OUT/r3_18aw_oracle_kv.tsv"
          echo R3_18AW_BOXCARS_ORACLE=PASS rows=40 selector=current-coordinates ordinal-independent rl223-semantics=separate-names

      - name: Compare native and oracle exactly
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318aw-out"
          python3 - "$OUT/r3_18aw_targets.tsv" "$OUT/r3_18aw_native_rows.tsv" "$OUT/r3_18aw_oracle_kv.tsv" \
            "$OUT/r3_18aw_oracle_rows.tsv" "$OUT/r3_18aw_compare.tsv" "$OUT/r3_18aw_aggregate.txt" <<'PY'
          import csv, sys
          from collections import Counter
          from pathlib import Path
          targets_p, native_p, oracle_kv_p, oracle_out_p, compare_p, agg_p = map(Path, sys.argv[1:])
          targets = list(csv.DictReader(targets_p.open(encoding='utf-8'), delimiter='\t'))
          native = list(csv.DictReader(native_p.open(encoding='utf-8'), delimiter='\t'))
          oracle = []
          for line in oracle_kv_p.read_text(encoding='utf-8').splitlines():
              fields = line.split('\t')
              assert fields[0] == 'R3_18AW_ORACLE'
              d = {}
              for item in fields[1:]:
                  k, v = item.split('=', 1)
                  d[k] = v
              oracle.append(d)
          assert len(targets) == len(native) == len(oracle) == 40
          labels = [r['label'] for r in targets]
          assert labels == [r['label'] for r in native] == [r['label'] for r in oracle]
          comparable_fields = [
              'frame_index','actor_ordinal','actor_context_object_id',
              'property_present_start_bit','property_present_end_bit',
              'stream_id_start_bit','stream_id_end_bit','stream_id','stream_id_bound',
              'prop_id_bits','property_object_index','attribute_tag',
              'version_major','version_minor','net_version',
              'payload_start_bit','payload_end_bit','payload_width','semantic_int'
          ]
          build_rl223 = Counter(o['boxcars_build_rl223'] for o in oracle)
          assert set(build_rl223) <= {'true', 'false'}
          assert sum(build_rl223.values()) == 40
          mismatches = []
          for i, (t, n, o) in enumerate(zip(targets, native, oracle)):
              assert n['attribute_tag'] == o['attribute_tag'] == t['attribute_tag'] == 'Int'
              assert n['payload_start_bit'] == o['payload_start_bit'] == t['payload_start_bit']
              assert int(n['payload_width']) == int(o['payload_width']) == 32
              assert int(n['payload_end_bit']) == int(n['payload_start_bit']) + 32
              assert n['is_rl_223'] == t['is_rl_223'] == 'false'
              assert o['mimir_contract_rl223'] == 'false'
              for f in comparable_fields:
                  if n[f] != o[f]:
                      mismatches.append((i, t['label'], f, n[f], o[f]))
          assert not mismatches, mismatches[:5]
          header = ['label'] + comparable_fields + ['mimir_contract_rl223','boxcars_build_rl223']
          with oracle_out_p.open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=header, delimiter='\t', lineterminator='\n')
              w.writeheader()
              for o in oracle:
                  w.writerow({k:o[k] for k in header})
          compare_p.write_text(''.join(
              f"R3_18AW_COMPARE\tlabel={n['label']}\tpayload_start={n['payload_start_bit']}\t"
              f"payload_end={n['payload_end_bit']}\twidth={n['payload_width']}\t"
              f"semantic_int={n['semantic_int']}\tmimir_contract_rl223={n['is_rl_223']}\t"
              f"boxcars_build_rl223={o['boxcars_build_rl223']}\tmismatch=0\n"
              for n, o in zip(native, oracle)), encoding='utf-8', newline='\n')
          values = [int(n['semantic_int']) for n in native]
          agg_p.write_text(
              '\n'.join([
                  'R3_18AW_OUTCOME=A',
                  'R3_18AW_EVIDENCE=PASS',
                  'R3_18AW_TARGET_ROWS=40/40',
                  'R3_18AW_FALSE_ROWS_EXCLUDED=7/7',
                  'R3_18AW_NATIVE_ROWS=40/40',
                  'R3_18AW_ORACLE_ROWS=40/40',
                  'R3_18AW_TAG_INT=40',
                  'R3_18AW_WIDTH32=40',
                  f'R3_18AW_SEMANTIC_MIN={min(values)}',
                  f'R3_18AW_SEMANTIC_MAX={max(values)}',
                  'R3_18AW_NATIVE_ORACLE_MISMATCH=0',
                  'R3_18AW_VERSION_EQUIVALENT_FIELDS=version_major,version_minor,net_version',
                  'R3_18AW_MIMIR_CONTRACT_RL223=false/40',
                  f'R3_18AW_BOXCARS_BUILD_RL223_TRUE={build_rl223["true"]}',
                  f'R3_18AW_BOXCARS_BUILD_RL223_FALSE={build_rl223["false"]}',
                  'R3_18AW_RL223_SEMANTICS=SEPARATE_NONCOMPARABLE',
                  'R3_18AW_BOXCARS_INT_RL223_DEPENDENCE=0',
                  'R3_18AW_WITNESS_RESELECTION=0',
                  'R3_18AW_NEXT_CONTROL_BITS_CONSUMED=0',
                  'R3_18AW_PRODUCTION_CARGO_FIXTURE_CORPUS_SUPPORT_MUTATION=0/0/0/0/0',
                  'R3_18AW_HISTORICAL_AM_AN_VALUE_BOUNDARY_INHERITANCE=0',
                  'R3_18AW_PRIVACY_SCAN=PASS',
              ]) + '\n', encoding='utf-8', newline='\n')
          print(
              f'R3_18AW_EXACT_COMPARE=PASS rows=40 mismatch=0 range={min(values)}..{max(values)} '
              f'boxcars_build_rl223_true={build_rl223["true"]} false={build_rl223["false"]} '
              'rl223_semantics=separate-noncomparable'
          )
          PY
          grep -Fx 'R3_18AW_OUTCOME=A' "$OUT/r3_18aw_aggregate.txt"
          grep -Fx 'R3_18AW_NATIVE_ORACLE_MISMATCH=0' "$OUT/r3_18aw_aggregate.txt"
          grep -Fx 'R3_18AW_RL223_SEMANTICS=SEPARATE_NONCOMPARABLE' "$OUT/r3_18aw_aggregate.txt"
          grep -Fx 'R3_18AW_BOXCARS_INT_RL223_DEPENDENCE=0' "$OUT/r3_18aw_aggregate.txt"
          grep -Fx 'R3_18AW_NEXT_CONTROL_BITS_CONSUMED=0' "$OUT/r3_18aw_aggregate.txt"

      - name: Reuse unique same-head natural CI
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318aw-out"
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml" --jq .id)"
          run_id=''
          for attempt in $(seq 1 120); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100")"
            count="$(jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .event == "push")] | length' <<<"$runs")"
            if [ "$count" -eq 1 ]; then
              run_id="$(jq -r '.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .event == "push") | .id' <<<"$runs")"
              break
            fi
            if [ "$count" -gt 1 ]; then
              echo "duplicate same-head CI runs detected: $count" >&2
              exit 1
            fi
            sleep 5
          done
          test -n "$run_id"
          for attempt in $(seq 1 360); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
            [ "$state" = completed ] && break
            sleep 5
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)" = completed
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)" = success
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          test "$(jq '.total_count' <<<"$jobs")" -eq 1
          job_id="$(jq -r '.jobs[0].id' <<<"$jobs")"
          test "$(jq -r '.jobs[0].conclusion' <<<"$jobs")" = success
          {
            echo R3_18AW_SAME_HEAD_CI=PASS
            echo CI_RUN_ID=$run_id
            echo CI_JOB_ID=$job_id
            echo CI_RUN_COUNT=1
            echo CI_HEAD_SHA=$GITHUB_SHA
          } > "$OUT/r3_18aw_same_head_ci_receipt.txt"

      - name: Build immutable R3.18AW artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/r318aw-out"
          {
            echo MAIN_SHA=$MAIN_SHA
            echo MAIN_TREE=$MAIN_TREE
            echo PROD_SHA=$PROD_SHA
            echo PROD_TREE=$PROD_TREE
            echo AV_HEAD=$AV_HEAD
            echo AV_RUN=$AV_RUN
            echo AV_ARTIFACT=$AV_ARTIFACT
            echo AV_DIGEST=$AV_DIGEST
            echo AS_ARTIFACT=$AS_ARTIFACT
            echo AS_DIGEST=$AS_DIGEST
            echo BOXCARS_SHA=$BOXCARS_SHA
            echo AW_TEST_BLOB=$AW_TEST_BLOB
            echo AW_BOXCARS_BLOB=$AW_BOXCARS_BLOB
            echo RL223_SEMANTICS=separate_mimir_contract_vs_boxcars_build_threshold_noncomparable
            echo EVIDENCE_HEAD=$GITHUB_SHA
          } > "$OUT/r3_18aw_authority_receipts.txt"
          grep -RInE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})' \
            "$OUT"/r3_18aw_* && exit 1 || true
          rm -f "$OUT/r3_18aw_oracle.log" "$OUT/r3_18aw_oracle_kv.tsv" "$OUT/r3_18aw_oracle_requests.tsv"
          cd "$OUT"
          files=(
            r3_18aw_targets.tsv
            r3_18aw_replay_identity.tsv
            r3_18aw_native_rows.tsv
            r3_18aw_oracle_rows.tsv
            r3_18aw_compare.tsv
            r3_18aw_aggregate.txt
            r3_18aw_negative_controls.txt
            r3_18aw_boxcars_instrumentation.patch
            r3_18aw_boxcars_instrumentation_sha256.txt
            r3_18aw_authority_receipts.txt
            r3_18aw_same_head_ci_receipt.txt
            r3_18aw_test.log
            r3_18aw_lib_test.log
          )
          printf '%s\n' "${files[@]}" | while read -r f; do test -s "$f"; done
          sha256sum "${files[@]}" > r3_18aw_artifact_sha256.txt
          sha256sum -c r3_18aw_artifact_sha256.txt
          echo R3_18AW_ARTIFACT_MANIFEST=PASS files=${#files[@]}

      - name: Upload immutable R3.18AW evidence
        uses: actions/upload-artifact@v4
        with:
          name: r318aw-one-following-payload-evidence
          path: ${{ runner.temp }}/r318aw-out/r3_18aw_*
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Verify artifact receipt and mark success
        shell: bash
        run: |
          set -euo pipefail
          artifact=''
          for attempt in $(seq 1 30); do
            artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name=="r318aw-one-following-payload-evidence") | [.id,.size_in_bytes,.digest] | @tsv' | head -n1)"
            [ -n "$artifact" ] && break
            sleep 2
          done
          test -n "$artifact"
          IFS=$'\t' read -r artifact_id artifact_size artifact_digest <<<"$artifact"
          test -n "$artifact_id"
          test -n "$artifact_size"
          test -n "$artifact_digest"
          echo "R3_18AW_ARTIFACT=${artifact_id}/${artifact_size}/${artifact_digest}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='r318aw/evidence' \
            -f description='R3.18AW exact one-payload evidence passed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Mark evidence failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='r318aw/evidence' \
            -f description='R3.18AW evidence failed; inspect exact run' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
