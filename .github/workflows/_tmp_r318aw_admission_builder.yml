name: R3.18AW Continuity Admission Builder

on:
  push:
    branches:
      - builder/r318aw-admission-v1
    paths:
      - .github/workflows/_tmp_r318aw_admission_builder.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: r318aw-continuity-admission-builder-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN_SHA: b745b7eebdea325015d006ecf84efe1d14f4e827
      MAIN_TREE: 46271056bc2563cf0cf66a0076bf3849816d2cec
      EVIDENCE_HEAD: 5f1d983a7b67f84293f337f23b7e7c25fee48795
      EVIDENCE_TREE: 63cbbb752100ef6944b1ecf366e89854e0f2376a
      EVIDENCE_RUN: '33064535889'
      EVIDENCE_JOB: '98491267256'
      SAME_HEAD_CI: '33064535850'
      SAME_HEAD_CI_JOB: '98491266948'
      ARTIFACT_ID: '9643254651'
      ARTIFACT_SIZE: '23599'
      ARTIFACT_DIGEST: sha256:9bf954cbb161a6ab37e72d04243e6b4aff5495e5d49799dbbbd71e32d0380fbc
      CANDIDATE_BRANCH: candidate/r318aw-admission-v1

    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v6
        with:
          ref: ${{ env.MAIN_SHA }}
          fetch-depth: 2

      - name: Freeze AW authority and candidate uniqueness
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$MAIN_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$MAIN_SHA" --jq .tree.sha)" = "$MAIN_TREE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$EVIDENCE_HEAD" --jq .tree.sha)" = "$EVIDENCE_TREE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$EVIDENCE_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$EVIDENCE_RUN" --jq .head_sha)" = "$EVIDENCE_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$EVIDENCE_JOB" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$SAME_HEAD_CI" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$SAME_HEAD_CI" --jq .head_sha)" = "$EVIDENCE_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$SAME_HEAD_CI_JOB" --jq .conclusion)" = success
          art="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ARTIFACT_ID")"
          test "$(jq -r .name <<<"$art")" = r318aw-one-following-payload-evidence
          test "$(jq -r .size_in_bytes <<<"$art")" = "$ARTIFACT_SIZE"
          test "$(jq -r .digest <<<"$art")" = "$ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.id <<<"$art")" = "$EVIDENCE_RUN"
          test "$(jq -r .workflow_run.head_sha <<<"$art")" = "$EVIDENCE_HEAD"
          if gh api "repos/${GITHUB_REPOSITORY}/branches/${CANDIDATE_BRANCH}" >/dev/null 2>&1; then
            echo "candidate branch already exists; refusing duplicate candidate" >&2
            exit 1
          fi

      - name: Build atomic AW admission and AX spec
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if s.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement marker, got {s.count(old)}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')

          aw_summary = "R3.18AW — one following primitive payload evidence / Outcome A / AV-true 40/40 / AV-false excluded 7/7 / Int=40 / width32=40 / semantic range 5..300 / native-Boxcars mismatch 0 / MIMIR contract RL223 false=40 / Boxcars build RL223 true=34 false=6 / next-control 0 / artifact 9643254651"

          # MIMIR_CONTINUE_HERE.md
          p = Path('MIMIR_CONTINUE_HERE.md')
          s = p.read_text(encoding='utf-8')
          pairs = [
              ("LAST_COMPLETED_READ_ONLY_AUDIT:\n  R3.18AV — published-R3.18AU mixed following-header differential / Outcome A / 47 frozen / false terminators 7 / true headers exact 40 / 16 exact contexts / multiplicity 40 / Int=40 / mismatch 0 / witness reselection 0 / payload-second-control 0/0 / artifact 9640472993",
               "LAST_COMPLETED_READ_ONLY_AUDIT:\n  " + aw_summary),
              ("LAST_COMPLETED_EVIDENCE_PASS:\n  R3.18AV — published AU exact 47/47 / false terminators 7/7 / true following headers exact 40/40 / exact AT contexts 16/16 / multiplicity 40 / Int=40 / mismatch 0 / witness reselection 0 / payload/second-control consumption 0/0 / same-head CI 33057596712 / artifact 9640472993",
               "LAST_COMPLETED_EVIDENCE_PASS:\n  R3.18AW — exact AV-true payload 40/40 / false rows excluded 7/7 / Int=40 / width32=40 / semantic range 5..300 / native-oracle mismatch 0 / RL223 provenance separated / witness reselection 0 / next-control consumption 0 / same-head CI 33064535850 / artifact 9643254651"),
              ("CURRENT_PASS:\n  R3.18AW — one following primitive payload evidence on exact AV-true rows",
               "CURRENT_PASS:\n  R3.18AX — next property-control bit evidence after exact AW payload end"),
              ("CURRENT_PASS_TYPE:\n  read-only one-payload boundary evidence / rematerialize exactly the 40 R3.18AV true rows from the admitted AV artifact; exclude all 7 false terminators before payload decode; compare exactly one current primitive scalar against pinned Boxcars; stop at payload end with zero next-control consumption; production mutation forbidden",
               "CURRENT_PASS_TYPE:\n  read-only one-bit boundary evidence / rematerialize exactly the 40 admitted R3.18AW payload rows; reconstruct the exact AW payload end; independently observe exactly one next property_present bit with pinned Boxcars and standalone native LSB-first evidence logic; stop one bit later; stream/header/payload/second-control and production mutation forbidden"),
              ("  R3.18AW ACTIVE read-only evidence: inspect exactly one following primitive payload on only the 40 admitted AV-true rows; all 7 false terminators are excluded before payload decode; require native/Boxcars exact equality and stop at payload end\n  NO following-payload production composition, next property-control bit after the AW payload, payload access on AV-false rows, context outside exact AV/AT authority, generalized/repeated property loop/cursor, next actor/frame/lifecycle/raw-state/event/replay-slice/skill/runtime/export widening is admitted",
               "  R3.18AW CLOSED Outcome A: exact one Int/32 payload on all 40 admitted AV-true rows; seven AV-false terminators excluded; native/Boxcars mismatch 0; semantic range 5..300; MIMIR contract RL223 false=40 while Boxcars build-derived RL223 true=34 false=6 and Int decoding is independent of that build flag; next-control consumption 0; artifact 9643254651\n  R3.18AX ACTIVE read-only evidence: reconstruct exactly the 40 AW payload ends and observe exactly one following property_present bit; stop one bit later with stream/header/payload/second-control consumption 0/0/0/0\n  NO following-payload production composition, stream/header/payload after the AX control bit, second later property-control bit, payload access on AV-false rows, generalized/repeated property loop/cursor, next actor/frame/lifecycle/raw-state/event/replay-slice/skill/runtime/export widening is admitted")
          ]
          for old, new in pairs:
              if s.count(old) != 1:
                  raise SystemExit(f'continue marker mismatch: {old[:120]!r} count={s.count(old)}')
              s = s.replace(old, new, 1)
          closure = '''\n\nR3_18AW_PAYLOAD_EVIDENCE_CLOSURE:\nOutcome A / read-only / production unchanged at 6a9f456c78ffccab177823234a8d9fe4ba59a850 / tree cbda5db96e88cc208f872c2237cf4741b8fcfaef\nevidence head/tree: 5f1d983a7b67f84293f337f23b7e7c25fee48795 / 63cbbb752100ef6944b1ecf366e89854e0f2376a\nevidence run/job: 33064535889/98491267256 SUCCESS / same-head natural CI 33064535850/98491266948 SUCCESS / count=1 / rerun=0\nartifact: 9643254651 / 23599 bytes / sha256:9bf954cbb161a6ab37e72d04243e6b4aff5495e5d49799dbbbd71e32d0380fbc / downloaded ZIP digest exact / inner manifest 13/13 PASS\nexact rows: AV-true payload 40/40 / AV-false excluded 7/7 / Int=40 / width32=40 / semantic range 5..300 / mismatch 0\nRL223 provenance: MIMIR exact contract false=40/40; Boxcars build-derived true=34 false=6; pinned Boxcars Int decoder RL223 dependence=0\nwitness reselection 0 / next-control bits 0 / production-Cargo-fixture-corpus-support mutation 0/0/0/0/0 / privacy PASS\nnext exact pass: R3.18AX one next property_present bit evidence on the exact forty AW payload ends; no expected boolean distribution inherited; stop one bit later\n'''
          if 'R3_18AW_PAYLOAD_EVIDENCE_CLOSURE:' in s:
              raise SystemExit('AW closure already present')
          p.write_text(s.rstrip() + closure, encoding='utf-8', newline='\n')

          # Knowledge graph current chain + mandatory order + closure note.
          p = Path('MIMIR_KNOWLEDGE_GRAPH.md')
          s = p.read_text(encoding='utf-8')
          old = "R3.18AW one following primitive payload evidence on exact AV-true rows / ACTIVE                                 |"
          new = "R3.18AW one following primitive payload evidence on exact AV-true rows / Outcome A CLOSED                    |\nR3.18AX next property-control bit evidence after exact AW payload end / ACTIVE                                  |"
          if s.count(old) != 1: raise SystemExit('knowledge graph AW chain marker mismatch')
          s = s.replace(old, new, 1)
          old_tail = '''135. `docs/continuity/MIMIR_R3_18AW_EXECUTION_SPEC.md`\n136. `docs/continuity/MIMIR_PASS_PROTOCOL.md`\n137. `docs/continuity/MIMIR_BOUNDARY_LOCKS.md`\n138. `docs/continuity/MIMIR_EXECUTION_ROADMAP_A_TO_Z.md`\n139. `MIMIR_ALL_SOURCES_SUPERBOOK.md`\n140. `docs/chatgpt-archive/SOURCE_REGISTRY.md`\n141. `docs/chatgpt-archive/VALIDATION_MATRIX.md`\n142. `docs/chatgpt-archive/migration/HISTORICAL_TO_CURRENT_MAPPING.md`'''
          new_tail = '''135. `docs/continuity/MIMIR_R3_18AW_EXECUTION_SPEC.md`\n136. `docs/continuity/MIMIR_R3_18AW_DECISION.md`\n137. `docs/continuity/MIMIR_R3_18AX_EXECUTION_SPEC.md`\n138. `docs/continuity/MIMIR_PASS_PROTOCOL.md`\n139. `docs/continuity/MIMIR_BOUNDARY_LOCKS.md`\n140. `docs/continuity/MIMIR_EXECUTION_ROADMAP_A_TO_Z.md`\n141. `MIMIR_ALL_SOURCES_SUPERBOOK.md`\n142. `docs/chatgpt-archive/SOURCE_REGISTRY.md`\n143. `docs/chatgpt-archive/VALIDATION_MATRIX.md`\n144. `docs/chatgpt-archive/migration/HISTORICAL_TO_CURRENT_MAPPING.md`'''
          if s.count(old_tail) != 1: raise SystemExit('knowledge graph mandatory tail mismatch')
          s = s.replace(old_tail, new_tail, 1)
          kg_append = '''\n\n### R3.18AW one following primitive payload evidence: OUTCOME A / CLOSED\n- evidence `5f1d983a7b67f84293f337f23b7e7c25fee48795` / tree `63cbbb752100ef6944b1ecf366e89854e0f2376a`; run/job `33064535889/98491267256` SUCCESS\n- same-head CI `33064535850/98491266948` SUCCESS / count=1 / rerun=0; artifact `9643254651` / `23599` / `sha256:9bf954cbb161a6ab37e72d04243e6b4aff5495e5d49799dbbbd71e32d0380fbc`; ZIP and 13-file inner manifest verified\n- exact AV-true rows 40/40; false terminators excluded 7/7; Int=40; width32=40; semantic range 5..300; native/Boxcars mismatch 0; next-control bits 0\n- RL223 provenance separated: MIMIR AT/AV contract false=40; Boxcars build-derived flag true=34 false=6; pinned Boxcars Int decoder does not consume that build flag\n- production/Cargo/fixture/corpus/support mutation 0/0/0/0/0; production remains R3.18AU\n\n### R3.18AX next property-control bit evidence: ACTIVE\n- exact lane is the same 40 admitted AW payload rows; all seven AV-false terminators remain outside the lane\n- reconstruct each exact AW payload end and observe exactly one following `property_present` bit with pinned Boxcars plus independent native LSB-first evidence logic\n- no expected false/true distribution is inherited; record the complete observed distribution\n- stop one bit later; next stream/header/payload, second later control, generalized cursor and production mutation remain closed\n'''
          if '### R3.18AX next property-control bit evidence: ACTIVE' in s: raise SystemExit('AX section already present')
          p.write_text(s.rstrip() + kg_append, encoding='utf-8', newline='\n')

          # Boundary locks: replace only the current override, retain historical body.
          p = Path('docs/continuity/MIMIR_BOUNDARY_LOCKS.md')
          s = p.read_text(encoding='utf-8')
          marker = '\n---\n\n# 1. Status vocabulary'
          idx = s.find(marker)
          if idx < 0: raise SystemExit('boundary-lock section marker missing')
          prefix = '''# MIMIR — Boundary Locks\n\n**Purpose:** keep current capability claims narrow and prevent a future chat from opening several binary/semantic layers at once.\n\nThis file is not a wishlist. It is the list of boundaries that are currently **OPEN**, **EVIDENCE-ONLY**, or **CLOSED**.\n\n---\n\n# 0. Current override — R3.18AU production / R3.18AW closed / R3.18AX active\n\nThis current override supersedes older status wording later in this historical lock file.\n\n## PRODUCTION — R3.18AU\n- `6a9f456c78ffccab177823234a8d9fe4ba59a850` / `cbda5db96e88cc208f872c2237cf4741b8fcfaef` remains canonical production;\n- false remains a successful no-header terminator on the exact seven AQ/AV-false rows; true composes exactly one following header under exact R3.18AT membership and stops at `payload_start`;\n- R3.18AW is evidence only and does not publish payload composition.\n\n## CLOSED EVIDENCE — R3.18AW Outcome A\n- evidence `5f1d983a7b67f84293f337f23b7e7c25fee48795` / tree `63cbbb752100ef6944b1ecf366e89854e0f2376a` / run-job `33064535889/98491267256` SUCCESS;\n- same-head natural CI `33064535850/98491266948` SUCCESS / count=1 / rerun=0;\n- artifact `9643254651` / `23599` bytes / `sha256:9bf954cbb161a6ab37e72d04243e6b4aff5495e5d49799dbbbd71e32d0380fbc`, downloaded ZIP and inner manifest 13/13 verified;\n- exact 40 AV-true rows yielded Int/32 payloads with semantic range 5..300 and native/Boxcars mismatch 0; all seven AV-false terminators were excluded before payload decoding;\n- MIMIR exact contract `is_rl_223=false` on 40/40; Boxcars build-derived flag true=34 false=6; Int decoding has zero dependency on that Boxcars flag;\n- witness reselection 0; next-control bits consumed 0; production/Cargo/fixture/corpus/support mutation 0/0/0/0/0.\n\n## CLOSED CONTRACT — R3.18AT Outcome A\n- contract `sha256:3c412a5fdf5ed647fbe2b2e4db1f3adf4e4f578ae07c58a302c261f6abafd0a5`; exact_tuple_only / 16 complete eight-field tuples / multiplicity 40;\n- all seven false rows remain outside header membership; AJ/Z/P inheritance and RL223 widening remain rejected.\n\n## ACTIVE EVIDENCE GATE — R3.18AX\n- exact input set is only the 40 admitted AW payload rows; all seven AV-false terminators remain excluded;\n- reconstruct the exact AW payload end first, then inspect exactly one next `property_present` bit;\n- pinned Boxcars and an independent native one-bit observation must match start/value/end exactly; no expected false/true distribution is inherited;\n- stop exactly one bit later with next stream/header/payload/second-control consumption `0/0/0/0`; production mutation forbidden.\n\n## CLOSED\n- following-payload production composition after R3.18AU;\n- any payload/control access on the seven AV-false terminator rows;\n- next stream ID/header/payload after the one R3.18AX control-bit evidence boundary;\n- second later property-control bit after R3.18AX;\n- context/value/boundary inheritance from historical R3.18AM/R3.18AN;\n- repeated/generalized property loop or generic cursor;\n- next actor/frame/lifecycle/raw-state/event/replay-slice/skill/counterfactual/runtime/export widening.\n'''
          p.write_text(prefix + s[idx:], encoding='utf-8', newline='\n')

          # Machine-readable continuity state.
          p = Path('docs/continuity/MIMIR_CONTINUITY_STATE.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['updated_date'] = '2026-08-27'
          d['last_completed_read_only_audit'] = 'R3.18AW'
          d['current_pass'] = 'R3.18AX'
          d['current_pass_kind'] = 'read-only next-property-control-bit evidence / exact R3.18AW payload rows only'
          d['current_pass_goal'] = 'Rematerialize exactly the 40 admitted R3.18AW payload rows, reconstruct each exact payload end, independently observe exactly one next property_present bit with pinned Boxcars and native LSB-first evidence logic, record the complete distribution without prior expectation, and stop one bit later.'
          d['current_pass_stop_boundary'] = 'Read-only. Stop exactly one bit after each exact AW payload end. No next stream ID/header/payload, no second later property-control bit, no AV-false-row access, no generalized cursor, no production mutation, and no actor/frame/lifecycle/raw-state/event/skill/runtime widening.'
          closed = d.get('closed_now', [])
          closed = [x for x in closed if x != 'next property-control bit after the one R3.18AW payload evidence boundary']
          for x in [
              'next stream/header/payload after the one R3.18AX control-bit evidence boundary',
              'second later property-control bit after R3.18AX',
              'payload or control access on the seven R3.18AV false terminator rows',
          ]:
              if x not in closed: closed.append(x)
          d['closed_now'] = closed
          files = d.get('next_files_to_read', [])
          anchor = 'docs/continuity/MIMIR_R3_18AW_EXECUTION_SPEC.md'
          if anchor not in files: raise SystemExit('continuity next_files AW anchor missing')
          for x in ['docs/continuity/MIMIR_R3_18AW_DECISION.md','docs/continuity/MIMIR_R3_18AX_EXECUTION_SPEC.md']:
              if x in files: files.remove(x)
          i = files.index(anchor) + 1
          files[i:i] = ['docs/continuity/MIMIR_R3_18AW_DECISION.md','docs/continuity/MIMIR_R3_18AX_EXECUTION_SPEC.md']
          d['next_files_to_read'] = files
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')

          # Current state.
          Path('docs/continuity/MIMIR_CURRENT_STATE.md').write_text('''# MIMIR — Current Canonical State\n\n**Continuity date:** 2026-08-27\n**Repository:** `Naveax/MIMIR`\n**Canonical production SHA:** `6a9f456c78ffccab177823234a8d9fe4ba59a850`\n**Production tree:** `cbda5db96e88cc208f872c2237cf4741b8fcfaef`\n**Production milestone:** `R3.18AU — bounded post-AQ mixed-continuation following-header production`\n**Last read-only evidence:** `R3.18AW — Outcome A / exact AV-true payload 40/40 / Int=40 / width32=40 / range 5..300 / mismatch 0 / artifact 9643254651`\n**Last completed contract:** `R3.18AT — exact_tuple_only / 16 eight-field contexts / multiplicity 40 / 7 false terminators outside membership / sha256:3c412a5fdf5ed647fbe2b2e4db1f3adf4e4f578ae07c58a302c261f6abafd0a5`\n**Current exact pass:** `R3.18AX — next property-control bit evidence after exact AW payload end`\n\n## Truthful boundary\n\nR3.18AU remains canonical production. R3.18AW closed read-only Outcome A on exactly the forty R3.18AV true rows; all seven false terminators were excluded before payload access. Exactly one current Int/32 scalar matched pinned Boxcars on 40/40 rows with mismatch zero and no next-control bit consumed.\n\n```text\nproduction SHA/tree                    6a9f456c78ffccab177823234a8d9fe4ba59a850 / cbda5db96e88cc208f872c2237cf4741b8fcfaef\nAW evidence head/tree                  5f1d983a7b67f84293f337f23b7e7c25fee48795 / 63cbbb752100ef6944b1ecf366e89854e0f2376a\nAW evidence run/job                    33064535889 / 98491267256 SUCCESS\nAW same-head CI                        33064535850 / 98491266948 SUCCESS / count 1\nAW artifact                            9643254651 / 23599 / sha256:9bf954cbb161a6ab37e72d04243e6b4aff5495e5d49799dbbbd71e32d0380fbc\nAV-true payload rows                   40/40\nAV-false excluded                      7/7\nobserved tag / width                   Int=40 / 32 bits=40\nsemantic Int range                     5..300\nnative/oracle mismatch                 0\nMIMIR contract RL223                   false=40\nBoxcars build-derived RL223            true=34 / false=6\nBoxcars Int RL223 dependence           0\nwitness reselection / next control     0 / 0\nproduction mutation                    0\n```\n\n## Current gate\n\nR3.18AX is read-only. Reconstruct exactly the forty admitted AW payload ends, observe exactly one following `property_present` bit independently with pinned Boxcars and native LSB-first evidence logic, record the complete boolean distribution without inheriting an expected value, and stop one bit later.\n\n## Hard stop\n\nNo AX access on the seven AV-false terminators, no next stream ID/header/payload after the AX bit, no second later control bit, no production payload composition, no generalized/repeated property cursor, and no actor/frame/lifecycle/raw-state/event/replay-slice/skill/runtime/export widening.\n''', encoding='utf-8', newline='\n')

          # Handoff.
          Path('docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md').write_text('''# MIMIR — Next Chat Handoff\n\nCanonical production remains **R3.18AU** at `6a9f456c78ffccab177823234a8d9fe4ba59a850` / `cbda5db96e88cc208f872c2237cf4741b8fcfaef`. R3.18AW is **CLOSED Outcome A** as read-only payload evidence and did not mutate production.\n\nR3.18AW authority: evidence `5f1d983a7b67f84293f337f23b7e7c25fee48795` / tree `63cbbb752100ef6944b1ecf366e89854e0f2376a`; run/job `33064535889/98491267256` SUCCESS; same-head CI `33064535850/98491266948` SUCCESS / count 1 / rerun 0; artifact `9643254651` / `23599` bytes / `sha256:9bf954cbb161a6ab37e72d04243e6b4aff5495e5d49799dbbbd71e32d0380fbc`, independently downloaded with ZIP digest exact and inner manifest 13/13 PASS. Exact AV-true payload rows 40/40 were Int/32 with semantic range 5..300 and native/Boxcars mismatch 0. All seven AV-false rows were excluded. MIMIR `is_rl_223` contract remained false on 40/40 while Boxcars' separate build-derived flag was true=34/false=6; pinned Boxcars Int decoding does not depend on that build flag. Next-control consumption was zero.\n\nThe active pass is **R3.18AX next property-control bit evidence after exact AW payload end**. Use exactly the same forty admitted AW rows, reconstruct each exact payload end first, then observe exactly one following `property_present` bit with pinned Boxcars and independent native LSB-first evidence logic. Do not inherit an expected false/true distribution. Stop exactly one bit later.\n\nDo not access any of the seven AV-false terminators; do not resolve the next stream ID, header or payload; do not read a second later property-control bit; do not create a generic/repeated property loop; do not mutate production. Before dispatch/rerun inspect queued/waiting/in-progress equivalent runs and reuse the existing exact run. Rerun is never polling.\n''', encoding='utf-8', newline='\n')

          # Progress ledger append.
          p = Path('docs/continuity/MIMIR_PROGRESS_LEDGER.md')
          s = p.read_text(encoding='utf-8')
          ledger = '''\n\n---\n\n## R3.18AW — one following primitive payload evidence — Outcome A CLOSED\n\n- Canonical production unchanged: `6a9f456c78ffccab177823234a8d9fe4ba59a850` / `cbda5db96e88cc208f872c2237cf4741b8fcfaef`.\n- Evidence head/tree: `5f1d983a7b67f84293f337f23b7e7c25fee48795` / `63cbbb752100ef6944b1ecf366e89854e0f2376a`.\n- Evidence run/job `33064535889/98491267256` SUCCESS; same-head natural CI `33064535850/98491266948` SUCCESS / count 1 / rerun 0.\n- Artifact `9643254651` / 23599 bytes / `sha256:9bf954cbb161a6ab37e72d04243e6b4aff5495e5d49799dbbbd71e32d0380fbc`; downloaded ZIP digest exact and inner manifest 13/13 PASS.\n- Exact AV-true rows 40/40; AV-false excluded 7/7; Int=40; width32=40; semantic range 5..300; native/Boxcars mismatch 0; witness reselection 0; next-control consumption 0.\n- MIMIR exact contract `is_rl_223=false` on 40/40. Boxcars' distinct build-derived RL223 flag observed true=34 false=6; pinned Boxcars `Int` decoder has zero dependency on that flag.\n- Production/Cargo/fixture/corpus/support mutation `0/0/0/0/0`; privacy PASS.\n\nNext exact pass:\n- `R3.18AX — next property-control bit evidence after exact AW payload end` on exactly the same forty admitted payload rows; no expected boolean distribution; stop one bit later.\n'''
          if '## R3.18AW — one following primitive payload evidence — Outcome A CLOSED' in s:
              raise SystemExit('progress ledger AW closure already present')
