name: R3.18E Continuity Closure

on:
  push:
    branches:
      - agent/r318e-continuity-sync

permissions:
  contents: write
  actions: read

jobs:
  continuity:
    runs-on: windows-latest
    timeout-minutes: 85
    env:
      CANONICAL_BASE: dd7d9550910a0ad08cd5f1a171d782b5dd4e954a
      PROD: 4adadd185783954c7fb6ad67db14b77b377cdde5
      PROD_TREE: 67b1969eaff49d2913b88b3921f27b1bd7fe8193
      LIB_BLOB: 42bc3fd3e8ea6bd1d15df82e4c6d8809b8443662
      TEST_BLOB: 2f5b188cc5b3ce8200c9961d964f1dc66b3ab49b
      EVIDENCE_HEAD: aae03a7fdec85e30be3954d14ffdc8cd1d86121e
      EVIDENCE_RUN: '31949407736'
      NORMAL_CI_RUN: '31949407685'
      ARTIFACT_ID: '9264243765'
      ARTIFACT_DIGEST: 005afc3c97bd6bdb9aef69be993538fd813e30481923c59beefcf37e71cdfc9b

    steps:
      - name: Checkout disposable continuity branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Freeze exact authority and receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main evidence/r318e-control-differential candidate/r3-18d-control-bit-clean
          test "$(git rev-parse origin/main)" = "$CANONICAL_BASE"
          test "$(git rev-parse origin/main^{tree})" = "250571af52c627980b0314814cdacb7881733e9c"
          test "$(git rev-parse "${CANONICAL_BASE}^")" = "$PROD"
          test "$(git rev-parse origin/evidence/r318e-control-differential)" = "$EVIDENCE_HEAD"
          test "$(git rev-parse origin/candidate/r3-18d-control-bit-clean)" = "$PROD"
          test "$(git rev-parse "${PROD}^{tree}")" = "$PROD_TREE"
          test "$(git rev-parse "${PROD}:crates/mimir-replay/src/lib.rs")" = "$LIB_BLOB"
          test "$(git rev-parse "${PROD}:crates/mimir-replay/tests/r3_18d_next_property_control.rs")" = "$TEST_BLOB"
          for id in "$EVIDENCE_RUN" "$NORMAL_CI_RUN"; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .conclusion)" = success
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .head_sha)" = "$EVIDENCE_HEAD"
          done
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .workflow_run.id)" = "$EVIDENCE_RUN"
          digest="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq .digest)"
          test "$digest" = "sha256:$ARTIFACT_DIGEST"
          echo 'R3_18E_CONTINUITY_AUTHORITY=PASS'

      - name: Generate closure from exact canonical main
        shell: pwsh
        run: |
          $generator = Join-Path $env:RUNNER_TEMP 'r318e_continuity.py'
          Copy-Item tools/_tmp_r318e_continuity.py $generator -Force
          git reset --hard $env:CANONICAL_BASE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python $generator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(
            'MIMIR_CONTINUE_HERE.md','MIMIR_KNOWLEDGE_GRAPH.md',
            'docs/continuity/MIMIR_CONTINUITY_STATE.json','docs/continuity/MIMIR_CURRENT_STATE.md',
            'docs/continuity/MIMIR_R3_18E_DECISION.md','docs/continuity/MIMIR_R3_18F_EXECUTION_SPEC.md'
          )
          foreach ($f in $files) {
            $content = Get-Content $f -Raw
            $content = [regex]::Replace($content, '[ \t]+(?=\r?$)', '', 'Multiline')
            $path = if (Test-Path $f) { (Resolve-Path $f).Path } else { Join-Path $PWD $f }
            [IO.File]::WriteAllText($path, $content.Replace("`r`n","`n"), [Text.UTF8Encoding]::new($false))
          }
          Write-Host 'R3_18E_CONTINUITY_GENERATION=PASS'

      - name: Enforce six-file scope and handbook integrity
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = @(
            'MIMIR_CONTINUE_HERE.md','MIMIR_KNOWLEDGE_GRAPH.md',
            'docs/continuity/MIMIR_CONTINUITY_STATE.json','docs/continuity/MIMIR_CURRENT_STATE.md',
            'docs/continuity/MIMIR_R3_18E_DECISION.md','docs/continuity/MIMIR_R3_18F_EXECUTION_SPEC.md'
          ) | Sort-Object
          $actual = @(git diff --name-only; git ls-files --others --exclude-standard) | Where-Object { $_ } | Sort-Object -Unique
          $delta = @(Compare-Object $expected $actual)
          if ($delta.Count -ne 0) { $delta | Format-Table; exit 1 }
          $forbidden = @(git diff --name-only -- crates Cargo.toml Cargo.lock external_fixtures test_corpus tools scripts .github)
          if ($forbidden.Count -ne 0) { $forbidden; exit 1 }
          $numstat = @(git diff --numstat $env:CANONICAL_BASE -- MIMIR_CONTINUE_HERE.md)
          if ($numstat.Count -ne 1) { $numstat; exit 1 }
          $parts = $numstat[0] -split "`t"; $adds=[int]$parts[0]; $dels=[int]$parts[1]
          if ($adds -gt 250 -or $dels -gt 200) { throw "Handbook diff unexpectedly large: +$adds -$dels" }
          $baseLines=@(git show "$env:CANONICAL_BASE`:MIMIR_CONTINUE_HERE.md"); $newLines=@(Get-Content MIMIR_CONTINUE_HERE.md)
          if ([math]::Abs($newLines.Count-$baseLines.Count) -gt 250) { throw "Handbook line-count drift: base=$($baseLines.Count) new=$($newLines.Count)" }
          $handbook=Get-Content MIMIR_CONTINUE_HERE.md -Raw
          foreach ($anchor in @('# 9.7 Exact-SHA validation','# 10. PASS TEMPLATE — COPY THIS FOR EVERY FUTURE PASS','# 13. CURRENT PASS CHECKLIST — R3.14A','**Important:** the newest `main` commit can be newer than `LAST_PRODUCTION_CODE_SHA`')) {
            if (-not $handbook.Contains($anchor)) { throw "Preserved handbook anchor missing: $anchor" }
          }
          Write-Host "R3_18E_CONTINUITY_SCOPE=PASS files=6 handbook=+$adds/-$dels production=0"

      - name: Verify canonical semantics
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          prod='4adadd185783954c7fb6ad67db14b77b377cdde5'
          state=json.loads(Path('docs/continuity/MIMIR_CONTINUITY_STATE.json').read_text(encoding='utf-8'))
          main=Path('MIMIR_CONTINUE_HERE.md').read_text(encoding='utf-8')
          graph=Path('MIMIR_KNOWLEDGE_GRAPH.md').read_text(encoding='utf-8')
          current=Path('docs/continuity/MIMIR_CURRENT_STATE.md').read_text(encoding='utf-8')
          decision=Path('docs/continuity/MIMIR_R3_18E_DECISION.md').read_text(encoding='utf-8')
          spec=Path('docs/continuity/MIMIR_R3_18F_EXECUTION_SPEC.md').read_text(encoding='utf-8')
          assert state['last_production_code_sha']==prod
          assert state['last_production_milestone']=='R3.18D'
          assert state['last_completed_read_only_audit']=='R3.18E'
          assert state['last_completed_evidence_pass']=='R3.18E'
          assert state['current_pass']=='R3.18F'
          assert state['r3_18e']['evidence_head_sha']=='aae03a7fdec85e30be3954d14ffdc8cd1d86121e'
          assert state['r3_18e']['selected_rows']==94
          assert state['r3_18e']['native_oracle_mismatch_count']==0
          assert state['r3_18e']['second_stream_bits_consumed']==0
          assert state['r3_18e']['second_header_bits_consumed']==0
          assert state['r3_18e']['second_payload_bits_consumed']==0
          for anchor in ['CURRENT_PASS:\n  R3.18F','R3_18E_AUDIT_CLOSURE:','R3_18F_OPEN_BOUNDARY:','# 9.7 Exact-SHA validation','# 13. CURRENT PASS CHECKLIST — R3.14A']:
              assert anchor in main, anchor
          assert 'R3.18E control-bit differential decision' in graph
          assert 'R3.18F active second-property-header evidence spec' in graph
          assert '**Outcome:** **A — ADMITTED / READ-ONLY DIFFERENTIAL COMPLETE**' in decision
          assert '**Status:** ACTIVE' in spec
          assert '**Production mutation:** forbidden' in spec
          assert '**Second-property payload decode:** forbidden' in spec
          assert '**Third property / repeated loop:** forbidden' in spec
          assert 'stop at `payload_start`' in spec
          assert 'R3.18F' in current and prod in current
          print('R3_18E_CONTINUITY_SEMANTICS=PASS')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Knowledge Archive
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/verify_mimir_knowledge_archive.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Full repository verifier
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/verify_repo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish clean continuity candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CANONICAL_BASE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- MIMIR_CONTINUE_HERE.md MIMIR_KNOWLEDGE_GRAPH.md docs/continuity/MIMIR_CONTINUITY_STATE.json docs/continuity/MIMIR_CURRENT_STATE.md docs/continuity/MIMIR_R3_18E_DECISION.md docs/continuity/MIMIR_R3_18F_EXECUTION_SPEC.md
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'Close R3.18E control differential and open R3.18F second-header evidence' | git commit-tree "$tree" -p "$CANONICAL_BASE")"
          echo "R3_18E_CONTINUITY_CANDIDATE=$commit"
          echo "R3_18E_CONTINUITY_TREE=$tree"
          echo "R3_18E_CONTINUITY_PARENT=$CANONICAL_BASE"
          git diff-tree --no-commit-id --numstat -r "$commit"
          git push origin "$commit:refs/heads/candidate/r3-18e-continuity-clean"
          echo 'R3_18E_CONTINUITY_PUBLICATION=PASS'
