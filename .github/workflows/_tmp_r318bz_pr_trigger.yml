name: R3.18BZ Admission Repair Runner

on:
  push:
    branches:
      - admit/r318bz-outcome-a
    paths:
      - .github/workflows/_tmp_r318bz_pr_trigger.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: r318bz-outcome-a-admission-repair
  cancel-in-progress: false

jobs:
  admit:
    if: github.event.head_commit.message == 'Normalize R3.18BZ admission docs whitespace'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: 3c90dd10fb775ca45c8bd23b8330290f6ebafbbc
      BASE_TREE: d2ef61ef1c34630db6139dde28f6d952e0a67e4a
      EVIDENCE_SHA: cfcfb671555827b8003007ff766798a1206aca15
      EVIDENCE_RUN: '34950884111'
      EVIDENCE_JOB: '104321306221'
      EVIDENCE_ARTIFACT: '10389058675'
      EVIDENCE_ARTIFACT_NAME: r318bz-published-by-differential-evidence-v4
      EVIDENCE_DIGEST: sha256:e11eceb83779b2fb52c658edf8ee932d4c24228d7b8046b44b235203d9f79d39
      EVIDENCE_MANIFEST_SHA256: f298edbe583571ac1a1b477d74fde61f76b92983b0e4016a01639fd2de8930af

    steps:
      - name: Checkout exact admission branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Freeze fresh main and immutable R3.18BZ evidence
        shell: bash
        run: |
          set -euo pipefail
          eq() { [ "$1" = "$2" ] || { echo "mismatch: got=$1 expected=$2" >&2; exit 1; }; }

          eq "$(git merge-base HEAD "$BASE_SHA")" "$BASE_SHA"
          eq "$(git rev-parse "$BASE_SHA^{tree}")" "$BASE_TREE"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" "$BASE_SHA"

          mapfile -t changed < <(git diff --name-only "$BASE_SHA...HEAD" | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/_tmp_r318bz_admission_builder.yml'
          test "${changed[1]}" = '.github/workflows/_tmp_r318bz_pr_trigger.yml'

          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$EVIDENCE_RUN" --jq .head_sha)" "$EVIDENCE_SHA"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$EVIDENCE_RUN" --jq .status)" completed
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$EVIDENCE_RUN" --jq .conclusion)" success
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$EVIDENCE_JOB" --jq .run_id)" "$EVIDENCE_RUN"
          eq "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$EVIDENCE_JOB" --jq .conclusion)" success

          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$EVIDENCE_ARTIFACT")"
          eq "$(jq -r .name <<<"$meta")" "$EVIDENCE_ARTIFACT_NAME"
          eq "$(jq -r .digest <<<"$meta")" "$EVIDENCE_DIGEST"
          eq "$(jq -r .workflow_run.id <<<"$meta")" "$EVIDENCE_RUN"
          eq "$(jq -r .workflow_run.head_sha <<<"$meta")" "$EVIDENCE_SHA"

          out="$RUNNER_TEMP/r318bz"
          mkdir -p "$out"
          gh run download "$EVIDENCE_RUN" --repo "$GITHUB_REPOSITORY" --name "$EVIDENCE_ARTIFACT_NAME" --dir "$out"
          eq "$(sha256sum "$out/r3_18bz_artifact_sha256.txt" | awk '{print $1}')" "$EVIDENCE_MANIFEST_SHA256"
          (cd "$out" && sha256sum -c r3_18bz_artifact_sha256.txt)

          for line in \
            'R3_18BZ_OUTCOME=A' \
            'R3_18BZ_ROWS=2/2' \
            'R3_18BZ_FALSE_TERMINATOR=1/1' \
            'R3_18BZ_TRUE_HEADER=1/1' \
            'R3_18BZ_EXACT_BX_CONTEXT=1/1' \
            'R3_18BZ_DIRECT_HEADER_MATCH=1/1' \
            'R3_18BZ_BW_ROW_RECONCILIATION=2/2' \
            'R3_18BZ_NATIVE_ORACLE_MISMATCH=0' \
            'R3_18BZ_WITNESS_RESELECTION=0' \
            'R3_18BZ_NEGATIVE_CONTROLS=PASS' \
            'R3_18BZ_FOLLOWING_PAYLOAD_BITS_CONSUMED=0' \
            'R3_18BZ_SECOND_LATER_CONTROL_BITS_CONSUMED=0' \
            'R3_18BZ_PRODUCTION_CARGO_FIXTURE_CORPUS_SUPPORT_MUTATION=0/0/0/0/0' \
            'R3_18BZ_PRIVACY_SCAN=PASS'; do
            grep -Fx "$line" "$out/r3_18bz_aggregate.txt"
          done

      - name: Reuse frozen admission patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/_tmp_r318bz_admission_builder.yml').read_text(encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Validate continuity archive and exact diff"
          if workflow.count(start_marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('admission patch markers are not unique')
          body = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          body = textwrap.dedent(body)
          compile(body, '<r318bz-admission-patch>', 'exec')
          exec(body, {'__name__': '__main__'})

          ca = Path('docs/continuity/MIMIR_R3_18CA_EXECUTION_SPEC.md')
          normalized = '\n'.join(line.rstrip() for line in ca.read_text(encoding='utf-8').splitlines()) + '\n'
          ca.write_text(normalized, encoding='utf-8', newline='\n')
          PY

      - name: Validate archive and staged docs-only final tree
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool docs/continuity/MIMIR_CONTINUITY_STATE.json >/dev/null
          git diff --check
          pwsh -NoProfile -File scripts/verify_mimir_knowledge_archive.ps1

          git rm .github/workflows/_tmp_r318bz_admission_builder.yml
          git rm .github/workflows/_tmp_r318bz_pr_trigger.yml
          git add -A
          git diff --cached --check

          mapfile -t changed < <(git diff --cached --name-only "$BASE_SHA" | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            MIMIR_CONTINUE_HERE.md
            MIMIR_KNOWLEDGE_GRAPH.md
            docs/continuity/MIMIR_BOUNDARY_LOCKS.md
            docs/continuity/MIMIR_CONTINUITY_STATE.json
            docs/continuity/MIMIR_CURRENT_STATE.md
            docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md
            docs/continuity/MIMIR_PROGRESS_LEDGER.md
            docs/continuity/MIMIR_R3_18BZ_DECISION.md
            docs/continuity/MIMIR_R3_18CA_EXECUTION_SPEC.md
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done

          test -z "$(git diff --cached --name-only "$BASE_SHA" -- crates/mimir-replay Cargo.toml Cargo.lock external_fixtures test_corpus || true)"

      - name: Commit canonical admission surface
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MIMIR GitHub Builder'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Admit R3.18BZ and open R3.18CA'
          git push origin HEAD:admit/r318bz-outcome-a
