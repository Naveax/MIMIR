name: R3.18AX Continuity Admission Builder

on:
  push:
    branches:
      - builder/r318ax-admission-v1
    paths:
      - .github/workflows/_tmp_r318ax_admission_builder.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: r318ax-continuity-admission-builder-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      MAIN_SHA: 7741e132df86877cc26cf451f296fd7b7e9cdf30
      MAIN_TREE: 38c66911494625a5ec02f4633424c5a8068a8182
      EVIDENCE_HEAD: 465a3f2fc71e5eed6f00c16a04738031bef8d82c
      EVIDENCE_TREE: b164a8566c6ac57ddee1aed0a7edbf9f44250488
      EVIDENCE_RUN: '33068572230'
      EVIDENCE_JOB: '98504703417'
      SAME_HEAD_CI: '33068572200'
      SAME_HEAD_CI_JOB: '98504703614'
      ARTIFACT_ID: '9644869549'
      ARTIFACT_NAME: r318ax-next-property-control-evidence
      ARTIFACT_SIZE: '18070'
      ARTIFACT_DIGEST: sha256:32f8b8056791280805da023e18ba73931f7caf4e2cf9e816411d4a0094bf97d9
      CANDIDATE_BRANCH: candidate/r318ax-admission-v1

    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@v6
        with:
          ref: ${{ env.MAIN_SHA }}
          fetch-depth: 2

      - name: Freeze AX authority and candidate uniqueness
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$MAIN_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$MAIN_SHA" --jq .tree.sha)" = "$MAIN_TREE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/$EVIDENCE_HEAD" --jq .tree.sha)" = "$EVIDENCE_TREE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$EVIDENCE_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$EVIDENCE_RUN" --jq .head_sha)" = "$EVIDENCE_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$EVIDENCE_JOB" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$SAME_HEAD_CI" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$SAME_HEAD_CI" --jq .head_sha)" = "$EVIDENCE_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$SAME_HEAD_CI_JOB" --jq .conclusion)" = success
          art="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$ARTIFACT_ID")"
          test "$(jq -r .name <<<"$art")" = "$ARTIFACT_NAME"
          test "$(jq -r .size_in_bytes <<<"$art")" = "$ARTIFACT_SIZE"
          test "$(jq -r .digest <<<"$art")" = "$ARTIFACT_DIGEST"
          test "$(jq -r .workflow_run.id <<<"$art")" = "$EVIDENCE_RUN"
          test "$(jq -r .workflow_run.head_sha <<<"$art")" = "$EVIDENCE_HEAD"
          test "$(jq -r .expired <<<"$art")" = false
          if gh api "repos/${GITHUB_REPOSITORY}/branches/${CANDIDATE_BRANCH}" >/dev/null 2>&1; then
            echo "candidate branch already exists; refusing duplicate candidate" >&2
            exit 1
          fi

      - name: Build atomic AX admission and AY spec
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 marker, got {count}')
              return text.replace(old, new, 1)

          # MIMIR_CONTINUE_HERE.md
          p = Path('MIMIR_CONTINUE_HERE.md')
          s = p.read_text(encoding='utf-8')
          s = once(s,
              'LAST_COMPLETED_READ_ONLY_AUDIT:\n  R3.18AW — one following primitive payload evidence / Outcome A / AV-true 40/40 / AV-false excluded 7/7 / Int=40 / width32=40 / semantic range 5..300 / native-Boxcars mismatch 0 / MIMIR contract RL223 false=40 / Boxcars build RL223 true=34 false=6 / next-control 0 / artifact 9643254651',
              'LAST_COMPLETED_READ_ONLY_AUDIT:\n  R3.18AX — next property-control bit evidence after exact AW payload end / Outcome A / AW payload exact 40/40 / AV-false excluded 7/7 / false=37 true=3 / oracle-native exact 40/40 / mismatch 0 / witness reselection 0 / adjacent consumption 0/0/0/0 / artifact 9644869549',
              'continue last audit')
          s = once(s,
              'LAST_COMPLETED_EVIDENCE_PASS:\n  R3.18AW — exact AV-true payload 40/40 / false rows excluded 7/7 / Int=40 / width32=40 / semantic range 5..300 / native-oracle mismatch 0 / RL223 provenance separated / witness reselection 0 / next-control consumption 0 / same-head CI 33064535850 / artifact 9643254651',
              'LAST_COMPLETED_EVIDENCE_PASS:\n  R3.18AX — exact AW payload reconstruction 40/40 / false rows excluded 7/7 / one next property_present bit false=37 true=3 / pinned Boxcars-native exact 40/40 / mismatch 0 / expected distribution inherited 0 / witness reselection 0 / adjacent consumption 0/0/0/0 / same-head CI 33068572200 / artifact 9644869549',
              'continue evidence pass')
          s = once(s,
              'CURRENT_PASS:\n  R3.18AX — next property-control bit evidence after exact AW payload end',
              'CURRENT_PASS:\n  R3.18AY — bounded post-AU one-following-payload production',
              'continue current pass')
          s = once(s,
              'CURRENT_PASS_TYPE:\n  read-only one-bit boundary evidence / rematerialize exactly the 40 admitted R3.18AW payload rows; reconstruct the exact AW payload end; independently observe exactly one next property_present bit with pinned Boxcars and standalone native LSB-first evidence logic; stop one bit later; stream/header/payload/second-control and production mutation forbidden',
              'CURRENT_PASS_TYPE:\n  bounded production implementation / from one exact R3.18AU true following-header result under R3.18AT membership, validate/recompute the header authority, decode exactly one R3.18AW-admitted Int/32 payload with existing primitive scalar machinery, and stop exactly at payload end; the R3.18AX-observed following control remains evidence-only and must not be consumed',
              'continue current type')
          old_gate = '  R3.18AX ACTIVE read-only evidence: reconstruct exactly the 40 AW payload ends and observe exactly one following property_present bit; stop one bit later with stream/header/payload/second-control consumption 0/0/0/0\n  NO following-payload production composition, stream/header/payload after the AX control bit, second later property-control bit, payload access on AV-false rows, generalized/repeated property loop/cursor, next actor/frame/lifecycle/raw-state/event/replay-slice/skill/runtime/export widening is admitted'
          new_gate = '  R3.18AX CLOSED Outcome A: exact AW payload reconstruction 40/40; one next property_present bit false=37 true=3; pinned Boxcars/native exact 40/40; mismatch 0; expected distribution inherited 0; witness reselection 0; adjacent stream/header/payload/second-control consumption 0/0/0/0; artifact 9644869549\n  R3.18AY ACTIVE bounded production: after one exact R3.18AU true following-header result, validate/recompute AU/AT authority, decode exactly one AW-admitted Int/32 payload, and stop at payload end with following-control consumption 0\n  NO production consumption of the AX-observed control bit, payload/control access on AV-false rows, next stream/header/payload, second later property-control bit, generalized/repeated property loop/cursor, next actor/frame/lifecycle/raw-state/event/replay-slice/skill/runtime/export widening is admitted'
          s = once(s, old_gate, new_gate, 'continue hard-stop gate')
          if 'R3_18AX_NEXT_CONTROL_EVIDENCE_CLOSURE:' in s:
              raise SystemExit('AX closure already present')
          closure = '''\n\nR3_18AX_NEXT_CONTROL_EVIDENCE_CLOSURE:\nOutcome A / read-only / production unchanged at 6a9f456c78ffccab177823234a8d9fe4ba59a850 / tree cbda5db96e88cc208f872c2237cf4741b8fcfaef\ncanonical evidence base: 7741e132df86877cc26cf451f296fd7b7e9cdf30 / tree 38c66911494625a5ec02f4633424c5a8068a8182\nevidence head/tree: 465a3f2fc71e5eed6f00c16a04738031bef8d82c / b164a8566c6ac57ddee1aed0a7edbf9f44250488\nevidence run/job: 33068572230/98504703417 SUCCESS / same-head natural CI 33068572200/98504703614 SUCCESS / count=1 / rerun=0\nartifact: 9644869549 / 18070 bytes / sha256:32f8b8056791280805da023e18ba73931f7caf4e2cf9e816411d4a0094bf97d9 / downloaded ZIP digest exact / inner manifest 15/15 PASS\nexact rows: AW payload exact 40/40 / AV-false excluded 7/7 / next control false=37 true=3 / oracle-native exact 40/40 / mismatch 0\nexpected distribution inherited 0 / witness reselection 0 / adjacent stream-header-payload-second-control consumption 0/0/0/0 / privacy PASS\nproduction-Cargo-fixture-corpus-support mutation 0/0/0/0/0\nnext exact pass: R3.18AY bounded post-AU one-following-payload production; AX control remains evidence-only and closed to production consumption\n'''
          p.write_text(s.rstrip() + closure, encoding='utf-8', newline='\n')

          # Knowledge graph current chain, mandatory order, and closure note.
          p = Path('MIMIR_KNOWLEDGE_GRAPH.md')
          s = p.read_text(encoding='utf-8')
          s = once(s,
              'R3.18AX next property-control bit evidence after exact AW payload end / ACTIVE                                  |',
              'R3.18AX next property-control bit evidence after exact AW payload end / Outcome A CLOSED                      |\nR3.18AY bounded post-AU one-following-payload production / ACTIVE                                              |',
              'KG AX chain')
          old_tail = '''135. `docs/continuity/MIMIR_R3_18AW_EXECUTION_SPEC.md`\n136. `docs/continuity/MIMIR_R3_18AW_DECISION.md`\n137. `docs/continuity/MIMIR_R3_18AX_EXECUTION_SPEC.md`\n138. `docs/continuity/MIMIR_PASS_PROTOCOL.md`\n139. `docs/continuity/MIMIR_BOUNDARY_LOCKS.md`\n140. `docs/continuity/MIMIR_EXECUTION_ROADMAP_A_TO_Z.md`\n141. `MIMIR_ALL_SOURCES_SUPERBOOK.md`\n142. `docs/chatgpt-archive/SOURCE_REGISTRY.md`\n143. `docs/chatgpt-archive/VALIDATION_MATRIX.md`\n144. `docs/chatgpt-archive/migration/HISTORICAL_TO_CURRENT_MAPPING.md`'''
          new_tail = '''135. `docs/continuity/MIMIR_R3_18AW_EXECUTION_SPEC.md`\n136. `docs/continuity/MIMIR_R3_18AW_DECISION.md`\n137. `docs/continuity/MIMIR_R3_18AX_EXECUTION_SPEC.md`\n138. `docs/continuity/MIMIR_R3_18AX_DECISION.md`\n139. `docs/continuity/MIMIR_R3_18AY_EXECUTION_SPEC.md`\n140. `docs/continuity/MIMIR_PASS_PROTOCOL.md`\n141. `docs/continuity/MIMIR_BOUNDARY_LOCKS.md`\n142. `docs/continuity/MIMIR_EXECUTION_ROADMAP_A_TO_Z.md`\n143. `MIMIR_ALL_SOURCES_SUPERBOOK.md`\n144. `docs/chatgpt-archive/SOURCE_REGISTRY.md`\n145. `docs/chatgpt-archive/VALIDATION_MATRIX.md`\n146. `docs/chatgpt-archive/migration/HISTORICAL_TO_CURRENT_MAPPING.md`'''
          s = once(s, old_tail, new_tail, 'KG mandatory tail')
          if '### R3.18AX next property-control bit evidence: OUTCOME A / CLOSED' in s:
              raise SystemExit('KG AX closure already present')
          s = s.rstrip() + '''\n\n### R3.18AX next property-control bit evidence: OUTCOME A / CLOSED\n- evidence `465a3f2fc71e5eed6f00c16a04738031bef8d82c` / tree `b164a8566c6ac57ddee1aed0a7edbf9f44250488`; run/job `33068572230/98504703417` SUCCESS\n- same-head CI `33068572200/98504703614` SUCCESS / count=1 / rerun=0; artifact `9644869549` / `18070` / `sha256:32f8b8056791280805da023e18ba73931f7caf4e2cf9e816411d4a0094bf97d9`; downloaded ZIP digest exact and inner manifest 15/15 PASS\n- exact AW payload reconstruction 40/40; AV-false excluded 7/7; next control false=37 true=3; pinned Boxcars/native exact 40/40; mismatch 0; expected distribution inherited 0\n- witness reselection 0; next stream/header/payload/second-control consumption 0/0/0/0; production/Cargo/fixture/corpus/support mutation 0/0/0/0/0\n\n### R3.18AY bounded post-AU one-following-payload production: ACTIVE\n- canonical production remains R3.18AU; R3.18AY may publish only the AW-admitted Int/32 payload boundary on the exact AU/AT true-continuation lane\n- all seven AU/AQ false terminators remain outside payload composition\n- validate/recompute exact AU header authority, require Int and exact payload_start, decode one 32-bit scalar with existing primitive machinery, and stop at payload_end\n- the AX-observed next control distribution false=37/true=3 is evidence for a later pass only; R3.18AY must consume zero following-control bits\n'''
          p.write_text(s + '\n', encoding='utf-8', newline='\n')

          # Boundary locks: replace only current override.
          p = Path('docs/continuity/MIMIR_BOUNDARY_LOCKS.md')
          s = p.read_text(encoding='utf-8')
          marker = '\n---\n\n# 1. Status vocabulary'
          idx = s.find(marker)
          if idx < 0:
              raise SystemExit('boundary-lock status marker missing')
          prefix = '''# MIMIR — Boundary Locks\n\n**Purpose:** keep current capability claims narrow and prevent a future chat from opening several binary/semantic layers at once.\n\nThis file is not a wishlist. It is the list of boundaries that are currently **OPEN**, **EVIDENCE-ONLY**, or **CLOSED**.\n\n---\n\n# 0. Current override — R3.18AU production / R3.18AW+AX closed / R3.18AY active\n\nThis current override supersedes older status wording later in this historical lock file.\n\n## PRODUCTION — R3.18AU\n- `6a9f456c78ffccab177823234a8d9fe4ba59a850` / `cbda5db96e88cc208f872c2237cf4741b8fcfaef` remains canonical production;\n- false remains a successful no-header terminator on the exact seven AQ/AV-false rows; true composes exactly one following header under exact R3.18AT membership and stops at `payload_start`;\n- neither AW payload evidence nor AX control evidence is production capability.\n\n## CLOSED EVIDENCE — R3.18AW Outcome A\n- exact 40 AV-true rows yielded one Int/32 payload with semantic range 5..300 and native/Boxcars mismatch 0; seven AV-false terminators were excluded;\n- artifact `9643254651` / `sha256:9bf954cbb161a6ab37e72d04243e6b4aff5495e5d49799dbbbd71e32d0380fbc`; production mutation 0.\n\n## CLOSED EVIDENCE — R3.18AX Outcome A\n- evidence `465a3f2fc71e5eed6f00c16a04738031bef8d82c` / tree `b164a8566c6ac57ddee1aed0a7edbf9f44250488` / run-job `33068572230/98504703417` SUCCESS;\n- same-head CI `33068572200/98504703614` SUCCESS / count=1 / rerun=0;\n- artifact `9644869549` / `18070` bytes / `sha256:32f8b8056791280805da023e18ba73931f7caf4e2cf9e816411d4a0094bf97d9`; downloaded ZIP digest exact / inner manifest 15/15 PASS;\n- AW payload exact 40/40; AV-false excluded 7/7; exactly one next control bit false=37 true=3; oracle/native exact 40/40; mismatch 0; expected distribution inherited 0;\n- witness reselection 0; next stream/header/payload/second-control consumption `0/0/0/0`; production/Cargo/fixture/corpus/support mutation `0/0/0/0/0`.\n\n## CLOSED CONTRACT — R3.18AT Outcome A\n- contract `sha256:3c412a5fdf5ed647fbe2b2e4db1f3adf4e4f578ae07c58a302c261f6abafd0a5`; exact_tuple_only / 16 complete eight-field tuples / multiplicity 40;\n- all seven false rows remain outside header membership; AJ/Z/P inheritance and RL223 widening remain rejected.\n\n## ACTIVE PRODUCTION GATE — R3.18AY\n- input authority is only one exact R3.18AU true following-header result under R3.18AT membership; all seven false terminators remain outside the payload lane;\n- validate/recompute the exact AU header result and require its resolved tag to be Int;\n- decode exactly one AW-admitted 32-bit Int at the validated payload_start using existing primitive scalar machinery;\n- stop exactly at payload_end; following `property_present` consumption must remain zero;\n- AX false=37/true=3 is recorded evidence only and does not authorize control-bit production in AY.\n\n## CLOSED\n- production consumption of the AX-observed following control bit;\n- payload or control access on the seven AV-false terminator rows;\n- next stream/header/payload after the future one-control boundary;\n- second later property-control bit;\n- context/value/boundary inheritance from historical R3.18AM/R3.18AN;\n- repeated/generalized property loop or generic cursor;\n- next actor/frame/lifecycle/raw-state/event/replay-slice/skill/counterfactual/runtime/export widening.\n'''
          p.write_text(prefix + s[idx:], encoding='utf-8', newline='\n')

          # Machine-readable continuity state.
          p = Path('docs/continuity/MIMIR_CONTINUITY_STATE.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['updated_date'] = '2026-08-27'
          d['last_completed_read_only_audit'] = 'R3.18AX'
          d['current_pass'] = 'R3.18AY'
          d['current_pass_kind'] = 'bounded production implementation / exact R3.18AU true header plus R3.18AW Int/32 payload authority'
          d['current_pass_goal'] = 'From one exact R3.18AU true following-header result under R3.18AT membership, validate or recompute the header authority, decode exactly one R3.18AW-admitted Int/32 payload with existing primitive scalar machinery, and stop exactly at payload end.'
          d['current_pass_stop_boundary'] = 'Production pass. Consume zero R3.18AX following-control bits. No AV-false-row payload/control access, no next stream/header/payload, no second later control, no generalized cursor, and no actor/frame/lifecycle/raw-state/event/skill/runtime widening.'
          closed = [x for x in d.get('closed_now', []) if 'following-payload production composition after R3.18AU' not in x and 'post-AU following payload production' not in x]
          for x in [
              'production consumption of the R3.18AX-observed following control bit',
              'payload or control access on the seven R3.18AV false terminator rows',
              'next stream/header/payload after the future post-AY control boundary',
              'second later property-control bit after the future post-AY control boundary',
          ]:
              if x not in closed:
                  closed.append(x)
          d['closed_now'] = closed
          files = d.get('next_files_to_read', [])
          anchor = 'docs/continuity/MIMIR_R3_18AX_EXECUTION_SPEC.md'
          if anchor not in files:
              raise SystemExit('continuity next_files AX anchor missing')
          for x in ['docs/continuity/MIMIR_R3_18AX_DECISION.md','docs/continuity/MIMIR_R3_18AY_EXECUTION_SPEC.md']:
              while x in files:
                  files.remove(x)
          i = files.index(anchor) + 1
          files[i:i] = ['docs/continuity/MIMIR_R3_18AX_DECISION.md','docs/continuity/MIMIR_R3_18AY_EXECUTION_SPEC.md']
          d['next_files_to_read'] = files
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')

          # Current state.
          Path('docs/continuity/MIMIR_CURRENT_STATE.md').write_text('''# MIMIR — Current Canonical State\n\n**Continuity date:** 2026-08-27\n**Repository:** `Naveax/MIMIR`\n**Canonical production SHA:** `6a9f456c78ffccab177823234a8d9fe4ba59a850`\n**Production tree:** `cbda5db96e88cc208f872c2237cf4741b8fcfaef`\n**Production milestone:** `R3.18AU — bounded post-AQ mixed-continuation following-header production`\n**Last read-only evidence:** `R3.18AX — Outcome A / AW payload exact 40/40 / false=37 true=3 / oracle-native exact 40/40 / mismatch 0 / artifact 9644869549`\n**Last completed contract:** `R3.18AT — exact_tuple_only / 16 eight-field contexts / multiplicity 40 / 7 false terminators outside membership / sha256:3c412a5fdf5ed647fbe2b2e4db1f3adf4e4f578ae07c58a302c261f6abafd0a5`\n**Current exact pass:** `R3.18AY — bounded post-AU one-following-payload production`\n\n## Truthful boundary\n\nR3.18AU remains canonical production and stops at the following header's `payload_start` on its exact forty true-continuation rows. R3.18AW proved one Int/32 payload on those rows. R3.18AX then reconstructed the same payload ends and observed exactly one later `property_present` bit: false=37, true=3, oracle/native mismatch zero. Neither evidence pass changed production.\n\n```text\nproduction SHA/tree                    6a9f456c78ffccab177823234a8d9fe4ba59a850 / cbda5db96e88cc208f872c2237cf4741b8fcfaef\nAX evidence head/tree                  465a3f2fc71e5eed6f00c16a04738031bef8d82c / b164a8566c6ac57ddee1aed0a7edbf9f44250488\nAX evidence run/job                    33068572230 / 98504703417 SUCCESS\nAX same-head CI                        33068572200 / 98504703614 SUCCESS / count 1\nAX artifact                            9644869549 / 18070 / sha256:32f8b8056791280805da023e18ba73931f7caf4e2cf9e816411d4a0094bf97d9\nAW payload exact                       40/40\nAV-false excluded                      7/7\nAX control distribution                false=37 / true=3\nAX oracle/native exact                 40/40\nAX mismatch / reselection              0 / 0\nadjacent consumption                   0/0/0/0\nexpected distribution inherited        0\nproduction mutation                    0\n```\n\n## Current gate\n\nR3.18AY is the next bounded production pass because production still stops at the AU header boundary. It may compose exactly one AW-admitted Int/32 payload on the exact AU/AT true-continuation lane and must stop at payload end. The AX control bit remains evidence-only and must not be read.\n\n## Hard stop\n\nNo payload/control access on the seven false terminators, no AX control-bit production, no next stream/header/payload, no second later control, no generalized/repeated property cursor, and no actor/frame/lifecycle/raw-state/event/replay-slice/skill/runtime/export widening.\n''', encoding='utf-8', newline='\n')

          # Handoff.
          Path('docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md').write_text('''# MIMIR — Next Chat Handoff\n\nCanonical production remains **R3.18AU** at `6a9f456c78ffccab177823234a8d9fe4ba59a850` / `cbda5db96e88cc208f872c2237cf4741b8fcfaef`. R3.18AX is **CLOSED Outcome A** as read-only next-control evidence; production is unchanged.\n\nR3.18AX authority: evidence `465a3f2fc71e5eed6f00c16a04738031bef8d82c` / tree `b164a8566c6ac57ddee1aed0a7edbf9f44250488`; run/job `33068572230/98504703417` SUCCESS; same-head CI `33068572200/98504703614` SUCCESS / count 1 / rerun 0; artifact `9644869549` / `18070` bytes / `sha256:32f8b8056791280805da023e18ba73931f7caf4e2cf9e816411d4a0094bf97d9`, independently downloaded with ZIP digest exact and inner manifest 15/15 PASS. Exact AW payload reconstruction was 40/40, all seven AV-false terminators were excluded, and the next one-bit distribution was false=37 / true=3 with pinned Boxcars/native exact 40/40, mismatch 0, witness reselection 0 and adjacent consumption 0/0/0/0.\n\nThe active pass is **R3.18AY bounded post-AU one-following-payload production**. This is deliberately payload production, not control production: canonical production currently stops at the R3.18AU header `payload_start`. Validate/recompute one exact AU/AT true-header authority, decode exactly one AW-admitted Int/32 payload with existing primitive scalar machinery, and stop at payload end.\n\nThe AX false=37/true=3 control distribution remains evidence for a later pass only. Do not read that control bit in AY. Do not access the seven AV-false rows, create a repeated cursor, advance actor/frame/lifecycle, or widen raw-state/event/skill/runtime/export behavior. Before dispatch/rerun inspect queued/waiting/in-progress equivalent runs and reuse an existing exact run; rerun is never polling.\n''', encoding='utf-8', newline='\n')

          # Progress ledger append.
          p = Path('docs/continuity/MIMIR_PROGRESS_LEDGER.md')
          s = p.read_text(encoding='utf-8')
          if '## R3.18AX — next property-control bit evidence after exact AW payload end — Outcome A CLOSED' in s:
              raise SystemExit('progress ledger AX closure already present')
