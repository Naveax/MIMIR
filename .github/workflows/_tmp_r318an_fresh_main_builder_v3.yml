name: R3.18AN Fresh-Main Candidate Builder V3

on:
  push:
    branches:
      - automation/r318an-fresh-main-builder-v3
    paths:
      - .github/workflows/_tmp_r318an_fresh_main_trigger_v3.txt
  workflow_dispatch:

concurrency:
  group: r318an-fresh-main-candidate-builder-v3
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build-candidate-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_SHA: 6f92e817a88056ba303229541ae04a5d5e03239b
      BASE_TREE: 607905f33c10c6d5cc9715a5d372354ff8960e0e
      V1_GENERATOR_BLOB: 7bef3508f824d40b357eec6f411fc3dddef93fce
      V2_PATCH_BLOB: 91561bb9d94f0d4fff3817cff5830249749b78d3
      CANDIDATE_BRANCH: candidate/r318an-post-ak-payload-v3
      AM_HEAD: 842b94ed4c4e57323433585fea48116ecf18989b
      AM_RUN: '32473716883'
      AM_JOB: '96745647750'
      AM_CI_RUN: '32474038136'
      AM_CI_JOB: '96746590106'
      AM_ARTIFACT: '9443581172'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout builder head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Freeze fresh main and immutable AM authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AM_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AM_RUN" --jq .head_sha)" = "$AM_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$AM_JOB" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AM_CI_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AM_CI_RUN" --jq .head_sha)" = "$AM_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$AM_CI_JOB" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$AM_ARTIFACT" --jq .workflow_run.id)" = "$AM_RUN"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$AM_ARTIFACT" --jq .expired)" = false
          git fetch origin automation/r318an-pre-admission-builder-v1 automation/r318an-pre-admission-builder-v2 --force
          git show origin/automation/r318an-pre-admission-builder-v1:tools/_tmp_r318an_pre_admission_generate.py > "$RUNNER_TEMP/r318an_generate.py"
          git show origin/automation/r318an-pre-admission-builder-v2:tools/_tmp_r318an_pre_admission_patch_v2.py > "$RUNNER_TEMP/r318an_patch_v2.py"
          test "$(git hash-object "$RUNNER_TEMP/r318an_generate.py")" = "$V1_GENERATOR_BLOB"
          test "$(git hash-object "$RUNNER_TEMP/r318an_patch_v2.py")" = "$V2_PATCH_BLOB"
          python -m py_compile "$RUNNER_TEMP/r318an_generate.py" "$RUNNER_TEMP/r318an_patch_v2.py"
          echo R3_18AN_V3_AUTHORITY_FREEZE=PASS

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '
          cargo +1.85.0 --version

      - name: Generate exact two-file candidate from fresh main
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1; then
            echo "candidate branch already exists; refusing duplicate publication" >&2
            exit 1
          fi
          git reset --hard "$BASE_SHA"
          git clean -fdx
          git switch -C "$CANDIDATE_BRANCH" "$BASE_SHA"
          mkdir -p tools
          cp "$RUNNER_TEMP/r318an_generate.py" tools/_tmp_r318an_pre_admission_generate.py
          cp "$RUNNER_TEMP/r318an_patch_v2.py" tools/_tmp_r318an_pre_admission_patch_v2.py
          python tools/_tmp_r318an_pre_admission_generate.py
          python tools/_tmp_r318an_pre_admission_patch_v2.py
          rm -f tools/_tmp_r318an_pre_admission_generate.py tools/_tmp_r318an_pre_admission_patch_v2.py
          rmdir tools 2>/dev/null || true
          cargo +1.85.0 fmt --all
          printf '%s\n' crates/mimir-replay/src/lib.rs crates/mimir-replay/tests/r3_18an_post_ak_payload.rs | sort > "$RUNNER_TEMP/expected.txt"
          { git diff --name-only; git ls-files --others --exclude-standard; } | sed '/^$/d' | sort -u > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          git diff --check
          grep -Fq 'r3_18an_all_47_frozen_am_rows_are_exact_and_stop_before_next_control' crates/mimir-replay/tests/r3_18an_post_ak_payload.rs
          grep -Fq '&following_payload.value' crates/mimir-replay/src/lib.rs
          echo R3_18AN_V3_SCOPE=PASS

      - name: Focused validation
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 test --locked -p mimir-replay --test r3_18an_post_ak_payload
          cargo +1.85.0 test --locked -p mimir-replay --test r3_18ak_post_ag_following_header
          echo R3_18AN_V3_FOCUSED=PASS

      - name: Commit and publish clean candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -- crates/mimir-replay/src/lib.rs crates/mimir-replay/tests/r3_18an_post_ak_payload.rs
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "crates/mimir-replay/src/lib.rs crates/mimir-replay/tests/r3_18an_post_ak_payload.rs "
          git config user.name "MIMIR Candidate Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Implement bounded R3.18AN post-AK Int payload"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "tree=$candidate_tree" >> "$GITHUB_OUTPUT"
          echo "R3_18AN_V3_CANDIDATE=$candidate_sha/$candidate_tree"

      - name: Full repository validation on exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.sha }}"
          cargo +1.85.0 check --locked --workspace --all-targets --all-features
          cargo +1.85.0 clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +1.85.0 test --locked --workspace
          pwsh -NoProfile -File ./scripts/verify_repo.ps1
          echo R3_18AN_V3_FULL_REPO=PASS

      - name: Freeze receipt
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "R3_18AN_V3=PASS"
            echo "BASE_SHA=$BASE_SHA"
            echo "BASE_TREE=$BASE_TREE"
            echo "AM_HEAD=$AM_HEAD"
            echo "AM_RUN_JOB=$AM_RUN/$AM_JOB"
            echo "AM_CI=$AM_CI_RUN/$AM_CI_JOB"
            echo "CANDIDATE_SHA=${{ steps.candidate.outputs.sha }}"
            echo "CANDIDATE_TREE=${{ steps.candidate.outputs.tree }}"
            echo "SCOPE=crates/mimir-replay/src/lib.rs+crates/mimir-replay/tests/r3_18an_post_ak_payload.rs"
            echo "FROZEN_ROWS=47/47"
            echo "TAG=Int"
            echo "WIDTH=32"
            echo "NEXT_CONTROL_BITS=0"
            echo "CANONICAL_ADMISSION=0"
          } | tee r318an_v3_receipt.txt

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: r318an-fresh-main-candidate-v3-receipt
          path: r318an_v3_receipt.txt
          if-no-files-found: error
          retention-days: 30
