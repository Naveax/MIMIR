name: R3.18BY Production Candidate Builder

on:
  push:
    branches:
      - automation/r318by-production-builder-v1

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: r318by-production-builder-v1
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RUSTUP_TOOLCHAIN: 1.85.0
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      BASE_SHA: d4b0e84adf5603a6c2fe106a7f466cd497efdd43
      BASE_TREE: 7bd3ef4f2750efa4aa074ff43dc54015f87c0992
      CANDIDATE_BRANCH: candidate/r318by-production-v1

    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Freeze exact base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)" = "$BASE_SHA"
          mapfile -t changed < <(git diff --name-only "$BASE_SHA...HEAD" | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = '.github/workflows/_tmp_r318by_production_builder.yml'
          test "${changed[1]}" = 'tools/_tmp_r318by_build_candidate.py'

      - name: Install Rust floor
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '

      - name: Materialize source and focused test
        shell: bash
        run: |
          set -euo pipefail
          PATCH_SCRIPT="$RUNNER_TEMP/r318by_build_candidate.py"
          cp tools/_tmp_r318by_build_candidate.py "$PATCH_SCRIPT"
          python3 - "$PATCH_SCRIPT" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          old = '''    let decode_header_suffix = decode_replay_network_existing_actor_property_header_suffix_v1;\n    let following_header = decode_header_suffix(\n'''
          new = '''    let following_header = decode_replay_network_existing_actor_property_header_suffix_v1(\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one BY suffix alias block, got {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git switch --detach "$BASE_SHA"
          git switch -c "$CANDIDATE_BRANCH"
          python3 "$PATCH_SCRIPT"
          git status --short

      - name: Format and enforce exact candidate scope
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 fmt --all
          git diff --check
          mapfile -t changed < <(git status --porcelain | cut -c4- | sort -u)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'crates/mimir-replay/src/lib.rs'
          test "${changed[1]}" = 'crates/mimir-replay/tests/r3_18by_post_bu_following_header.rs'

      - name: Focused R3.18BY validation
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 test -p mimir-replay --test r3_18by_post_bu_following_header

      - name: Direct prerequisite regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 test -p mimir-replay --test r3_18bu_post_bs_following_control
          cargo +1.85.0 test -p mimir-replay --test r3_18bs_post_bo_payload
          cargo +1.85.0 test -p mimir-replay --test r3_18bo_post_bk_following_header

      - name: Workspace validation
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 check --workspace --all-targets
          cargo +1.85.0 clippy --workspace --all-targets -- -D warnings
          pwsh -NoLogo -NoProfile -File scripts/verify_repo.ps1

      - name: Commit and publish clean candidate
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            crates/mimir-replay/src/lib.rs
            crates/mimir-replay/tests/r3_18by_post_bu_following_header.rs
          )
          git config user.name 'MIMIR GitHub Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -- "${expected[@]}"
          mapfile -t cached < <(git diff --cached --name-only | sort)
          test "${#cached[@]}" -eq 2
          test "${cached[0]}" = "${expected[0]}"
          test "${cached[1]}" = "${expected[1]}"
          git commit -m 'Implement R3.18BY bounded post-BU following header'
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo "R3_18BY_PRODUCTION_CANDIDATE_SHA=$candidate_sha"
