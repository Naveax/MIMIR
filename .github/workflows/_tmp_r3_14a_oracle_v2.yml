name: Temporary R3.14A Pinned Oracle Evidence V2

on:
  push:
    branches:
      - agent/r3-14a-first-actor-envelope-evidence
    paths:
      - 'tools/r3_14a_oracle/**'
      - '.github/workflows/_tmp_r3_14a_oracle_v2.yml'

permissions:
  contents: read

jobs:
  oracle:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6

      - name: Apply committed StrictMode driver correction
        shell: pwsh
        run: |
          & ./tools/r3_14a_oracle/fix_driver_strictmode.ps1
          if ($LASTEXITCODE -ne 0) { throw "R3.14A StrictMode correction failed: $LASTEXITCODE" }
          & git diff --check -- tools/r3_14a_oracle/run_oracle.ps1
          if ($LASTEXITCODE -ne 0) { throw "effective oracle driver diff check failed: $LASTEXITCODE" }

      - name: Run deterministic pinned-oracle driver
        shell: pwsh
        run: |
          & ./tools/r3_14a_oracle/run_oracle.ps1
          if ($LASTEXITCODE -ne 0) { throw "R3.14A oracle driver failed: $LASTEXITCODE" }

      - name: Finalize spec-complete JSONL and aggregate evidence
        shell: pwsh
        run: |
          & ./tools/r3_14a_oracle/finalize_evidence.ps1
          if ($LASTEXITCODE -ne 0) { throw "R3.14A evidence finalizer failed: $LASTEXITCODE" }
          foreach ($path in @('r3_14a_first_actor_envelope.jsonl','r3_14a_summary.json','r3_14a_spec_aggregate.txt')) {
            if (-not (Test-Path -LiteralPath $path) -or (Get-Item -LiteralPath $path).Length -eq 0) {
              throw "missing or empty finalized evidence artifact: $path"
            }
          }
          $jsonlCount = @(Get-Content -LiteralPath r3_14a_first_actor_envelope.jsonl).Count
          if ($jsonlCount -ne 47) { throw "expected 47 finalized JSONL rows, got $jsonlCount" }
          $aggregate = Get-Content -Raw -LiteralPath r3_14a_spec_aggregate.txt
          if (-not $aggregate.Contains('R3_14A_SPEC_EVIDENCE=PASS')) { throw 'missing spec evidence PASS marker' }

      - name: Upload R3.14A evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: r3-14a-pinned-oracle-evidence-v2-${{ github.sha }}
          path: |
            r3_14a_effective_driver_sha256.txt
            r3_14a_selector_for_oracle.log
            r3_14a_supported.tsv
            r3_14a_oracle_identity.txt
            r3_14a_boxcars_instrumentation.patch
            r3_14a_oracle.log
            r3_14a_aggregate.txt
            r3_14a_first_actor_envelope.jsonl
            r3_14a_summary.json
            r3_14a_spec_aggregate.txt
          if-no-files-found: error
          retention-days: 30
