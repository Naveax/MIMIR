name: R3.18AP Next Property-Control Differential Evidence

on:
  push:
    branches:
      - evidence/r318ap-next-property-control-v1

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: r318ap-next-property-control-evidence-v1
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mark evidence pending
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='r318ap/evidence' \
            -f description='R3.18AP exact one-bit evidence running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '

      - name: Execute deterministic R3.18AP evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crates/mimir-replay/examples
          cp tools/_tmp_r318ap_run.sh "$RUNNER_TEMP/r318ap_run.sh"
          python3 - "$RUNNER_TEMP/r318ap_run.sh" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text(encoding='utf-8')
          old="insert_after='use std::path::{Path, PathBuf};\\n'"
          new="insert_after='use std::path::PathBuf;\\n'"
          if s.count(old) != 1:
              raise SystemExit(f'R3.18AP V3 import-anchor patch count={s.count(old)}')
          s=s.replace(old,new,1)
          old_run='cargo +1.85.0 run -p mimir-replay --example _tmp_r318ap_probe --quiet > "$TMP/native.log"'
          new_run='RUST_BACKTRACE=1 cargo +1.85.0 run -p mimir-replay --example _tmp_r318ap_probe --quiet 2>&1 | tee "$TMP/native.log"'
          if s.count(old_run) != 1:
              raise SystemExit(f'R3.18AP V3 native-run patch count={s.count(old_run)}')
          s=s.replace(old_run,new_run,1)
          p.write_text(s,encoding='utf-8',newline='\n')
          print('R3_18AP_V3_DIAGNOSTIC_PATCH=PASS')
          PY
          bash "$RUNNER_TEMP/r318ap_run.sh"

      - name: Reuse and verify the unique same-head natural CI
        shell: bash
        run: |
          set -euo pipefail
          workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml" --jq .id)"
          run_id=''
          for attempt in $(seq 1 60); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100")"
            count="$(jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .event == "push")] | length' <<<"$runs")"
            if [ "$count" -eq 1 ]; then
              run_id="$(jq -r '.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .event == "push") | .id' <<<"$runs")"
              break
            fi
            if [ "$count" -gt 1 ]; then
              echo "duplicate same-head CI runs detected: $count" >&2
              exit 1
            fi
            sleep 5
          done
          test -n "$run_id"
          for attempt in $(seq 1 120); do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
            if [ "$state" = completed ]; then break; fi
            sleep 5
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)" = completed
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .head_sha)" = "$GITHUB_SHA"
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          test "$(jq '.total_count' <<<"$jobs")" -eq 1
          job_id="$(jq -r '.jobs[0].id' <<<"$jobs")"
          test "$(jq -r '.jobs[0].conclusion' <<<"$jobs")" = success
          {
            echo R3_18AP_SAME_HEAD_CI=PASS
            echo CI_RUN_ID=$run_id
            echo CI_JOB_ID=$job_id
            echo CI_RUN_COUNT=1
            echo CI_HEAD_SHA=$GITHUB_SHA
          } | tee r3_18ap_same_head_ci_receipt.txt

      - name: Upload immutable R3.18AP evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: r318ap-next-property-control-differential-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            r3_18ap_source_scope.txt
            r3_18ap_replay_identity.tsv
            r3_18ap_targets.tsv
            r3_18ap_boxcars_instrumentation_sha256.txt
            r3_18ap_summary.json
            r3_18ap_comparison.tsv
            r3_18ap_negative_controls.txt
            r3_18ap_validation.txt
            r3_18ap_aggregate.txt
            r3_18ap_upstream_receipts.txt
            r3_18ap_same_head_ci_receipt.txt
            r3_18ap_artifact_sha256.txt

      - name: Verify immutable receipt and mark success
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          meta="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}")"
          test "$(jq -r '.workflow_run.id' <<<"$meta")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' <<<"$meta")" = "$GITHUB_SHA"
          test "$(jq -r '.expired' <<<"$meta")" = false
          norm() { printf '%s' "${1#sha256:}" | tr '[:upper:]' '[:lower:]'; }
          test "$(norm "$(jq -r '.digest' <<<"$meta")")" = "$(norm "$ARTIFACT_DIGEST")"
          grep -Fx 'R3_18AP_OUTCOME=A' r3_18ap_aggregate.txt
          grep -Fx 'R3_18AP_EVIDENCE=PASS' r3_18ap_aggregate.txt
          grep -Fx 'R3_18AP_FROZEN_ROWS=47/47' r3_18ap_aggregate.txt
          grep -Fx 'R3_18AP_PUBLISHED_AN_EXACT=47/47' r3_18ap_aggregate.txt
          grep -Fx 'R3_18AP_ORACLE_NATIVE_MISMATCH=0' r3_18ap_aggregate.txt
          grep -Fx 'R3_18AP_WITNESS_RESELECTION=0' r3_18ap_aggregate.txt
          grep -Fx 'R3_18AP_NEXT_STREAM_BITS_CONSUMED=0' r3_18ap_aggregate.txt
          grep -Fx 'R3_18AP_NEXT_HEADER_BITS_CONSUMED=0' r3_18ap_aggregate.txt
          grep -Fx 'R3_18AP_NEXT_PAYLOAD_BITS_CONSUMED=0' r3_18ap_aggregate.txt
          grep -Fx 'R3_18AP_SECOND_LATER_CONTROL_BITS_CONSUMED=0' r3_18ap_aggregate.txt
          grep -Fx 'R3_18AP_PRIVACY_SCAN=PASS' r3_18ap_aggregate.txt
          grep -Fx 'R3_18AP_SAME_HEAD_CI=PASS' r3_18ap_same_head_ci_receipt.txt
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='r318ap/evidence' \
            -f description='R3.18AP Outcome A exact one-bit differential PASS' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          echo "R3_18AP_EVIDENCE_HEAD=$(git rev-parse HEAD)"
          echo "R3_18AP_EVIDENCE_TREE=$(git rev-parse HEAD^{tree})"
          echo "R3_18AP_AUTHORITY_RUN=$GITHUB_RUN_ID"
          echo "R3_18AP_ARTIFACT_ID=$ARTIFACT_ID"
          echo "R3_18AP_ARTIFACT_DIGEST=$ARTIFACT_DIGEST"
          cat r3_18ap_aggregate.txt
          cat r3_18ap_same_head_ci_receipt.txt
          echo R3_18AP_IMMUTABLE_RECEIPT=PASS

      - name: Mark evidence failure
        if: failure()
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='r318ap/evidence' \
            -f description='R3.18AP evidence failed; inspect exact run' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null || true
