name: R3.6 Validate Clean Exact SHA

on:
  push:
    branches:
      - agent/r3-6-footer-scaffold-clean-validation

jobs:
  validate-clean-exact-sha:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout exact clean R3.6 commit
        uses: actions/checkout@v6
        with:
          ref: 569d523fb16a169ad4b9feafcca1d4636f3c333e

      - name: Assert exact checkout
        shell: pwsh
        run: |
          $expected = '569d523fb16a169ad4b9feafcca1d4636f3c333e'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "exact clean SHA mismatch: expected=$expected actual=$actual" }
          Write-Host "R3_6_EXACT_CLEAN_SHA=$actual"

      - name: Toolchain
        shell: pwsh
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: Full repository verification
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify_repo.ps1
