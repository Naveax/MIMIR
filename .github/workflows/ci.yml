name: CI

on:
  push:
    branches-ignore:
      - automation/r318an-admission-builder-v1
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain
        shell: pwsh
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: Repository verification
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify_repo.ps1
