name: Aux Anyhow RustSec Remediation Builder V1

on:
  push:
    branches:
      - recovery/anyhow-rustsec-ci-v1
    paths:
      - '.github/workflows/ci.yml'

concurrency:
  group: aux-anyhow-rustsec-remediation-builder-v1
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_SHA: fec9dca3cb8366108245788fc9a2b24a0c99fe94
      BASE_TREE: 3bf5f68ec7df5565f78f89fd4bc2254f2a64e010
      CANDIDATE_BRANCH: aux/anyhow-rustsec-remediation-v1

    steps:
      - name: Checkout exact recovery head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Freeze recovery scope and fresh main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/main^{tree})" = "$BASE_TREE"
          test "$(git diff --name-only "$BASE_SHA" HEAD)" = '.github/workflows/ci.yml'
          if git ls-remote --exit-code --heads origin "refs/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1; then
            echo 'clean candidate already exists; refusing duplicate build'
            exit 78
          fi
          git show "$BASE_SHA:Cargo.lock" > /tmp/Cargo.lock.before

      - name: Exact Rust 1.85 toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '
          cargo +1.85.0 --version

      - name: Apply minimal anyhow lock remediation
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$BASE_SHA"
          git clean -fdx
          cargo +1.85.0 update -p anyhow --precise 1.0.103
          test "$(git diff --name-only)" = 'Cargo.lock'
          python - <<'PY'
          import tomllib
          from pathlib import Path
          before = tomllib.loads(Path('/tmp/Cargo.lock.before').read_text())['package']
          after = tomllib.loads(Path('Cargo.lock').read_text())['package']
          def without_anyhow(packages):
              return sorted((p for p in packages if p['name'] != 'anyhow'), key=lambda p: (p['name'], p['version'], p.get('source','')))
          assert without_anyhow(before) == without_anyhow(after), 'cargo update changed packages other than anyhow'
          b = [p for p in before if p['name'] == 'anyhow']
          a = [p for p in after if p['name'] == 'anyhow']
          assert len(b) == 1 and b[0]['version'] == '1.0.102', b
          assert len(a) == 1 and a[0]['version'] == '1.0.103', a
          print('ANYHOW_LOCK_TRANSITION=1.0.102->1.0.103')
          PY
          git diff --check

      - name: Rust 1.85 full verification
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 check --locked --workspace --all-targets --all-features
          cargo +1.85.0 test --locked --workspace --all-targets --all-features
          cargo +1.85.0 clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Confirm advisory remediation
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 install cargo-audit --version 0.22.1 --locked
          test "$(cargo-audit --version 2>&1)" = 'cargo-audit 0.22.1'
          cargo audit --file Cargo.lock 2>&1 | tee /tmp/audit.log
          if grep -F 'RUSTSEC-2026-0190' /tmp/audit.log; then
            echo 'RUSTSEC-2026-0190 still present after precise lock update' >&2
            exit 1
          fi
          db="$HOME/.cargo/advisory-db"
          test -d "$db/.git"
          echo "RUSTSEC_ADVISORY_DB_HEAD=$(git -C "$db" rev-parse HEAD)"
          echo "RUSTSEC_CARGO_LOCK_SHA256=$(sha256sum Cargo.lock | awk '{print $1}')"

      - name: Publish clean lock-only candidate once
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'Cargo.lock'
          git config user.name 'MIMIR Auxiliary Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- Cargo.lock
          test "$(git diff --cached --name-only)" = 'Cargo.lock'
          git diff --cached --check
          git commit -m 'fix(deps): remediate RUSTSEC-2026-0190'
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          if git ls-remote --exit-code --heads origin "refs/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1; then
            echo 'candidate appeared during builder run; refusing overwrite' >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo "AUX_ANYHOW_RUSTSEC_CANDIDATE=$(git rev-parse HEAD)/$(git rev-parse HEAD^{tree})"
