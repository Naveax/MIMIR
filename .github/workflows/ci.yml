name: R3.18AN Corrective Registered CI V4

on:
  push:
    branches:
      - recovery/r318an-source-scope-ci-v2
    paths:
      - .github/workflows/_tmp_r318an_corrective_trigger_v4.txt

concurrency:
  group: r318an-corrective-registered-ci-v4
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  statuses: write
  issues: write

jobs:
  build-an-corrected:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BASE_SHA: 6f92e817a88056ba303229541ae04a5d5e03239b
      BASE_TREE: 607905f33c10c6d5cc9715a5d372354ff8960e0e
      OLD_CUSTOM_HEAD: 07b39f417d6af329e89474096b2e07d829d97b27
      OLD_REGISTERED_HEAD: d51dffe4ca0318934173c2d27f080011125fad47
      V1_GENERATOR_BLOB: 7bef3508f824d40b357eec6f411fc3dddef93fce
      V2_PATCH_BLOB: 91561bb9d94f0d4fff3817cff5830249749b78d3
      RELOCATE_BLOB: 7b55e7b9f32bc80ac0a76de0160c82516058147a
      CANDIDATE_BRANCH: candidate/r318an-post-ak-payload-v4
      OLD_CANDIDATE_BRANCH: candidate/r318an-post-ak-payload-v3
      AM_HEAD: 842b94ed4c4e57323433585fea48116ecf18989b
      AM_RUN: '32473716883'
      AM_JOB: '96745647750'
      AM_CI_RUN: '32474038136'
      AM_CI_JOB: '96746590106'
      AM_ARTIFACT: '9443581172'
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact corrective recovery head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mark recovery pending
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='r318an/production-recovery' \
            -f description='R3.18AN corrective recovery running' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Freeze helper scope and fresh main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          test "$(git rev-parse HEAD:tools/_tmp_r318an_relocate_v3.py)" = "$RELOCATE_BLOB"
          mapfile -t actual < <(git diff --name-only "$BASE_SHA" HEAD | sort)
          mapfile -t expected < <(printf '%s\n' \
            .github/workflows/ci.yml \
            .github/workflows/_tmp_r318an_corrective_trigger_v4.txt \
            tools/_tmp_r318an_relocate_v3.py | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          cp tools/_tmp_r318an_relocate_v3.py "$RUNNER_TEMP/r318an_relocate_v3.py"
          python -m py_compile "$RUNNER_TEMP/r318an_relocate_v3.py"
          echo R3_18AN_V4_HELPER_SCOPE=PASS

      - name: Refuse active superseded recoveries or conflicting candidates
        id: race
        shell: bash
        run: |
          set -euo pipefail
          old_custom="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=automation%2Fr318an-fresh-main-builder-v3&event=push&per_page=100" --jq "[.workflow_runs[] | select(.head_sha == \"$OLD_CUSTOM_HEAD\" and .status != \"completed\")] | length")"
          old_registered="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=recovery%2Fr318an-fresh-main-ci-v1&event=push&per_page=100" --jq "[.workflow_runs[] | select(.head_sha == \"$OLD_REGISTERED_HEAD\" and .status != \"completed\")] | length")"
          test "$old_custom" -eq 0
          test "$old_registered" -eq 0

          if git ls-remote --exit-code --heads origin "refs/heads/$OLD_CANDIDATE_BRANCH" >/dev/null 2>&1; then
            echo "superseded v3 candidate unexpectedly exists; inspect before proceeding" >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1; then
            echo 'mode=existing' >> "$GITHUB_OUTPUT"
            echo R3_18AN_V4_EXISTING_CANDIDATE=PASS
            exit 0
          fi
          echo 'mode=generate' >> "$GITHUB_OUTPUT"
          echo R3_18AN_V4_RACE_GUARD=PASS

      - name: Freeze R3.18AM authority and source helpers
        if: steps.race.outputs.mode == 'generate'
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AM_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AM_RUN" --jq .head_sha)" = "$AM_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$AM_JOB" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AM_CI_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AM_CI_RUN" --jq .head_sha)" = "$AM_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$AM_CI_JOB" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$AM_ARTIFACT" --jq .workflow_run.id)" = "$AM_RUN"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$AM_ARTIFACT" --jq .expired)" = false

          git fetch origin automation/r318an-pre-admission-builder-v1 automation/r318an-pre-admission-builder-v2 --force
          git show origin/automation/r318an-pre-admission-builder-v1:tools/_tmp_r318an_pre_admission_generate.py > "$RUNNER_TEMP/r318an_generate.py"
          git show origin/automation/r318an-pre-admission-builder-v2:tools/_tmp_r318an_pre_admission_patch_v2.py > "$RUNNER_TEMP/r318an_patch_v2.py"
          test "$(git hash-object "$RUNNER_TEMP/r318an_generate.py")" = "$V1_GENERATOR_BLOB"
          test "$(git hash-object "$RUNNER_TEMP/r318an_patch_v2.py")" = "$V2_PATCH_BLOB"
          python -m py_compile "$RUNNER_TEMP/r318an_generate.py" "$RUNNER_TEMP/r318an_patch_v2.py"
          echo R3_18AN_V4_AUTHORITY_FREEZE=PASS

      - name: Toolchain
        if: steps.race.outputs.mode == 'generate'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc +1.85.0 --version | grep -F 'rustc 1.85.0 '
          cargo +1.85.0 --version

      - name: Generate patch and relocate corrected AN candidate
        if: steps.race.outputs.mode == 'generate'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$BASE_SHA"
          git clean -fdx
          git switch -C "$CANDIDATE_BRANCH" "$BASE_SHA"
          mkdir -p tools
          cp "$RUNNER_TEMP/r318an_generate.py" tools/_tmp_r318an_pre_admission_generate.py
          cp "$RUNNER_TEMP/r318an_patch_v2.py" tools/_tmp_r318an_pre_admission_patch_v2.py
          cp "$RUNNER_TEMP/r318an_relocate_v3.py" tools/_tmp_r318an_relocate_v3.py
          python tools/_tmp_r318an_pre_admission_generate.py
          python tools/_tmp_r318an_pre_admission_patch_v2.py
          python tools/_tmp_r318an_relocate_v3.py
          rm -f tools/_tmp_r318an_pre_admission_generate.py tools/_tmp_r318an_pre_admission_patch_v2.py tools/_tmp_r318an_relocate_v3.py
          rmdir tools 2>/dev/null || true
          cargo +1.85.0 fmt --all

          printf '%s\n' crates/mimir-replay/src/lib.rs crates/mimir-replay/tests/r3_18an_post_ak_payload.rs | sort > "$RUNNER_TEMP/expected.txt"
          { git diff --name-only; git ls-files --others --exclude-standard; } | sed '/^$/d' | sort -u > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          git diff --check
          grep -Fq 'r3_18an_all_47_frozen_am_rows_are_exact_and_stop_before_next_control' crates/mimir-replay/tests/r3_18an_post_ak_payload.rs
          grep -Fq 'r3_18an_source_scope_is_one_ak_header_one_int_scalar_and_no_next_control_or_loop' crates/mimir-replay/tests/r3_18an_post_ak_payload.rs
          python - <<'PY'
          from pathlib import Path
          s = Path('crates/mimir-replay/src/lib.rs').read_text(encoding='utf-8')
          ak = s.index('// R3.18AK END bounded post-AG following-header composition')
          tm = s.index('#[cfg(test)]\nmod tests {')
          an = s.index('// R3.18AN PRE-ADMISSION BEGIN bounded post-AK payload composition')
          j = s.index('/// R3.18J bounded second-property payload value.')
          assert ak < tm < an < j, (ak, tm, an, j)
          print('R3_18AN_V4_SAFE_SOURCE_ORDER=PASS')
          PY
          echo R3_18AN_V4_SCOPE=PASS files=2 rows=47

      - name: Focused source-scope and boundary validation
        if: steps.race.outputs.mode == 'generate'
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 test --locked -p mimir-replay --test r3_18an_post_ak_payload
          cargo +1.85.0 test --locked -p mimir-replay --test r3_18ak_post_ag_following_header
          cargo +1.85.0 test --locked -p mimir-replay --test r3_18w_following_payload_control
          cargo +1.85.0 test --locked -p mimir-replay --test r3_18aa_post_w_following_header
          cargo +1.85.0 test --locked -p mimir-replay --test r3_18ag_post_ad_payload_control
          echo R3_18AN_V4_FOCUSED_AND_SCOPE=PASS

      - name: Commit exact clean candidate
        if: steps.race.outputs.mode == 'generate'
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -- crates/mimir-replay/src/lib.rs crates/mimir-replay/tests/r3_18an_post_ak_payload.rs
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "crates/mimir-replay/src/lib.rs crates/mimir-replay/tests/r3_18an_post_ak_payload.rs "
          git config user.name 'MIMIR Candidate Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Implement bounded R3.18AN post-AK Int payload'
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Full exact-candidate validation
        if: steps.race.outputs.mode == 'generate'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.sha }}"
          cargo +1.85.0 check --locked --workspace --all-targets --all-features
          cargo +1.85.0 clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +1.85.0 test --locked --workspace
          pwsh -NoProfile -File ./scripts/verify_repo.ps1
          echo R3_18AN_V4_FULL_REPO=PASS

      - name: Publish exact clean candidate once
        if: steps.race.outputs.mode == 'generate'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          if git ls-remote --exit-code --heads origin "refs/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1; then
            echo 'candidate appeared during validation; refusing overwrite' >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo R3_18AN_V4_CANDIDATE_PUBLISHED=PASS

      - name: Freeze candidate receipt
        if: steps.race.outputs.mode == 'generate'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'R3_18AN_CORRECTIVE_V4=PASS'
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "BASE_SHA=$BASE_SHA"
            echo "BASE_TREE=$BASE_TREE"
            echo "AM_HEAD=$AM_HEAD"
            echo "AM_RUN_JOB=$AM_RUN/$AM_JOB"
            echo "AM_CI=$AM_CI_RUN/$AM_CI_JOB"
            echo "CANDIDATE_SHA=${{ steps.candidate.outputs.sha }}"
            echo "CANDIDATE_TREE=${{ steps.candidate.outputs.tree }}"
            echo 'SCOPE=crates/mimir-replay/src/lib.rs+crates/mimir-replay/tests/r3_18an_post_ak_payload.rs'
            echo 'FROZEN_ROWS=47/47'
            echo 'TAG=Int'
            echo 'WIDTH=32'
            echo 'NEXT_CONTROL_BITS=0'
            echo 'SOURCE_RELOCATION=after_internal_test_module_before_R3.18J'
            echo 'CANONICAL_ADMISSION=0'
          } | tee r318an_corrective_v4_receipt.txt

      - name: Upload receipt
        if: steps.race.outputs.mode == 'generate'
        uses: actions/upload-artifact@v4
        with:
          name: r318an-corrective-v4-receipt
          path: r318an_corrective_v4_receipt.txt
          if-no-files-found: error
          retention-days: 30

      - name: Record success in coordination ledger
        if: success() && steps.race.outputs.mode == 'generate'
        shell: bash
        run: |
          set -euo pipefail
          job_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | select(.name == "build-an-corrected") | .id' | head -n1)"
          gh issue comment 129 --repo "$GITHUB_REPOSITORY" --body "R3.18AN corrective recovery SUCCESS: run/job \`$GITHUB_RUN_ID/$job_id\`; base \`$BASE_SHA/$BASE_TREE\`; candidate \`${{ steps.candidate.outputs.sha }}/${{ steps.candidate.outputs.tree }}\`; exact two-file scope; 47/47 AM Int/32; next-control bits 0; source relocation after the internal test module and before R3.18J; AK/W/AA/AG source-scope regressions PASS. Candidate \`$CANDIDATE_BRANCH\` is validation evidence only, not canonical admission."

      - name: Mark recovery success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='r318an/production-recovery' \
            -f description='R3.18AN corrective recovery passed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Record and mark recovery failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 129 --repo "$GITHUB_REPOSITORY" --body "R3.18AN corrective recovery failed on immutable helper head \`$GITHUB_SHA\`, run \`$GITHUB_RUN_ID\`. Do not rerun this SHA; inspect the exact failed step before any new corrective head."
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='r318an/production-recovery' \
            -f description='R3.18AN corrective recovery failed' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
