name: R3.18AM Continuity Recovery via Registered CI V5

on:
  push:
    branches:
      - recovery/r318am-continuity-ci-v1
    paths:
      - '.github/workflows/ci.yml'
      - 'tools/_tmp_r318am_admission_generate.py'

concurrency:
  group: r318am-continuity-recovery-registered-ci-v5
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  recover-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: fec9dca3cb8366108245788fc9a2b24a0c99fe94
      BASE_TREE: 3bf5f68ec7df5565f78f89fd4bc2254f2a64e010
      V4_HEAD: c5c2d7a08163afe0222a894c9cd78e4c6d734da3
      GENERATOR_BLOB: 952beba8bbfa9dd0bb4985c5ecba75b89e8dfb96
      AM_HEAD: 842b94ed4c4e57323433585fea48116ecf18989b
      AM_TREE: 486d0a0f3833dcb8872f062ae1927c9aefde87ba
      AM_RUN: '32473716883'
      AM_JOB: '96745647750'
      AM_CI_RUN: '32474038136'
      AM_CI_JOB: '96746590106'
      AM_ARTIFACT: '9443581172'
      AM_ARTIFACT_SIZE: '14827'
      AM_ARTIFACT_DIGEST: 2f65de5207bd96787fd7d1527a55991f08d5da614a0ddfce22a7aa267968e3c8
      CANDIDATE_BRANCH: continuity/r318am-admit-an-v2
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact registered-CI recovery head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Freeze helper scope and fresh main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse HEAD:tools/_tmp_r318am_admission_generate.py)" = "$GENERATOR_BLOB"
          mapfile -t actual < <(git diff --name-only "$BASE_SHA" HEAD | sort)
          mapfile -t expected < <(printf '%s\n' .github/workflows/ci.yml tools/_tmp_r318am_admission_generate.py | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/main^{tree})" = "$BASE_TREE"
          cp tools/_tmp_r318am_admission_generate.py /tmp/r318am_admission_generate.py
          python -m py_compile /tmp/r318am_admission_generate.py
          echo R3_18AM_V5_HELPER_FREEZE=PASS

      - name: Refuse to race an active V4 or existing clean candidate
        id: race
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "refs/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1; then
            echo "candidate_exists=1" >> "$GITHUB_OUTPUT"
            echo R3_18AM_V5_NOOP_EXISTING_CANDIDATE=1
            exit 0
          fi
          active="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=automation%2Fr318am-admission-builder-v1&event=push&per_page=100" --jq "[.workflow_runs[] | select(.head_sha == \"$V4_HEAD\" and .status != \"completed\")] | length")"
          test "$active" -eq 0
          echo "candidate_exists=0" >> "$GITHUB_OUTPUT"
          echo R3_18AM_V5_RACE_GUARD=PASS

      - name: Freeze R3.18AM evidence authority
        if: steps.race.outputs.candidate_exists == '0'
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AM_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AM_RUN" --jq .head_sha)" = "$AM_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AM_RUN" --jq .head_commit.tree_id)" = "$AM_TREE"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$AM_JOB" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AM_CI_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$AM_CI_RUN" --jq .head_sha)" = "$AM_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/$AM_CI_JOB" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$AM_ARTIFACT" --jq .workflow_run.id)" = "$AM_RUN"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$AM_ARTIFACT" --jq .workflow_run.head_sha)" = "$AM_HEAD"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$AM_ARTIFACT" --jq .name)" = r318am-post-ak-payload-evidence
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$AM_ARTIFACT" --jq .size_in_bytes)" = "$AM_ARTIFACT_SIZE"
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/$AM_ARTIFACT" --jq .digest)"
          test "${digest#sha256:}" = "$AM_ARTIFACT_DIGEST"
          rm -rf /tmp/r318am_art && mkdir -p /tmp/r318am_art
          gh run download "$AM_RUN" -n r318am-post-ak-payload-evidence -D /tmp/r318am_art
          (
            cd /tmp/r318am_art
            test "$(wc -l < r3_18am_artifact_sha256.txt)" -eq 11
            sha256sum -c r3_18am_artifact_sha256.txt
            grep -Fqx 'R3_18AM_OUTCOME=A' r3_18am_aggregate.txt
            grep -Fqx 'R3_18AM_FROZEN_ROWS=47/47' r3_18am_aggregate.txt
            grep -Fqx 'R3_18AM_PUBLISHED_AK_EXACT=47/47' r3_18am_aggregate.txt
            grep -Fqx 'R3_18AM_TAG_INT=47' r3_18am_aggregate.txt
            grep -Fqx 'R3_18AM_OBSERVED_PAYLOAD_WIDTH=32' r3_18am_aggregate.txt
            grep -Fqx 'R3_18AM_PAYLOAD_WIDTH_COUNT=47' r3_18am_aggregate.txt
            grep -Fqx 'R3_18AM_NATIVE_ORACLE_MISMATCH=0' r3_18am_aggregate.txt
            grep -Fqx 'R3_18AM_WITNESS_RESELECTION=0' r3_18am_aggregate.txt
            grep -Fqx 'R3_18AM_ANOTHER_CONTROL_BITS_CONSUMED=0' r3_18am_aggregate.txt
            grep -Fqx 'R3_18AM_PRIVACY_SCAN=PASS' r3_18am_aggregate.txt
          )
          echo R3_18AM_V5_AUTHORITY_FREEZE=PASS

      - name: Generate exact nine-file clean candidate
        if: steps.race.outputs.candidate_exists == '0'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$BASE_SHA"
          git clean -fdx
          python /tmp/r318am_admission_generate.py "$AM_CI_RUN" "$AM_CI_JOB"
          git add -N docs/continuity/MIMIR_R3_18AM_DECISION.md docs/continuity/MIMIR_R3_18AN_EXECUTION_SPEC.md
          mapfile -t actual < <(git diff --name-only | sort)
          mapfile -t expected < <(printf '%s\n' \
            MIMIR_CONTINUE_HERE.md \
            MIMIR_KNOWLEDGE_GRAPH.md \
            docs/continuity/MIMIR_BOUNDARY_LOCKS.md \
            docs/continuity/MIMIR_CONTINUITY_STATE.json \
            docs/continuity/MIMIR_CURRENT_STATE.md \
            docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md \
            docs/continuity/MIMIR_PROGRESS_LEDGER.md \
            docs/continuity/MIMIR_R3_18AM_DECISION.md \
            docs/continuity/MIMIR_R3_18AN_EXECUTION_SPEC.md | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${actual[@]}")
          python -m json.tool docs/continuity/MIMIR_CONTINUITY_STATE.json >/dev/null
          git diff --check
          git diff --exit-code HEAD -- crates Cargo.toml Cargo.lock external_fixtures test_corpus scripts .github
          echo R3_18AM_V5_SCOPE=PASS files=9

      - name: Commit and publish clean candidate once
        if: steps.race.outputs.candidate_exists == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MIMIR Admission Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- \
            MIMIR_CONTINUE_HERE.md \
            MIMIR_KNOWLEDGE_GRAPH.md \
            docs/continuity/MIMIR_BOUNDARY_LOCKS.md \
            docs/continuity/MIMIR_CONTINUITY_STATE.json \
            docs/continuity/MIMIR_CURRENT_STATE.md \
            docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md \
            docs/continuity/MIMIR_PROGRESS_LEDGER.md \
            docs/continuity/MIMIR_R3_18AM_DECISION.md \
            docs/continuity/MIMIR_R3_18AN_EXECUTION_SPEC.md
          test "$(git diff --cached --name-only | wc -l)" -eq 9
          git diff --cached --check
          git commit -m "Admit R3.18AM and open R3.18AN"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          if git ls-remote --exit-code --heads origin "refs/heads/$CANDIDATE_BRANCH" >/dev/null 2>&1; then
            echo "candidate appeared during recovery; refusing overwrite" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo "R3_18AM_V5_CANDIDATE=$(git rev-parse HEAD)/$(git rev-parse HEAD^{tree})"
          echo R3_18AM_V5_CANDIDATE_PUBLISHED=PASS
