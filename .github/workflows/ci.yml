name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Apply disposable R3.16B production patch
        shell: pwsh
        run: |
          git apply --check tools/_tmp_r316b_property_header.patch
          if ($LASTEXITCODE -ne 0) { throw "R3.16B patch check failed" }
          git apply tools/_tmp_r316b_property_header.patch
          if ($LASTEXITCODE -ne 0) { throw "R3.16B patch apply failed" }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw "R3.16B formatting failed" }
          git diff --check -- crates/mimir-replay/src/lib.rs crates/mimir-replay/tests/_tmp_r316b_property_header.rs
          if ($LASTEXITCODE -ne 0) { throw "R3.16B patched diff check failed" }

      - name: Toolchain
        shell: pwsh
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: Repository verification
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify_repo.ps1

      - name: Upload disposable patched source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r316b-patched-source
          path: crates/mimir-replay/src/lib.rs
          if-no-files-found: error
          retention-days: 1
