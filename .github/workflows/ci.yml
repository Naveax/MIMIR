name: R3.16B Knowledge Dispatch

on:
  push:
    branches:
      - agent/r3-16b-first-property-header-implementation

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch exact-candidate Knowledge Archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run knowledge-archive.yml \
            --repo Naveax/MIMIR \
            --ref candidate/r3-16b-property-header-clean
          echo "R3_16B_KNOWLEDGE_DISPATCH=PASS"
