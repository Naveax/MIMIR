name: Temporary R3.14C Continuity Sync

on:
  push:
    branches:
      - docs/r3-14c-admission-r3-14d
    paths:
      - '.github/workflows/_tmp_r3_14c_continuity_sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout continuity branch
        uses: actions/checkout@v6
        with:
          ref: docs/r3-14c-admission-r3-14d
          fetch-depth: 0

      - name: Apply deterministic continuity patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/_tmp_sync_r3_14c_admission.py

      - name: Normalize only newly introduced markdown hard-break whitespace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'docs/continuity/MIMIR_CURRENT_STATE.md': [
                  ('**Production code checkpoint:** `bad2db9d5043a7a0087a4fab1d278df5f36c7717`  \n', '**Production code checkpoint:** `bad2db9d5043a7a0087a4fab1d278df5f36c7717`\n'),
                  ('**Production milestone:** `R3.14C — private native network bit cursor + bounded-u32 primitive`  \n', '**Production milestone:** `R3.14C — private native network bit cursor + bounded-u32 primitive`\n'),
              ],
              'docs/continuity/MIMIR_EXECUTION_ROADMAP_A_TO_Z.md': [
                  ('**Current production checkpoint:** R3.14C private native bit cursor + bounded-u32 primitive  \n', '**Current production checkpoint:** R3.14C private native bit cursor + bounded-u32 primitive\n'),
              ],
          }

          for path_str, pairs in replacements.items():
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path_str}: expected exactly one whitespace normalization target: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8', newline='\n')
          print('R3_14C_CONTINUITY_WHITESPACE=PASS')
          PY

      - name: Audit continuity-only scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(crates/|Cargo\.toml$|Cargo\.lock$|external_fixtures/|test_corpus/)'; then
            echo 'ERROR: continuity sync crossed production/corpus scope' >&2
            exit 1
          fi
          grep -q 'ACTIVE NEXT PASS                = R3.14D' MIMIR_CONTINUE_HERE.md
          grep -q '"last_production_code_sha": "bad2db9d5043a7a0087a4fab1d278df5f36c7717"' docs/continuity/MIMIR_CONTINUITY_STATE.json
          grep -q '"current_pass": "R3.14D"' docs/continuity/MIMIR_CONTINUITY_STATE.json
          grep -q 'R3.14C — Native bit cursor + bounded integer primitive implementation' docs/continuity/MIMIR_PROGRESS_LEDGER.md
          grep -q 'CURRENT OVERRIDE — At R3.14D' docs/continuity/MIMIR_BOUNDARY_LOCKS.md
          grep -q 'R3.14D — First actor envelope header native reader — ACTIVE' docs/continuity/MIMIR_EXECUTION_ROADMAP_A_TO_Z.md
          grep -q 'CURRENT REPLAY DECODER ADMISSION UPDATE — R3.14C PRODUCTION / R3.14D ACTIVE' MIMIR_ALL_SOURCES_SUPERBOOK.md
          grep -q 'R3.14D — first actor envelope header native reader' docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md

      - name: Verify knowledge archive / continuity graph
        shell: pwsh
        run: |
          ./scripts/verify_mimir_knowledge_archive.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit durable continuity files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            MIMIR_CONTINUE_HERE.md \
            MIMIR_ALL_SOURCES_SUPERBOOK.md \
            docs/continuity/MIMIR_CURRENT_STATE.md \
            docs/continuity/MIMIR_CONTINUITY_STATE.json \
            docs/continuity/MIMIR_PROGRESS_LEDGER.md \
            docs/continuity/MIMIR_BOUNDARY_LOCKS.md \
            docs/continuity/MIMIR_EXECUTION_ROADMAP_A_TO_Z.md \
            docs/continuity/README.md \
            docs/continuity/MIMIR_NEXT_CHAT_HANDOFF.md
          git diff --cached --check
          git commit -m 'Advance continuity to R3.14D'
          git push origin HEAD:docs/r3-14c-admission-r3-14d
