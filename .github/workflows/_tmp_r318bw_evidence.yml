          grep -RniE '/home/runner|C:\\Users\\|github_pat_|ghp_|Omersevik|Maximillan' "$OUT" && exit 1 || true
          echo R3_18BW_PRIVACY_SCAN=PASS

      - name: Validate repository with evidence helpers removed
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.85.0 fmt --all -- --check
          cargo +1.85.0 test -p mimir-replay --test r3_18bu_post_bs_following_control
          cargo +1.85.0 check --workspace
          cargo +1.85.0 test --workspace
          cargo +1.85.0 clippy --workspace --all-targets -- -D warnings
          pwsh -NoLogo -NoProfile -File scripts/verify_mimir_knowledge_archive.ps1
          git diff --check "$BASE_SHA"
          OUT="$RUNNER_TEMP/r318bw-out"
          printf '%s\n' \
            'rust_1_85_fmt=PASS' \
            'r3_18bu_regression=PASS' \
            'workspace_check=PASS' \
            'workspace_test=PASS' \
            'workspace_clippy=PASS' \
            'knowledge_archive_verifier=PASS' \
            'git_diff_check=PASS' \
