    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact closure branch
        uses: actions/checkout@v6
        with:
          ref: docs/r3-14a-outcome-a-r3-14b

      - name: Patch canonical continuity control plane
        shell: python
        run: |
          import json
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # MIMIR_CONTINUE_HERE.md: preserve history, append an explicit highest-current override.
          path = 'MIMIR_CONTINUE_HERE.md'
          text = read(path)
          marker = '## R3.14A OUTCOME A / R3.14B ADMISSION / ACTIVE R3.14C'
          if marker in text:
              raise SystemExit('continue-here current admission marker already exists')
          text += '''

---

## R3.14A OUTCOME A / R3.14B ADMISSION / ACTIVE R3.14C

> **CURRENT OVERRIDE:** This section is newer than earlier R3.14A `current pass` wording in this historical continuation file. Fresh source/tests still outrank this document.

