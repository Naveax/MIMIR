name: Temporary R3.14A-B Continuity Sync

on:
  push:
    branches:
      - docs/r3-14a-outcome-a-r3-14b
    paths:
      - '.github/workflows/_tmp_r3_14ab_continuity_sync.yml'

permissions:
  contents: write

jobs:
