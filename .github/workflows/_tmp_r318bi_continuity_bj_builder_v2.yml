name: R3.18BI Continuity Admission and R3.18BJ Open v2

on:
  push:
    branches:
      - automation/r318bi-continuity-bj-builder-v2

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: r318bi-continuity-bj-builder-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RUNNER_BLOB: bfbb351d948d1dc8e7f7c3618767895ce62decfb
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@v6
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Execute immutable R3.18BI continuity builder v2
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$RUNNER_BLOB" --jq .content | tr -d '\n' | base64 -d > "$RUNNER_TEMP/r318bi_continuity_bj_runner_v2.sh"
          test "$(git hash-object "$RUNNER_TEMP/r318bi_continuity_bj_runner_v2.sh")" = "$RUNNER_BLOB"
          bash -n "$RUNNER_TEMP/r318bi_continuity_bj_runner_v2.sh"
          bash "$RUNNER_TEMP/r318bi_continuity_bj_runner_v2.sh"
