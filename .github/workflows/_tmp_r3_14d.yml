name: Temporary R3.14D First Actor Envelope

on:
  push:
    branches:
      - agent/r3-14d-first-actor-envelope
    paths:
      - '.github/workflows/_tmp_r3_14d.yml'

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact implementation branch
        uses: actions/checkout@v6
        with:
          ref: agent/r3-14d-first-actor-envelope
          fetch-depth: 0

      - name: Assert exact canonical base
        shell: bash
        run: |
          set -euo pipefail
          base=9c0f81a084b2df0e64496af87c0edc50814bcbc6
          git cat-file -e "${base}^{commit}"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git rev-parse "${base}:Cargo.lock")" = "$(git rev-parse 'HEAD:Cargo.lock')"
          test "$(git rev-parse "${base}:crates/mimir-replay/Cargo.toml")" = "$(git rev-parse 'HEAD:crates/mimir-replay/Cargo.toml')"
          test "$(git rev-parse "${base}:crates/mimir-replay/src/lib.rs")" = "$(git rev-parse 'HEAD:crates/mimir-replay/src/lib.rs')"

      - name: Apply deterministic R3.14D source patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/_tmp_r3_14d_apply.py
          git diff -- crates/mimir-replay/src/lib.rs

      - name: Format and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          test "$(git diff --name-only)" = 'crates/mimir-replay/src/lib.rs'
          git diff --quiet -- Cargo.toml Cargo.lock crates/mimir-replay/Cargo.toml

      - name: Focused R3.14D tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p mimir-replay r3_14d_ -- --nocapture

      - name: Full repository verification
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/verify_repo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify knowledge archive
        shell: pwsh
        run: |
          ./scripts/verify_mimir_knowledge_archive.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit R3.14D source scope and hard stop
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          printf 'R3.14D working-tree changes:\n%s\n' "$changed"
          test "$changed" = 'crates/mimir-replay/src/lib.rs'
          git diff --quiet -- Cargo.toml Cargo.lock crates/mimir-replay/Cargo.toml

          grep -q 'pub struct ReplayNetworkFirstActorEnvelopeV1' crates/mimir-replay/src/lib.rs
          grep -q 'pub trait ReplayNetworkFirstActorEnvelopeReader' crates/mimir-replay/src/lib.rs
          grep -q 'pub struct MinimalReplayNetworkFirstActorEnvelopeReader' crates/mimir-replay/src/lib.rs
          grep -q 'fn decode_network_first_actor_header' crates/mimir-replay/src/lib.rs
          grep -q 'read_bounded_u32(max_channels, channel_bits)' crates/mimir-replay/src/lib.rs
          grep -q 'f32::from_bits(time_raw_u32)' crates/mimir-replay/src/lib.rs
          grep -q 'f32::from_bits(delta_raw_u32)' crates/mimir-replay/src/lib.rs

          test "$(grep -c '^    fn r3_14d_' crates/mimir-replay/src/lib.rs)" -eq 17

          added="$(git diff -U0 -- crates/mimir-replay/src/lib.rs | grep '^+' | grep -v '^+++' || true)"
          if printf '%s\n' "$added" | grep -Eq 'pub (name_id|object_id|spawn|stream_id|attribute)|read_(name_id|object_id|spawn|stream_id|attribute)|second_actor|second_frame'; then
            echo 'R3.14D hard stop crossed by added production surface' >&2
            exit 1
          fi

          git diff -- crates/mimir-replay/src/lib.rs > r3_14d_source.diff
          source_sha256="$(sha256sum crates/mimir-replay/src/lib.rs | awk '{print $1}')"
          cat > r3_14d_validation_receipt.txt <<EOF
          pass=R3.14D
          base_main_sha=9c0f81a084b2df0e64496af87c0edc50814bcbc6
          source_sha256=${source_sha256}
          focused_test_count=17
          focused_tests=PASS
          verify_repo_locked=PASS
          knowledge_archive_verifier=PASS
          cargo_manifest_drift=0
          hard_stop_scope=PASS
          production_files_changed=crates/mimir-replay/src/lib.rs
          EOF

      - name: Commit validated production source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/mimir-replay/src/lib.rs
          test "$(git diff --cached --name-only)" = 'crates/mimir-replay/src/lib.rs'
          git diff --cached --check
          git commit -m 'Add first replay actor envelope reader'
          git push origin HEAD:agent/r3-14d-first-actor-envelope

      - name: Upload R3.14D validation evidence
        uses: actions/upload-artifact@v6
        with:
          name: r3-14d-validation-${{ github.sha }}
          path: |
            r3_14d_source.diff
            r3_14d_validation_receipt.txt
          if-no-files-found: error
