name: R3.18L Following Property Control Evidence v3

on:
  push:
    branches:
      - evidence/r318l-following-property-control-v3

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rust 1.85 toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustc --version | grep -F 'rustc 1.85.0 '
          cargo --version | grep -F 'cargo 1.85.'
          rustc +stable --version

      - name: Run R3.18L evidence
        shell: bash
        run: bash tools/_tmp_r318l_run.sh

      - name: Upload immutable R3.18L evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: r318l-following-property-control-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            r3_18l_source_scope.txt
            r3_18l_replay_identity.tsv
            r3_18l_frozen_witnesses.json
            r3_18l_r318k_authority_sha256.txt
            r3_18l_source_summary.json
            r3_18l_targets.tsv
            r3_18l_boxcars_instrumentation_sha256.txt
            r3_18l_control_rows.json
            r3_18l_negative_controls.txt
            r3_18l_aggregate.txt
            r3_18l_artifact_sha256.txt

      - name: Emit immutable receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          normalize_digest() {
            local digest="${1,,}"
            digest="${digest#sha256:}"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || return 1
            printf '%s' "$digest"
          }
          test -n "$ARTIFACT_ID"
          test -n "$ARTIFACT_DIGEST"
          api_run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '.workflow_run.id')"
          api_head_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '.workflow_run.head_sha')"
          api_head_branch="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '.workflow_run.head_branch')"
          api_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '.name')"
          api_expired="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '.expired')"
          api_digest_raw="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '.digest')"
          test "$api_run_id" = "$GITHUB_RUN_ID"
          test "$api_head_sha" = "$GITHUB_SHA"
          test "$api_head_branch" = 'evidence/r318l-following-property-control-v3'
          test "$api_name" = 'r318l-following-property-control-evidence'
          test "$api_expired" = 'false'
          api_digest="$(normalize_digest "$api_digest_raw")" || { echo 'invalid API digest'; exit 1; }
          upload_digest="$(normalize_digest "$ARTIFACT_DIGEST")" || { echo 'invalid upload digest'; exit 1; }
          test "$api_digest" = "$upload_digest"
          echo "R3_18L_EVIDENCE_HEAD=$(git rev-parse HEAD)"
          echo "R3_18L_EVIDENCE_TREE=$(git rev-parse HEAD^{tree})"
          echo "R3_18L_ARTIFACT_ID=$ARTIFACT_ID"
          echo "R3_18L_ARTIFACT_DIGEST_SHA256=$upload_digest"
          echo 'R3_18L_IMMUTABLE_RECEIPT=PASS'
