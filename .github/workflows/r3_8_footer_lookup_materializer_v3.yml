name: R3.8 Footer Lookup Materializer V3

on:
  push:
    branches:
      - agent/r3-8-footer-lookup-materializer
    paths:
      - .github/workflows/r3_8_footer_lookup_materializer_v3.yml

permissions:
  contents: write

jobs:
  verify-and-commit-correction:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Correct synthetic UTF-16 boundary fixture
        shell: pwsh
        run: |
          python tools/r3_8_fix_utf16_synthetic_fixture_v2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'crates/mimir-replay/src/lib.rs') {
            throw "R3.8 V3 pre-validation source scope drift: $($changed -join ', ')"
          }

      - name: Strict focused replay verification
        shell: pwsh
        run: |
          cargo check -p mimir-replay --all-targets --all-features
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p mimir-replay -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy -p mimir-replay --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore non-source drift and commit corrected source only
        shell: pwsh
        run: |
          git restore --source=HEAD -- Cargo.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          if ($changed.Count -ne 1 -or $changed[0] -ne 'crates/mimir-replay/src/lib.rs') {
            throw "R3.8 V3 commit scope drift after Cargo.lock restore: $($changed -join ', ')"
          }
          git config user.name "Naveax"
          git config user.email "79841922+Naveax@users.noreply.github.com"
          git add -- crates/mimir-replay/src/lib.rs
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "Fix R3.8 UTF-16 boundary regression fixture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:agent/r3-8-footer-lookup-materializer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
