name: R3.17F Contract Admission

on:
  push:
    branches:
      - agent/r317f-contract-admission
  workflow_dispatch:

permissions:
  contents: write

jobs:
  admission:
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout disposable contract branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply R3.17F contract sync
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/_tmp_r317f_contract_sync.py
          if ($LASTEXITCODE -ne 0) { throw 'R3.17F contract synchronizer failed' }

          @'
          import json
          from pathlib import Path
          p = Path('docs/continuity/MIMIR_CONTINUITY_STATE.json')
          state = json.loads(p.read_text(encoding='utf-8'))
          order = state['next_files_to_read']
          fexec = 'docs/continuity/MIMIR_R3_17F_EXECUTION_SPEC.md'
          fdecision = 'docs/continuity/MIMIR_R3_17F_DECISION.md'
          gexec = 'docs/continuity/MIMIR_R3_17G_EXECUTION_SPEC.md'
          order = [x for x in order if x not in (fdecision, gexec)]
          idx = order.index(fexec) + 1
          order[idx:idx] = [fdecision, gexec]
          state['next_files_to_read'] = order
          p.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'R3.17F read-order normalization failed' }
          Write-Host 'R3_17F_CONTRACT_APPLY=PASS'

      - name: Verify exact six-file contract scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'b4b4449a99dabbb97120d5393c3d5b1462b6f81e'
          $prodBlob = '54e1bfb918ec1bd42a61cfa0131ca27412082ac5'
          $expected = @(
            'MIMIR_CONTINUE_HERE.md',
            'MIMIR_KNOWLEDGE_GRAPH.md',
            'docs/continuity/MIMIR_CONTINUITY_STATE.json',
            'docs/continuity/MIMIR_CURRENT_STATE.md',
            'docs/continuity/MIMIR_R3_17F_DECISION.md',
            'docs/continuity/MIMIR_R3_17G_EXECUTION_SPEC.md'
          ) | Sort-Object

          if ((git rev-parse 'HEAD:crates/mimir-replay/src/lib.rs') -ne $prodBlob) {
            throw 'R3.17F frozen production source blob mismatch'
          }
          git diff --exit-code "$base..HEAD" -- crates/mimir-replay/src/lib.rs crates/mimir-replay/Cargo.toml Cargo.toml Cargo.lock external_fixtures test_corpus
          if ($LASTEXITCODE -ne 0) { throw 'protected production/Cargo/corpus branch drift exists' }

          git add -N -- docs/continuity/MIMIR_R3_17F_DECISION.md docs/continuity/MIMIR_R3_17G_EXECUTION_SPEC.md
          if ($LASTEXITCODE -ne 0) { throw 'intent-to-add contract docs failed' }
          $actual = @(git diff --name-only) | Sort-Object
          if (($actual -join "`n") -ne ($expected -join "`n")) {
            Write-Host 'EXPECTED:'
            $expected | ForEach-Object { Write-Host $_ }
            Write-Host 'ACTUAL:'
            $actual | ForEach-Object { Write-Host $_ }
            throw 'R3.17F contract working-tree scope mismatch'
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'R3.17F contract diff check failed' }
          Write-Host 'R3_17F_CONTRACT_SCOPE=PASS files=6'

      - name: Knowledge archive verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/verify_mimir_knowledge_archive.ps1
          if ($LASTEXITCODE -ne 0) { throw 'knowledge archive verification failed' }
          Write-Host 'R3_17F_CONTRACT_KNOWLEDGE=PASS'

      - name: Full repository verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup show
          rustup component add rustfmt clippy
          if ($LASTEXITCODE -ne 0) { throw 'rust component setup failed' }
          pwsh -NoProfile -File scripts/verify_repo.ps1
          if ($LASTEXITCODE -ne 0) { throw 'full repository verification failed' }
          Write-Host 'R3_17F_CONTRACT_REPO_VERIFY=PASS'

      - name: Publish clean R3.17F contract candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'b4b4449a99dabbb97120d5393c3d5b1462b6f81e'
          $candidate = 'candidate/r3-17f-contract-clean'
          $files = @(
            'MIMIR_CONTINUE_HERE.md',
            'MIMIR_KNOWLEDGE_GRAPH.md',
            'docs/continuity/MIMIR_CONTINUITY_STATE.json',
            'docs/continuity/MIMIR_CURRENT_STATE.md',
            'docs/continuity/MIMIR_R3_17F_DECISION.md',
            'docs/continuity/MIMIR_R3_17G_EXECUTION_SPEC.md'
          )
          $stage = Join-Path $env:RUNNER_TEMP 'r317f-contract-clean-stage'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          foreach ($file in $files) {
            $dst = Join-Path $stage $file
            $parent = Split-Path -Parent $dst
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -LiteralPath $file -Destination $dst
          }

          git fetch origin main --quiet
          if ($LASTEXITCODE -ne 0) { throw 'fetch main failed' }
          $remoteMain = git rev-parse origin/main
          if ($remoteMain -ne $base) { throw "main drifted: $remoteMain != $base" }

          git ls-remote --exit-code --heads origin "refs/heads/$candidate" *> $null
          if ($LASTEXITCODE -eq 0) { throw "candidate branch already exists: $candidate" }
          $global:LASTEXITCODE = 0

          git checkout --detach $base
          if ($LASTEXITCODE -ne 0) { throw 'checkout canonical base failed' }
          git clean -fdx
          if ($LASTEXITCODE -ne 0) { throw 'git clean failed' }
          git checkout -b $candidate
          if ($LASTEXITCODE -ne 0) { throw 'candidate branch create failed' }

          foreach ($file in $files) {
            $src = Join-Path $stage $file
            $parent = Split-Path -Parent $file
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            Copy-Item -LiteralPath $src -Destination $file
          }

          git add -- $files
          if ($LASTEXITCODE -ne 0) { throw 'git add candidate files failed' }
          $expected = $files | Sort-Object
          $actual = @(git diff --cached --name-only) | Sort-Object
          if (($actual -join "`n") -ne ($expected -join "`n")) {
            throw 'clean R3.17F contract staged scope mismatch'
          }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'clean R3.17F contract diff check failed' }
          git diff --cached --exit-code -- crates/mimir-replay/src/lib.rs crates/mimir-replay/Cargo.toml Cargo.toml Cargo.lock external_fixtures test_corpus
          if ($LASTEXITCODE -ne 0) { throw 'clean R3.17F candidate contains protected diff' }
          $global:LASTEXITCODE = 0

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Admit R3.17F K2 contract and open R3.17G'
          if ($LASTEXITCODE -ne 0) { throw 'contract admission commit failed' }
          $cleanSha = git rev-parse HEAD
          git push origin "HEAD:refs/heads/$candidate"
          if ($LASTEXITCODE -ne 0) { throw 'push clean R3.17F candidate failed' }
          Write-Host "R3_17F_CONTRACT_CLEAN_SHA=$cleanSha"
          Write-Host 'R3_17F_CONTRACT_CLEAN=PASS'
