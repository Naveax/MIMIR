name: Temporary MIMIR Knowledge Archive Bootstrap V2

on:
  push:
    branches:
      - docs/chatgpt-storage-multistage-archive-v2
    paths:
      - '.github/workflows/_tmp_bootstrap_mimir_knowledge_archive_v2.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/chatgpt-storage-multistage-archive-v2

      - name: Verify exact payload chunks
        shell: bash
        run: |
          set -euo pipefail
          cd .github/_tmp_mimir_knowledge_parts
          echo 'fdbc497347d488eb3e4b12ae18df6962b0824e1411ff171baeeeb1ced34c836d  part_00.b64' | sha256sum -c -
          echo 'd3ff54488c7d55d2ee11c6938fd80103eb36070a8d0265f898e4be295778ca0a  part_01.b64' | sha256sum -c -
          echo 'a22631917bd5ce21c517724345bad32be3c8b6a6c1e938fc76cc74995bf8f778  part_02.b64' | sha256sum -c -
          echo '88c9b243e314d9da89ae639d6516d1a139c0717ee1f1474d094b04082e0ad098  part_03.b64' | sha256sum -c -
          echo 'd26d584a04d88e1cb7565c7252e6d5a3784059f63f4386840ed3feceadf22f8d  part_04.b64' | sha256sum -c -
          echo 'acbbd0a06d95d266eb2b1db0c41ee71637e338f62934bae5c090ab4108fe59c8  part_05.b64' | sha256sum -c -
          echo 'ef0e5777f4cb2159f27d19f6dd308592a9887ecd89641449457a65e95ab9fcba  part_06.b64' | sha256sum -c -
          echo 'e3bcf2cf5e3e125f5cacbcfdbd88a888ec4f65d0eafd93870e2381f4debe856c  part_07a.b64' | sha256sum -c -
          echo 'd61763919542dd1e2ed22b31fb0d872a0fdafaa615cdbc5af805163eb441626c  part_07c00.b64' | sha256sum -c -
          echo '6382e6a356369e0c747a8b6046d22884b4e9187c8bd6189263bebc1c5f5974fe  part_07c01.b64' | sha256sum -c -
          echo '34dbeb40e9431933b2ba70fe4e79f89b324078a1f657d1950ed4674e357a87a9  part_07c02.b64' | sha256sum -c -
          echo 'ae6817664f9c13e54dbce7676f4425d2c0fc2a38635afa19c7937b0ccd226913  part_07c03.b64' | sha256sum -c -
          echo '5dfbbc010be4c028c3c12537ce09a6db658fec0d62648c9faf5550e7ad35fcab  part_07c04.b64' | sha256sum -c -
          echo '1645aaa5acfbf53d5488a442f6dbe6d2668e40391b15cf72b2fadab47485da9e  part_07c05.b64' | sha256sum -c -
          echo 'ea34973d9c85ab1eb539aaddbfea9fa2675b463c89a0a61cb8e2231e6262e81c  part_07c06.b64' | sha256sum -c -
          echo '9ffcf8928bceaed77bb6ff6c94a397f7a5c4396a5ae53c044efe7f35cfd961df  part_07c07.b64' | sha256sum -c -

      - name: Reconstruct and verify archive payload
        shell: bash
        run: |
          set -euo pipefail
          parts=.github/_tmp_mimir_knowledge_parts
          cat \
            "$parts/part_00.b64" \
            "$parts/part_01.b64" \
            "$parts/part_02.b64" \
            "$parts/part_03.b64" \
            "$parts/part_04.b64" \
            "$parts/part_05.b64" \
            "$parts/part_06.b64" \
            "$parts/part_07a.b64" \
            "$parts/part_07c00.b64" \
            "$parts/part_07c01.b64" \
            "$parts/part_07c02.b64" \
            "$parts/part_07c03.b64" \
            "$parts/part_07c04.b64" \
            "$parts/part_07c05.b64" \
            "$parts/part_07c06.b64" \
            "$parts/part_07c07.b64" \
            > /tmp/mimir-knowledge-archive.b64
          base64 --decode /tmp/mimir-knowledge-archive.b64 > /tmp/mimir-knowledge-archive.zip
          echo '0a79eede6030c0ca7ceee8f962bbcd0c80826ed4f6be9a80eb9b61f506e6e52a  /tmp/mimir-knowledge-archive.zip' | sha256sum -c -

      - name: Materialize permanent archive files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('/tmp/mimir-knowledge-archive.zip') as z:
              names = z.namelist()
              if len(names) != 25:
                  raise SystemExit(f'expected 25 archive entries, got {len(names)}')
              z.extractall('.')
          PY

      - name: Static structure privacy and link gate
        shell: bash
        run: |
          set -euo pipefail
          test -f MIMIR_ALL_SOURCES_SUPERBOOK.md
          test -f MIMIR_KNOWLEDGE_GRAPH.md
          test -f docs/chatgpt-archive/README.md
          test -f docs/chatgpt-archive/SOURCE_REGISTRY.md
          test -f docs/chatgpt-archive/VALIDATION_MATRIX.md
          test -f docs/chatgpt-archive/MANIFEST.json
          test -f docs/chatgpt-archive/migration/HISTORICAL_TO_CURRENT_MAPPING.md
          test -f scripts/verify_mimir_knowledge_archive.ps1
          test -f .github/workflows/knowledge-archive.yml

          test ! -e docs/chatgpt-archive/historical/conversations-011.json
          test ! -e docs/chatgpt-archive/historical/Naveax_replay_extracted_settings.json

          grep -q 'MIMIR_CONTINUE_HERE.md' MIMIR_KNOWLEDGE_GRAPH.md
          grep -q 'MIMIR_ALL_SOURCES_SUPERBOOK.md' MIMIR_KNOWLEDGE_GRAPH.md
          grep -q 'SOURCE_REGISTRY.md' MIMIR_KNOWLEDGE_GRAPH.md
          grep -q 'VALIDATION_MATRIX.md' MIMIR_KNOWLEDGE_GRAPH.md
          grep -q 'HISTORICAL_TO_CURRENT_MAPPING.md' MIMIR_KNOWLEDGE_GRAPH.md
          grep -q 'SOURCE_REGISTRY.md' MIMIR_ALL_SOURCES_SUPERBOOK.md
          grep -q 'VALIDATION_MATRIX.md' MIMIR_ALL_SOURCES_SUPERBOOK.md
          grep -q 'REDACTED_EXTRACT' docs/chatgpt-archive/SOURCE_REGISTRY.md
          grep -q 'CURATED_SOURCE_SNAPSHOT' docs/chatgpt-archive/SOURCE_REGISTRY.md
          grep -q 'EXACT_ARCHIVE_COPY' docs/chatgpt-archive/SOURCE_REGISTRY.md

      - name: Run archive verifier
        shell: pwsh
        run: |
          & ./scripts/verify_mimir_knowledge_archive.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove bootstrap-only transport files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/_tmp_mimir_knowledge_parts
          rm -f .github/_tmp_mimir_knowledge_archive_payload.zip
          rm -f .github/workflows/_tmp_bootstrap_mimir_knowledge_archive_v2.yml

      - name: Commit permanent archive only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^crates/'; then
            echo 'ERROR: archive bootstrap attempted to change Rust source.' >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^Cargo\.'; then
            echo 'ERROR: archive bootstrap attempted to change Cargo metadata.' >&2
            exit 1
          fi
          git commit -m 'Add multi-stage ChatGPT knowledge archive for MIMIR'
          git push origin HEAD:docs/chatgpt-storage-multistage-archive-v2
